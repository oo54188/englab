name: daily-materials

on:
  schedule:
    - cron: "10 0 * * *"   # 每天 UTC 00:10（北京时间 08:10）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch daily materials
        run: python tools/fetch_daily.py

      - name: Commit and push
        run: |
          git config user.name "englab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git commit -m "daily: $(date -u +%F)" || echo "no change"
          git push
