/* ---------- 验证连接（只读） ---------- */
function gistTest(){
  if(GIST.busy){ toast("正在同步，稍等"); return; }
  gistCfgLoad();
  if(!(GIST.tok||"").trim()){ gistSay("先填 token 才能验证（只读一次身份接口，不写任何数据）",1); return; }
  GIST.busy=1;
  gistSay("正在验证 token…");
  return ghReq("GET", GH_API+"/user").then(function(r){
    var login=(r.j&&r.j.login)||"";
    if(!GIST.id){
      GIST.busy=0;
      gistSay("token 可用（账号 "+login+"）。还没填 gist ID，第一次上传会自动创建。");
      return { ok:true, login:login, gist:false };
    }
    return ghReq("GET", GH_API+"/gists/"+encodeURIComponent(GIST.id)).then(function(r2){
      var j=r2.j||{}, f=(j.files||{})[GIST_FILE], up="";
      try{ up = j.updated_at ? new Date(j.updated_at).toLocaleString() : ""; }catch(e){}
      GIST.busy=0;
      if(!f){ gistSay("连接正常：账号 "+login+"，但该 gist 里没有 "+GIST_FILE+"（可以先上传一次）",1); return { ok:true, login:login, hasFile:false }; }
      gistSay("连接正常：账号 "+login+"，gist 可读，备份更新于 "+(up||"未知时间"));
      return { ok:true, login:login, hasFile:true, updated:up };
    });
  }).catch(function(e){
    GIST.busy=0;
    gistSay((e&&e.msg)||"验证失败",1);
    return { ok:false, kind:(e&&e.kind)||"unknown", msg:(e&&e.msg)||"" };
  });
}

function barRow(label,v){
  var pct=Math.min(100,v);
  return '<div style="margin-top:6px"><div class="row" style="justify-content:space-between"><span class="small">'+label+'</span><span class="small muted">'+v+' 词</span></div>'+

}
function fourCoverage(){
  var tot=0, l=0, r=0, v=0, s=0, w=0, never=0;
  for(var k in DB.srs){
    if(!VOCAB_BY_W[k]) continue;
    tot++;
    var u=useOf(k);
    if(u.listen) l++;
    if(u.read) r++;
    if(u.view) v++;
    if(u.say) s++;
    if(u.write) w++;
    if(!u.say && !u.write) never++;
  }
  return { total:tot, listen:l, read:r, view:v, say:s, write:w, never:never };
}

function vcPermShow(){
  var el=document.getElementById("vcPerm");

  if(!navigator.permissions || !navigator.permissions.query){ el.textContent="本浏览器不支持权限查询（不代表没权限）"; return; }

      var e2=document.getElementById("vcPerm");
      if(e2) e2.textContent=m[p.state]||p.state;
      try{ p.onchange=function(){ vcPermShow(); }; }catch(e){}
    }).catch(function(){ var e2=document.getElementById("vcPerm"); if(e2) e2.textContent="查不到（该内核未开放 query）"; });
  }catch(e){ el.textContent="查不到（该内核不支持）"; }

/* ================= P1-3 考试倒计时反推配额 =================
   推导：剩余 N 天 × 每日新词 ≥ 待掌握词量（目标词量 - 已掌握）。
   反推出来的每日新词写进既有 DB.goal，复习配额按"今日到期 + 新词 ×1.5"给。
   边界：日期当天按 1 天算（不除零）；日期已过自动回常规模式；新词夹在 [5,80]、复习夹在 [10,200]，
   免得算出 200 词/天这种做不到的值。 */
var EXAM_NEW_MIN = 5, EXAM_NEW_MAX = 80, EXAM_REV_MIN = 10, EXAM_REV_MAX = 200;
var EXAM_INP = "width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;background:var(--surf);outline:none;box-sizing:border-box;margin-top:8px";
function vocabTotal(){
  try{ if(typeof vocabUniq==="function") return vocabUniq(); }catch(e){}
  return (typeof VOCAB!=="undefined")? VOCAB.length : 0;
}
function examOf(){
  if(!DB.exam || typeof DB.exam!=="object") DB.exam={ name:"", date:"", target:0 };
  if(typeof DB.exam.target!=="number" || DB.exam.target<0) DB.exam.target=0;
  return DB.exam;
}
function examDayMs(s){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||""));
  if(!m) return null;
  var t=new Date(+m[1], +m[2]-1, +m[3], 0, 0, 0, 0).getTime();
  return isNaN(t)? null : t;
}
function examDays(){
  var t=examDayMs(examOf().date);
  if(t===null) return null;
  var now=new Date(), t0=new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  return Math.round((t-t0)/86400000);
}
function examTargetTotal(){ return examOf().target || vocabTotal(); }
function examPlan(){
  var cfg=examOf(), days=examDays(), tgt=examTargetTotal();
  var mastered=masteredCount(), remain=Math.max(0, tgt-mastered);
  var p={ name:cfg.name||"", date:cfg.date||"", days:days, target:tgt, mastered:mastered,
          remain:remain, state:"off", rawNew:0, newQ:0, revQ:0, gap:0, feasible:true, dueToday:0 };
  if(!cfg.date || days===null){ p.state="off"; return p; }
  if(days<0){ p.state="past"; return p; }
  p.state = (days===0)? "today" : "on";
  var d=Math.max(1, days);                 /* 当天到期按 1 天算，避免除零 */
  var raw=Math.ceil(remain/d);
  p.rawNew=raw;
  p.newQ=Math.max(EXAM_NEW_MIN, Math.min(EXAM_NEW_MAX, raw));
  p.feasible = (raw<=EXAM_NEW_MAX);
  p.gap = p.feasible? 0 : Math.max(0, remain-d*EXAM_NEW_MAX);
  var due=0;
  try{ due=dueWords().length; }catch(e){ due=0; }
  p.dueToday=due;
  p.revQ=Math.max(EXAM_REV_MIN, Math.min(EXAM_REV_MAX, Math.round(due + p.newQ*1.5)));
  return p;
}
function examApplyPlan(p){
  p=p||examPlan();
  var cfg=examOf(), dirty=false;
  if(p.state==="on" || p.state==="today"){
    if(DB.goal!==p.newQ){ DB.goal=p.newQ; dirty=true; }
    if(cfg.planQ!==p.newQ){ cfg.planQ=p.newQ; dirty=true; }
  }else if(cfg.planQ){ cfg.planQ=0; dirty=true; }
  if(dirty) saveDB();
  return p;
}
function examSetName(v){ examOf().name=String(v||"").slice(0,24); saveDB(); }
function examSetDate(v){
  var s=String(v||"").trim();
  if(s && examDayMs(s)===null){ toast("日期格式不对，用 年-月-日"); return; }
  examOf().date=s; saveDB();
  var p=examApplyPlan();
  if(!s) toast("已清除考试日期，回到常规模式");
  else if(p.state==="past") toast("这个日期已经过了，按常规模式算配额");
  else if(p.state==="today") toast("就是今天：今日新词配额 "+p.newQ+" 词");
  else toast("已按剩余 "+p.days+" 天反推：每日新词 "+p.newQ+"、复习 "+p.revQ);
  render();
}
function examSetTarget(v){
  var n=parseInt(v,10);
  if(isNaN(n) || n<0){ toast("目标词量要填正整数"); return; }
  examOf().target=n; saveDB();
  var p=examApplyPlan();
  if(p.state==="on"||p.state==="today") toast("目标 "+p.target+" 词 → 每日新词 "+p.newQ);
  else toast("目标词量已存 "+n+" 词");
  render();
}
function examUseVocabTotal(){
  examOf().target=vocabTotal(); saveDB();
  examApplyPlan();
  render();
  toast("目标词量 = 词库总量 "+vocabTotal());
}
function examClear(){
  var auto = (DB.exam && DB.exam.planQ) || 0;
  DB.exam={ name:"", date:"", target:0 };
  /* 只有"当前的每日词量确实是按考试反推出来的"才复位，避免覆盖用户手调的数值 */
  if(!DB.goal || DB.goal<5 || (auto && DB.goal===auto)) DB.goal=20;
  saveDB();
  render();
  toast("已清除考试目标，回到常规模式（每日新词 "+DB.goal+"）");
}
function examBoost(){
  var p=examPlan();
  DB.goal=Math.max(EXAM_NEW_MIN, Math.min(EXAM_NEW_MAX, p.rawNew||EXAM_NEW_MAX));
  saveDB(); render();
  toast("每日新词已提到 "+DB.goal+" 词");
}
function examLower(){
  var p=examPlan(), d=Math.max(1, p.days||1);
  examOf().target=p.mastered + d*EXAM_NEW_MAX; saveDB();
  examApplyPlan();
  render();
  toast("目标已降到 "+examOf().target+" 词，考前可完成");
}

     ' 个待掌握词（目标 '+p.target+' 词，已掌握 '+p.mastered+'）。今日到期复习 '+p.dueToday+' 个，复习配额取 '+p.revQ+'。</div>';
  if(!p.feasible){

       '<div class="row wrap" style="gap:6px;margin-top:8px">'+
       '<button class="btn sm" onclick="examBoost()">提高每日量（到 '+EXAM_NEW_MAX+' 词）</button>'+
       '<button class="btn sm ghost" onclick="examLower()">降低目标词量（到 '+(p.mastered+Math.max(1,p.days||1)*EXAM_NEW_MAX)+' 词）</button></div></div>';
  }
  h+='</div>';
  return h;
}
function examSettingsHtml(){
  var p=examPlan(), cfg=examOf();
  var h='<div class="small muted" style="margin:12px 0 4px">考试目标（填了日期就按倒计时反推每日配额）</div>';
  h+='<input id="examName" value="'+esc(cfg.name||"")+'" placeholder="考试名称：四级 / 六级 / 雅思 / 期末" oninput="examSetName(this.value)" style="'+EXAM_INP+'">';

  h+='<input id="examTarget" type="number" min="0" step="10" value="'+(cfg.target||vocabTotal())+'" placeholder="目标掌握词量" onchange="examSetTarget(this.value)" style="'+EXAM_INP+'">';

/* --- 神经音色：微软神经 TTS 预生成的词库音频（本机内置，不依赖网络，音质最好） ---
   覆盖范围：词库 272 个单词 + 各自例句；命中即播放，未命中自动回落在线/系统语音。 */
var NEU = { hinted:false, hinted2:false, map:null };
var NEURAL_VOICES = [
  { id:"en-US-AriaNeural",  name:"Aria",  desc:"美音 · 女 · 播音腔", acc:"en" },
  { id:"en-US-GuyNeural",   name:"Guy",   desc:"美音 · 男 · 播音腔", acc:"en" },
  { id:"en-US-JennyNeural", name:"Jenny", desc:"美音 · 女 · 自然", acc:"en" },
  { id:"en-GB-SoniaNeural", name:"Sonia", desc:"英音 · 女 · 标准", acc:"uk" }
];
function neuralVoice(){
  var v=String(DB.voice||"");
  if(v.indexOf("neural:")!==0) return null;
  v=v.slice(7);
  for(var i=0;i<NEURAL_VOICES.length;i++) if(NEURAL_VOICES[i].id===v) return v;
  return null;
}
function neuKey(t){ return String(t==null?"":t).toLowerCase().replace(/\s+/g," ").trim(); }
function neuMap(){
  if(NEU.map) return NEU.map;
  var m={w:{}, s:{}}, i, it, k;
  for(i=0;i<VOCAB.length;i++){
    it=VOCAB[i]; if(!it||!it.w) continue;
    k=neuKey(it.w); if(k && !m.w[k]) m.w[k]=it.w;
    if(it.ex){ k=neuKey(it.ex); if(k && !m.s[k]) m.s[k]=it.w; }
  }
  NEU.map=m;
  return m;
}
function neuralSrc(voice, text){
  var m=neuMap(), k=neuKey(text), w;
  if(!k) return "";
  w=m.w[k];
  if(w) return "audio/"+voice+"/w_"+w+".mp3";
  w=m.s[k];
  if(w) return "audio/"+voice+"/s_"+w+".mp3";
  return "";
}
function voiceOpts(){
  var en=enVoices(), h='<option value="">自动选择</option>', i, val;
  h+='<optgroup label="神经音色（音质最好 · 词库单词与例句）">';
  for(i=0;i<NEURAL_VOICES.length;i++){
    val="neural:"+NEURAL_VOICES[i].id;
    h+='<option value="'+esc(val)+'"'+(DB.voice===val?" selected":"")+'>'+

function pasteBase(w){
  if(VOCAB_BY_W[w]) return w;
  var suf=["s","es","ed","d","ing","ly","er","est"], i, b;
  for(i=0;i<suf.length;i++){
    var s=suf[i];
    if(w.length>s.length+2 && w.slice(-s.length)===s){
      b=w.slice(0,-s.length);
      if(VOCAB_BY_W[b]) return b;
      if(VOCAB_BY_W[b+"e"]) return b+"e";
      if(s==="ing" && b.length>2 && b[b.length-1]===b[b.length-2] && VOCAB_BY_W[b.slice(0,-1)]) return b.slice(0,-1);
    }
  }
  return "";
}

  if(news.length){

       '<div class="small" style="font-weight:700;margin-bottom:6px">高频生词（不在库内，点一下听发音）</div>'+
       '<div style="display:flex;flex-wrap:wrap">'+news.map(function(x){
         return '<span class="tag" onclick="speak(\''+esc(x.w).replace(/'/g,"")+'\')">'+esc(x.w)+' <i>×'+x.n+'</i></span>';

/* ==== el17_dictation.js ==== */
/* ================= 模块 17：听写模式 ================= */
var DICT = { mode:"word", src:"new", q:[], i:0, ok:0, n:0, streak:0, best:0, phase:"idle",
  plays:0, text:"", t0:0, hint:0, hard:[] };

function dictSrcList(){
  var pool=[], i, w;
  if(DICT.src==="due"){ pool=dueWords(); }
  else if(DICT.src==="hard"){
    for(i=0;i<VOCAB.length;i++){ w=VOCAB[i].w.toLowerCase(); var s=DB.srs[w]; if(!s || (s.lv|0)<=2) pool.push(w); }
  } else if(DICT.src==="all"){
    for(i=0;i<VOCAB.length;i++) pool.push(VOCAB[i].w.toLowerCase());
  } else {
    pool=newWords(200);
    if(pool.length<10) for(i=0;i<VOCAB.length;i++) pool.push(VOCAB[i].w.toLowerCase());
  }
  return shuffle(pool);
}
function dictMax(){ return DICT.mode==="word" ? 12 : 8; }

function startDict(){ 
  DICT.q = dictSrcList().slice(0, dictMax());
  if(!DICT.q.length){ toast("词库还没内容"); return; }
  DICT.i=0; DICT.ok=0; DICT.n=0; DICT.streak=0; DICT.best=0; DICT.hard=[]; DICT.phase="ask";
  DICT.plays=0; DICT.text=""; DICT.hint=0; DICT.t0=Date.now();
  render(); playDict();
}
function setDictMode(m){ DICT.mode=m; DICT.phase="idle"; render(); }
function setDictSrc(s){ DICT.src=s; DICT.phase="idle"; render(); }

function dictTarget(){
  var w=DICT.q[DICT.i]; if(!w) return null;
  var v=VOCAB_BY_W[w];
  if(!v) return { w:w, ph:"", cn:"", ex:"", exCn:"" };
  return v;
}
function playDict(){
  var v=dictTarget(); if(!v) return;
  DICT.plays++;
  if(DICT.mode==="word") speak(v.w, 0.86);
  else speak(v.ex || v.w, 0.9);
  render();
}
function dictHintWord(){
  var v=dictTarget(); if(!v) return;
  DICT.hint++;
  toast("首字母 "+v.w.charAt(0).toUpperCase()+" · 共 "+v.w.length+" 个字母");
  render();
}
function dictInput(el){
  DICT.text = el.value;
  el.className = "dictbox";
}
function dictSubmit(){
  /* v20：句子模式有自己的提交链路（真实语料 + 有序 diff），这里做一层守卫防串用 */
  if(DICT.mode==="sent"){ dsentSubmit(); return; }
  var v=dictTarget(); if(!v || DICT.phase!=="ask") return;
  var ans=String(DICT.text==null? "": DICT.text).trim();
  var target = DICT.mode==="word" ? v.w : (v.ex||v.w);
  var r = cmpDict(target, ans);
  DICT.phase="done"; DICT.res=r;
  DICT.n++;
  if(r.rate>=0.999){ DICT.ok++; DICT.streak++; if(DICT.streak>DICT.best) DICT.best=DICT.streak; }
  else { DICT.streak=0; if(DICT.mode==="word") DICT.hard.push(v.w); }
  useWord(v.w, "write"); useWord(v.w, "listen"); touch("write"); touch("listen");
  if(DICT.mode==="word") srsUpd(v.w, r.rate>=0.999?3:1);
  addSec(2, "write");
  render();
}
function dictNext(){
  /* v20：句子模式走 dsentNext，不共用单词模式的索引推进 */
  if(DICT.mode==="sent"){ dsentNext(); return; }
  DICT.i++;
  DICT.plays=0; DICT.text=""; DICT.hint=0; DICT.res=null;
  if(DICT.i>=DICT.q.length){ DICT.phase="end"; addSec(Math.round((Date.now()-DICT.t0)/1000), "write"); render(); return; }
  DICT.phase="ask"; render(); playDict();
}
function cmpDict(target, said){
  var t=String(target).trim(), s=String(said).trim();
  if(!s) return { rate:0, mark:normWords(t).map(function(w){ return { w:w, ok:false }; }), exact:false };
  var a=normWords(t), b=normWords(s);
  var pool=b.slice(), mark=[], hit=0, i, idx;
  for(i=0;i<a.length;i++){
    idx=pool.indexOf(a[i]);
    if(idx>=0){ mark.push({ w:a[i], ok:true }); pool.splice(idx,1); hit++; }
    else mark.push({ w:a[i], ok:false });
  }
  var rate = a.length ? hit/a.length : 0;
  var exact = a.join(" ")===b.join(" ");
  if(exact) rate=1;
  return { rate:rate, mark:mark, exact:exact, extra:pool };
}
function letterBoxes(word, said){
  // 逐字母对齐：给出 对/错/漏 三态
  var t=String(word).toLowerCase().replace(/[^a-z]/g,""), s=String(said).toLowerCase().replace(/[^a-z]/g,"");
  var out="", i;
  for(i=0;i<t.length;i++){
    var c=t.charAt(i), ok = s.charAt(i)===c;
    out += '<span class="dictletter'+(ok?"":" gap")+'">'+(ok?c:"·")+'</span>';
  }
  return out;
}

/* ============================================================
   v20 · C 档：句子听写
   语料严格取自 LISTEN 每段的 m.s 真实句子：不拼接、不改写、不自造。
   流程：播一句（按所属段 wpm 走 lsRate）→ 打字 → 提交 → 有序逐词对照
        → 错词命中词库进 SRS / 未命中记错因并可一键收进我的词条
        → 本轮统计写 DB.dictSent（刷新不丢，周报可读）
   ============================================================ */
var DSENT = {
  phase:"idle", seg:"all", len:10,
  q:[], i:0, n:0, ok:0, sumW:0, sumOk:0,
  plays:0, slow:0, text:"", res:null, t0:0,
  hard:[], worst:null, pool:null
};
var DS_LVORD = { "A2":0, "B1":1, "B2":2, "C1":3 };

/* 句子池：把 30 段的每条 m.s 摊平，带上所属段引用（原始字符串，不动一个字） */
function dsPool(){
  if(DSENT.pool) return DSENT.pool;
  var out=[], i, j, m, ss;
  for(i=0;i<LISTEN.length;i++){
    m=LISTEN[i]; ss=(m && m.s) || [];
    for(j=0;j<ss.length;j++){ out.push({ m:m, si:j, text:ss[j] }); }
  }
  DSENT.pool=out;
  return out;
}
function dsWc(t){ var a=String(t||"").match(/[A-Za-z0-9']+/g); return a? a.length : 0; }
function dsLv(it){ var v=DS_LVORD[it.m.lv]; return (v==null)? 2 : v; }

function dsentSegOpts(){
  var h="", i, m;
  h+='<option value="all"'+(DSENT.seg==="all"?" selected":"")+'>全部 '+LISTEN.length+' 段（按难度先易后难）</option>';
  for(i=0;i<LISTEN.length;i++){
    m=LISTEN[i];
    h+='<option value="'+esc(m.id)+'"'+(DSENT.seg===m.id?" selected":"")+'>'+
       esc(m.id.toUpperCase()+" · "+m.t+"（"+m.lv+" · "+m.wpm+"wpm）")+'</option>';
  }
  return h;
}
/* 取句：先按难度（A2→B1→B2→C1），同难度按句长由短到长；全量时在最低难度的一批里随机，
   锁段时在该段内随机。绝不拼接、绝不自造。 */
function dsentPick(){
  var all=dsPool(), pool=[], i, it;
  for(i=0;i<all.length;i++){
    it=all[i];
    if(DSENT.seg!=="all" && it.m.id!==DSENT.seg) continue;
    if(dsWc(it.text)<4) continue;   /* 太碎的半句没有听写价值 */
    pool.push(it);
  }
  if(!pool.length) return [];
  pool.sort(function(a,b){
    var d1=dsLv(a), d2=dsLv(b);
    if(d1!==d2) return d1-d2;
    var w1=dsWc(a.text), w2=dsWc(b.text);
    if(w1!==w2) return w1-w2;
    return String(a.m.id+"#"+a.si) > String(b.m.id+"#"+b.si) ? 1 : -1;
  });
  var cap=(DSENT.seg==="all")? Math.max(DSENT.len*5, 40) : pool.length;
  var bag=pool.slice(0, Math.min(cap, pool.length)), pick=[];
  while(bag.length && pick.length<DSENT.len){
    var k=Math.floor(Math.random()*bag.length);
    pick.push(bag.splice(k,1)[0]);
  }
  pick.sort(function(a,b){
    var d1=dsLv(a), d2=dsLv(b);
    if(d1!==d2) return d1-d2;
    return dsWc(a.text)-dsWc(b.text);
  });
  return pick;
}

function dsentSetLen(n){ DSENT.len=Number(n)||10; if(DSENT.phase==="idle") render(); }
function dsentSetSeg(id){ DSENT.seg=String(id||"all"); if(DSENT.phase==="idle") render(); }

function dsentStart(){
  var q=dsentPick();
  if(!q.length){ toast("这组筛选里没有够长的句子"); return; }
  DSENT.q=q; DSENT.i=0; DSENT.n=0; DSENT.ok=0; DSENT.sumW=0; DSENT.sumOk=0;
  DSENT.hard=[]; DSENT.worst=null; DSENT.text=""; DSENT.res=null;
  DSENT.plays=0; DSENT.slow=0; DSENT.t0=Date.now(); DSENT.phase="ask";
  render();
  dsentPlay(0, 1);
}
function dsentCur(){ return DSENT.q[DSENT.i] || null; }

/* 播报：首播不计次；「再听一遍」限 3 次，0.7 倍速另限 3 次 */
function dsentPlay(slow, auto){
  var it=dsentCur(); if(!it) return;
  if(!auto){
    if(slow){
      if(DSENT.slow>=3){ toast("0.7 倍速这句已经用完 3 次"); return; }
      DSENT.slow++;
    }else{
      if(DSENT.plays>=3){ toast("「再听一遍」这句已经用完 3 次，先把手上的写出来"); return; }
      DSENT.plays++;
    }
  }
  var d=lsRate(it.m, slow?0.7:1);
  dsentSyncBtns(d, !!slow);
  speak(it.text, d.r, function(ok){ if(!ok) toast("这次没读出声，可再点一次（次数照计）"); });
}
function dsentSyncBtns(d, slow){
  var b1=document.getElementById("dsReplay"), b2=document.getElementById("dsSlow"), t=document.getElementById("dsRate");
  if(b1){ b1.textContent="再听一遍（剩 "+(3-DSENT.plays)+"）"; b1.disabled=(DSENT.plays>=3); }
  if(b2){ b2.textContent="0.7 倍速（剩 "+(3-DSENT.slow)+"）"; b2.disabled=(DSENT.slow>=3); }
  if(t && d){
    /* v20：倍速来源写清——先按该段 wpm 折算，0.7 慢速是在此基础上再降 */
    var base=(Number(d.wpm)||160)/160;  /* 段自身倍率；d.r 已保留两位，反推会有误差 */
    t.textContent="本句语速 ×"+d.r.toFixed(2)+"（该段 "+d.wpm+" wpm"+
      (slow? "，先按 ×"+base.toFixed(2)+" 再 ×0.7 慢速" : "，基准 160 wpm = ×1.00")+"）"+
      (d.clamped? " · 已按上下限截断":"");
  }
}
function dsentInput(el){ DSENT.text=el.value; }
function dsentKey(e){
  if(e && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); dsentSubmit(); }
}

/* ---------- 逐词对照 ----------
   分词：只认字母数字与词内撇号；归一化 = 小写 + 撇号统一并去掉（don't = dont）+ 丢弃标点
   对齐：LCS 有序对齐（不是位置比对），错一个词不会把后面整句带红 */
function dsTok(str){
  var raw=String(str==null?"":str).match(/[A-Za-z0-9]+(?:['\u2019][A-Za-z]+)*/g) || [];
  var out=[], i, r;
  for(i=0;i<raw.length;i++){
    r=raw[i];
    out.push({ raw:r, n:r.toLowerCase().replace(/\u2019/g,"'").replace(/'/g,"") });
  }
  return out;
}
function dsLev(a,b){
  a=String(a); b=String(b);
  var n=a.length, m=b.length, i, j, prev=[], cur=[], t;
  if(!n) return m;
  if(!m) return n;
  for(j=0;j<=m;j++) prev[j]=j;
  for(i=1;i<=n;i++){
    cur[0]=i;
    for(j=1;j<=m;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
    }
    t=prev; prev=cur; cur=t;
  }
  return prev[m];
}
/* 返回 { marks[], total, right, acc, full, hints, bad[], extra } */
function dsDiff(answer, said){
  var A=dsTok(answer), B=dsTok(said);
  var n=A.length, m=B.length, i, j;
  var dp=[], row;
  for(i=0;i<=n;i++){ row=[]; for(j=0;j<=m;j++) row.push(0); dp.push(row); }
  for(i=n-1;i>=0;i--){
    for(j=m-1;j>=0;j--){
      dp[i][j]=(A[i].n===B[j].n)? (dp[i+1][j+1]+1) : Math.max(dp[i+1][j], dp[i][j+1]);
    }
  }
  var pairs=[], x=0, y=0;
  while(x<n && y<m){
    if(A[x].n===B[y].n){ pairs.push([x,y]); x++; y++; }
    else if(dp[x+1][y]>=dp[x][y+1]) x++;
    else y++;
  }
  var marks=[], hints={ case:0, punct:0, apos:0 }, bad=[], right=0;
  var px=0, py=0;

  function flushGap(ax, ay, bx, by){
    var map=[], usedB={}, t, k, bestI, bestD, bestW, lim, d2;
    for(t=ax;t<ay;t++){
      bestI=-1; bestD=99; bestW=null;
      for(k=bx;k<by;k++){
        if(usedB[k]) continue;
        d2=dsLev(A[t].n, B[k].n);
        if(d2<bestD){ bestD=d2; bestI=k; bestW=B[k]; }
      }
      lim=Math.max(1, Math.floor(Math.max(A[t].n.length, bestW? bestW.n.length:1)/3));
      if(bestI>=0 && bestD<=lim && Math.abs(A[t].n.length-bestW.n.length)<=2){
        usedB[bestI]=1; map.push({ a:t, b:bestI, type:"spell" });
      }else{
        map.push({ a:t, b:-1, type:"miss" });
      }
    }
    var mm, hit;
    for(k=bx;k<by;k++){
      hit=null;
      for(mm=0;mm<map.length;mm++){ if(map[mm].b===k){ hit=map[mm]; break; } }
      if(hit){
        marks.push({ type:"spell", w:B[k].raw, right:A[hit.a].raw });
        bad.push({ w:A[hit.a].n, disp:A[hit.a].raw, tag:"spell", said:B[k].raw });
      }else{
        marks.push({ type:"extra", w:B[k].raw });
      }
    }
    for(mm=0;mm<map.length;mm++){
      if(map[mm].type==="miss"){
        marks.push({ type:"miss", w:A[map[mm].a].raw });
        bad.push({ w:A[map[mm].a].n, disp:A[map[mm].a].raw, tag:"hear", said:"" });
      }
    }
  }

  var pa, pb, Am, Bm;
  for(i=0;i<pairs.length;i++){
    pa=pairs[i][0]; pb=pairs[i][1];
    if(pa>px || pb>py) flushGap(px, pa, py, pb);
    Am=A[pa]; Bm=B[pb];
    marks.push({ type:"ok", w:Bm.raw });
    right++;
    if(Am.raw!==Bm.raw){
      if(Am.raw.indexOf("'")>=0 || Bm.raw.indexOf("'")>=0 ||
         Am.raw.indexOf("\u2019")>=0 || Bm.raw.indexOf("\u2019")>=0) hints.apos++;
      else hints.case++;
    }
    px=pa+1; py=pb+1;
  }
  if(px<n || py<m) flushGap(px, n, py, m);

  /* 句末标点：答案有、输入没写 —— 记为忽略项并明确告知，不悄悄放水 */
  var aq=(String(answer).match(/[.!?]+["']?\s*$/)||[""])[0];
  var bq=(String(said).match(/[.!?]+["']?\s*$/)||[""])[0];
  if(aq && !bq) hints.punct=1;

  var extraN=0, mi;
  for(mi=0;mi<marks.length;mi++){ if(marks[mi].type==="extra") extraN++; }
  var total=A.length? A.length : 1;
  return { marks:marks, total:A.length, right:right, acc:(right/total),
           full:(A.length>0 && right===A.length && extraN===0),
           hints:hints, bad:bad, extra:extraN,
           answer:String(answer==null?"":answer), said:String(said==null?"":said) };
}

/* ---------- 错词入库 ---------- */
function dsentSaveWord(badItem){
  var k=badItem.w, disp=badItem.disp||badItem.w;
  if(!k) return;
  var inV=(typeof VOCAB_BY_W!=="undefined" && VOCAB_BY_W[k])? 1 : 0;
  var dup=0, i;
  for(i=0;i<DSENT.hard.length;i++){
    if(DSENT.hard[i].w===k){ DSENT.hard[i].n=(DSENT.hard[i].n||1)+1; dup=1; break; }
  }
  if(!dup) DSENT.hard.push({ w:k, disp:disp, tag:badItem.tag||"spell", inV:inV, n:1 });
  if(inV){
    useWord(k, "dict");          /* 听写维度计数 */
    srsUpd(k, 1);                /* 进 SRS 复习队列（低档，明天还会问） */
  }else{
    errBump(k, badItem.tag||"spell", "dictsent");   /* 非词库词记错因，不静默丢弃 */
  }
}
/* 未命中词库的错词：一键收进我的词条 */
function dsentAddWord(w){
  w=String(w||"").toLowerCase();
  if(!w) return;
  var b=myBag(), old=b[w];
  b[w]={ w:w, ph:"", pos:"", cn:"（句子听写错词，待补释义）", root:"",
         fam:[], syn:[], ant:[], col:[], conf:[],
         ex:"", exCn:"", scene:"",
         added:(old && old.added)||Date.now(), up:Date.now() };
  try{ myMirror(); }catch(e){}
  try{ mySync(); }catch(e){}
  saveDB();
  var i;
  for(i=0;i<DSENT.hard.length;i++){ if(DSENT.hard[i].w===w) DSENT.hard[i].inV=2; }
  render();
  toast("已加入我的词：「"+w+"」（点词条可补中文释义）");
}

function dsentSubmit(){
  if(DSENT.phase!=="ask") return;
  var it=dsentCur(); if(!it) return;
  var r=dsDiff(it.text, DSENT.text||"");
  DSENT.res=r; DSENT.phase="done";
  DSENT.n++; DSENT.sumW+=r.total; DSENT.sumOk+=r.right;
  if(r.full) DSENT.ok++;
  if(!DSENT.worst || r.acc<DSENT.worst.acc){
    DSENT.worst={ text:it.text, acc:r.acc, seg:it.m.t, id:it.m.id };
  }
  var i;
  for(i=0;i<r.bad.length;i++) dsentSaveWord(r.bad[i]);
  addSec(Math.max(1, Math.round(dsWc(it.text)/8)), "write");
  render();
}
function dsentNext(){
  if(DSENT.i+1>=DSENT.q.length){ dsentFinish(); return; }
  DSENT.i++; DSENT.phase="ask"; DSENT.text=""; DSENT.res=null;
  DSENT.plays=0; DSENT.slow=0;
  render();
  dsentPlay(0, 1);
}
function dsentFinish(){
  var sec=Math.max(1, Math.round((Date.now()-(DSENT.t0||Date.now()))/1000));
  dsentRecord();
  addSec(Math.max(1, Math.round(sec/60)), "write");
  DSENT.phase="end";
  render();
}
/* 本轮记录写库：时间 / 句数 / 逐词正确率 / 错词数组（最多留 30 轮） */
function dsentRecord(){
  var arr=(DB.dictSent instanceof Array)? DB.dictSent.slice() : [];
  var sec=Math.max(1, Math.round((Date.now()-(DSENT.t0||Date.now()))/1000));
  var words=DSENT.sumW|0, right=DSENT.sumOk|0, hw=[], i;
  for(i=0;i<DSENT.hard.length;i++) hw.push(DSENT.hard[i].w);
  var rec={ t:Date.now(), d:dk(), n:DSENT.n|0, qs:(DSENT.q||[]).length,
            words:words, right:right, acc:(words? Math.round(right/words*100):0),
            ok:(DSENT.ok|0), sec:sec, hard:hw };
  arr.push(rec);
  if(arr.length>30) arr=arr.slice(-30);
  DB.dictSent=arr; saveDB();
  return rec;
}

  h+='<div class="hero"><div class="kicker">Dictation</div><h1>句子听写</h1>'+
     '<p>材料全部取自精听里的真实句子（新闻 / 对话 / 学术 / 职场），不是拿单词拼出来的假句。</p></div>';
  h+='<div class="seg">'+
     '<button onclick="setDictMode(\'word\')">单词听写</button>'+
     '<button class="on" onclick="setDictMode(\'sent\')">句子听写</button>'+
     '</div>';
  if(DSENT.phase==="ask") return h+dsentAskHtml();
  if(DSENT.phase==="done") return h+dsentDoneHtml();

     '· 对照结果会写明本次到底忽略了哪几处</div></div>';
  return h;

/* ================= 模块 18：碎片时间 Snack（吃饭 / 排队 / 通勤） ================= */
var SNACK = { on:false, qs:[], i:0, ok:0, t0:0, limit:120, left:0, tick:null,
  phase:"idle", pick:null, reveal:false, scene:"meal" };

var SNACK_SCENES = [
  { id:"meal",  t:"吃饭时",   d:"一只手拿筷子，只需听和选", s:"60 秒起" },
  { id:"queue", t:"排队等号", d:"站着也能做，看词回想", s:"90 秒起" },
  { id:"walk",  t:"走路通勤", d:"纯听，不用看屏幕", s:"2 分钟起" },
  { id:"bed",   t:"睡前躺着", d:"闭眼听写，手不用抬", s:"3 分钟" }
];

/* ---- 生成微题：每道题 1 个核心动作，30 秒内可完成 ---- */
function snackBuild(kind, n){
  var pool=dueFirstPool().filter(function(w){ return !!VOCAB_BY_W[w]; });
  if(!pool.length) pool=wordPool();
  var picked=pickN(pool, Math.max(n, 6));
  var qs=[], i;
  for(i=0;i<n;i++){
    var w=picked[i % picked.length];
    var v=VOCAB_BY_W[w];
    if(!v) continue;
    var t;
    if(kind==="listen") t="listen";
    else if(kind==="recall") t="recall";
    else if(kind==="dict") t="dict";
    else if(kind==="shadow") t="shadow";
    else t = ["listen","recall","dict"][i%3];
    if(t==="shadow"){
      var sents=(window.SHADOW_POOL||[]);
      var s=sents.length? oneOf(sents) : (v.ex?{ en:v.ex, cn:v.exCn } : null);
      if(s) qs.push({ t:"shadow", w:w, en:s.en, cn:s.cn });
      else qs.push({ t:"recall", w:w });
      continue;
    }
    qs.push({ t:t, w:w });
  }
  return qs;
}

function startSnack(kind, limit){
  stopSnackTimer();
  var n = limit<=60? 4 : (limit<=120? 8 : (limit<=180? 12 : 20));
  SNACK.qs=snackBuild(kind, n);
  if(!SNACK.qs.length){ toast("词库为空"); return; }
  SNACK.on=true; SNACK.phase="run"; SNACK.i=0; SNACK.ok=0; SNACK.pick=null; SNACK.reveal=false;
  SNACK.limit=limit||120; SNACK.left=SNACK.limit; SNACK.t0=Date.now();
  SNACK.tick=setInterval(function(){
    SNACK.left=SNACK.limit - Math.round((Date.now()-SNACK.t0)/1000);
    var el=document.getElementById("snackLeft");
    if(el) el.textContent = humanSec(Math.max(0,SNACK.left));
    var bar=document.getElementById("snackBar");
    if(bar) bar.style.width = Math.max(0, Math.min(100, SNACK.left/SNACK.limit*100))+'%';
    if(SNACK.left<=0) endSnack(true);
  }, 1000);
  render();
  snackPlay();
}
function stopSnackTimer(){ if(SNACK.tick){ clearInterval(SNACK.tick); SNACK.tick=null; } }
function endSnack(byTime){
  stopSnackTimer(); SNACK.on=false; SNACK.phase="end";
  var used=Math.round((Date.now()-SNACK.t0)/1000);
  SNACK.used=used;
  addSec(Math.min(used, SNACK.limit));
  if(SNACK.ok>0) touch("snack", 1);
  SNACK.byTime=!!byTime;
  render();
}
function snackNext(){
  SNACK.i++; SNACK.pick=null; SNACK.reveal=false;
  if(SNACK.i>=SNACK.qs.length){ endSnack(false); return; }
  render(); snackPlay();
}
function snackCur(){ return SNACK.qs[SNACK.i]; }
function snackPlay(){
  var q=snackCur(); if(!q) return;
  if(q.t==="listen") speak(VOCAB_BY_W[q.w]? VOCAB_BY_W[q.w].w : q.w, 0.9);
  else if(q.t==="shadow") speak(q.en, 0.95);
  else if(q.t==="dict") speak(VOCAB_BY_W[q.w]? VOCAB_BY_W[q.w].w : q.w, 0.82);
}
function snackAnswer(opt, right){
  if(SNACK.pick!==null) return;
  SNACK.pick=opt;
  if(right){ SNACK.ok++; useWord(SNACK.qs[SNACK.i].w, "view"); }
  addSec(3);
  setTimeout(function(){ if(SNACK.on) snackNext(); }, right?520:1100);
}
function snackReveal(){ SNACK.reveal=true; render(); }
function snackKnow(knew){
  if(knew){ SNACK.ok++; useWord(snackCur().w, "view"); }
  srsUpd(snackCur().w, knew?3:1);
  snackNext();
}
function snackDictCheck(){
  var el=document.getElementById("snackIn"); if(!el) return;
  var q=snackCur(), v=VOCAB_BY_W[q.w]||{w:q.w};
  var r=cmpDict(v.w||q.w, el.value);
  SNACK.pick = el.value;
  SNACK.res = r;
  if(r.rate>=0.999){ SNACK.ok++; srsUpd(q.w,3); } else srsUpd(q.w,0);
  useWord(q.w, "write");
  SNACK.reveal=true;
  render();
}

var INTERP_MODE = "ci";

var CI = { stage:"idle", seg:0, i:0, reps:1, rate:0.9, judge:[], t0:0, note:"", said:"", rec:false, showCn:false };

function ciStart(segIdx){
  INTERP_MODE="ci"; SI.stage="idle";
  CI.seg=segIdx|0; CI.i=0; CI.judge=[]; CI.t0=Date.now(); CI.note=""; CI.said=""; CI.stage="play";
  render(); ciPlay();
}
function ciPlay(){
  var seg=INTERP_SEGS[CI.seg];
  if(!seg) return;
  var s=seg.en[CI.i];
  CI.stage="play";
  render();
  var n=0;
  (function rep(){
    speak(s, CI.rate, function(){ n++; if(n<CI.reps) setTimeout(rep, 380); else { CI.stage="speak"; render(); } });
  })();
}
function ciReplay(){ speak(INTERP_SEGS[CI.seg].en[CI.i], CI.rate); }
function ciSlower(){ CI.rate=0.78; speak(INTERP_SEGS[CI.seg].en[CI.i], 0.72); }
function ciToSpeak(){ CI.stage="speak"; render(); }
function ciNote(el){ CI.note=el.value; }
function ciSaid(el){ CI.said=el.value; }
function ciReveal(){ CI.stage="reveal"; render(); }
function ciJudge(score){
  CI.judge.push(score);
  CI.i++;
  CI.note=""; CI.said="";
  if(CI.i>=INTERP_SEGS[CI.seg].en.length){ ciEnd(); return; }
  CI.stage="play"; render(); ciPlay();
}
function ciEnd(){
  CI.stage="end";
  var used=Math.round((Date.now()-CI.t0)/1000);
  CI.used=used;
  addSec(used);
  touch("interp", 1);
  DB.interp=DB.interp||{ ci:{n:0,sec:0}, si:{n:0,sec:0} };
  DB.interp.ci.n=(DB.interp.ci.n||0)+1;
  DB.interp.ci.sec=(DB.interp.ci.sec||0)+used;
  saveDB();
  render();
}

var SI = { stage:"idle", seg:0, i:0, rate:1.0, delay:0, playing:false, timer:null, t0:0, judge:[], reps:0, mono:false };

function siStart(segIdx){
  INTERP_MODE="si"; CI.stage="idle";
  SI.seg=segIdx|0; SI.i=0; SI.judge=[]; SI.judge=[]; SI.stage="run"; SI.playing=true; SI.t0=Date.now();
  SI.mono=false;
  render();
  siPlayFrom(0);
}
function siPlayFrom(index){
  var seg=INTERP_SEGS[SI.seg];
  if(!seg || index>=seg.en.length){ siEnd(); return; }
  SI.i=index;
  render();
  var startFn=function(){
    speak(seg.en[index], SI.rate, function(){
      if(!SI.playing) return;
      setTimeout(function(){
        if(!SI.playing) return;
        if(SI.i!==index) return;
        siPlayFrom(index+1);
      }, 260);
    });
  };
  if(SI.delay>0 && index>0) setTimeout(startFn, SI.delay*1000); else startFn();
}
function siStop(){ SI.playing=false; stopSpeak(); SI.stage="pause"; render(); }
function siResume(){ SI.playing=true; SI.stage="run"; render(); siPlayFrom(SI.i); }
function siEnd(){
  SI.playing=false; stopSpeak();
  if(SI.timer){ clearInterval(SI.timer); SI.timer=null; }
  SI.stage="end";
  var used=Math.round((Date.now()-SI.t0)/1000);
  SI.used=used;
  addSec(used);
  touch("interp", 1);
  DB.interp=DB.interp||{ ci:{n:0,sec:0}, si:{n:0,sec:0} };
  DB.interp.si.n=(DB.interp.si.n||0)+1;
  DB.interp.si.sec=(DB.interp.si.sec||0)+used;
  saveDB();
  render();
}

/* ===== v25：素材池与口音维度 =====
   口音只描述"这段音频是谁念的"，取值来自每段的 accent 字段（生成时用的真实 voice），
   界面绝不再二次推断；筛选只改轮转集合，不会给同一份 mp3 换一个口音标签。 */
var BG_ACCS = [["all","全部"],["us","美音"],["uk","英音"],["au","澳音"],["in","印音"]];
var BG_ACC_CN = { all:"全部", us:"美音", uk:"英音", au:"澳音", in:"印音", std:"标准音色" };
var BG_CAT_CN = { news:"新闻简讯", academic:"学术讲座", meeting:"职场会议", daily:"日常对话" };
function bgAccNorm(a){
  var k = String(a || "").toLowerCase();
  return (k === "us" || k === "uk" || k === "au" || k === "in" || k === "std") ? k : "all";
}
function bgAccOf(s){ return s ? bgAccNorm(s.accent) : "std"; }
function bgAccCn(a){ var k = bgAccNorm(a); return BG_ACC_CN[k] || "标准音色"; }
function bgAccTag(s){ return s ? bgAccCn(bgAccOf(s)) : "标准音色"; }
function bgAccCount(a){
  var v = bgAccNorm(a), n = 0, i;
  for(i = 0; i < BG_WORK.length; i++){ if(bgAccOf(BG_WORK[i]) === v) n++; }
  return n;
}
/* 选中集合：全局下标数组。集合为空时回落全部，并由 bgPoolEmpty() 在界面上如实说明 */
var BG_POOL = null, BG_POOL_KEY = "";
function bgWorkPool(){
  var acc = bgAccNorm(DB.bgAcc);
  if(BG_POOL && BG_POOL_KEY === acc) return BG_POOL;
  var out = [], i;
  for(i = 0; i < BG_WORK.length; i++){ if(acc === "all" || bgAccOf(BG_WORK[i]) === acc) out.push(i); }
  if(!out.length){ for(i = 0; i < BG_WORK.length; i++) out.push(i); }
  BG_POOL = out; BG_POOL_KEY = acc;
  return out;
}
function bgPoolLen(){ return bgWorkPool().length; }
function bgPoolEmpty(){ return bgAccNorm(DB.bgAcc) !== "all" && bgAccCount(DB.bgAcc) === 0; }
/* 集合序号 → 全局下标。负值/越界一律取模，永不返回越界段 */
function bgPoolGet(pos){
  var p = bgWorkPool(), n = p.length;
  if(!n) return null;
  var i = (((pos | 0) % n) + n) % n;
  return { idx:p[i], pos:i, n:n, seg:BG_WORK[p[i]] };
}
function bgPoolPosOf(idx){
  var p = bgWorkPool(), i;
  for(i = 0; i < p.length; i++){ if(p[i] === (idx | 0)) return i; }
  return -1;
}
/* 全局下标 → 当前集合内的全局下标：不在集合里就取模落到集合内的段，绝不指向未选中的段 */
function bgNormIdx(idx){
  var p = bgWorkPool(), n = p.length;
  if(!n) return 0;
  var pos = bgPoolPosOf(idx);
  if(pos >= 0) return p[pos];
  return p[(((idx | 0) % n) + n) % n];
}
function bgStat(){
  var t = { dur:0, byCat:{}, byAcc:{} }, i, s, k;
  for(i = 0; i < BG_WORK.length; i++){
    s = BG_WORK[i];
    t.dur += Number(s.dur) || 0;
    k = s.cat || "news"; t.byCat[k] = (t.byCat[k] || 0) + 1;
    k = bgAccOf(s); t.byAcc[k] = (t.byAcc[k] || 0) + 1;
  }
  return t;
}
function bgKwCover(){
  var seen = {}, n = 0, i, k, seg, w;
  for(i = 0; i < BG_WORK.length; i++){
    seg = BG_WORK[i];
    if(!seg.kw) continue;
    for(k = 0; k < seg.kw.length; k++){
      w = String(seg.kw[k]).toLowerCase();
      if(!seen[w]){ seen[w] = 1; n++; }
    }
  }
  return n;
}
/* 口音筛选：切集合后段号立刻归一，播放中切会跳到新集合内同位置段；已听时长一分不动 */
function bgSetAcc(a){
  var v = bgAccNorm(a);
  if(v === bgAccNorm(DB.bgAcc)){ render(); return; }
  if(v !== "all" && bgAccCount(v) === 0){
    DB.bgAcc = "all"; DB.bgAccTs = Date.now();
    BG.idx = bgNormIdx(BG.idx);
    saveDB(); render();
    toast("「" + bgAccCn(v) + "」目前没有可用素材，已回落到全部 " + BG_WORK.length + " 段");
    return;
  }

  var ws = [], bag = {}, mon = "";

  function next(){
    if(!BG.playing || my !== BG.seqToken){ BG.speaking = 0; return; }
    if(BG.paused){ BG.speaking = 0; return; }
    if(i >= list.length){ if(done) done(); return; }
    var txt = list[i], t0 = Date.now(), settled = false, wd = null;
    var r = gv(rate) || 0.9;

    var estMs = Math.max(4000, (words / 2.2 / Math.max(0.6, r)) * 1000 * 1.6 + 4000);
    function settle(ok){
      if(settled) return;

      if(wd){ clearTimeout(wd); wd = null; }

      if(ok){ BG.spoken += d; BG.fails = 0; }
      else { BG.fails++; }

/* --- 跨模块联动：背景听里播过的目标词记一次极轻的曝光（不动 SRS 等级、不改到期日） ---
   同一个词每天只往 use / 回流队列记一次，循环 30 分钟不会把计数刷爆；
   词库里没有的词只留曝光次数，不凭空造复习记录 */
function bgExpose(seg){
  if(!seg || !seg.kw || !seg.kw.length) return 0;
  var today = dk(), hit = 0;
  if(!DB.bgEx) DB.bgEx = {};
  for(var i = 0; i < seg.kw.length; i++){
    var w = String(seg.kw[i]).toLowerCase();
    if(typeof VOCAB_BY_W === "undefined" || !VOCAB_BY_W[w]) continue;
    var e = DB.bgEx[w] || (DB.bgEx[w] = { n:0, d:"", last:"" });
    e.n = (e.n || 0) + 1; e.last = today; hit++;
    if(e.d !== today){ e.d = today; useWord(w, "bg"); }
  }
  saveDB();
  return hit;
}

/* --- 「这段没听清」：单手一键。v24 起顺手把回听要用的信息一起记下：
   模式、段号（睡前听记轮次）、段标题、日期与时刻——点一下就能回到那一段重听 --- */
function bgMarkNow(){
  var d = new Date();
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function bgMarkSeg(){
  if(!BG.playing) return;
  var seg = (BG.mode === "work") ? BG_WORK[bgNormIdx(BG.idx)] : null;
  /* v25：库里只存标题，口音在展示时由 bgMarkTitle 现算——存两份会变成「澳音 · 澳音 · 标题」 */
  var raw = seg ? seg.t : "睡前句包";
  var key = seg ? (bgAccTag(seg) + " · " + raw) : "睡前句包";
  /* v25：段号存全局下标（长按回听时能定位回原段），展示时再换算成当前集合里的第几段 */
  var idx = (BG.mode === "work") ? bgNormIdx(BG.idx) : (BG.rounds | 0);
  DB.bgMark = bgMarkNormArr(DB.bgMark);
  DB.bgMark.unshift({ id:"m" + Date.now() + "_" + Math.floor(Math.random() * 1e6),
                      t:raw, d:dk(), mode:BG.mode, idx:idx, tm:bgMarkNow(), ts:Date.now() });
  if(DB.bgMark.length > BG_MARK_MAX) DB.bgMark.length = BG_MARK_MAX;   /* 上限 200，超出淘汰最旧 */
  if(seg && seg.kw && seg.kw.length){
    DB.bgHard = DB.bgHard || {};
    for(var i = 0; i < seg.kw.length; i++){
      var w = String(seg.kw[i]).toLowerCase();
      if(typeof VOCAB_BY_W === "undefined" || !VOCAB_BY_W[w]) continue;
      var hd = DB.bgHard[w] || (DB.bgHard[w] = { n:0, d:"" });
      hd.n = (hd.n || 0) + 1; hd.d = dk();
    }
  }
  BG.marks++; BG.lastMark = key;
  saveDB();
  var el = document.getElementById("bgMarkN");
  if(el) el.textContent = BG.marks;
  toast("已标「没听清」：" + key + "（已记 " + (BG.mode === "work" ? ("第 " + (bgPoolPosOf(idx) + 1) + " 段") : ("第 " + (idx + 1) + " 轮")) +
        "，可在下面清单点开回听" + (seg && seg.kw && seg.kw.length ? "；目标词也记了「没听清」次数" : "") + "）");
}

/* ===== v24：没听清标记的清单与回听 =====
   清单项可点：work 复用 bgJumpTo 跳段重播，sleep 回到那一轮重新起；跳转不清零已听时长、不重复计。
   删除/清空只动登记关系，不碰任何学习记录。 */
function bgMarkWhen(x){
  if(!x.d) return "时间未记录";
  return (x.d === dk()) ? ("标记于 " + (x.tm || "--:--")) : ("标记于 " + bgDateCn(x.d) + " " + (x.tm || ""));
}
function bgMarkTitle(x){
  if(x.mode === "sleep") return "第 " + ((x.idx | 0) + 1) + " 轮 · " + x.t;
  /* v25：工作听标「口音 · 标题」而不是固定段号——段号会随口音筛选变化，标题不会 */
  var sg = BG_WORK[x.idx | 0];
  return (sg ? (bgAccTag(sg) + " · ") : "") + x.t;
}
function bgMarkListHtml(){
  var arr = bgMarkNormArr(DB.bgMark);
  if(!arr.length) return "";
  var show = arr.slice(0, 20), h = "", i, x;
  h += '<div class="h2">没听清标记<span class="ln"></span></div>';

       '<div class="hd"><h3>共 ' + arr.length + ' 条</h3><span class="sub">点条目回听</span></div>' +
       '<div class="tiny muted" style="margin:-2px 0 6px;line-height:1.7">点一下直接跳回那一段重听：已听时长照旧累计，不重复计。删掉只删这条标记。</div>';
  for(i = 0; i < show.length; i++){
    x = show[i];
    h += '<div class="row" style="align-items:flex-start;gap:8px;padding:8px 0;border-top:1px solid rgba(128,128,128,.18)">' +
         '<div style="flex:1;min-width:0">' +
           '<div style="font-weight:700;font-size:13.5px;overflow-wrap:anywhere">' + esc(bgMarkTitle(x)) + '</div>' +
           '<div class="tiny muted" style="margin-top:2px">' +
             esc((x.mode === "sleep" ? "睡前听 · " : "工作听 · ") + bgMarkWhen(x)) + '</div>' +
         '</div>' +
         '<button class="mini" onclick="bgReplayMark(\'' + esc(x.id) + '\')">回听</button>' +

         '</div>';
  }
  if(arr.length > show.length){

  }
  h += '<div class="row" style="margin-top:10px"><button class="btn sm ghost" onclick="bgMarkClear()">清空标记</button></div>';
  h += '</div>';

}
function bgMarkFind(id){
  var arr = DB.bgMark || [], i;
  for(i = 0; i < arr.length; i++){
    if(arr[i] && String(arr[i].id) === String(id)) return { at:i, m:bgMarkDef(arr[i], i) };
  }
  return null;
}
function bgReplayMark(id){
  var f = bgMarkFind(id), m;
  if(!f || !f.m){ toast("这条标记已经不在了"); return; }
  m = f.m;
  if(m.mode === "work"){
    if(!BG_WORK.length){ toast("工作听素材为空，暂时无法回听"); return; }
    if(m.idx < 0 || m.idx >= BG_WORK.length){ toast("该段已不在当前素材里了（素材表更新过）"); return; }
    /* v25：这段若不在当前口音集合内，先把集合切过去，否则跳转会被归一化到别的段 */
    var _rs = BG_WORK[m.idx], _ca = bgAccNorm(DB.bgAcc);
    if(_rs && _ca !== "all" && bgAccOf(_rs) !== _ca){ DB.bgAcc = bgAccOf(_rs); DB.bgAccTs = Date.now(); saveDB(); }
    var _rt = (_rs ? (bgAccTag(_rs) + " · ") : "") + m.t;
    if(BG.playing && BG.mode === "work"){ bgJumpTo(m.idx); toast("回到「" + _rt + "」重听，已听时长照旧累计"); return; }
    if(BG.playing) bgStop(false);
    bgSetMode("work");
    DB.bgProg = bgProgMerge(DB.bgProg, {});
    DB.bgProg.work = { idx:m.idx, d:dk(), acc:bgAccNorm(DB.bgAcc) };
    saveDB();
    bgStart();
    toast("从「" + _rt + "」开始重听");
    return;
  }
  if(!bgSleepPool().items.length){ toast("今天没有到期或学过的词，睡前听暂时没有可回听的内容"); return; }
  if(BG.playing) bgStop(false);
  bgSetMode("sleep");
  DB.bgProg = bgProgMerge(DB.bgProg, {}); DB.bgProg.sleep = { idx:m.idx, d:dk() }; saveDB();
  bgStart();
  toast("从第 " + (m.idx + 1) + " 轮开始重听");
}
function bgMarkDel(id){
  var f = bgMarkFind(id);
  if(!f){ toast("这条标记已经不在了"); return; }
  DB.bgMark.splice(f.at, 1);
  DB.bgMark = bgMarkNormArr(DB.bgMark);
  saveDB(); render();
  toast("已删掉这条标记");
}
function bgMarkClear(){
  DB.bgMark = [];
  saveDB(); render();
  toast("标记清单已清空，学习记录不受影响");
}

/* ===== v24：外部资源真实计时 =====
   原来点一下就把资源标称时长整笔入账，是能被戳穿的假账。现在只有两个动作：开始计时 / 结束并记账，
   入账唯一依据是两次点击之间的真实秒数（墙上时钟）；没开始计时或时长为 0 一律计 0 并说明原因，
   绝不按资源标称时长补一笔。计时器是会话级的，不写库、不跨刷新。 */
var BG_SRC = { i:-1, name:"", t0:0, iv:null };
function bgSrcSec(){
  if(BG_SRC.i < 0 || !BG_SRC.t0) return 0;
  var v = (Date.now() - BG_SRC.t0) / 1000;
  return v > 0 ? Math.floor(v) : 0;
}
function bgSrcDurText(sec){
  sec = Math.max(0, sec | 0);
  var m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? (m + " 分 " + s + " 秒") : (s + " 秒");
}
function bgSrcTick(){
  if(BG_SRC.i < 0) return;
  var el = document.getElementById("bgSrcGo" + BG_SRC.i);
  if(el) el.textContent = "结束并记账 · 已 " + bgSrcDurText(bgSrcSec());
}
function bgSrcTimerStop(){
  if(BG_SRC.iv){ clearInterval(BG_SRC.iv); BG_SRC.iv = null; }
}
function bgSrcBtnText(i){
  var s = BG_SOURCES[i];
  if(!s) return "";
  if(BG_SRC.i === i && BG_SRC.t0) return "结束并记账 · 已 " + bgSrcDurText(bgSrcSec());
  var b = (DB.srcBack || {})[s.name];
  if(!b) return "开始计时";
  return "已用 " + (b.n | 0) + " 次 · 累计 " + Math.round((b.sec || 0) / 60) + " 分钟" +
         (b.last ? " · 上次 " + b.last : "") + "，再计一次";
}
/* 点一下开始计时，再点一下结束并记账；中途不落库，只有真实秒数才入账 */
function bgSrcGo(i){
  var s = BG_SOURCES[i];
  if(!s) return;
  if(BG_SRC.i === i && BG_SRC.t0){ bgSrcBack(i); return; }
  bgSrcTimerStop();
  BG_SRC.i = i; BG_SRC.name = s.name; BG_SRC.t0 = Date.now();
  BG_SRC.iv = setInterval(bgSrcTick, 1000);
  render();
  toast("开始计时。在外面听完回来点「结束并记账」，只按这段真实秒数入账");
}
function bgSrcBack(i){
  var s = BG_SOURCES[i], sec = 0, m, b, counted;
  if(!s) return;
  if(BG_SRC.i === i && BG_SRC.t0) sec = bgSrcSec();
  bgSrcTimerStop();
  BG_SRC.i = -1; BG_SRC.name = ""; BG_SRC.t0 = 0;
  DB.srcBack = DB.srcBack || {};
  b = DB.srcBack[s.name] || (DB.srcBack[s.name] = { n:0, last:"", sec:0 });
  if(sec < 1){
    /* 拿不到真实时长就计 0：不按资源标称时长补账，也不假装成功 */
    saveDB(); render();
    toast("这次没有可记账的时长：外部资源在你的播放器里放，本应用看不到播放器，只认你实际计时的秒数（本次 0 秒）");
    return;
  }
  m = (BG.mode === "sleep") ? "sleep" : "work";
  b.n = (b.n || 0) + 1; b.last = dk(); b.sec = (b.sec || 0) + sec;
  DB.bg = DB.bg || { work:{ n:0, sec:0 }, sleep:{ n:0, sec:0 } };
  DB.bg[m].sec = (DB.bg[m].sec || 0) + sec;
  counted = sec >= bgGoalNorm(DB.bgGoal);
  /* v27：工作听进「听」分项与日历计数；睡前听只记睡前口径，不与工作听混算 */
  if(m === "work"){
    addSec(sec, "listen");
    if(counted){ DB.bg.work.n = (DB.bg.work.n || 0) + 1; touch("bg", 1); }
  } else {
    addSec(sec);
    if(counted) DB.bg.sleep.n = (DB.bg.sleep.n || 0) + 1;
  }
  saveDB(); render();
  toast("已按实际计时记 " + bgSrcDurText(sec) + " 到" + (m === "sleep" ? "睡前听" : "工作听") +
        (counted ? "，达成一次有效背景听" : "；不到 " + bgGoalMinText() + "，只记时长、不计有效次数"));
}

function bgSetMode(m){
  if(BG.playing) bgStop(false);
  if(BG.mode === "work") BG.rateWork = BG.rate; else BG.rateSleep = BG.rate;
  BG.mode = m; BG.night = (m === "sleep");
  BG.rate = (m === "work") ? BG.rateWork : BG.rateSleep;   /* 两个场景各记各的语速 */
  document.body.classList.toggle("bgnight", BG.night);
  render();
}

function bgSetMins(n){ if(BG.playing) return; BG.mins = n|0; render(); }
/* v27：睡前时长档位——写进本地库（10/15/20/30，非法值回落 15），刷新与快照恢复都不丢 */
function bgSleepSetMins(n){
  var v = bgSleepMinsNorm(n);
  DB.bgSleepMins = v; DB.bgSleepTs = Date.now();
  BG.sleepWarn = 0;
  if(BG.playing && BG.mode === "sleep"){
    BG.mins = v;                                  /* 播放中改档：按新档位重算剩余，已发声时长不动 */
    BG.remain = Math.max(0, v * 60 - bgElapsed());
    bgPaintClock();
  }
  saveDB(); render();
  toast("睡前听时长改为 " + v + " 分钟");
}
/* v27：到点自动收尾开关 */
function bgSleepSetAuto(v){
  DB.bgSleepAuto = bgSleepAutoNorm(v); DB.bgSleepTs = Date.now();
  BG.sleepWarn = 0; BG.overdue = 0;
  saveDB(); render();
  toast(bgSleepAutoOn()
    ? "到点自动收尾已开：到点后不再开新句，当前句念完即停"
    : "到点自动收尾已关：到点只提示已达标，继续放到你手动停");
}
/* v24：有效门槛三档切换。写库即生效：判定统一读 DB.bgGoal；同时盖时间戳，
   同步/快照按时间戳取较新的一侧，旧快照不能把档位降回去 */
function bgSetGoal(g){
  var v = bgGoalNorm(g);
  if(v === bgGoalNorm(DB.bgGoal)){ render(); return; }
  DB.bgGoal = v;
  DB.bgGoalTs = Date.now();
  saveDB(); render();
  toast("有效门槛已设为 " + (v / 60) + " 分钟：真实发声满 " + (v / 60) + " 分钟才算一次");
}
/* 合并：时间戳新的一侧胜出；两侧都没有时间戳时取较大档位，绝不因为旧数据回落 */
function bgGoalPick(ta, ga, tb, gb){
  var A = bgGoalNorm(ga), B = bgGoalNorm(gb);
  var TA = Number(ta) || 0, TB = Number(tb) || 0;
  if(TA === TB) return { g: Math.max(A, B), ts: TA };
  return (TA > TB) ? { g: A, ts: TA } : { g: B, ts: TB };
}
function bgSetRate(r){
  if(BG.playing) return;
  BG.rate = r;
  if(BG.mode === "work") BG.rateWork = r; else BG.rateSleep = r;
  render();
}

/* --- v23 断点：段号 + 日期一起存。工作听记段号，睡前听记轮次 --- */
function bgProgSave(){
  var m = (BG.mode === "sleep") ? "sleep" : "work";
  DB.bgProg = bgProgMerge(DB.bgProg, {});
  /* v25：工作听存集合内的全局下标 + 集合标识，恢复时集合变了能按取模兜底 */
  DB.bgProg[m] = { idx:(m === "work" ? bgNormIdx(BG.idx) : (BG.rounds | 0)), d: dk(), acc: bgAccNorm(DB.bgAcc) };
  saveDB();
}
function bgDateCn(d){
  var mm = String(d || "").match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(!mm) return "上次";
  return (mm[2] | 0) + " 月 " + (mm[3] | 0) + " 日";
}
/* 取断点：越界/段数变少一律取模兜底，绝不落到 undefined 段；跨天保留但要标明是哪天的 */
function bgProgPick(m, fromHead){
  var p = (DB.bgProg && DB.bgProg[m]) ? DB.bgProg[m] : null;
  if(fromHead || !p || !p.d) return { on:0, idx:0, d:"", cross:0 };
  var idx = p.idx | 0;
  if(idx < 0) idx = 0;
  if(m === "work" && BG_WORK.length > 0){
    var pa = bgAccNorm(p.acc), ca = bgAccNorm(DB.bgAcc);
    if(pa === ca) idx = bgNormIdx(idx);            /* 集合没变：按集合内位置还原 */
    else { var g0 = bgPoolGet(idx); idx = g0 ? g0.idx : 0; }   /* 集合变了：取模兜底，绝不指向未选中段 */
  }
  return { on:1, idx:idx, d:String(p.d || ""), cross:(String(p.d || "") !== dk()) ? 1 : 0 };
}

function bgStart(fromHead){
  if(BG.mode === "sleep" && !bgSleepPool().items.length){   /* v26：池子含低刺激背景段，不再只看有没有到期词 */
    toast("今天没有到期或学过的词，背景素材也没加载上，睡前听暂时无法开始");
    return;
  }
  BG.sq = null;                                   /* v26：每次起播重新组池 */
  stopSpeak();
  BG.seqToken++;
  var m = (BG.mode === "sleep") ? "sleep" : "work";
  var rs = bgProgPick(m, !!fromHead);             /* v23：先取上次听到哪，再决定从哪段开 */
  /* v27：睡前听按库里记的档位起播（10/15/20/30，默认 15）；工作听仍是页面上的 15/30/60 */
  if(m === "sleep") BG.mins = bgSleepMinsNorm(DB.bgSleepMins);
  BG.sleepWarn = 0; BG.overdue = 0; BG.speaking = 0;
  BG.playing = true; BG.paused = false;
  BG.idx = (m === "work") ? bgNormIdx(rs.idx) : 0;
  BG.rounds = (m === "sleep") ? rs.idx : 0;
  BG.elapsed = 0; BG.spoken = 0; BG.fails = 0;
  BG.pausedMs = 0; BG.pauseAt = 0;
  BG.startedAt = Date.now(); BG.remain = BG.mins * 60;
  BG.marks = 0; BG.lastMark = ""; BG.exposed = 0;
  var rp = Math.max(0, bgPoolPosOf(BG.idx));
  BG.progHint = rs.on ? { idx:rs.idx, pos:rp, d:rs.d, cross:rs.cross, mode:m } : null;
  render();
  bgWakeOn();                                     /* 睡前才占常亮，且整段会话有效 */
  bgMetaSet();                                    /* 锁屏标题：进第一段就标对 */
  bgPlayChunk();
  if(BG.timer) clearInterval(BG.timer);
  BG.timer = setInterval(bgTick, 500);
  if(rs.on){
    toast(m === "work"
      ? (rs.cross
          ? "上次是 " + bgDateCn(rs.d) + " 听的，从第 " + (rp + 1) + " 段接着放（" + bgAccCn(DB.bgAcc) + "集合共 " + bgPoolLen() + " 段）"
          : "从上次的第 " + (rp + 1) + " 段继续（" + bgAccCn(DB.bgAcc) + "集合共 " + bgPoolLen() + " 段，想重来点「从头开始」）")
      : (rs.cross
          ? "上次是 " + bgDateCn(rs.d) + " 听的，从第 " + (rs.idx + 1) + " 轮接着放"
          : "从上次的第 " + (rs.idx + 1) + " 轮继续"));
  }
}

function bgPause(){
  if(!BG.playing || BG.paused) return;
  BG.paused = true; BG.pauseAt = Date.now();
  BG.seqToken++;                                  /* 作废掉当前朗读链 */
  BG.speaking = 0;
  if(BG.gapTimer){ clearTimeout(BG.gapTimer); BG.gapTimer = null; }
  if(BG.fadeReset){ try{ BG.fadeReset(); }catch(e){} }   /* v23：先复位音量，别留 0 音量的残 */
  if(BG.audio){ try{ BG.audio.pause(); }catch(e){} }
  try{ if("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused"; }catch(e){}
  stopSpeak();
  bgWakeOff();                                    /* 暂停就还锁，别在后台白撑着屏幕 */
  bgProgSave();                                   /* 暂停多半是要走了，断点先落盘 */
  bgTick(true);
  render();
}

function bgResume(){
  if(!BG.playing || !BG.paused) return;
  BG.pausedMs += Date.now() - BG.pauseAt;
  BG.pauseAt = 0; BG.paused = false; BG.fails = 0;
  render();
  bgWakeOn();
  bgMetaSet();                                    /* 恢复播放，锁屏状态与段标题重新对上 */
  bgPlayChunk();                                  /* 从本段开头接着放 */
}

function bgPlayChunk(){
  if(!BG.playing || BG.paused) return;
  /* v26：睡前听不再走"一次念一串"的老路径，改由 bgSleepPlayCur 逐条推进（A/D/B 单句 + C 整段 mp3） */
  if(BG.mode === "sleep"){ bgSleepPlayCur(0); return; }
  var list, rate, gap, seg = null;
  BG.idx = bgNormIdx(BG.idx);                     /* v25：越界/负值/不在选中集合内 一律归一，绝不出现空段 */
  seg = BG_WORK[BG.idx];
  list = seg.s; rate = BG.rate; gap = 4500;
  bgMetaSet();                                    /* v23：每进新段，锁屏标题跟着换 */
  /* 一段放完就接下一段，否则语音流断在半空、计时还在走 */
  function afterChunk(){
    if(!BG.playing || BG.paused) return;
    /* v25：只在当前口音集合内往下走，放完集合最后一段回到集合第一段（睡前听走轮次，不动段号） */
    if(BG.mode === "work"){
      var _nx = bgPoolGet(bgPoolPosOf(BG.idx) + 1);
      BG.idx = _nx ? _nx.idx : bgNormIdx(0);
    }
    BG.rounds++;
    bgProgSave();                                 /* v23：跨段就把断点落盘，异常退出也能续上 */
    bgPaintClock();
    if(bgLeft() <= 0) return;
    bgPlayChunk();
  }
  if(seg) BG.exposed += bgExpose(seg);            /* 每进一段，把目标词记一次曝光并回流 */
  /* v23：段间淡出只在 mp3 分支做。TTS 分支（bgSaySeq）走系统语音合成，
     音量不归页面管（没有可写的 volume 通道，改 rate 只会变语速），
     所以这里保持原样、靠句间 gap 自然收尾，不假装做淡出。 */
  if(seg && seg.a){
    bgPlayMp3(seg.a, rate, gap, afterChunk, function(){ bgSaySeq(list, rate, gap, afterChunk); });
  } else {
    bgSaySeq(list, rate, gap, afterChunk);
  }
}

/* ===== v26：睡前听的播放链 =====
   池子按轮次缓存：同一轮内 A/D/B 句子与 C 段顺序固定（断点/回听都稳定），换轮才重新组池。
   bgSaySeq / bgPlayMp3 自带 seqToken 校验，暂停、停止、跳轮都会自然中断，不需要外部再管。 */
function bgSleepPoolOf(){
  if(BG.sq && BG.sq.g === (BG.rounds | 0)) return BG.sq;
  var pk = bgSleepPool();
  pk.g = (BG.rounds | 0);
  pk.p = 0;
  BG.sq = pk;
  return pk;
}
/* v27：当前是否正有一句在出声——到点收尾靠它判断「当前句念完没有」 */
function bgSleepBusy(){
  if(BG.speaking) return true;
  if(BG.audio && BG.audio.paused === false) return true;
  return false;
}
/* v27：睡前收尾的统一出口。手动停止与到点收尾都落到 bgStop，
   定时器/Audio/Wake Lock/seqToken 一次清干净，不留后台声音 */
function bgSleepFinish(reason){
  if(!BG.playing) return;
  var sp = Math.floor(BG.spoken || 0);
  BG.overdue = 0;
  BG.sleepWarn = 1;
  bgStop(true);
  toast("今天睡前听已结束 · 本轮真实发声 " + bgDurCn(sp) + "，只记睡前听口径，不计入工作听有效次数");
}
function bgSleepPlayCur(start){
  if(!BG.playing || BG.paused) return;
  /* v27：到点且开着自动收尾时不再开新句（这一句结束才走到这里，所以不会截断当前句） */
  if(bgSleepAutoOn() && bgLeft() <= 0){ bgSleepFinish("timeup"); return; }
  var pk = bgSleepPoolOf();
  if(!pk.items.length){                            /* 连背景段都没有：如实说明，不空转 */
    if((BG.rounds | 0) === 0) toast("睡前听暂时没有可放的内容，背景素材也没加载上");
    bgStop(true);
    return;
  }
  var it = (start == null) ? (pk.p | 0) : (start | 0);
  if(it >= pk.items.length){ bgSleepNextRound(); return; }
  pk.p = it;
  if(it === 0 && pk.loose && (pk.g | 0) === 0){
    /* 今天没词、没听错句、没标记：只剩背景段可铺，如实说清，不假装在复习 */
    toast("今天没有到期词、也没听错句，这一轮只铺低刺激背景段（" + pk.c + " 段慢放）");
  }
  bgMetaSet();                                     /* v23 行为不变：锁屏标题显示「睡前听 · 第 N 轮」 */
  var cur = pk.items[it];
  /* v28：息屏/后台时系统语音（TTS）一定会被系统挂起，句子项直接跳过，只放预生成的整段音频；
     一整轮都没有音频段可放时如实暂停，绝不空转刷轮次、也不假装还在念 */
  if(cur.k !== "mp3" && bgHidden()){
    pk.skip = (pk.skip | 0) + 1;
    if(pk.skip >= pk.items.length){
      bgPause();
      toast("息屏时只能放预生成的整段音频；这一轮没有音频段，已暂停。亮屏后点继续，接着念今天的句子");
      return;
    }
    bgSleepPlayCur(it + 1);
    return;
  }
  pk.skip = 0;
  if(cur.k === "mp3"){
    var seg = cur.seg || BG_WORK[cur.idx] || null;
    if(seg && seg.a){
      bgPlayMp3(seg.a, BG_SLEEP_C_RATE, bgSleepGap(),
        function(){ bgSleepPlayCur(it + 1); },
        function(){ bgSleepSaySeg(cur, it); });    /* mp3 放不出来按句念，仍算 C 的来源，不退回空转 */
      return;
    }
    bgSleepSaySeg(cur, it);
    return;
  }
  bgSaySeq([cur.x], bgSleepRate, bgSleepGap, function(){ bgSleepPlayCur(it + 1); });
}
/* C 段没有 mp3（或加载失败）时按段内原句念，来源仍是 C，语速同样用慢档 */
function bgSleepSaySeg(cur, it){
  var seg = cur.seg || BG_WORK[cur.idx] || null;
  var arr = (seg && seg.s instanceof Array && seg.s.length) ? seg.s : null;
  if(!arr){ bgSleepPlayCur(it + 1); return; }
  bgSaySeq(arr, BG_SLEEP_C_RATE, bgSleepGap, function(){ bgSleepPlayCur(it + 1); });
}
/* 一轮放完：轮次 +1，重新组池（C 段换到下一批），时长到点就停——轮次上限沿用现有逻辑 */
function bgSleepNextRound(){
  if(!BG.playing || BG.paused) return;
  BG.rounds = (BG.rounds | 0) + 1;
  BG.sq = null;
  bgProgSave();
  bgPaintClock();
  /* v27：到点不再开新一轮；关掉自动收尾时照旧往下放 */
  if(bgSleepAutoOn() && bgLeft() <= 0){ bgSleepFinish("timeup"); return; }
  bgSleepPlayCur(0);
}

function bgTick(quiet){
  if(!BG.playing) return;
  var el = bgElapsed();
  BG.remain = Math.max(0, Math.round(BG.mins * 60 - el));
  var c = document.getElementById("bgClock");
  if(c) c.textContent = bgClock(BG.remain);
  var sub = document.getElementById("bgSub");
  if(sub) sub.textContent = bgSubLine();
  var gl = document.getElementById("bgGoalLine");
  if(gl) gl.innerHTML = bgGoalLine();            /* v24：门槛进度跟真实发声走 */
  /* v24：跨过门槛时给一次明确正反馈，只给一次 */
  if(!quiet && !BG.goalHit && (BG.spoken || 0) >= bgGoalNorm(DB.bgGoal)){
    BG.goalHit = 1;
    toast("已听满 " + bgGoalMinText() + "，这次停止后记为 1 次有效背景听");
  }
  /* v27：睡前听到点——两条路，与工作听分开 */
  if(BG.mode === "sleep"){
    var left = BG.mins * 60 - el;
    if(bgSleepAutoOn()){
      /* 到点前 30 秒：只提醒一次，不暂停、不跳句，当前句照常念完 */
      if(!quiet && !BG.sleepWarn && left <= 30 && left > 0){
        BG.sleepWarn = 1;
        toast("还有半分钟到 " + BG.mins + " 分钟，这一句念完就收尾");
      }
      if(el >= BG.mins * 60){
        BG.overdue = 1;
        /* 句间空档里到点：立刻收，不必等下一句；正有一句在念就等它念完 */
        if(!bgSleepBusy()){ bgSleepFinish("timeup"); return; }
      }
    } else if(!quiet && el >= BG.mins * 60 && !BG.sleepWarn){
      BG.sleepWarn = 1;
      toast("已到 " + BG.mins + " 分钟（自动收尾已关），仍按你的设置继续放；想停点「停止」");
    }
    return;
  }
  if(!quiet && el >= BG.mins * 60) bgStop(true);
}

/* v24：时长文案与门槛进度。达标给一次明确状态，没达标写清还差多少 */
function bgDurCn(sec){
  sec = Math.max(0, sec | 0);
  var m = Math.floor(sec / 60), s = sec % 60;
  if(m <= 0) return s + " 秒";
  return m + " 分" + (s ? (" " + s + " 秒") : "");
}
function bgGoalLine(){
  var goal = bgGoalNorm(DB.bgGoal);
  var sp = Math.floor(BG.spoken || 0);
  var head = '已听 <b>' + bgDurCn(sp) + '</b> / 目标 <b>' + (goal / 60) + ' 分钟</b>';
  if(goal - sp <= 0){
    return head + ' · <b style="color:#2f8f5b">已达标，停止后记 1 次有效背景听</b>';
  }
  return head + ' · 还差 <b>' + bgDurCn(goal - sp) + '</b>';
}

function bgSubLine(){
  if(BG.paused) return "已暂停 · 点继续接着放";
  if(BG.mode === "sleep"){
    if(!bgSleepAutoOn() && bgLeft() <= 0){
      return "第 " + (BG.rounds + 1) + " 轮 · 语速 " + bgSleepRate() + "x · 已过 " + BG.mins + " 分钟（自动收尾已关，仍在放）";
    }
    var tail = bgLeft() <= 120 ? "收尾中 · 句间拉长" : "屏幕已调暗";
    return "第 " + (BG.rounds + 1) + " 轮 · 语速 " + bgSleepRate() + "x · " + tail;
  }
  var _si = bgNormIdx(BG.idx), _sg = BG_WORK[_si], _pos = bgPoolPosOf(_si);
  return "正在播 · " + bgAccTag(_sg) + " · " + (_sg ? _sg.t : "素材加载中") +
         (_pos >= 0 ? (" · 第 " + (_pos + 1) + "/" + bgPoolLen() + " 段") : "") + " · 不要看屏幕";
}

function bgPaintClock(){
  var el = document.getElementById("bgClock");
  if(el) el.textContent = bgClock(BG.remain);
  var sub = document.getElementById("bgSub");
  if(sub) sub.textContent = bgSubLine();
  var gl = document.getElementById("bgGoalLine");
  if(gl) gl.innerHTML = bgGoalLine();
}

function bgClock(sec){
  if(sec < 0) sec = 0;
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}

/* v23：锁屏/控制条文案。工作听带「第几段/共几段」，睡前听带轮次；
   歌手与专辑给可辨识的定值，息屏瞥一眼就知道是哪个会话、听到哪了 */
function bgMetaSet(){
  if(!BG.playing) return;
  if(BG.mode === "sleep"){
    mediaSet("睡前听 · 第 " + ((BG.rounds | 0) + 1) + " 轮",
      { bg:1, artist:"EngLab · 睡前听", album:"只放今天见过的句子" });
    return;
  }
  /* v25：锁屏标题带口音与集合内序号，息屏也能分清是哪个声音、听到集合第几段 */
  var g = bgPoolGet(bgPoolPosOf(bgNormIdx(BG.idx)));
  var sg = g ? g.seg : BG_WORK[bgNormIdx(BG.idx)];
  var tg = bgAccTag(sg), n = g ? g.n : bgPoolLen(), i = g ? g.pos : 0;
  mediaSet("背景听 " + (i + 1) + "/" + n + " · " + tg + " · " + (sg ? sg.t : ""),
    { bg:1, artist:"EngLab · 工作听 · " + tg, album:"第 " + (i + 1) + " 段 / 共 " + n + " 段" });
}

/* v23：跳过本段 / 回到上一段。只对工作听开放——睡前听是一条连续句包，跳段没有语义。
   跳段只改"从哪一段接着放"，本次已累计的发声时长一分不动：不重复计，也不清零。 */
function bgJumpTo(idx){
  if(!BG.playing || BG.mode !== "work") return;
  BG.seqToken++;                                  /* 作废当前 mp3 与朗读链，防双播 */
  if(BG.gapTimer){ clearTimeout(BG.gapTimer); BG.gapTimer = null; }
  if(BG.fadeReset){ try{ BG.fadeReset(); }catch(e){} }
  if(BG.audio && BG.audioAbort){ try{ BG.audioAbort(); }catch(e){} }  /* 先记账再收尾 */
  BG.audio = null;
  BG.audioAbort = null;
  stopSpeak();                                    /* TTS 回退分支也一并停掉 */
  BG.idx = bgNormIdx(idx);
  BG.fails = 0;
  BG.paused = false;                              /* 跳段视为继续听 */
  if(!BG.timer) BG.timer = setInterval(bgTick, 500);
  bgProgSave();
  render();
  bgPlayChunk();
}
function bgNextSeg(){ if(BG.mode !== "work") return; var g = bgPoolGet(bgPoolPosOf(bgNormIdx(BG.idx)) + 1); bgJumpTo(g ? g.idx : bgNormIdx(0)); }
function bgPrevSeg(){ if(BG.mode !== "work") return; var g = bgPoolGet(bgPoolPosOf(bgNormIdx(BG.idx)) - 1); bgJumpTo(g ? g.idx : bgNormIdx(0)); }

/* v23：从头开始——把该模式的断点清零并立刻回到第一段/第一轮，已累计时长不受影响 */
function bgRestart(){
  var m = (BG.mode === "sleep") ? "sleep" : "work";
  DB.bgProg = bgProgMerge(DB.bgProg, {});
  DB.bgProg[m] = { idx:0, d:dk(), acc:bgAccNorm(DB.bgAcc) };
  BG.progHint = null;
  saveDB();
  if(BG.playing){
    if(m === "work"){ bgJumpTo(0); toast("已回到第 1 段"); return; }
    BG.rounds = 0; render(); toast("已回到第 1 轮"); return;
  }
  render();
  toast("已清零进度，下次从第 1 " + (m === "work" ? "段" : "轮") + "开始");
}

function bgStop(complete){
  var el = Math.floor(BG.playing ? bgElapsed() : (BG.elapsed || 0));
  var sp = Math.floor(BG.spoken || 0);
  var wasPlaying = BG.playing;
  BG.seqToken++;
  BG.speaking = 0;
  if(BG.timer){ clearInterval(BG.timer); BG.timer = null; }
  if(BG.gapTimer){ clearTimeout(BG.gapTimer); BG.gapTimer = null; }
  if(BG.fadeReset){ try{ BG.fadeReset(); }catch(e){} }        /* v23：清掉段间淡出定时器 */
  if(BG.audio && BG.audioAbort){ try{ BG.audioAbort(); }catch(e){} }
  if(BG.audio){ try{ BG.audio.pause(); }catch(e){} BG.audio = null; }
  BG.audioAbort = null;
  stopSpeak();
  if(BG.playing) bgProgSave();                               /* v23：停之前先把断点存下来 */
  bgWakeOff(); mediaOff(true);                               /* 强制清 metadata 与动作绑定，不留残 */
  BG.playing = false; BG.paused = false; BG.pausedMs = 0; BG.pauseAt = 0;
  BG.elapsed = el;
  BG.remain = Math.max(0, BG.mins * 60 - el);
  if(!wasPlaying && !complete){ render(); return; }

  var counted = sp >= bgGoalNorm(DB.bgGoal);   /* v24：门槛读 DB.bgGoal（默认 600），仍只认真实发声时长 */
  if(sp >= 60){
    DB.bg = DB.bg || { work:{ n:0, sec:0 }, sleep:{ n:0, sec:0 } };
    DB.bg[BG.mode].sec = (DB.bg[BG.mode].sec || 0) + sp;
    if(BG.mode === "work"){
      /* 工作听：进「听」分项，也进日历的背景听计数 */
      addSec(sp, "listen");
      if(counted){
        DB.bg.work.n = (DB.bg.work.n || 0) + 1;
        touch("bg", 1);
      }
    } else {
      /* v27：睡前听的发声只记睡前口径——加总时长，但不进「听」分项、不进工作听次数、不进日历背景听计数，
         两个口径不互算（原来这里 sleep 也走 addSec listen + touch bg，会把睡前算成工作听的账） */
      addSec(sp);
      if(counted) DB.bg.sleep.n = (DB.bg.sleep.n || 0) + 1;
    }
    saveDB();
  }
  BG.last = { sec: sp, wall: el, counted: counted, mode: BG.mode };
  render();
}

  /* v23：入口就说明"上次听到哪"，别让人以为点开始又是从第一段放 */

var KIND_CN = { listen:"听", read:"读", view:"看", say:"说", write:"写" };

function confGroupOf(w){
  var k=String(w||"").toLowerCase(), out=[], i;
  for(i=0;i<CONF.length;i++){ if(CONF[i].a===k || CONF[i].b===k) out.push(i); }
  return out;
}

/* ---------- 详情页：辨析对照块 ---------- */
function confBlocks(v){
  var gs=confGroupOf(v.w), h, i;
  h='<div class="cfwrap"><div class="cfhd"><b>辨析词</b><span class="tiny muted">和它最容易混的词，并排比较</span></div>';
  if(!gs.length){
    h+='<div class="fb warn" style="margin-top:6px"><b>易混</b> '+esc((v.conf||[]).join("；")||"暂无记录")+'</div>';
    h+='<div class="tiny muted" style="margin-top:5px">这条只是提示，还没配成对比练习。遇到具体混用场景，记下来下次补。</div></div>';
    return h;
  }
  for(i=0;i<gs.length;i++){
    var gi=gs[i], g=CONF[gi];
    var other=(g.a===v.w.toLowerCase())? g.b : g.a;
    var inLib=!!VOCAB_BY_W[other];
    h+='<div class="cfbox">'+
       '<div class="cftag">'+esc(g.tag)+'</div>'+
       '<div class="cfrow">'+
         confCol(g.a, g.ca, g.ea, g.eaCn, g.a===v.w.toLowerCase())+
         confCol(g.b, g.cb, g.eb, g.ebCn, g.b===v.w.toLowerCase())+
       '</div>'+
       '<div class="cfrule"><b>怎么分</b>　'+esc(g.rule)+'</div>'+
       '<div class="row wrap" style="margin-top:8px">'+
         '<button class="btn sm" onclick="cqStartGroup('+gi+')">测这一组</button>'+
         (inLib
           ? '<button class="btn sm ghost" onclick="openWord(\''+other+'\')">看 '+esc(other)+' 的词网</button>'
           : '<button class="btn sm ghost" onclick="toast(\''+other+' 不在本库，可在「我的 · 联网」用剑桥查\')">'+esc(other)+'（库外）</button>')+
       '</div></div>';
  }
  h+='<div class="tiny muted" style="margin-top:6px">辨析靠「对比 + 做题」才牢。每组两道填空，做错的词会自动放回复习队列。</div></div>';
  return h;
}
function confCol(w, point, ex, exCn, cur){
  return '<div class="cfcol'+(cur?" cur":"")+'">'+
    '<div class="cfw" onclick="speak(\''+esc(w).replace(/'/g,"")+'\')">'+esc(w)+' <span class="tiny muted">▶</span></div>'+
    '<div class="cfpt">'+esc(point)+'</div>'+
    '<div class="cfex">'+esc(ex)+'<br><span class="muted">'+esc(exCn)+'</span></div>'+
    '</div>';
}

/* ---------- 辨析练习 ---------- */
var CQ = { list:[], idx:0, ok:0, bad:0, hit:[], mode:"drill" };
function cqStartGroup(gi){
  CQ={ list:[{ g:gi, q:0 },{ g:gi, q:1 }], idx:0, ok:0, bad:0, hit:[], mode:"group" };
  cqRender();
}
function cqStartDrill(){
  var idxs=[], i, j, t;
  for(i=0;i<CONF.length;i++) idxs.push(i);
  for(i=idxs.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=idxs[i]; idxs[i]=idxs[j]; idxs[j]=t; }
  var n=Math.min(6,idxs.length), list=[];
  for(i=0;i<n;i++) list.push({ g:idxs[i], q:(Math.random()<0.5?0:1) });
  CQ={ list:list, idx:0, ok:0, bad:0, hit:[], mode:"drill" };
  cqRender();
}
function cqLine(s){
  return esc(s).replace(/___/g,'<b class="blank">______</b>');
}
function cqRender(){
  if(CQ.idx>=CQ.list.length) return cqDone();
  var it=CQ.list[CQ.idx], g=CONF[it.g], q=g.q[it.q];
  var h=sheetHead("辨析练习 "+(CQ.idx+1)+" / "+CQ.list.length, CQ.mode==="drill"?"随机抽题：选出能填进空格的词":"同一组两道填空");
  h+='<div class="cfqline">'+cqLine(q.s)+'</div>';
  h+='<div class="row wrap" style="margin-top:10px">'+
     '<button class="opt" style="flex:1;min-width:120px" onclick="cqPick(this,0)">'+esc(g.a)+'</button>'+
     '<button class="opt" style="flex:1;min-width:120px" onclick="cqPick(this,1)">'+esc(g.b)+'</button>'+
     '</div>';
  h+='<div id="cqfb"></div>';
  openSheet(h);
}
function cqPick(btn, pick){
  var it=CQ.list[CQ.idx], g=CONF[it.g], q=g.q[it.q];
  var right=(q.ans==="a")?0:1, ok=(pick===right);
  var all=document.querySelectorAll("#sheet .opt"), i;
  for(i=0;i<all.length;i++) all[i].disabled=true;
  btn.className="opt "+(ok?"ok":"no");
  if(!ok){ for(i=0;i<all.length;i++) if(i===right) all[i].className="opt ok"; }

function cqDone(){

  var doneMap={};
  for(i=0;i<CQ.hit.length;i++){

     '<div class="small muted" style="margin-top:3px">'+(acc>=80?"辨析基本稳了，隔三四天再抽一次。":(acc>=50?"能分一半：把下面错的组，两边例句各读两遍再测。":"先别刷量，下面这几组的口诀先背下来，再做题。"))+'</div></div>';
  var wrongs=[];
  for(i=0;i<CQ.hit.length;i++) if(!CQ.hit[i].ok && wrongs.indexOf(CQ.hit[i].g)<0) wrongs.push(CQ.hit[i].g);

    }

     '<button class="btn sm ghost" onclick="cqStartDrill()">再抽一套</button></div>';

function waitSpan(sec){
  sec=Math.max(0,Math.round(sec||0));
  if(sec<60) return sec+" 秒";
  var m=Math.round(sec/60);
  if(m<60) return m+" 分钟";
  return (Math.floor(m/60)+" 小时 "+(m%60)+" 分");
}
function waitStart(sec){
  WAIT.on=1; WAIT.n=0; WAIT.ok=0; WAIT.bad=[]; WAIT.lock=0; WAIT.q=null;
  WAIT.what=WAIT.pickWhat||WAIT_WHAT[0];
  WAIT.startAt=Date.now(); WAIT.total=sec||0; WAIT.endAt=sec?Date.now()+sec*1000:0;
  if(WAIT.timer) clearInterval(WAIT.timer);
  WAIT.timer=setInterval(waitTick,250);

}
function waitHead(){
  var sub=WAIT.endAt? ("还剩 "+Math.max(0,Math.ceil((WAIT.endAt-Date.now())/1000))+" 秒 · 已做 "+WAIT.n+" 题")
                    : ("已做 "+WAIT.n+" 题 · 你说停才停");
  return '<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px">'+
    '<div style="flex:1"><h3>'+esc(WAIT.what||"等一件事")+'</h3>'+
    '<div id="wtleft" style="font-size:12px;color:var(--muted);margin-top:2px">'+sub+'</div></div>'+
    '<button class="mini" onclick="waitFinish(true)">停</button></div>';
}
function waitPool(){
  var out=[], k;
  var rec=(DB.rec||{});
  for(k in rec) if(VOCAB_BY_W[k]) out.push(k);
  var due=dueWords(), i;
  for(i=0;i<due.length;i++) if(out.indexOf(due[i])<0) out.push(due[i]);
  return out;
}
function waitNext(){
  if(!WAIT.on) return;
  var q=null;
  var pool=waitPool();
  /* 「等」的时候优先练这次真的会遇到、会忘的东西：回流词 > 到期词 > 随机 */
  var preferWord=(pool.length && Math.random()<0.55);
  if(!preferWord && typeof CONF!=="undefined" && CONF.length && Math.random()<0.5){
    var g=CONF[Math.floor(Math.random()*CONF.length)];
    var qi=Math.floor(Math.random()*g.q.length);
    q={ type:"conf", g:g, s:g.q[qi].s, ans:(g.q[qi].ans==="a"?0:1), opts:[g.a,g.b], word:g.a };
  }
  if(!q){
    var w = preferWord ? pool[Math.floor(Math.random()*pool.length)] : VOCAB[Math.floor(Math.random()*VOCAB.length)].w.toLowerCase();
    var v=VOCAB_BY_W[w];
    if(!v){ w=VOCAB[Math.floor(Math.random()*VOCAB.length)].w.toLowerCase(); v=VOCAB_BY_W[w]; }
    if(v){
      var right=String(v.cn||"").split("；")[0];
      var opts=[right], guard=0;
      while(opts.length<4 && guard++<120){
        var vv=VOCAB[Math.floor(Math.random()*VOCAB.length)];
        var c=String(vv.cn||"").split("；")[0];
        if(c && opts.indexOf(c)<0) opts.push(c);
      }
      var ri=Math.floor(Math.random()*opts.length), tmp=opts[0];
      opts[0]=opts[ri]; opts[ri]=tmp;
      q={ type:"mean", w:w, ans:ri, opts:opts, word:w };
    }
  }
  WAIT.q=q;
  if(!q){ waitFinish(true); return; }
  waitPaint();
}
function waitPaint(){
  var q=WAIT.q; if(!q) return;
  var pct=WAIT.endAt? Math.min(100,Math.max(0,Math.round((1-((WAIT.endAt-Date.now())/1000)/Math.max(1,WAIT.total))*100))):0;
  var h=waitHead();
  h+='<div class="wtbar"><i id="wtbi" style="width:'+pct+'%"></i></div>';
  h+='<div id="wtq">';
  if(q.type==="conf"){
    h+='<div class="cfqline">'+cqLine(q.s)+'</div>';
    h+='<div class="row wrap" style="margin-top:10px">'+
       '<button class="opt" style="flex:1;min-width:120px" onclick="waitPick(0,this)">'+esc(q.opts[0])+'</button>'+
       '<button class="opt" style="flex:1;min-width:120px" onclick="waitPick(1,this)">'+esc(q.opts[1])+'</button></div>';
  } else {
    h+='<div class="wtq">'+esc(q.w)+' <span class="tiny muted">'+esc((VOCAB_BY_W[q.w]||{}).pos||"")+'</span></div>';
    for(var i=0;i<q.opts.length;i++){
      h+='<button class="opt" style="display:block;width:100%;text-align:left;margin-bottom:7px" onclick="waitPick('+i+',this)">'+esc(q.opts[i])+'</button>';
    }
  }
  h+='</div>';
  h+='<div id="wtfb" class="tiny muted" style="min-height:16px;margin-top:4px"></div>';
  h+='<div class="row" style="margin-top:10px"><button class="btn sm ghost" onclick="waitFinish(true)">不做了，去忙</button></div>';
  openSheet(h);
}
function waitPick(i, btn){
  if(!WAIT.on || WAIT.lock) return;
  var q=WAIT.q; if(!q) return;
  var ok=(i===q.ans);
  WAIT.lock=1;
  var all=document.querySelectorAll("#wtq .opt"), x;
  for(x=0;x<all.length;x++) all[x].disabled=true;
  if(ok){ btn.className="opt ok"; WAIT.ok++; }
  else{
    btn.className="opt no";
    for(x=0;x<all.length;x++) if(x===q.ans && all[x]!==btn) all[x].className="opt ok";
    if(q.word) WAIT.bad.push(q.word);
  }
  WAIT.n++;
  if(q.word){ try{ srsUpd(q.word, ok?2:0); }catch(e){} }
  try{ touch("wait",1); }catch(e){}
  var fb=document.getElementById("wtfb");
  if(fb){
    fb.innerHTML = ok? "对"
      : ("错 → <b>"+esc(q.opts[q.ans]||"")+"</b>"+(q.type==="conf"&&q.g? (" · "+esc(q.g.tag||"") ) : ""));
  }
  setTimeout(function(){ WAIT.lock=0; if(WAIT.on) waitNext(); }, ok?520:1500);
}
function waitTick(){
  if(!WAIT.on) return;
  var mask=document.getElementById("mask");
  if(mask && !mask.classList.contains("on")){ waitFinish(true); return; }
  var now=Date.now();
  var bar=document.getElementById("wtbi");
  var t=document.getElementById("wtleft");
  if(WAIT.endAt){
    var left=Math.ceil((WAIT.endAt-now)/1000);
    if(bar) bar.style.width=Math.min(100,Math.max(0,Math.round((1-((WAIT.endAt-now)/1000)/Math.max(1,WAIT.total))*100)))+"%";
    if(t) t.textContent="还剩 "+Math.max(0,left)+" 秒 · 已做 "+WAIT.n+" 题";
    if(now>=WAIT.endAt){ waitFinish(false); return; }
  }else{
    if(t) t.textContent="已做 "+WAIT.n+" 题 · 你说停才停";
  }
}
function waitFinish(manual){
  if(!WAIT.on) return;
  WAIT.on=0;
  if(WAIT.timer){ clearInterval(WAIT.timer); WAIT.timer=null; }
  var used=Math.max(0,Math.round((Date.now()-WAIT.startAt)/1000));
  if(!DB.wait) DB.wait={ sec:0, n:0, ok:0, days:{} };
  if(!DB.wait.days) DB.wait.days={};
  DB.wait.sec=(DB.wait.sec||0)+used;
  DB.wait.n=(DB.wait.n||0)+WAIT.n;
  DB.wait.ok=(DB.wait.ok||0)+WAIT.ok;
  DB.wait.days[dk()]=(DB.wait.days[dk()]||0)+used;
  saveDB();
  var mm=Math.floor(used/60), ss=used%60;
  var h='<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px">'+
    '<div style="flex:1"><h3>'+(manual?"先停在这里":"时间到")+'</h3>'+
    '<div style="font-size:12px;color:var(--muted);margin-top:2px">'+esc(WAIT.what||"")+'</div></div></div>';
  h+='<div class="grid3 stats" style="margin:6px 0 10px">'+
    '<div class="stat"><b>'+WAIT.n+'</b><span>做了题</span></div>'+
    '<div class="stat"><b>'+WAIT.ok+'</b><span>答对</span></div>'+
    '<div class="stat"><b>'+(mm? (mm+"′"+ss+"″") : (ss+"″"))+'</b><span>用掉</span></div></div>';
  if(WAIT.bad.length){
    var uniq=[], i;
    for(i=0;i<WAIT.bad.length;i++) if(uniq.indexOf(WAIT.bad[i])<0) uniq.push(WAIT.bad[i]);
    h+='<div class="fb warn">'+esc(uniq.slice(0,6).join("、"))+' 没答对，已排回明天复习。</div>';
  }else if(WAIT.n){
    h+='<div class="fb">这一组全对。把等的事办完再回来。</div>';
  }else{
    h+='<div class="fb warn">一道都没做。下次等的时候，先按开始再切走。</div>';
  }
  h+='<div class="tiny muted" style="margin-top:8px;line-height:1.8">累计等待学习 '+DB.wait.n+' 题 / '+waitSpan(DB.wait.sec)+'。这些时间本来大概率是拿去刷手机的。</div>';
  h+='<div class="row" style="margin-top:12px"><button class="btn" onclick="WAIT.pickWhat=\''+esc(WAIT.what||"")+'\';waitStart('+(WAIT.total||0)+')">再来一组</button>'+
     '<button class="btn ghost" onclick="closeSheet();render()">回去忙</button></div>';
  openSheet(h);
}

/* ---------------- P2-3 双栏：CSS 负责布局，JS 负责跟随尺寸重排 ---------------- */

/* ---------------- P2-1 错因标签体系 ---------------- */
var ERR_TAGS=[
  { k:"hear",    t:"听不出", d:"声音过去了，没分辨出来" },
  { k:"spell",   t:"拼错",   d:"听出来了，写错字母" },
  { k:"unknown", t:"不认识", d:"完全没印象" }
];
function errTagText(k){
  for(var i=0;i<ERR_TAGS.length;i++) if(ERR_TAGS[i].k===k) return ERR_TAGS[i].t;
  return "未标记";
}
function errInit(){
  if(!DB.err || typeof DB.err!=="object") DB.err={ sum:{}, w:{}, day:{} };
  if(!DB.err.sum || typeof DB.err.sum!=="object") DB.err.sum={};
  if(!DB.err.w || typeof DB.err.w!=="object") DB.err.w={};
  if(!DB.err.day || typeof DB.err.day!=="object") DB.err.day={};
  return DB.err;
}
function errTotal(tag){
  var e=errInit();
  if(tag) return e.sum[tag]|0;
  return (e.sum.hear|0)+(e.sum.spell|0)+(e.sum.unknown|0);
}
/* 统一记账入口：错因只用于挑专项词，不动 srs 的 lv */
function errBump(w, tag, src){
  var e=errInit();
  tag = tag||"unknown";
  e.sum[tag]=(e.sum[tag]|0)+1;
  if(w){
    var k=String(w).toLowerCase(), o=e.w[k]||(e.w[k]={});
    o[tag]=(o[tag]|0)+1; o._t=Date.now(); o._src=src||"";
  }
  var key=dk(), d=e.day[key]||(e.day[key]={ hear:0, spell:0, unknown:0 });
  d[tag]=(d[tag]|0)+1;
  var ks=Object.keys(e.day).sort();
  while(ks.length>30){ delete e.day[ks.shift()]; }
  saveDB();
}
/* 三选一录入入口（复习 / 词卡 / 产出校验失败后弹） */
function errAsk(w, src){
  if(!w) return;
  var h=sheetHead("错在哪？", "选一个，只用来挑专项练习");
  h+='<div class="small" style="font-weight:700;margin:2px 0 10px">'+esc(w)+'</div>';
  h+='<div class="row wrap" style="gap:8px">';
  for(var i=0;i<ERR_TAGS.length;i++){
    h+='<button class="btn sm ghost" onclick="errPick(\''+esc(w).replace(/'/g,"")+'\',\''+ERR_TAGS[i].k+'\',\''+(src||"")+'\')">'+
