/* ================= 模块 17：听写模式 ================= */
var DICT = { mode:"word", src:"new", q:[], i:0, ok:0, n:0, streak:0, best:0, phase:"idle",
  plays:0, text:"", t0:0, hint:0, hard:[] };

function dictSrcList(){
  var pool=[], i, w;
  if(DICT.src==="due"){ pool=dueWords(); }
  else if(DICT.src==="hard"){
    for(i=0;i<VOCAB.length;i++){ w=VOCAB[i].w.toLowerCase(); var s=DB.srs[w]; if(!s || (s.lv|0)<=2) pool.push(w); }
  } else if(DICT.src==="all"){
    for(i=0;i<VOCAB.length;i++) pool.push(VOCAB[i].w.toLowerCase());
  } else {
    pool=newWords(200);
    if(pool.length<10) for(i=0;i<VOCAB.length;i++) pool.push(VOCAB[i].w.toLowerCase());
  }
  return shuffle(pool);
}
function dictMax(){ return DICT.mode==="word" ? 12 : 8; }

function startDict(){ 
  DICT.q = dictSrcList().slice(0, dictMax());
  if(!DICT.q.length){ toast("词库还没内容"); return; }
  DICT.i=0; DICT.ok=0; DICT.n=0; DICT.streak=0; DICT.best=0; DICT.hard=[]; DICT.phase="ask";
  DICT.plays=0; DICT.text=""; DICT.hint=0; DICT.t0=Date.now();
  render(); playDict();
}
function setDictMode(m){ DICT.mode=m; DICT.phase="idle"; render(); }
function setDictSrc(s){ DICT.src=s; DICT.phase="idle"; render(); }

function dictTarget(){
  var w=DICT.q[DICT.i]; if(!w) return null;
  var v=VOCAB_BY_W[w];
  if(!v) return { w:w, ph:"", cn:"", ex:"", exCn:"" };
  return v;
}
function playDict(){
  var v=dictTarget(); if(!v) return;
  DICT.plays++;
  if(DICT.mode==="word") speak(v.w, 0.86);
  else speak(v.ex || v.w, 0.9);
  render();
}
function dictHintWord(){
  var v=dictTarget(); if(!v) return;
  DICT.hint++;
  toast("首字母 "+v.w.charAt(0).toUpperCase()+" · 共 "+v.w.length+" 个字母");
  render();
}
function dictInput(el){
  DICT.text = el.value;
  el.className = "dictbox";
}
function dictSubmit(){
  var v=dictTarget(); if(!v || DICT.phase!=="ask") return;
  var ans=DICT.text.trim();
  var target = DICT.mode==="word" ? v.w : (v.ex||v.w);
  var r = cmpDict(target, ans);
  DICT.phase="done"; DICT.res=r;
  DICT.n++;
  if(r.rate>=0.999){ DICT.ok++; DICT.streak++; if(DICT.streak>DICT.best) DICT.best=DICT.streak; }
  else { DICT.streak=0; if(DICT.mode==="word") DICT.hard.push(v.w); }
  useWord(v.w, "write"); useWord(v.w, "listen"); touch("write"); touch("listen");
  if(DICT.mode==="word") srsUpd(v.w, r.rate>=0.999?3:1);
  addSec(2);
  render();
}
function dictNext(){
  DICT.i++;
  DICT.plays=0; DICT.text=""; DICT.hint=0; DICT.res=null;
  if(DICT.i>=DICT.q.length){ DICT.phase="end"; addSec(Math.round((Date.now()-DICT.t0)/1000)); render(); return; }
  DICT.phase="ask"; render(); playDict();
}
function cmpDict(target, said){
  var t=String(target).trim(), s=String(said).trim();
  if(!s) return { rate:0, mark:normWords(t).map(function(w){ return { w:w, ok:false }; }), exact:false };
  var a=normWords(t), b=normWords(s);
  var pool=b.slice(), mark=[], hit=0, i, idx;
  for(i=0;i<a.length;i++){
    idx=pool.indexOf(a[i]);
    if(idx>=0){ mark.push({ w:a[i], ok:true }); pool.splice(idx,1); hit++; }
    else mark.push({ w:a[i], ok:false });
  }
  var rate = a.length ? hit/a.length : 0;
  var exact = a.join(" ")===b.join(" ");
  if(exact) rate=1;
  return { rate:rate, mark:mark, exact:exact, extra:pool };
}
function letterBoxes(word, said){
  // 逐字母对齐：给出 对/错/漏 三态
  var t=String(word).toLowerCase().replace(/[^a-z]/g,""), s=String(said).toLowerCase().replace(/[^a-z]/g,"");
  var out="", i;
  for(i=0;i<t.length;i++){
    var c=t.charAt(i), ok = s.charAt(i)===c;
    out += '<span class="dictletter'+(ok?"":" gap")+'">'+(ok?c:"·")+'</span>';
  }
  return out;
}

/* ================= 模块 18：碎片时间 Snack（吃饭 / 排队 / 通勤） ================= */
var SNACK = { on:false, qs:[], i:0, ok:0, t0:0, limit:120, left:0, tick:null,
  phase:"idle", pick:null, reveal:false, scene:"meal" };

var SNACK_SCENES = [
  { id:"meal",  t:"吃饭时",   d:"一只手拿筷子，只需听和选", s:"60 秒起" },
  { id:"queue", t:"排队等号", d:"站着也能做，看词回想", s:"90 秒起" },
  { id:"walk",  t:"走路通勤", d:"纯听，不用看屏幕", s:"2 分钟起" },
  { id:"bed",   t:"睡前躺着", d:"闭眼听写，手不用抬", s:"3 分钟" }
];

/* ---- 生成微题：每道题 1 个核心动作，30 秒内可完成 ---- */
function snackBuild(kind, n){
  var pool=dueFirstPool().filter(function(w){ return !!VOCAB_BY_W[w]; });
  if(!pool.length) pool=wordPool();
  var picked=pickN(pool, Math.max(n, 6));
  var qs=[], i;
  for(i=0;i<n;i++){
    var w=picked[i % picked.length];
    var v=VOCAB_BY_W[w];
    if(!v) continue;
    var t;
    if(kind==="listen") t="listen";
    else if(kind==="recall") t="recall";
    else if(kind==="dict") t="dict";
    else if(kind==="shadow") t="shadow";
    else t = ["listen","recall","dict"][i%3];
    if(t==="shadow"){
      var sents=(window.SHADOW_POOL||[]);
      var s=sents.length? oneOf(sents) : (v.ex?{ en:v.ex, cn:v.exCn } : null);
      if(s) qs.push({ t:"shadow", w:w, en:s.en, cn:s.cn });
      else qs.push({ t:"recall", w:w });
      continue;
    }
    qs.push({ t:t, w:w });
  }
  return qs;
}

function startSnack(kind, limit){
  stopSnackTimer();
  var n = limit<=60? 4 : (limit<=120? 8 : (limit<=180? 12 : 20));
  SNACK.qs=snackBuild(kind, n);
  if(!SNACK.qs.length){ toast("词库为空"); return; }
  SNACK.on=true; SNACK.phase="run"; SNACK.i=0; SNACK.ok=0; SNACK.pick=null; SNACK.reveal=false;
  SNACK.limit=limit||120; SNACK.left=SNACK.limit; SNACK.t0=Date.now();
  SNACK.tick=setInterval(function(){
    SNACK.left=SNACK.limit - Math.round((Date.now()-SNACK.t0)/1000);
    var el=document.getElementById("snackLeft");
    if(el) el.textContent = humanSec(Math.max(0,SNACK.left));
    var bar=document.getElementById("snackBar");
    if(bar) bar.style.width = Math.max(0, Math.min(100, SNACK.left/SNACK.limit*100))+'%';
    if(SNACK.left<=0) endSnack(true);
  }, 1000);
  render();
  snackPlay();
}
function stopSnackTimer(){ if(SNACK.tick){ clearInterval(SNACK.tick); SNACK.tick=null; } }
function endSnack(byTime){
  stopSnackTimer(); SNACK.on=false; SNACK.phase="end";
  var used=Math.round((Date.now()-SNACK.t0)/1000);
  SNACK.used=used;
  addSec(Math.min(used, SNACK.limit));
  if(SNACK.ok>0) touch("snack", 1);
  SNACK.byTime=!!byTime;
  render();
}
function snackNext(){
  SNACK.i++; SNACK.pick=null; SNACK.reveal=false;
  if(SNACK.i>=SNACK.qs.length){ endSnack(false); return; }
  render(); snackPlay();
}
function snackCur(){ return SNACK.qs[SNACK.i]; }
function snackPlay(){
  var q=snackCur(); if(!q) return;
  if(q.t==="listen") speak(VOCAB_BY_W[q.w]? VOCAB_BY_W[q.w].w : q.w, 0.9);
  else if(q.t==="shadow") speak(q.en, 0.95);
  else if(q.t==="dict") speak(VOCAB_BY_W[q.w]? VOCAB_BY_W[q.w].w : q.w, 0.82);
}
function snackAnswer(opt, right){
  if(SNACK.pick!==null) return;
  SNACK.pick=opt;
  if(right){ SNACK.ok++; useWord(SNACK.qs[SNACK.i].w, "view"); }
  addSec(3);
  setTimeout(function(){ if(SNACK.on) snackNext(); }, right?520:1100);
}
function snackReveal(){ SNACK.reveal=true; render(); }
function snackKnow(knew){
  if(knew){ SNACK.ok++; useWord(snackCur().w, "view"); }
  srsUpd(snackCur().w, knew?3:1);
  snackNext();
}
function snackDictCheck(){
  var el=document.getElementById("snackIn"); if(!el) return;
  var q=snackCur(), v=VOCAB_BY_W[q.w]||{w:q.w};
  var r=cmpDict(v.w||q.w, el.value);
  SNACK.pick = el.value;
  SNACK.res = r;
  if(r.rate>=0.999){ SNACK.ok++; srsUpd(q.w,3); } else srsUpd(q.w,0);
  useWord(q.w, "write");
  SNACK.reveal=true;
  render();
}

  DB.snackStat=DB.snackStat||{ n:0, sec:0 };

  h+='</div>';
  return h;
}

/* ---------------- 交传 CI ---------------- */
var INTERP_MODE = "ci";
function iprPick(m){
  INTERP_MODE=m;
  CI.stage=(m==="ci")?"pick":"idle";
  SI.stage=(m==="si")?"pick":"idle";
  render();
}
function iprHome(){ CI.stage="idle"; SI.stage="idle"; render(); }

var CI = { stage:"idle", seg:0, i:0, reps:1, rate:0.9, judge:[], t0:0, note:"", said:"", rec:false, showCn:false };

function ciStart(segIdx){
  INTERP_MODE="ci"; SI.stage="idle";
  CI.seg=segIdx|0; CI.i=0; CI.judge=[]; CI.t0=Date.now(); CI.note=""; CI.said=""; CI.stage="play";
  render(); ciPlay();
}
function ciPlay(){
  var seg=INTERP_SEGS[CI.seg];
  if(!seg) return;
  var s=seg.en[CI.i];
  CI.stage="play";
  render();
  var n=0;
  (function rep(){
    speak(s, CI.rate, function(){ n++; if(n<CI.reps) setTimeout(rep, 380); else { CI.stage="speak"; render(); } });
  })();
}
function ciReplay(){ speak(INTERP_SEGS[CI.seg].en[CI.i], CI.rate); }
function ciSlower(){ CI.rate=0.78; speak(INTERP_SEGS[CI.seg].en[CI.i], 0.72); }
function ciToSpeak(){ CI.stage="speak"; render(); }
function ciNote(el){ CI.note=el.value; }
function ciSaid(el){ CI.said=el.value; }
function ciReveal(){ CI.stage="reveal"; render(); }
function ciJudge(score){
  CI.judge.push(score);
  CI.i++;
  CI.note=""; CI.said="";
  if(CI.i>=INTERP_SEGS[CI.seg].en.length){ ciEnd(); return; }
  CI.stage="play"; render(); ciPlay();
}
function ciEnd(){
  CI.stage="end";
  var used=Math.round((Date.now()-CI.t0)/1000);
  CI.used=used;
  addSec(used);
  touch("interp", 1);
  DB.interp=DB.interp||{ ci:{n:0,sec:0}, si:{n:0,sec:0} };
  DB.interp.ci.n=(DB.interp.ci.n||0)+1;
  DB.interp.ci.sec=(DB.interp.ci.sec||0)+used;
  saveDB();
  render();
}

/* ---------------- 同传 SI ---------------- */
var SI = { stage:"idle", seg:0, i:0, rate:1.0, delay:0, playing:false, timer:null, t0:0, judge:[], reps:0, mono:false };

function siStart(segIdx){
  INTERP_MODE="si"; CI.stage="idle";
  SI.seg=segIdx|0; SI.i=0; SI.judge=[]; SI.judge=[]; SI.stage="run"; SI.playing=true; SI.t0=Date.now();
  SI.mono=false;
  render();
  siPlayFrom(0);
}
function siPlayFrom(index){
  var seg=INTERP_SEGS[SI.seg];
  if(!seg || index>=seg.en.length){ siEnd(); return; }
  SI.i=index;
  render();
  var startFn=function(){
    speak(seg.en[index], SI.rate, function(){
      if(!SI.playing) return;
      setTimeout(function(){
        if(!SI.playing) return;
        if(SI.i!==index) return;
        siPlayFrom(index+1);
      }, 260);
    });
  };
  if(SI.delay>0 && index>0) setTimeout(startFn, SI.delay*1000); else startFn();
}
function siStop(){ SI.playing=false; stopSpeak(); SI.stage="pause"; render(); }
function siResume(){ SI.playing=true; SI.stage="run"; render(); siPlayFrom(SI.i); }
function siEnd(){
  SI.playing=false; stopSpeak();
  if(SI.timer){ clearInterval(SI.timer); SI.timer=null; }
  SI.stage="end";
  var used=Math.round((Date.now()-SI.t0)/1000);
  SI.used=used;
  addSec(used);
  touch("interp", 1);
  DB.interp=DB.interp||{ ci:{n:0,sec:0}, si:{n:0,sec:0} };
  DB.interp.si.n=(DB.interp.si.n||0)+1;
  DB.interp.si.sec=(DB.interp.si.sec||0)+used;
  saveDB();
  render();
}
function siRate(v){ SI.rate=parseFloat(v); render(); }
function siDelay(v){ SI.delay=parseInt(v,10); render(); }
function siJudge(i2, v){ SI.judge[i2]=v; render(); }

/* 睡前句包：优先用今天到期的词的原例句（睡眠中重放已学内容才有意义，不引入新词） */
function bgSleepPack(){
  var due = dueWords().filter(function(w){ return !!VOCAB_BY_W[w]; });
  var pick = due.slice(0, 6);
  if(pick.length < 4){
    var fresh = newWords(6).filter(function(w){ return !!VOCAB_BY_W[w] && pick.indexOf(w) < 0; });
    pick = pick.concat(fresh).slice(0, 6);
  }
  var out = [];
  for(var i = 0; i < pick.length; i++){
    var v = VOCAB_BY_W[pick[i]];
    if(v && v.ex) out.push(v.ex);
  }
  out.push("You have done enough for today.");
  out.push("Let the words settle while you sleep.");
  return out;
}

/* 自写串行朗读，支持逐段变速（speakSeq 用全局语速，这里要按段降速） */
function bgSaySeq(list, rate, gap, done){
  var i = 0;
  (function next(){
    if(!BG.playing) return;
    if(i >= list.length){ if(done) done(); return; }
    speak(list[i], rate, function(){
      if(!BG.playing) return;
      i++;
      BG.gapTimer = setTimeout(next, gap || 400);
    });
  })();
}

function bgSetMode(m){
  if(BG.playing) bgStop(false);
  BG.mode = m; BG.night = (m === "sleep");
  if(m === "sleep" && BG.rate > 0.8) BG.rate = 0.8;
  if(m === "work" && BG.rate < 0.85) BG.rate = 0.95;
  document.body.classList.toggle("bgnight", BG.night);
  render();
}

function bgSetMins(n){ if(BG.playing) return; BG.mins = n|0; render(); }
function bgSetRate(r){ if(BG.playing) return; BG.rate = r; render(); }

function bgStart(){
  stopSpeak();
  BG.playing = true; BG.idx = 0; BG.rounds = 0;
  BG.elapsed = 0; BG.remain = BG.mins * 60; BG.startedAt = Date.now();
  render();
  bgPlayChunk();
  if(BG.timer) clearInterval(BG.timer);
  BG.timer = setInterval(bgTick, 1000);
}

function bgPlayChunk(){
  if(!BG.playing) return;
  var list, rate;
  if(BG.mode === "sleep"){
    list = bgSleepPack();
    rate = Math.max(0.68, BG.rate - 0.05 * BG.rounds);
  } else {
    var seg = BG_WORK[BG.idx % BG_WORK.length];
    list = seg.s; rate = BG.rate;
  }
  bgSaySeq(list, rate, BG.mode === "sleep" ? 8000 : 4500, function(){
    if(!BG.playing) return;
    BG.idx++; BG.rounds++;
    bgPaintClock();
  });
}

function bgTick(){
  if(!BG.playing) return;
  BG.elapsed++;
  BG.remain--;
  var el = document.getElementById("bgClock");
  if(el) el.textContent = bgClock(BG.remain);
  var sub = document.getElementById("bgSub");
  if(sub) sub.textContent = BG.mode === "sleep"
    ? ("第 " + (BG.rounds + 1) + " 轮 · 语速逐段放慢 · 屏幕已调暗")
    : ("正在播 · " + BG_WORK[BG.idx % BG_WORK.length].t + " · 不要看屏幕");
  if(BG.remain <= 0) bgStop(true);
}

function bgPaintClock(){
  var el = document.getElementById("bgClock");
  if(el) el.textContent = bgClock(BG.remain);
  var sub = document.getElementById("bgSub");
  if(sub && BG.mode === "work") sub.textContent = "正在播 · " + BG_WORK[BG.idx % BG_WORK.length].t + " · 不要看屏幕";
}

function bgClock(sec){
  if(sec < 0) sec = 0;
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}

function bgStop(complete){
  if(!BG.playing && !complete){
    BG.playing = false;
    if(BG.timer){ clearInterval(BG.timer); BG.timer = null; }
    if(BG.gapTimer){ clearTimeout(BG.gapTimer); BG.gapTimer = null; }
    stopSpeak(); render(); return;
  }
  BG.playing = false;
  if(BG.timer){ clearInterval(BG.timer); BG.timer = null; }
  if(BG.gapTimer){ clearTimeout(BG.gapTimer); BG.gapTimer = null; }
  stopSpeak();

  var mins = Math.round(BG.elapsed / 60);
  var counted = BG.elapsed >= 600;
  if(BG.elapsed >= 60){
    addSec(BG.elapsed);
    DB.bg = DB.bg || { work:{ n:0, sec:0 }, sleep:{ n:0, sec:0 } };
    DB.bg[BG.mode].sec = (DB.bg[BG.mode].sec || 0) + BG.elapsed;
    if(counted){
      DB.bg[BG.mode].n = (DB.bg[BG.mode].n || 0) + 1;
      touch("bg", 1);
    }
    saveDB();
  }
  BG.last = { mins: mins, counted: counted, mode: BG.mode };
  render();
}

function confGroupOf(w){
  var k=String(w||"").toLowerCase(), out=[], i;
  for(i=0;i<CONF.length;i++){ if(CONF[i].a===k || CONF[i].b===k) out.push(i); }
  return out;
}

/* ---------- 详情页：辨析对照块 ---------- */
function confBlocks(v){
  var gs=confGroupOf(v.w), h, i;
  h='<div class="cfwrap"><div class="cfhd"><b>辨析词</b><span class="tiny muted">和它最容易混的词，并排比较</span></div>';
  if(!gs.length){
    h+='<div class="fb warn" style="margin-top:6px"><b>易混</b> '+esc((v.conf||[]).join("；")||"暂无记录")+'</div>';
    h+='<div class="tiny muted" style="margin-top:5px">这条只是提示，还没配成对比练习。遇到具体混用场景，记下来下次补。</div></div>';
    return h;
  }
  for(i=0;i<gs.length;i++){
    var gi=gs[i], g=CONF[gi];
    var other=(g.a===v.w.toLowerCase())? g.b : g.a;
    var inLib=!!VOCAB_BY_W[other];
    h+='<div class="cfbox">'+
       '<div class="cftag">'+esc(g.tag)+'</div>'+
       '<div class="cfrow">'+
         confCol(g.a, g.ca, g.ea, g.eaCn, g.a===v.w.toLowerCase())+
         confCol(g.b, g.cb, g.eb, g.ebCn, g.b===v.w.toLowerCase())+
       '</div>'+
       '<div class="cfrule"><b>怎么分</b>　'+esc(g.rule)+'</div>'+
       '<div class="row wrap" style="margin-top:8px">'+
         '<button class="btn sm" onclick="cqStartGroup('+gi+')">测这一组</button>'+
         (inLib
           ? '<button class="btn sm ghost" onclick="openWord(\''+other+'\')">看 '+esc(other)+' 的词网</button>'
           : '<button class="btn sm ghost" onclick="toast(\''+other+' 不在本库，可在「我的 · 联网」用剑桥查\')">'+esc(other)+'（库外）</button>')+
       '</div></div>';
  }
  h+='<div class="tiny muted" style="margin-top:6px">辨析靠「对比 + 做题」才牢。每组两道填空，做错的词会自动放回复习队列。</div></div>';
  return h;
}
function confCol(w, point, ex, exCn, cur){
  return '<div class="cfcol'+(cur?" cur":"")+'">'+
    '<div class="cfw" onclick="speak(\''+esc(w).replace(/'/g,"")+'\')">'+esc(w)+' <span class="tiny muted">▶</span></div>'+
    '<div class="cfpt">'+esc(point)+'</div>'+
    '<div class="cfex">'+esc(ex)+'<br><span class="muted">'+esc(exCn)+'</span></div>'+
    '</div>';
}

/* ---------- 辨析练习 ---------- */
var CQ = { list:[], idx:0, ok:0, bad:0, hit:[], mode:"drill" };
function cqStartGroup(gi){
  CQ={ list:[{ g:gi, q:0 },{ g:gi, q:1 }], idx:0, ok:0, bad:0, hit:[], mode:"group" };
  cqRender();
}
function cqStartDrill(){
  var idxs=[], i, j, t;
  for(i=0;i<CONF.length;i++) idxs.push(i);
  for(i=idxs.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=idxs[i]; idxs[i]=idxs[j]; idxs[j]=t; }
  var n=Math.min(6,idxs.length), list=[];
  for(i=0;i<n;i++) list.push({ g:idxs[i], q:(Math.random()<0.5?0:1) });
  CQ={ list:list, idx:0, ok:0, bad:0, hit:[], mode:"drill" };
  cqRender();
}
function cqLine(s){
  return esc(s).replace(/___/g,'<b class="blank">______</b>');
}
function cqRender(){
  if(CQ.idx>=CQ.list.length) return cqDone();
  var it=CQ.list[CQ.idx], g=CONF[it.g], q=g.q[it.q];
  var h=sheetHead("辨析练习 "+(CQ.idx+1)+" / "+CQ.list.length, CQ.mode==="drill"?"随机抽题：选出能填进空格的词":"同一组两道填空");
  h+='<div class="cfqline">'+cqLine(q.s)+'</div>';
  h+='<div class="row wrap" style="margin-top:10px">'+
     '<button class="opt" style="flex:1;min-width:120px" onclick="cqPick(this,0)">'+esc(g.a)+'</button>'+
     '<button class="opt" style="flex:1;min-width:120px" onclick="cqPick(this,1)">'+esc(g.b)+'</button>'+
     '</div>';
  h+='<div id="cqfb"></div>';
  openSheet(h);
}
function cqPick(btn, pick){
  var it=CQ.list[CQ.idx], g=CONF[it.g], q=g.q[it.q];
  var right=(q.ans==="a")?0:1, ok=(pick===right);
  var all=document.querySelectorAll("#sheet .opt"), i;
  for(i=0;i<all.length;i++) all[i].disabled=true;
  btn.className="opt "+(ok?"ok":"no");
  if(!ok){ for(i=0;i<all.length;i++) if(i===right) all[i].className="opt ok"; }
  if(ok) CQ.ok++; else CQ.bad++;
  CQ.hit.push({ g:it.g, ok:ok });
  var fb=document.getElementById("cqfb");
  fb.innerHTML='<div class="fb'+(ok?"":" bad")+'">'+(ok?"对。":"不对，这里该用 "+esc(right===0?g.a:g.b)+"。")+
    '<div class="cfrule" style="margin-top:7px"><b>怎么分</b>　'+esc(g.rule)+'</div>'+
    '<div class="cfex"><b>'+esc(g.a)+'</b>　'+esc(g.ea)+'<br><span class="muted">'+esc(g.eaCn)+'</span></div>'+
    '<div class="cfex"><b>'+esc(g.b)+'</b>　'+esc(g.eb)+'<br><span class="muted">'+esc(g.ebCn)+'</span></div>'+
    '<div class="row mt8"><button class="btn sm" onclick="cqNext()">'+
      (CQ.idx+1>=CQ.list.length?"看结果":"下一题")+'</button></div></div>';
}
function cqNext(){ CQ.idx++; cqRender(); }
function cqDone(){
  var total=CQ.ok+CQ.bad, acc=total? Math.round(CQ.ok/total*100) : 0, i, j;
  var doneMap={};
  for(i=0;i<CQ.hit.length;i++){
    var g=CONF[CQ.hit[i].g], ok=CQ.hit[i].ok, ws=[g.a,g.b];
    for(j=0;j<ws.length;j++){
      var k=ws[j], key=k+(ok?"1":"0");
      if(!VOCAB_BY_W[k] || doneMap[key]) continue;
      doneMap[key]=1;
      srsUpd(k, ok?2:0);
      clearRec(k);
    }
  }
  touch("word",1);
  var h=sheetHead("辨析练习结果","正确 "+CQ.ok+" / "+total);
  h+='<div class="cfbox"><div style="font-size:30px;font-weight:800;color:var(--green-d);letter-spacing:-1.2px">'+acc+'%</div>'+
     '<div class="small muted" style="margin-top:3px">'+(acc>=80?"辨析基本稳了，隔三四天再抽一次。":(acc>=50?"能分一半：把下面错的组，两边例句各读两遍再测。":"先别刷量，下面这几组的口诀先背下来，再做题。"))+'</div></div>';
  var wrongs=[];
  for(i=0;i<CQ.hit.length;i++) if(!CQ.hit[i].ok && wrongs.indexOf(CQ.hit[i].g)<0) wrongs.push(CQ.hit[i].g);
  if(wrongs.length){
    h+='<div class="small" style="margin-top:10px"><b>要再看一遍</b></div>';
    for(i=0;i<wrongs.length;i++){
      var wg=CONF[wrongs[i]];
      h+='<div class="cfbox"><div class="cftag">'+esc(wg.tag)+'</div>'+
         '<div class="cfrule">'+esc(wg.rule)+'</div>'+
         '<div class="cfex"><b>'+esc(wg.a)+'</b>　'+esc(wg.ea)+'<br><span class="muted">'+esc(wg.eaCn)+'</span></div>'+
         '<div class="cfex"><b>'+esc(wg.b)+'</b>　'+esc(wg.eb)+'<br><span class="muted">'+esc(wg.ebCn)+'</span></div>'+
         '<div class="row mt8"><button class="btn sm ghost" onclick="cqStartGroup('+wrongs[i]+')">再测这一组</button></div></div>';
    }
  }
  h+='<div class="row mt10"><button class="btn sm" onclick="closeSheet();render()">完成</button>'+
     '<button class="btn sm ghost" onclick="cqStartDrill()">再抽一套</button></div>';
  openSheet(h);
  render();
}

/* ---------- 跨模块「遇到过」回流 ---------- */
function recOf(w){ return ((DB.rec||{})[String(w||"").toLowerCase()]) || null; }
function clearRec(w){
  if(!DB.rec) return;
  var k=String(w||"").toLowerCase();
  if(DB.rec[k]){ delete DB.rec[k]; saveDB(); }
}
function recWords(){
  var r=DB.rec||{}, out=[], k;
  for(k in r){ if(VOCAB_BY_W[k]) out.push(k); }
  out.sort(function(x,y){ return (r[y].t||0)-(r[x].t||0); });
  return out;
}
function recCount(){ return recWords().length; }
function recKindsStr(r){
  if(!r||!r.kinds) return "";
  var out=[], k;
  for(k in r.kinds){ if(r.kinds[k]) out.push(KIND_CN[k]||k); }
  return out.join("/");
}
function agoStr(t){
  if(!t) return "";
  var m=Math.floor((Date.now()-t)/60000);
  if(m<1) return "刚刚";
  if(m<60) return m+" 分钟前";
  var hr=Math.floor(m/60);
  if(hr<24) return hr+" 小时前";
  return Math.floor(hr/24)+" 天前";
}
function recCardHTML(){
  var rw=recWords();
  if(!rw.length) return "";
  var h='<div class="card tight">'+
    '<div class="hd"><h3>别的模块遇到过</h3><div class="right"><span class="tag">'+rw.length+' 个</span></div></div>'+
    '<div class="small muted" style="margin-bottom:6px">听、读、看、说、写里碰到的词，还没回词网确认过。见过不等于记得。</div>';
  var n=Math.min(3,rw.length), i;
  for(i=0;i<n;i++){
    var v=VOCAB_BY_W[rw[i]], r=DB.rec[rw[i]];
    h+='<div class="wrow" onclick="openWord(\''+v.w+'\')">'+
       '<span class="lw">'+esc(v.w)+'</span>'+
       '<span class="lc">'+esc(v.cn)+'</span>'+
       '<span class="lr tiny">'+esc(recKindsStr(r))+' · '+agoStr(r.t)+'</span></div>';
  }
  h+='<div class="row mt8"><button class="btn sm" onclick="go(\'vocab\',\'back\')">回词网过一遍</button>'+
     '<button class="btn sm ghost" onclick="rcFirst()">从最近这个开始</button></div></div>';
  return h;
}
function rcFirst(){
  var rw=recWords();
  if(!rw.length){ toast("没有待回流的词"); return; }
  openWord(rw[0]);
}

/* ===== 等待间隙：等另一件事完成的时候，把这几分钟用掉 ===== */
var WAIT={on:0,endAt:0,startAt:0,total:0,what:"",n:0,ok:0,bad:[],lock:0,timer:null,pickWhat:"",q:null};
var WAIT_WHAT=["等编译/打包","等人回消息","等下载/上传","等开会","排队等车","等文件导出"];
function waitMark(btn){
  var all=document.querySelectorAll("#sheet .act"), i;
  for(i=0;i<all.length;i++) all[i].className="chip act";
  btn.className="chip act on";
  WAIT.pickWhat=btn.textContent;
}
function waitAsk(){
  if(WAIT.on){ waitPaint(); return; }
  var wt=(DB.wait||{});
  var h='<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px">'+
    '<div style="flex:1"><h3>你在等一件事？</h3>'+
    '<div style="font-size:12px;color:var(--muted);margin-top:2px">等，是最好用的开始信号</div></div>'+
    '<button class="mini" onclick="closeSheet()">关闭</button></div>';
  h+='<div class="small muted" style="line-height:1.85;margin-bottom:10px">等编译、等回复、等下载的时候，你走不开、又闲着——这是最容易拿起手机刷掉的几分钟。这里只出最短的题：一句填空、一个词义。答完自动跳下一题，时间到自动收，不耽误你要等的那件事。</div>';
  h+='<div class="small" style="font-weight:700;margin:2px 0 6px">在等什么</div><div class="row wrap" style="gap:6px;margin-bottom:12px">';
  for(var i=0;i<WAIT_WHAT.length;i++){
    h+='<button class="chip act'+(i===0?" on":"")+'" onclick="waitMark(this)">'+esc(WAIT_WHAT[i])+'</button>';
  }
  h+='</div>';
  h+='<div class="small" style="font-weight:700;margin:2px 0 6px">等到多久</div><div class="row wrap" style="gap:7px">'+
    '<button class="btn sm" onclick="waitStart(45)">45 秒</button>'+
    '<button class="btn sm ghost" onclick="waitStart(90)">90 秒</button>'+
    '<button class="btn sm ghost" onclick="waitStart(180)">3 分钟</button>'+
    '<button class="btn sm ghost" onclick="waitStart(0)">直到我按停</button>'+
    '</div>';
  h+='<div class="tiny muted" style="margin-top:10px;line-height:1.8">累计等待学习 '+(wt.n||0)+' 题 / '+waitSpan(wt.sec||0)+'。答错的词会自动排回明天。</div>';
  openSheet(h);
}
function waitSpan(sec){
  sec=Math.max(0,Math.round(sec||0));
  if(sec<60) return sec+" 秒";
  var m=Math.round(sec/60);
  if(m<60) return m+" 分钟";
  return (Math.floor(m/60)+" 小时 "+(m%60)+" 分");
}
function waitStart(sec){
  WAIT.on=1; WAIT.n=0; WAIT.ok=0; WAIT.bad=[]; WAIT.lock=0; WAIT.q=null;
  WAIT.what=WAIT.pickWhat||WAIT_WHAT[0];
  WAIT.startAt=Date.now(); WAIT.total=sec||0; WAIT.endAt=sec?Date.now()+sec*1000:0;
  if(WAIT.timer) clearInterval(WAIT.timer);
  WAIT.timer=setInterval(waitTick,250);
  waitNext();
}
function waitHead(){
  var sub=WAIT.endAt? ("还剩 "+Math.max(0,Math.ceil((WAIT.endAt-Date.now())/1000))+" 秒 · 已做 "+WAIT.n+" 题")
                    : ("已做 "+WAIT.n+" 题 · 你说停才停");
  return '<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px">'+
    '<div style="flex:1"><h3>'+esc(WAIT.what||"等一件事")+'</h3>'+
    '<div id="wtleft" style="font-size:12px;color:var(--muted);margin-top:2px">'+sub+'</div></div>'+
    '<button class="mini" onclick="waitFinish(true)">停</button></div>';
}
function waitPool(){
  var out=[], k;
  var rec=(DB.rec||{});
  for(k in rec) if(VOCAB_BY_W[k]) out.push(k);
  var due=dueWords(), i;
  for(i=0;i<due.length;i++) if(out.indexOf(due[i])<0) out.push(due[i]);
  return out;
}
function waitNext(){
  if(!WAIT.on) return;
  var q=null;
  var pool=waitPool();
  /* 「等」的时候优先练这次真的会遇到、会忘的东西：回流词 > 到期词 > 随机 */
  var preferWord=(pool.length && Math.random()<0.55);
  if(!preferWord && typeof CONF!=="undefined" && CONF.length && Math.random()<0.5){
    var g=CONF[Math.floor(Math.random()*CONF.length)];
    var qi=Math.floor(Math.random()*g.q.length);
    q={ type:"conf", g:g, s:g.q[qi].s, ans:(g.q[qi].ans==="a"?0:1), opts:[g.a,g.b], word:g.a };
  }
  if(!q){
    var w = preferWord ? pool[Math.floor(Math.random()*pool.length)] : VOCAB[Math.floor(Math.random()*VOCAB.length)].w.toLowerCase();
    var v=VOCAB_BY_W[w];
    if(!v){ w=VOCAB[Math.floor(Math.random()*VOCAB.length)].w.toLowerCase(); v=VOCAB_BY_W[w]; }
    if(v){
      var right=String(v.cn||"").split("；")[0];
      var opts=[right], guard=0;
      while(opts.length<4 && guard++<120){
        var vv=VOCAB[Math.floor(Math.random()*VOCAB.length)];
        var c=String(vv.cn||"").split("；")[0];
        if(c && opts.indexOf(c)<0) opts.push(c);
      }
      var ri=Math.floor(Math.random()*opts.length), tmp=opts[0];
      opts[0]=opts[ri]; opts[ri]=tmp;
      q={ type:"mean", w:w, ans:ri, opts:opts, word:w };
    }
  }
  WAIT.q=q;
  if(!q){ waitFinish(true); return; }
  waitPaint();
}
function waitPaint(){
  var q=WAIT.q; if(!q) return;
  var pct=WAIT.endAt? Math.min(100,Math.max(0,Math.round((1-((WAIT.endAt-Date.now())/1000)/Math.max(1,WAIT.total))*100))):0;
  var h=waitHead();
  h+='<div class="wtbar"><i id="wtbi" style="width:'+pct+'%"></i></div>';
  h+='<div id="wtq">';
  if(q.type==="conf"){
    h+='<div class="cfqline">'+cqLine(q.s)+'</div>';
    h+='<div class="row wrap" style="margin-top:10px">'+
       '<button class="opt" style="flex:1;min-width:120px" onclick="waitPick(0,this)">'+esc(q.opts[0])+'</button>'+
       '<button class="opt" style="flex:1;min-width:120px" onclick="waitPick(1,this)">'+esc(q.opts[1])+'</button></div>';
  } else {
    h+='<div class="wtq">'+esc(q.w)+' <span class="tiny muted">'+esc((VOCAB_BY_W[q.w]||{}).pos||"")+'</span></div>';
    for(var i=0;i<q.opts.length;i++){
      h+='<button class="opt" style="display:block;width:100%;text-align:left;margin-bottom:7px" onclick="waitPick('+i+',this)">'+esc(q.opts[i])+'</button>';
    }
  }
  h+='</div>';
  h+='<div id="wtfb" class="tiny muted" style="min-height:16px;margin-top:4px"></div>';
  h+='<div class="row" style="margin-top:10px"><button class="btn sm ghost" onclick="waitFinish(true)">不做了，去忙</button></div>';
  openSheet(h);
}
function waitPick(i, btn){
  if(!WAIT.on || WAIT.lock) return;
  var q=WAIT.q; if(!q) return;
  var ok=(i===q.ans);
  WAIT.lock=1;
  var all=document.querySelectorAll("#wtq .opt"), x;
  for(x=0;x<all.length;x++) all[x].disabled=true;
  if(ok){ btn.className="opt ok"; WAIT.ok++; }
  else{
    btn.className="opt no";
    for(x=0;x<all.length;x++) if(x===q.ans && all[x]!==btn) all[x].className="opt ok";
    if(q.word) WAIT.bad.push(q.word);
  }
  WAIT.n++;
  if(q.word){ try{ srsUpd(q.word, ok?2:0); }catch(e){} }
  try{ touch("wait",1); }catch(e){}
  var fb=document.getElementById("wtfb");
  if(fb){
    fb.innerHTML = ok? "对"
      : ("错 → <b>"+esc(q.opts[q.ans]||"")+"</b>"+(q.type==="conf"&&q.g? (" · "+esc(q.g.tag||"") ) : ""));
  }
  setTimeout(function(){ WAIT.lock=0; if(WAIT.on) waitNext(); }, ok?520:1500);
}
function waitTick(){
  if(!WAIT.on) return;
  var mask=document.getElementById("mask");
  if(mask && !mask.classList.contains("on")){ waitFinish(true); return; }
  var now=Date.now();
  var bar=document.getElementById("wtbi");
  var t=document.getElementById("wtleft");
  if(WAIT.endAt){
    var left=Math.ceil((WAIT.endAt-now)/1000);
    if(bar) bar.style.width=Math.min(100,Math.max(0,Math.round((1-((WAIT.endAt-now)/1000)/Math.max(1,WAIT.total))*100)))+"%";
    if(t) t.textContent="还剩 "+Math.max(0,left)+" 秒 · 已做 "+WAIT.n+" 题";
    if(now>=WAIT.endAt){ waitFinish(false); return; }
  }else{
    if(t) t.textContent="已做 "+WAIT.n+" 题 · 你说停才停";
  }
}
function waitFinish(manual){
  if(!WAIT.on) return;
  WAIT.on=0;
  if(WAIT.timer){ clearInterval(WAIT.timer); WAIT.timer=null; }
  var used=Math.max(0,Math.round((Date.now()-WAIT.startAt)/1000));
  if(!DB.wait) DB.wait={ sec:0, n:0, ok:0, days:{} };
  if(!DB.wait.days) DB.wait.days={};
  DB.wait.sec=(DB.wait.sec||0)+used;
  DB.wait.n=(DB.wait.n||0)+WAIT.n;
  DB.wait.ok=(DB.wait.ok||0)+WAIT.ok;
  DB.wait.days[dk()]=(DB.wait.days[dk()]||0)+used;
  saveDB();
  var mm=Math.floor(used/60), ss=used%60;
  var h='<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px">'+
    '<div style="flex:1"><h3>'+(manual?"先停在这里":"时间到")+'</h3>'+
    '<div style="font-size:12px;color:var(--muted);margin-top:2px">'+esc(WAIT.what||"")+'</div></div></div>';
  h+='<div class="grid3 stats" style="margin:6px 0 10px">'+
    '<div class="stat"><b>'+WAIT.n+'</b><span>做了题</span></div>'+
    '<div class="stat"><b>'+WAIT.ok+'</b><span>答对</span></div>'+
    '<div class="stat"><b>'+(mm? (mm+"′"+ss+"″") : (ss+"″"))+'</b><span>用掉</span></div></div>';
  if(WAIT.bad.length){
    var uniq=[], i;
    for(i=0;i<WAIT.bad.length;i++) if(uniq.indexOf(WAIT.bad[i])<0) uniq.push(WAIT.bad[i]);
    h+='<div class="fb warn">'+esc(uniq.slice(0,6).join("、"))+' 没答对，已排回明天复习。</div>';
  }else if(WAIT.n){
    h+='<div class="fb">这一组全对。把等的事办完再回来。</div>';
  }else{
    h+='<div class="fb warn">一道都没做。下次等的时候，先按开始再切走。</div>';
  }
  h+='<div class="tiny muted" style="margin-top:8px;line-height:1.8">累计等待学习 '+DB.wait.n+' 题 / '+waitSpan(DB.wait.sec)+'。这些时间本来大概率是拿去刷手机的。</div>';
  h+='<div class="row" style="margin-top:12px"><button class="btn" onclick="WAIT.pickWhat=\''+esc(WAIT.what||"")+'\';waitStart('+(WAIT.total||0)+')">再来一组</button>'+
     '<button class="btn ghost" onclick="closeSheet();render()">回去忙</button></div>';
  openSheet(h);
}
</script>

<script>
/* PWA：注册 Service Worker（https 或 localhost 下生效；file:// 打开会自动跳过） */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
  });
}
</script>
