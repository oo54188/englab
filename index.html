<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBFBF8">
<!-- 在线朗读音频由第三方合成，请求不能带 Referer（带上会被源站拒绝返回空音频） -->
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<meta name="apple-mobile-web-app-title" content="EngLab">
<meta name="application-name" content="EngLab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>EngLab · 听 · 说 · 读 · 写 · 看 · 译</title>
<!-- v22：首屏前定主题，深色用户刷新时不会先闪一帧亮白 -->
<script>
(function(){try{
  var m="auto";
  try{ var raw=localStorage.getItem("englab_v2"); if(raw){ var o=JSON.parse(raw)||{}; if(o.theme==="light"||o.theme==="dark") m=o.theme; } }catch(e){}
  var d=(m==="dark")||(m!=="light"&&!!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches));
  document.documentElement.setAttribute("data-theme", d?"dark":"light");
  try{ var mc=document.querySelector('meta[name="theme-color"]'); if(mc) mc.setAttribute("content", d?"#0F1410":"#FBFBF8"); }catch(e){}
}catch(e){}})();
</script>
<style>
:root{
  --green:#5C8A4E; --green-d:#436B37; --green-l:#F0F6EB; --green-l2:#E1EEDA;
  --ink:#141A11; --ink2:#4E5A48; --muted:#6B7666; --line:#EBEDE7; --line2:#F3F4F0;
  --bg:#FBFBF8; --card:#FFFFFF;
  --red:#C9584F; --red-l:#FBEEEC; --amber:#C08A22; --amber-l:#FCF6E8; --blue:#4A7DA6; --blue-l:#EEF4F9;
  --r:20px; --r2:14px;
  --sh:0 1px 1px rgba(20,26,17,.03), 0 8px 24px -8px rgba(20,26,17,.10);
  --sh2:0 1px 2px rgba(20,26,17,.04);
  --safe-b: env(safe-area-inset-bottom, 0px);
  /* v22：语义色变量。整站不再直接写颜色，全部走这里；深色只覆盖这些变量，不改布局 */
  --surf:#FFFFFF; --surf2:#F2F3EF; --surf3:#FCFCFA; --surf-warm:#FBFDF8;
  --on-pri:#FFFFFF; --tab-off:#79837A;
  --green-tx:#33521F; --red-tx:#9C3835; --amber-tx:#7A5A10; --blue-tx:#2F5C7D;
  --tick-line:#D9DED3; --strike:#DCE1D5; --bar-bg:#E6E9E2; --dash-line:#D6DCD0;
  --bad-line:#EDC9C6; --pri-line:#DDEBD2; --spell-line:#9BBED6; --warn-wave:#D8A63A;
  --heat0:#F2F3EF; --heat1:#DCEBCE; --heat2:#B6D69A;
  --hh0:#EEF0EA; --hh1:#D7E8C6; --hh2:#B4D394; --hh3:#8FBF6E; --hh4:#578A3B; --bar-hi:#8FBF6E;
  --ok:#3F9142; --warn:#C8892A; --bad:#C0392B; --ok-tx:#3F7A34; --bad-tx:#B4482E;
  --glass:rgba(251,251,248,.86); --glass2:rgba(255,255,255,.94);
  --mask:rgba(18,24,15,.38); --toast-bg:rgba(20,26,17,.94); --toast-tx:#FFFFFF; --toast-tx-dim:#C6CCC0;
  --deep-bg:#141A11; --deep-tx:#EAF0E4; --deep-hl:#9FD37E; --deep-dim:#7E8B76;
  --glow-pri:rgba(92,138,78,.55); --glow-bad:rgba(201,88,79,.7); --pri-aura:rgba(92,138,78,.10);
  --sh3:0 -6px 24px -14px rgba(20,26,17,.2); --sh-seg:0 1px 3px rgba(20,26,17,.09);
}
/* 深色主题：只覆盖语义变量 + 少量结构色，不动任何布局与交互 */
html[data-theme="light"]{color-scheme:light}
html[data-theme="dark"]{
  color-scheme:dark;
  --green:#7FB06A; --green-d:#9CCB87; --green-l:#1C2A1B; --green-l2:#22331E;
  --ink:#E6EDE1; --ink2:#B6C2AF; --muted:#93A38D; --line:#2B3629; --line2:#222C21;
  --bg:#0F1410; --card:#171E17;
  --red:#E3867C; --red-l:#2A1B1A; --amber:#DDB05C; --amber-l:#2A2317; --blue:#7FB0D8; --blue-l:#18242E;
  --surf:#171E17; --surf2:#1F2820; --surf3:#1A221A; --surf-warm:#182018;
  --on-pri:#101609; --tab-off:#8C9A86;
  --green-tx:#C3E6B0; --red-tx:#F0A9A0; --amber-tx:#F0CE8E; --blue-tx:#AECFEA;
  --tick-line:#3A473A; --strike:#3A473A; --bar-bg:#2A352A; --dash-line:#334033;
  --bad-line:#5A3532; --pri-line:#2E4A2A; --spell-line:#3A5A75; --warn-wave:#D8A63A;
  --heat0:#1F2820; --heat1:#2E4A26; --heat2:#4E7A39;
  --hh0:#1F2820; --hh1:#2E4A26; --hh2:#43703A; --hh3:#5D9150; --hh4:#7FB06A; --bar-hi:#9CCB87;
  --ok:#6FBF72; --warn:#DDB05C; --bad:#E3867C; --ok-tx:#8FCB91; --bad-tx:#F0A9A0;
  --glass:rgba(15,20,16,.86); --glass2:rgba(23,30,23,.94);
  --mask:rgba(0,0,0,.62); --toast-bg:#2B3629; --toast-tx:#E6EDE1; --toast-tx-dim:#B9C4B3;
  --deep-bg:#0A0F0B; --deep-tx:#DCE7D5; --deep-hl:#9FD37E; --deep-dim:#8B9A83;
  --glow-pri:rgba(127,176,106,.45); --glow-bad:rgba(227,134,124,.5); --pri-aura:rgba(127,176,106,.10);
  --sh:0 1px 1px rgba(0,0,0,.35), 0 10px 28px -12px rgba(0,0,0,.62);
  --sh2:0 1px 2px rgba(0,0,0,.4);
  --sh3:0 -6px 24px -14px rgba(0,0,0,.7); --sh-seg:0 1px 3px rgba(0,0,0,.5);
}
/* 深色下补几处结构性颜色：SVG 连线/热力/表头等靠变量拿不到的地方 */
html[data-theme="dark"] img,html[data-theme="dark"] svg{color-scheme:dark}
html[data-theme="dark"] *{scrollbar-color:var(--tick-line) transparent}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.62;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  letter-spacing:.1px;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--green-l2)}
.app{max-width:1180px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ===== 顶栏：极简无边框 ===== */
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:14px 20px 10px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:var(--glass);backdrop-filter:saturate(180%) blur(16px);
}
.spacer{flex:1}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:17px;letter-spacing:-.2px}
.logo{
  width:28px;height:28px;border-radius:10px;background:var(--green);display:grid;place-items:center;
  color:var(--on-pri);font-size:13px;font-weight:800;box-shadow:0 4px 10px -3px var(--glow-pri);
}
.brand small{display:block;font-size:9px;letter-spacing:1.1px;color:var(--muted);font-weight:700;margin-top:-2px}
.chip{
  display:inline-flex;align-items:center;gap:4px;background:var(--green-l);color:var(--green-d);
  border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;letter-spacing:.2px;
}
.chip.warn{background:var(--amber-l);color:var(--amber-tx)}
.chip.plain{background:var(--surf2);color:var(--ink2)}
.chip.act{background:var(--surf);border:1px solid var(--line);color:var(--ink);cursor:pointer;padding:7px 13px;font-size:12px;font-weight:700;transition:.16s}
.chip.act:active{transform:scale(.97);background:var(--green-l);border-color:var(--green)}

/* ===== 主体 ===== */
main{flex:1;padding:6px 18px 104px;padding-bottom:calc(104px + var(--safe-b))}
.view{display:none}
.view.on{display:block;animation:fade .26s cubic-bezier(.2,.7,.3,1)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 底部标签：悬浮胶囊 ===== */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:2px;
  background:var(--glass2);backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--line2);
  padding:7px 8px calc(7px + var(--safe-b));
}
.tabbar .tab{
  flex:1;border:0;background:none;padding:6px 2px 4px;border-radius:14px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tab-off);font-size:11px;font-weight:750;
  transition:color .18s,background .18s;letter-spacing:.3px;
}
.tabbar .tab .ic{width:24px;height:24px;display:grid;place-items:center;border-radius:9px;transition:background .18s}
.tabbar .tab .ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.tabbar .tab.on{color:var(--green-d)}
.tabbar .tab.on .ic{background:var(--green-l)}
.tabbar .tab.on .ic svg{stroke-width:1.9}
@media(min-width:768px){
  .tabbar{position:sticky;max-width:720px;margin:0 auto;width:calc(100% - 36px);border-radius:20px 20px 0 0;
    border:1px solid var(--line2);border-bottom:0;box-shadow:var(--sh3)}
  main{max-width:720px;margin:0 auto;width:100%;padding:6px 0 92px}
  .topbar{max-width:720px;width:100%;margin:0 auto;padding-left:0;padding-right:0}
}

/* ===== 卡片 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh2);margin-bottom:14px}
.card.tight{padding:14px 15px}
.card.flat{box-shadow:none;background:var(--surf3)}
.card.edge{border-color:var(--line2);box-shadow:var(--sh)}
.hd{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.hd h3{margin:0;font-size:15.5px;font-weight:750;letter-spacing:-.15px}
.hd .sub{font-size:11.5px;color:var(--muted);font-weight:600}
.hd .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.h2{
  margin:24px 2px 10px;font-size:11.5px;font-weight:800;color:var(--muted);
  letter-spacing:1.1px;text-transform:uppercase;display:flex;align-items:center;gap:10px;
}
.h2 .ln{flex:1;height:1px;background:var(--line2)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.center{text-align:center}
.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:760px){
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
}

/* ===== Hero ===== */
.hero{
  padding:26px 4px 18px;
}
.hero .kicker{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--green);text-transform:uppercase}
.hero h1{margin:6px 0 4px;font-size:30px;line-height:1.16;font-weight:800;letter-spacing:-1px}
.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.ring{width:64px;height:64px;flex:none}
.ring text{font-size:13px;font-weight:800;fill:var(--ink);letter-spacing:-.4px}
.ring circle.track{stroke:var(--line);fill:none;stroke-width:5}
.ring circle.val{stroke:var(--green);fill:none;stroke-width:5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s}

/* ===== 按钮 ===== */
.btn{
  border:1px solid var(--green);background:var(--green);color:var(--on-pri);border-radius:var(--r2);
  padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s,opacity .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;letter-spacing:.2px;
}
.btn:active{transform:scale(.976)}
.btn.block{display:flex;width:100%}
.btn.sm{padding:7px 13px;font-size:12.5px;border-radius:11px}
.btn.gray{background:var(--surf);border-color:var(--line);color:var(--ink2)}
.btn.gray.on,.btn.ghost.on{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink2)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.dark{background:var(--ink);border-color:var(--ink)}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn.big{padding:16px 20px;font-size:15.5px;border-radius:16px;font-weight:750;color:var(--on-pri)}

/* ===== 分段 ===== */
.seg{display:flex;gap:5px;overflow-x:auto;padding:3px;margin-bottom:10px;scrollbar-width:none;
  background:var(--surf2);border-radius:14px}
.seg::-webkit-scrollbar{display:none}
.seg.wrap{flex-wrap:wrap;overflow:visible}
.seg button{
  flex:none;border:0;background:transparent;color:var(--ink2);
  padding:7px 14px;border-radius:11px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.16s;letter-spacing:.2px;
}
.seg button.on{background:var(--surf);color:var(--green-d);box-shadow:var(--sh-seg)}

/* ===== 进度 ===== */
.bar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .45s cubic-bezier(.2,.7,.3,1)}
.bar.thin{height:4px}

/* ===== 统计 ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;text-align:center;background:var(--line2);
  border-radius:var(--r2);overflow:hidden;border:1px solid var(--line2)}
.stat{background:var(--surf);padding:12px 4px}
.stat b{display:block;font-size:20px;font-weight:800;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat span{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.2px}

/* ===== 任务行 ===== */
.todo{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.todo:last-child{border-bottom:0;padding-bottom:2px}
.todo .tick{
  width:21px;height:21px;flex:none;border-radius:50%;border:1.5px solid var(--tick-line);display:grid;place-items:center;
  font-size:11px;color:transparent;background:var(--surf);transition:.2s;
}
.todo.done .tick{background:var(--green);border-color:var(--green);color:var(--on-pri)}
.todo .tt{font-weight:700;font-size:14px}
.todo.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--strike)}
.todo .ts{font-size:11.5px;color:var(--muted)}
.todo .go{margin-left:auto;font-size:11.5px;color:var(--green-d);font-weight:800;background:var(--green-l);border-radius:9px;padding:4px 9px}

/* ===== 词卡 ===== */
.wcard{background:var(--surf);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--sh)}
.wcard .w{font-size:31px;font-weight:800;letter-spacing:-.9px;line-height:1.14}
.wcard .ph{color:var(--muted);font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:3px}
.wcard .cn{font-size:15px;font-weight:700;color:var(--green-d);margin-top:8px}
.tag{display:inline-block;background:var(--green-l);color:var(--green-d);border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;margin:2px 4px 2px 0;letter-spacing:.2px}
.tag.b{background:var(--blue-l);color:var(--blue-tx)}
.tag.a{background:var(--amber-l);color:var(--amber-tx)}
.tag.r{background:var(--red-l);color:var(--red-tx)}
.tag.g{background:var(--surf2);color:var(--ink2)}
.ex{border-left:2px solid var(--green-l2);padding:2px 0 2px 12px;margin:10px 0;font-size:13.5px;line-height:1.7}
.ex em{font-style:normal;font-weight:800;color:var(--green-d);background:linear-gradient(transparent 64%,var(--green-l2) 0)}
.ex .cn2{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* ===== 联想网 ===== */
.web{position:relative;margin-top:8px;border-radius:18px;background:radial-gradient(circle at 50% 44%,var(--green-l) 0,transparent 60%);min-height:250px}
.web svg{display:block;width:100%;height:auto;overflow:visible}
.web .node{cursor:pointer}
.web .node text{font-family:inherit;font-size:9.5px;font-weight:700;fill:var(--ink2)}
.web .node.core text{font-size:12.5px;fill:var(--on-pri)}
.web .node.core circle{fill:var(--green)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* ===== 词条行 ===== */
.wrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.wrow:last-child{border-bottom:0}
.wrow .lw{font-weight:750;font-size:14.5px;min-width:78px;letter-spacing:-.2px}
.wrow .lc{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .lr{font-size:10.5px;color:var(--green-d);font-weight:800;background:var(--green-l);border-radius:7px;padding:2px 7px}

/* ===== 播放/录音 ===== */
.playbtn{
  width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surf);
  color:var(--green-d);cursor:pointer;display:grid;place-items:center;font-size:12px;transition:.16s;
}
.playbtn:active{transform:scale(.94)}
.playbtn.on{background:var(--green);border-color:var(--green);color:var(--on-pri)}
.mic{
  width:100%;border:0;border-radius:18px;padding:17px;background:var(--green);color:var(--on-pri);font-weight:750;font-size:15px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 10px 24px -10px var(--glow-pri);letter-spacing:.4px;
}
.mic.rec{background:var(--red);box-shadow:0 10px 24px -10px var(--glow-bad);animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.84}}
.mic .dot{width:8px;height:8px;border-radius:50%;background:var(--surf);opacity:.92}
.volk{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}

/* ===== 句子 ===== */
.sent{padding:12px 0;border-bottom:1px solid var(--line2)}
.sent:last-child{border-bottom:0}
.sent .en{font-size:15px;line-height:1.62;font-weight:600;letter-spacing:-.1px}
.sent .cn3{font-size:12px;color:var(--muted);margin-top:3px}
.sent .tool{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mini{
  border:1px solid var(--line2);background:var(--surf);color:var(--ink);border-radius:9px;padding:5px 10px;font-size:11.5px;
  font-weight:700;cursor:pointer;transition:.16s;
}
.mini.on{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.mini.red{color:var(--red);border-color:var(--bad-line)}

/* ===== 反馈 ===== */
.fb{margin-top:10px;border-radius:14px;padding:12px 14px;font-size:13px;background:var(--green-l);color:var(--green-tx);line-height:1.65}
.fb.bad{background:var(--red-l);color:var(--red-tx)}
.fb.warn{background:var(--amber-l);color:var(--amber-tx)}
.fb b{font-weight:800}
.opt{
  display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:8px;font-size:13.5px;cursor:pointer;font-weight:600;transition:.16s;
}
.opt.on{border-color:var(--green);background:var(--green-l)}
.opt.ok{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.opt.no{border-color:var(--bad-line);background:var(--red-l);color:var(--red-tx)}

/* ===== 分数 ===== */
.big{font-size:42px;font-weight:800;line-height:1;letter-spacing:-1.6px;color:var(--ink);font-variant-numeric:tabular-nums}
.big small{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0}
.cmp{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;background:var(--surf)}
.cmp .sc{font-size:26px;font-weight:800;color:var(--green-d);font-variant-numeric:tabular-nums}
.wordcmp{line-height:2.2;font-size:14px;word-break:break-word;overflow-wrap:anywhere}
.wordcmp span{display:inline-block;padding:1px 5px;border-radius:6px;margin-right:3px}
.wordcmp .hit{background:var(--green-l);color:var(--green-tx)}
.wordcmp .miss{background:var(--red-l);color:var(--red-tx);text-decoration:line-through}
.wordcmp .extra{background:var(--amber-l);color:var(--amber-tx)}
/* v20：句子听写逐词对照的第四类「拼错」——蓝底，与多写的黄底区分 */
.wordcmp .spell{background:var(--blue-l);color:var(--blue-tx);border-bottom:2px solid var(--spell-line)}
.wordcmp em{font-style:normal;font-size:11px;opacity:.8;margin-left:3px;letter-spacing:0}
.wordcmp .lg{padding:1px 5px;border-radius:5px;font-weight:700}
.dssegsel{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surf);font-size:13.5px;color:var(--ink);outline:none}
.dssegsel:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-l)}

/* ===== 计时 ===== */
.timerbig{font-size:46px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums;color:var(--ink);text-align:center;line-height:1.05}
.pill{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:middle}
.pill.done{background:var(--green)}
.pill.cur{background:var(--green);box-shadow:0 0 0 3px var(--green-l2)}

/* ===== 表格 ===== */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:700;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase}
td.n{font-weight:800;color:var(--green-d)}

/* ===== 热力 ===== */
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--heat0);display:block}
.heat i.l1{background:var(--heat1)}.heat i.l2{background:var(--heat2)}.heat i.l3{background:var(--green)}

/* ===== 输入 ===== */
textarea,input[type=text]{
  width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surf);
  font-size:14px;line-height:1.65;resize:vertical;outline:none;transition:.16s;
}
textarea:focus,input[type=text]:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-l)}
label.fl{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin:0 0 6px;letter-spacing:.6px;text-transform:uppercase}

/* ===== 弹层 ===== */
.mask{position:fixed;inset:0;background:var(--mask);z-index:60;display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(2px)}
.mask.on{display:flex}
.wtbar{height:7px;border-radius:99px;background:var(--line2);overflow:hidden;margin:10px 0 2px}
.wtbar i{display:block;height:100%;background:var(--green);transition:width .25s linear}
.wtq{font-size:19px;line-height:1.6;font-weight:800;letter-spacing:-.3px;margin:14px 0 12px}
.sheet{background:var(--surf);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + var(--safe-b));width:100%;max-width:560px;max-height:84vh;overflow:auto;animation:up .28s cubic-bezier(.2,.7,.3,1)}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 8px;font-size:17px;font-weight:800;letter-spacing:-.3px}
.toast{
  position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,10px);z-index:80;
  background:var(--toast-bg);color:var(--toast-tx);padding:10px 16px;border-radius:13px;font-size:12.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .24s;max-width:82vw;text-align:center;letter-spacing:.2px;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hr{height:1px;background:var(--line2);margin:14px 0}
.linkrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2);text-decoration:none;color:inherit}
.linkrow:last-child{border-bottom:0}
.linkrow .lic{width:32px;height:32px;border-radius:11px;background:var(--green-l);color:var(--green-d);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.linkrow .lt{font-weight:700;font-size:13.5px}
.linkrow .ld{font-size:11px;color:var(--muted)}
.linkrow .la{margin-left:auto;color:var(--toast-tx-dim);font-size:15px}
.badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:var(--on-pri);font-size:9px;font-weight:800;border-radius:99px;padding:1px 5px}
.rel{position:relative}

/* ===== 新增：模块 17 听写 ===== */
.dictline{display:flex;align-items:center;gap:8px;margin-top:10px}
.dictbox{
  flex:1;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surf);font-size:15px;
  letter-spacing:.4px;outline:none;
}
.dictbox:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-l)}
.dictbox.ok{border-color:var(--green);background:var(--green-l)}
.dictbox.no{border-color:var(--bad-line);background:var(--red-l)}
.dictletter{display:inline-block;min-width:15px;border-bottom:1.5px solid var(--dash-line);margin:0 1px;text-align:center;color:var(--ink)}
.dictletter.gap{color:var(--red)}
.dictcount{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.4px}
.kbd{
  display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:7px;
  padding:1px 6px;font-size:11px;font-weight:700;color:var(--ink2);background:var(--surf3);
}
.empty{padding:36px 10px;text-align:center;color:var(--muted);font-size:13px}

/* ===== 新增：模块 18 碎片 ===== */
.snackcard{
  border-radius:22px;padding:20px;background:linear-gradient(150deg,var(--pri-l) 0%,var(--surf) 62%);
  border:1px solid var(--line2);position:relative;overflow:hidden;
}
.snackcard:after{
  content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,var(--pri-aura),transparent 70%);
}
.snacktile{
  display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surf);border:1px solid var(--line);
  border-radius:18px;padding:14px;cursor:pointer;transition:.18s;box-shadow:var(--sh2);
}
.snacktile:active{transform:scale(.985)}
.snacktile .st{font-size:14px;font-weight:750;letter-spacing:-.2px}
.snacktile .sd{font-size:11.5px;color:var(--muted);line-height:1.5}
.snacktile .sm{font-size:10.5px;font-weight:800;color:var(--green);letter-spacing:.8px;text-transform:uppercase}
.snacktile.hot{background:linear-gradient(160deg,var(--surf-warm),var(--surf));border-color:var(--pri-line)}
.snackprog{display:flex;gap:4px;margin-top:10px}
.snackprog i{flex:1;height:4px;border-radius:99px;background:var(--bar-bg);display:block}
.snackprog i.on{background:var(--green)}
.snackprog i.cur{background:var(--green);box-shadow:0 0 0 2px var(--green-l2)}
.bigword{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.15;text-align:center;margin:10px 0 4px}
.snackans{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

/* ===== 新增：模块 19 交传/同传 ===== */
.interphead{display:flex;align-items:center;gap:12px}
.meter{display:flex;align-items:flex-end;gap:3px;height:34px}
.meter i{width:4px;border-radius:2px;background:var(--green-l2);display:block;transition:height .12s}
.meter.on i{background:var(--green)}
.cue{
  background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;line-height:1.7;
  font-size:15.5px;font-weight:600;min-height:74px;letter-spacing:-.1px;
}
.cue .cnline{display:block;margin-top:8px;font-size:13px;color:var(--muted);font-weight:500}
.shadow{
  border-radius:16px;background:var(--deep-bg);color:var(--deep-tx);padding:14px 16px;font-size:13px;line-height:1.7;
  font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2px;
}
.shadow .hl{color:var(--deep-hl);font-weight:700}
.shadow .dim{color:var(--deep-dim)}
.segtime{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.segtime:last-child{border-bottom:0}
.segtime .num{width:22px;height:22px;flex:none;border-radius:8px;background:var(--green-l);color:var(--green-d);
  display:grid;place-items:center;font-size:11px;font-weight:800}
.segtime .txt{flex:1;min-width:0;font-size:13.5px;line-height:1.55}
.segtime .txt small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:359px){
  .split{grid-template-columns:1fr}
  .snackans{grid-template-columns:1fr}
  .hero h1{font-size:26px}
}
/* ===== 背景听 ===== */
.bgclock{font-size:48px;font-weight:800;letter-spacing:-1.6px;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--green-d)}
.srcrow{display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r2);padding:13px 14px;margin-bottom:9px;
  box-shadow:var(--sh2);transition:.16s}
.srcrow:active{transform:scale(.995);background:var(--surf-warm)}
.sr-top{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.sr-top .chip{flex:none}
.sr-name{font-size:14px;font-weight:750;letter-spacing:-.1px;flex:1;min-width:0;line-height:1.45;word-break:break-word}
.sr-org{font-size:11.5px;color:var(--muted);margin-top:3px}
.sr-why{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-top:6px}
.sr-go{font-size:11.5px;color:var(--green-d);font-weight:700;margin-top:7px}
/* 背景听降亮：浅色下把整页压暗一档；深色下只再暗一点点，保证文字对比度仍然够（不做死黑） */
body.bgnight{--bg:#0F1511;--card:#16201A;--line:#243028;--line2:#1C2720;--ink:#DDE6D8;--ink2:#A9B8A3;--muted:#7C8C76;
  --green:#8FB683;--green-d:#9CC48F;--green-l:#1B2A20;--green-l2:#213328;--on-pri:#0D1408;
  --surf:#16201A;--surf2:#1B2620;--surf3:#182219;--surf-warm:#141E16;--tab-off:#8A9A84;
  --green-tx:#C3E6B0;--red-tx:#F0A9A0;--amber-tx:#F0CE8E;--blue-tx:#AECFEA;
  --tick-line:#3A4A3C;--strike:#3A4A3C;--bar-bg:#28362A;--dash-line:#324032;
  --bad-line:#57342F;--pri-line:#2C4526;--spell-line:#37566F;
  --heat0:#202B22;--heat1:#2C4526;--heat2:#46703A;
  --hh0:#151D17;--hh1:#2C4526;--hh2:#3D6132;--hh3:#52803F;--hh4:#6B9C56;--bar-hi:#9CC48F;
  --ok:#6FBF72;--warn:#DDB05C;--bad:#E3867C;--ok-tx:#8FCB91;--bad-tx:#F0A9A0;
  --glass:rgba(15,21,17,.9);--glass2:rgba(18,26,21,.95);--toast-bg:#243028;--toast-tx:#DDE6D8;--toast-tx-dim:#B9C4B3;
  --deep-bg:#0B100C;--deep-tx:#DCE7D5;--deep-hl:#9FD37E;--deep-dim:#8B9A83;--pri-aura:rgba(143,182,131,.12)}
body.bgnight .tabbar{background:var(--glass2);border-color:var(--line)}
body.bgnight .toast{background:var(--toast-bg);color:var(--toast-tx)}
/* 深色主题下的降亮：只在深色底色上再压一档，文字仍然亮，绝不弹回浅色、也不压成不可读的死黑 */
html[data-theme="dark"] body.bgnight{--bg:#080C09;--card:#101610;--surf:#101610;--surf2:#151D15;--surf3:#0E140F;
  --surf-warm:#0C120D;--line:#232D23;--line2:#1B231B;--ink:#D3DECC;--ink2:#A2B09B;--muted:#7E8C78;
  --green:#7FA971;--green-d:#93BE84;--green-l:#162116;--green-l2:#1B2A19;--on-pri:#0A0F07;
  --glass:rgba(8,12,9,.92);--glass2:rgba(16,22,16,.95);--toast-bg:#1E2720;--toast-tx:#D3DECC;--toast-tx-dim:#ADB9A7;
  --heat0:#161E17;--hh0:#101710;--hh1:#1E3019;--hh2:#2C4726;--hh3:#3D5F33;--hh4:#527748;--bar-hi:#6E9A5E}

@media (max-width:340px){ .bgclock{font-size:40px} }

/* P2/P3：播放卡信息块、没听清回填、长文折叠 */
.bgmeta{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:11.5px;line-height:1.8;color:var(--muted)}
.bgmeta b{color:var(--ink);font-weight:750}
.sr-back{display:inline-block;margin-left:8px;padding:3px 8px;border:1px solid var(--green);
  border-radius:8px;background:var(--green-l);font-size:11px;font-weight:700;color:var(--green-d);
  vertical-align:middle}
.whyb{border:1px solid var(--line);border-radius:var(--r2);background:var(--card);
  padding:12px 14px;margin-bottom:9px}
.whyb summary{cursor:pointer;font-weight:750;font-size:13.5px;color:var(--ink);
  list-style:none;outline:none}
.whyb summary::-webkit-details-marker{display:none}
.whyb summary:before{content:"＋ ";color:var(--green-d);font-weight:800}
.whyb[open] summary:before{content:"－ "}
.whyb p{font-size:12.5px;line-height:1.95;color:var(--ink);margin:9px 0 0}
.whyb b{color:var(--green-d)}

/* ===== 辨析词 / 跨模块回流 ===== */
.cfwrap{margin-top:10px}
.cfhd{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.cfbox{border:1px solid var(--line);border-radius:var(--r2);background:var(--surf-warm);padding:10px 11px;margin-top:8px}
.cftag{display:inline-block;font-size:11px;font-weight:800;color:var(--green-d);background:var(--green-l);border-radius:999px;padding:2px 8px;margin-bottom:7px}
.cfrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cfcol{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 9px;min-width:0}
.cfcol.cur{border-color:var(--green);box-shadow:0 0 0 2px var(--green-l)}
.cfw{font-size:14px;font-weight:800;letter-spacing:-.1px;cursor:pointer;word-break:break-word}
.cfpt{font-size:12px;line-height:1.6;color:var(--ink2);margin-top:4px}
.cfex{font-size:12px;line-height:1.62;color:var(--ink2);margin-top:5px;word-break:break-word}
.cfex b{color:var(--green-d)}
.cfrule{font-size:12.5px;line-height:1.72;margin-top:7px;background:var(--card);border:1px dashed var(--green);border-radius:10px;padding:8px 9px;color:var(--ink2)}
.cfrule b{color:var(--green-d)}
.cfqline{font-size:15px;line-height:1.75;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px}
.cfqline .blank{color:var(--green-d);letter-spacing:1px}
.rcbox{font-size:12px;line-height:1.65;margin-top:8px;background:var(--green-l2);border-left:3px solid var(--green);border-radius:8px;padding:8px 10px;color:var(--ink2)}
.rcbox b{color:var(--green-d)}
@media (max-width:360px){ .cfrow{grid-template-columns:1fr} }

/* ---------- 每日素材 ---------- */
.dl-day{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.4px;margin:16px 2px 8px}
.dl-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px 13px;margin-bottom:9px;cursor:pointer;box-shadow:var(--sh2)}
.dl-item:active{transform:scale(.995)}
.dl-top{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.dl-src{font-size:10.5px;font-weight:800;color:var(--green-d);background:var(--green-l);border-radius:6px;padding:2px 6px;letter-spacing:.2px}
.dl-lv{font-size:10.5px;font-weight:800;color:var(--amber);background:var(--amber-l);border-radius:6px;padding:2px 6px}
.dl-meta{font-size:10.5px;color:var(--muted);font-weight:650}
.dl-t{font-size:15px;font-weight:750;line-height:1.35;letter-spacing:-.15px;color:var(--ink)}
.dl-sub{font-size:11.5px;color:var(--muted);margin-top:5px}
.dl-body{font-size:16.5px;line-height:1.9;color:var(--ink)}
.dl-s{border-radius:4px;padding:1px 0}
.dl-s:active{background:var(--green-l)}
.dl-w{color:var(--green-d);border-bottom:1px dashed var(--green);font-weight:650}
.dl-key{display:flex;flex-wrap:wrap;gap:7px}
.dl-k{border:1px solid var(--line);background:var(--surf);border-radius:9px;padding:6px 9px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.dl-k i{font-style:normal;font-weight:600;color:var(--muted);font-size:11px;margin-left:5px}
.dl-q{border:1px solid var(--line);border-radius:var(--r2);padding:12px;margin-bottom:9px}
.dl-q .qt{font-size:14px;font-weight:750;margin-bottom:8px}
.dl-op{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:9px 11px;margin-bottom:6px;font-size:13px;font-weight:650;cursor:pointer;color:var(--ink)}
.dl-op.ok{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.dl-op.no{border-color:var(--red);background:var(--red-l);color:var(--red)}
/* 产出校验（P0-1）：只给中文，英文让用户自己写/说 */
.prodcn{font-size:22px;font-weight:800;letter-spacing:.3px;color:var(--green-d);line-height:1.5;margin-top:2px}
/* 录音波形（P0-2）：纯本地能量分析，静音段换色 */
.wv{display:flex;align-items:flex-end;gap:2px;height:58px;background:var(--green-l);border-radius:12px;padding:7px 8px;margin-top:6px}
.wv i{flex:1;min-width:2px;display:block;border-radius:2px;background:var(--green);transition:height .18s}
.wv i.sil{background:var(--warn-wave);opacity:.85}
.wvlg{display:flex;gap:12px;align-items:center;font-size:10.5px;color:var(--muted);margin-top:5px}
.wvlg .dot{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--green);margin-right:4px}
.wvlg .dot.sil{background:var(--warn-wave)}
.wvnum{display:flex;gap:6px;margin-top:8px;text-align:center}
.wvnum div{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:6px 2px}
.wvnum b{display:block;font-size:13.5px;color:var(--green-d);font-variant-numeric:tabular-nums}
.wvnum span{font-size:10px;color:var(--muted)}
.wvbox{margin-top:8px}
/* ===== P2-3 双栏布局：默认单列，平板横屏（≥900px + landscape）才变双栏 ===== */
.duo{display:block;min-width:0}
.duo-main{min-width:0}
.duo-side{min-width:0}
.duo-main>.card:first-child,.duo-side>.card:first-child{margin-top:0}
.duo-side .dl-key{max-height:none}
.errbar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
@media (min-width:900px) and (orientation:landscape){
  .duo{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:14px;align-items:start}
  .duo-main,.duo-side{overflow-wrap:anywhere;word-break:break-word}
  .duo-side{position:sticky;top:64px;max-height:calc(100vh - 76px);overflow-y:auto;overscroll-behavior:contain}
  .duo-main>.card,.duo-side>.card{margin-bottom:12px}
  .duo-main .dl-t{font-size:20px}
}

/* v17：句子改错对照 —— 差异标记与状态卡（窄屏不横向溢出） */
.fxbox textarea{width:100%}
.fxdiff{word-break:break-word;overflow-wrap:anywhere}
.fxprompt{flex:1;min-width:0;line-height:1.7;word-break:break-word}
.fxrow{display:flex;gap:8px;align-items:flex-start}

<script>
/* ==== el2_vocab_a.js ==== */
/* ===== 词库 A：学术与职场（联想字段：词根 / 词族 / 近义 / 反义 / 搭配 / 易混 / 主题） ===== */
function V(w, ph, pos, cn, root, fam, syn, ant, col, ex, exCn, scene, conf){
  return { w: w, ph: ph, pos: pos, cn: cn, root: root,
    fam: sp(fam), syn: sp(syn), ant: sp(ant), col: sp(col),
    ex: ex, exCn: exCn, scene: scene, conf: sp(conf) };
}
function sp(s){ return s ? s.split("|").filter(Boolean) : []; }

var VOCAB = [
V("analyze","/ˈænəlaɪz/","v.","分析；拆解",
  "ana-(彻底) + lys(松开) → 把整体彻底拆开来看",
  "analysis|analyst|analytical","examine|dissect|break down","synthesize|overlook",
  "analyze data|analyze the cause|analyze in depth",
  "We need to analyze the data before drawing any conclusion.",
  "在得出任何结论之前，我们需要分析数据。","学术",
  "英式拼 analyse；名词 analysis 重音在后，动词 analyze 重音在前"),
V("significant","/sɪɡˈnɪfɪkənt/","adj.","显著的；有意义的",
  "sign(标记) + fic(做) + -ant → 能做出标记的 → 值得注意的",
  "significance|significantly|insignificant","notable|substantial|meaningful","trivial|negligible",
  "a significant increase|statistically significant|significant impact",
  "There was a significant increase in enrollment this year.",
  "今年报名人数有显著增长。","学术",
  "significant 指「重要/显著」，不是「很大的」；口语里说 a big difference 更自然"),
V("hypothesis","/haɪˈpɒθəsɪs/","n.","假设；假说",
  "hypo-(在下面) + thesis(放置) → 放在下面当基础的命题",
  "hypotheses|hypothetical|hypothesize","assumption|proposition|theory","fact|conclusion",
  "test a hypothesis|support the hypothesis|formulate a hypothesis",
  "The experiment was designed to test a simple hypothesis.",
  "这个实验旨在检验一个简单的假设。","学术",
  "复数 hypotheses /haɪˈpɒθəsiːz/；theory 是已被广泛验证的，hypothesis 尚未验证"),
V("evidence","/ˈevɪdəns/","n.","证据；依据",
  "e-(向外) + vid(看) + -ence → 能拿出来给人看的东西",
  "evident|evidently|evidential","proof|data|indication","guess|speculation",
  "strong evidence|evidence suggests|provide evidence",
  "The evidence suggests that the policy has not worked.",
  "证据表明这项政策没有奏效。","学术",
  "不可数名词，不说 an evidence；proof 比 evidence 更强，指确证"),
V("evaluate","/ɪˈvæljueɪt/","v.","评估；估值",
  "e-(向外) + value(价值) → 把价值算出来",
  "evaluation|evaluative|evaluator","assess|appraise|judge","ignore|assume",
  "evaluate the results|evaluate performance|critically evaluate",
  "Students are asked to evaluate the course at the end of term.",
  "学生被要求在期末评估这门课。","学术",
  "evaluate 强调按标准衡量；assess 更常用于能力/风险，两者近义但搭配不同"),
V("imply","/ɪmˈplaɪ/","v.","暗示；意味着",
  "im-(向内) + plic(折) → 折进话里，不明说",
  "implication|implicit|implicitly","suggest|hint|indicate","state|spell out",
  "imply that|strongly imply|as the name implies",
  "His silence implied that he did not agree.",
  "他的沉默暗示他并不同意。","学术",
  "说话人 imply（暗示），听话人 infer（推断）—— 方向相反，考场高频混淆"),
V("perspective","/pəˈspektɪv/","n.","视角；观点",
  "per-(穿过) + spect(看) + -ive → 透过某处看过去的角度",
  "perspectives|perspectival","viewpoint|standpoint|angle","—",
  "from a different perspective|put into perspective|broaden perspective",
  "Try to see the issue from her perspective.",
  "试着从她的角度看这个问题。","学术",
  "别与 prospective（未来的、潜在的）混；prospective student = 有意向报考的学生"),
V("contrast","/ˈkɒntrɑːst/","n./v.","对比；反差",
  "contra-(相反) + st(站) → 相对而立",
  "contrasting|contrastive","compare|distinguish|juxtapose","resemble|match",
  "in contrast|by contrast|contrast A with B",
  "In contrast to last year, sales have fallen sharply.",
  "与去年相比，销售额大幅下降。","学术",
  "compare 找相同点，contrast 找不同点；in contrast 后跟名词或句子，by contrast 常独立使用"),
V("emphasize","/ˈemfəsaɪz/","v.","强调；着重",
  "en-(使) + phasis(显现、陈述) → 使某点显出来",
  "emphasis|emphatic|emphatically","stress|highlight|underline","downplay|understate",
  "emphasize the need|emphasize that|place emphasis on",
  "The report emphasizes the need for early intervention.",
  "报告强调需要早期干预。","学术",
  "名词 emphasis，动词 emphasize 或英式 emphasise；put emphasis on 不是 make emphasis"),
V("framework","/ˈfreɪmwɜːk/","n.","框架；体系",
  "frame(骨架) + work(结构) → 支撑整体的骨架",
  "frames|framing","structure|model|scheme","—",
  "theoretical framework|legal framework|within the framework of",
  "The study lacks a clear theoretical framework.",
  "这项研究缺乏清晰的理论框架。","学术",
  "framework 是可数名词，a framework / frameworks；抽象说「框架内」用 within the framework of"),
V("derive","/dɪˈraɪv/","v.","获得；源自",
  "de-(从……来) + riv(河流) → 从河里引水 → 引出来源",
  "derivation|derivative|derived","obtain|originate|stem","—",
  "derive from|derive pleasure from|be derived from",
  "The word derives from an old Latin root.",
  "这个词源自一个古拉丁词根。","学术",
  "derive from = 源自（主动）；be derived from = 由……派生（被动），论文里两种都常见"),
V("coherent","/kəʊˈhɪərənt/","adj.","连贯的；条理清楚的",
  "co-(共同) + haer(粘) + -ent → 粘在一起的",
  "coherence|coherently|incoherent","logical|consistent|well-organized","confused|incoherent",
  "a coherent argument|coherent structure|logically coherent",
  "Your essay needs a more coherent structure.",
  "你的文章需要一个更连贯的结构。","学术",
  "coherent 指逻辑连贯；cohesive 指凝聚力强（团队、群体），两者不能互换"),

V("negotiate","/nɪˈɡəʊʃieɪt/","v.","谈判；协商",

  "negotiation|negotiator|negotiable","bargain|mediate|discuss terms","dictate|impose",
  "negotiate a deal|negotiate with sb|enter negotiations",
  "We are still negotiating the terms of the contract.",
  "我们仍在协商合同的条款。","职场",
  "negotiate 后面直接跟宾语（negotiate a price），不说 negotiate about a price"),
V("deadline","/ˈdedlaɪn/","n.","截止日期",
  "dead(死) + line(线) → 越过即作废的界线（源自监狱围墙线、报社截稿线）",
  "deadlines|deadline-driven","due date|cutoff|time limit","—",
  "meet a deadline|miss a deadline|tight deadline",
  "We have a tight deadline, so let us keep it short.",
  "我们时间很紧，所以简短点说。","职场",
  "deadline 是「期限」，due date 是「到期日」；miss the deadline = 逾期，不是 lose"),
V("delegate","/ˈdelɪɡeɪt/","v./n.","委派；代表",
  "de-(向下) + leg(派遣) + -ate → 派下去做事",
  "delegation|delegated","assign|entrust|hand over","micromanage|take on",
  "delegate tasks|delegate authority|delegate to sb",
  "A good manager knows how to delegate.",
  "好的管理者懂得如何授权。","职场",
  "名词重音在首音节 /ˈdelɪɡət/（代表），动词在末 /ˈdelɪɡeɪt/（委派）"),
V("propose","/prəˈpəʊz/","v.","提议；提出",
  "pro-(向前) + pos(放) → 放到前面来给大家看",
  "proposal|proposition|proponent","suggest|put forward|recommend","oppose|reject",
  "propose a plan|propose that|propose doing",
  "I propose that we postpone the launch by a week.",
  "我建议把上线时间推迟一周。","职场",
  "propose 后接从句用虚拟语气（propose that he be present）；proposal 是可数名词"),
V("feedback","/ˈfiːdbæk/","n.","反馈意见",
  "feed(喂) + back(返回) → 把输出回送回来（源自控制论）",
  "feedbacks（少用）","response|input|comments","—",
  "give feedback|receive feedback|constructive feedback",
  "Thanks for the feedback — it is genuinely useful.",
  "谢谢反馈，确实有用。","职场",
  "不可数，不说 a feedback，要说 a piece of feedback 或 some feedback"),
V("prioritize","/praɪˈɒrətaɪz/","v.","优先处理；排优先级",
  "prior(在先的) + -ize → 把在先的挑出来",
  "priority|priorities|prioritization","rank|put first|focus on","neglect|postpone",
  "prioritize tasks|prioritize health over work|top priority",
  "We need to prioritize the most urgent issue first.",
  "我们得先处理最紧急的问题。","职场",
  "priority 复数 priorities 常表示「优先事项」；prioritize 常与 over 搭配表示取舍"),
V("collaborate","/kəˈlæbəreɪt/","v.","合作；协作",
  "col-(共同) + labor(劳动) + -ate → 一起干活",
  "collaboration|collaborative|collaborator","cooperate|team up|work together","compete|obstruct",
  "collaborate with|collaborate on a project|cross-team collaboration",
  "The two teams collaborated on the design.",
  "两个团队在设计上进行了合作。","职场",
  "collaborate 常用于创意/项目层面；cooperate 更偏配合执行，语义较轻"),
V("compromise","/ˈkɒmprəmaɪz/","n./v.","妥协；折中方案",
  "com-(共同) + promise(承诺) → 双方共同许诺各让一步",
  "compromises|compromising","concession|middle ground|trade-off","insist|stand firm",
  "reach a compromise|compromise on|willing to compromise",
  "We reached a compromise on the budget.",
  "我们在预算上达成了折中。","职场",
  "compromise on 后面跟让步的内容；compromising 作形容词指「有失体面的」"),
V("clarify","/ˈklærəfaɪ/","v.","澄清；讲清楚",
  "clar(清楚) + -ify(使) → 使变清楚",
  "clarity|clarification|clear","explain|make clear|spell out","confuse|obscure",
  "clarify the point|clarify that|just to clarify",
  "Just to clarify, the meeting is on Thursday, not Friday.",
  "我澄清一下，会议是周四不是周五。","职场",
  "clarify 后面直接接内容（clarify the issue），不接 clarify about"),
V("agenda","/əˈdʒendə/","n.","议程；待办事项",
  "拉丁 agere(做) 的将来分词 → 「待做之事」",
  "agendas|agenda-setting","schedule|outline|to-do list","—",
  "on the agenda|set the agenda|hidden agenda",
  "There are three items on the agenda today.",
  "今天议程上有三项。","职场",
  "hidden agenda = 另有隐情的目的；agenda 也可指「（某人想推动的）议题」"),
V("submit","/səbˈmɪt/","v.","提交；屈服",
  "sub-(在下) + mit(送) → 送到上级手里",
  "submission|submitted|submissive","hand in|file|turn in","withdraw|reject",
  "submit an application|submit by Friday|submit to pressure",
  "Please submit your report by Friday noon.",
  "请在周五中午前提交报告。","职场",
  "submit 指正式提交（文件、申请）；hand in 更口语；submit to 还有「屈服于」之意"),
V("concise","/kənˈsaɪs/","adj.","简洁的",
  "con-(完全) + cis(切) → 把多余的全切掉",
  "concisely|conciseness|concision","brief|succinct|to the point","verbose|wordy",
  "a concise summary|keep it concise|clear and concise",
  "Keep the email concise — three short paragraphs at most.",
  "邮件写简洁些，最多三段。","职场",
  "concise 指用词少而信息足；brief 只指短，可能不够全；short 最中性"),
V("commitment","/kəˈmɪtmənt/","n.","承诺；投入",
  "com-(完全) + mit(送) + -ment → 把自己完全交出去",
  "commit|committed|non-committal","dedication|pledge|obligation","indifference|withdrawal",
  "make a commitment|long-term commitment|show commitment",
  "The job requires a two-year commitment.",
  "这份工作要求两年投入。","职场",
  "commitment 兼指「承诺」和「投入度」；committed to doing 用 to + 动名词"),
V("outcome","/ˈaʊtkʌm/","n.","结果；成果",
  "out(出) + come(来) → 最终走出来的东西",
  "outcomes|outcome-based","result|consequence|end result","cause|process",
  "the outcome of|positive outcome|outcome measures",
  "Nobody could predict the outcome of the vote.",
  "没人能预测投票结果。","学术",
  "outcome 偏「事情最终走向」，result 更通用；consequence 多带负面含义")
];

/* ==== el3_vocab_b.js ==== */
/* ===== 词库 B：科技 / 社会 / 情绪 ===== */
VOCAB = VOCAB.concat([
V("algorithm","/ˈælɡərɪðəm/","n.","算法",
  "源自 9 世纪数学家花拉子米（al-Khwarizmi）的名字",
  "algorithms|algorithmic","procedure|rule set|computation","—",
  "sorting algorithm|recommendation algorithm|run an algorithm",

  "算法决定你先看到哪些帖子。","科技",
  "algorithm 不指「程序代码」，而是解题步骤；易与 logarithm（对数）混淆"),

  "我们把周报自动化了，不用再手工做。","科技",

V("privacy","/ˈprɪvəsi/","n.","隐私",

  "private|privately|privacy-first","confidentiality|seclusion","exposure|publicity",
  "privacy policy|invade privacy|privacy concern",

  "用户越来越担心自己的网络隐私。","社会",

  cn:"一家把员工改为四天工作周的软件公司称，产出并未下降，离职人数还减半。试验持续八个月，覆盖两百余人。管理者原以为会议会减少，结果发现员工只是更守住自己手头的时间。并非一切都变好：支持岗位表示同样的请求量要在更少的天数里处理，有人反映每周临近周末都感到赶。公司已将该安排延长一年，但在永久化之前会重新审视薪酬与客服覆盖。同城几家公司在密切关注结果。",

{ id:"n6", t:"新闻：大学开放屋顶天文观测", lv:"B2", scene:"新闻", wpm:180,
  s:[
    "The university has opened a small observatory on the roof of its physics building, and on clear Wednesday evenings it is open to anyone who books a free slot.",
    "The equipment is modest, a telescope that a serious hobbyist might own, but the site is dark enough for the planets and the brighter star clusters.",
    "Student volunteers run the sessions, and they are told to spend more time explaining what people are looking at than adjusting the instrument.",
    "Demand has been higher than expected: the first month of slots went within a day, and the waiting list now runs into the hundreds.",
    "The department is applying for money to buy a second telescope, though it admits that the weather, not the equipment, is the real limit."
  ],

  notes:[

    "Wait, and come to the first lecture anyway. If you are there in person, the lecturer can add you manually.",
    "What if it stays full?",
    "Then take it next term. It runs every term, and the second half of the year is usually quieter."
  ],
  cn:"——我连着两天想注册统计课，系统一直说满员。\n——显示满员是因为阶梯教室有人数上限，但通常第一周会放出几个位置。\n——那我就干等？\n——等着，同时照常去上第一节课。你人到了，讲师可以手动把你加上。\n——要是一直满呢？\n——那就下学期再修。这门课每学期都开，下半年通常没那么挤。",
  notes:[

    {w:"add you manually", n:"手动把你加进名单，教务口语"},
    {w:"It runs every term", n:"run 指课程开设，也可指运行程序"}
  ],
  ling:[

{ id:"d5", t:"对话：约周末走山脊线", lv:"B2", scene:"对话", wpm:160,
  s:[

    "How long is it? I have not done anything that steep since the spring.",
    "Five hours, maybe six with stops. The first hour is the worst, then it flattens out.",
    "Six is a lot. Can we start early enough to be down before dark?",
    "If we leave at seven, we should be at the top by noon and back by four.",
    "Alright, but I am bringing the slow friend, so add an hour and do not pretend you were not warned."
  ],
  cn:"——我在想周六去走那条山脊线，如果天气预报靠谱的话。\n——多长？我从春天起就没走过那么陡的了。\n——五小时，加上休息也许六小时。第一个小时最难，之后路就平了。\n——六小时不短。我们能早到天黑前下山吗？\n——七点出发的话，中午前后到顶，四点能回来。\n——行，不过我要带上那个走得慢的朋友，所以再加一小时，别装作我没提醒过你。",
  notes:[
    {w:"if the forecast holds", n:"hold 在此为「（预报）站得住、不变」"},
    {w:"flattens out", n:"「变平缓」，形容地形与曲线都能用"},
    {w:"do not pretend you were not warned", n:"口语反问式提醒，语气带调侃"}
  ],
  ling:[
    {a:"we could do the", p:"/wi kəd duː ðə/", t:"弱读"},
    {a:"flattens out", p:"/ˈflætnz aʊt/", t:"连读"},
    {a:"at the top", p:"/ət ðə tɒp/", t:"弱读"},
    {a:"bringing the slow", p:"/ˈbrɪŋɪŋ ðə sləʊ/", t:"连读"}

  qs:[

    "The other rooms are warm, though. That is why I think it is this one.",
    "Fair enough. I will send someone on Thursday between nine and eleven. Can someone be in?",
    "I have a seminar until ten, but my flatmate is home all morning.",
    "Good. If it turns out to be the valve, it is a quick job. If the pipe is blocked, they may need to come back with parts.",
    "As long as it is sorted before the weekend, I am happy."
  ],
  cn:"——小卧室的暖气片从上周中就一直不热，气温在降，我不太想等到它彻底坏掉。\n——我不知道这事。整栋楼的供暖是定时控制的，所以可能不是暖气片本身的问题。\n——但其他房间都是热的，所以我觉得就是这一个。\n——有道理。我周四九点到十一点之间派人过去。家里有人吗？\n——我十点前有研讨课，但我室友整个上午都在。\n——好。如果只是阀门的问题，很快就好；要是管道堵了，他们可能得回去拿配件再来。\n——只要周末前弄好，我就满意了。",
  notes:[
    {w:"I would rather not wait", n:"would rather + 动词原形，表委婉的意愿"},
    {w:"Fair enough", n:"口语表「有道理、可以接受」"},
    {w:"be in", n:"英式口语「在家、在屋里」"},
    {w:"As long as it is sorted", n:"as long as 表条件；sort 口语指「解决」"}
  ],
  ling:[

    {a:"turns out to be", p:"/tɜːnz aʊt tə bi/", t:"连读"},

{ id:"a1", t:"讲座：我们为什么会忘事", lv:"B1", scene:"学术", wpm:140,
  s:[
    "Most of what you forget, you never really stored.",
    "Attention is the gate. If you were not paying attention when something happened, there is nothing to lose later.",
    "What does get in does not sit still. Memories are rebuilt each time you use them, and small details drift.",
    "This is why two people can remember the same evening differently and both be honest.",
    "So forgetting is not a fault in the system. It is part of how the system stays useful."
  ],
  cn:"你忘掉的大部分东西，其实从来没有真正存进去。注意力就是那道门：事情发生时你没在注意，之后也就没什么可丢的。真正进去了的内容也不会原封不动：每次调用记忆都是重建，细节会漂移。这就是为什么两个人对同一个晚上记忆不同，却都很诚实。所以遗忘不是系统的故障，而是系统保持有用的方式之一。",
  notes:[
    {w:"What does get in", n:"does 在此表强调，「确实进去了的」"},
    {w:"sit still", n:"本义「静止不动」，此处比喻记忆不稳定"},
    {w:"a fault in the system", n:"fault 指故障、缺陷，与 mistake 不同"}
  ],
  ling:[
    {a:"what you forget", p:"/wɒtʃu fəˈɡet/", t:"弱读"},
    {a:"get in does not", p:"/ɡet ɪn dʌz nɒt/", t:"连读"},
    {a:"part of how", p:"/pɑːt əv haʊ/", t:"连读"}
  ],
  qs:[
    {q:"讲者对遗忘的主要解释？", o:["多数内容从未存入","大脑容量不足","年龄导致"], a:0},
    {q:"记忆被使用时会怎样？", o:["原样保存","被重建、细节漂移","自动删除"], a:1},
    {q:"两个人记忆不同说明什么？", o:["有人说谎","记忆重建导致差异，都可信","记忆不存在"], a:1}
  ]},
{ id:"a2", t:"讲座：课堂笔记该怎么记", lv:"A2", scene:"学术", wpm:120,
  s:[
    "Today I want to talk about notes, and why most of us take them badly.",
    "The usual habit is to write down what the speaker says, word by word.",
    "That feels productive, but it uses the same attention you need for thinking.",
    "A better pattern is to leave space on the page and fill it in afterwards.",
    "The gap forces you to decide what mattered, and that decision is the learning."

{ id:"a3", t:"讲座：语言如何影响注意", lv:"B1", scene:"学术", wpm:140,
  s:[
    "Languages differ in how they divide colour, and this shows up in small experiments.",
    "Speakers of a language with two words for blue are faster at telling those two shades apart than speakers who use one word.",
    "The effect is not permanent. It appears when the task is quick, and it disappears when there is time to think.",
    "So the claim is not that your language stops you seeing something.",
    "It is that your language makes some distinctions cheap and others expensive."
  ],
  cn:"各种语言对颜色的切分方式不同，这一点会在小型实验里显现。一种语言若有两个表示蓝的词，其使用者分辨这两种色调的速度，会比只有一个词的使用者更快。这种效应并非永久：任务节奏快时它出现，有时间思考时它消失。所以结论并不是「你的语言让你看不见某样东西」，而是「你的语言让某些区分变得省力，让另一些变得费劲」。",
  notes:[
    {w:"shows up in", n:"show up 表「显现、看得出来」"},
    {w:"telling those two shades apart", n:"tell A and B apart 分辨；shade 指色调"},
    {w:"cheap and others expensive", n:"此处用「便宜/昂贵」比喻认知成本"}
  ],
  ling:[
    {a:"shows up in", p:"/ʃəʊz ʌp ɪn/", t:"连读"},
    {a:"telling those two", p:"/ˈtelɪŋ ðəʊz tuː/", t:"连读"},
    {a:"not that your", p:"/nɒt ðət jɔː/", t:"弱读"},
    {a:"cheap and others", p:"/tʃiːp ən ˈʌðəz/", t:"连读"}
  ],
  qs:[

    {q:"这种效应何时消失？", o:["任务变快时","有时间思考时","换语言时"], a:1},
    {q:"讲者的结论是？", o:["语言决定你看不见某些色","语言让某些区分更省力","颜色与语言无关"], a:1}
  ]},
{ id:"a4", t:"讲座：土壤里的微生物网络", lv:"C1", scene:"学术", wpm:180,
  s:[
    "A single teaspoon of healthy soil can hold more microorganisms than there are people on the planet, and until fairly recently we treated that community as a kind of background noise.",
    "What changed was our ability to sequence DNA directly from soil, without first growing anything in a dish.",
    "That matters, because the great majority of soil microbes will not grow under laboratory conditions at all.",
    "We now know that fungal threads can connect the roots of different plants, and that carbon and even warning signals move along them.",
    "How much this matters in a real field, as opposed to a greenhouse, is still argued about, which is exactly where the interesting work is."
  ],
  cn:"一茶匙健康土壤里的微生物数量，可以超过全球人口总数；而直到相当晚近，我们仍把这个群落当成某种背景噪音。转折点在于我们有能力不经培养、直接从土壤中测序 DNA。这一点很关键，因为绝大多数土壤微生物在实验室条件下根本培养不出来。现在我们知道，真菌菌丝可以连接不同植物的根系，碳元素乃至警示信号会沿这些菌丝移动。这套机制在真实农田里（而非温室里）到底有多重要，仍有争论——而这恰恰是有趣的研究所在。",
  notes:[
    {w:"background noise", n:"本义背景噪音，此处比喻被忽略的无关信息"},
    {w:"sequence DNA", n:"sequence 作动词，指测定序列"},
    {w:"at all", n:"否定句中强化语气，「根本（不）」"},
    {w:"as opposed to", n:"对比结构，「而不是」"}
  ],
  ling:[
    {a:"treated that community", p:"/ˈtriːtɪd ðət kəˈmjuːnəti/", t:"失爆"},
    {a:"great majority of", p:"/ɡreɪt məˈdʒɒrəti əv/", t:"连读"},
    {a:"at all", p:"/ət ɔːl/", t:"连读"},
    {a:"as opposed to", p:"/əz əˈpəʊzd tə/", t:"连读"}
  ],
  qs:[
    {q:"过去的做法把土壤微生物当成什么？", o:["关键资源","背景噪音","污染物"], a:1},
    {q:"真正的转折点是什么能力？", o:["显微镜升级","直接从土壤测序 DNA","人工培养"], a:1},
    {q:"菌丝网络的作用是？", o:["连接根系并输送碳与信号","只输送水分","隔绝植物"], a:0},
    {q:"讲者认为争议点在哪？", o:["实验室数据是否可靠","在真实农田中到底多重要","菌丝是否存在"], a:1}
  ]},
{ id:"a5", t:"讲座：排队为什么可预测", lv:"C1", scene:"学术", wpm:180,
  s:[
    "Queues look chaotic and are, in fact, quite predictable, as long as you are willing to talk about averages rather than individuals.",
    "The key quantity is not the average service time but its variability: two counters that each take four minutes on average behave very differently if one is steady and the other swings between one and seven.",
    "This is why a supermarket with a single line feeding several tills moves faster than several separate lines, even though the staff work just as hard.",
    "It is also why the last ten per cent of capacity is so expensive: as a system approaches full use, waiting times rise faster than any linear guess would suggest.",
    "The practical lesson is uncomfortable, because it means that a little spare capacity is not waste. It is what keeps the whole thing stable."
  ],
  cn:"排队看起来混乱，其实相当可预测，只要你愿意谈平均值而不是个体。关键量不是平均服务时长，而是它的波动性：两个柜台平均都花四分钟，但一个稳定、一个在一到七分钟之间摆动，两者的表现天差地别。这就是为什么「一条队排到多个收银台」的超市比「各自排一队」的超市流动更快，尽管员工干的活一样多。这也是为什么最后百分之十的产能如此昂贵：系统接近满负荷时，等待时间的上升快过任何线性估计。实用结论让人不舒服：一点闲置产能不是浪费，正是它让整体保持稳定。",
  notes:[
    {w:"as long as", n:"条件连词，「只要」"},
    {w:"swings between", n:"swing 表「在…之间大幅变动」"},
    {w:"the last ten per cent of capacity", n:"capacity 指运力、产能；per cent 后接 of 不加 s"},
    {w:"spare capacity", n:"闲置运力，运营与工程常用语"}
  ],
  ling:[
    {a:"look chaotic", p:"/lʊk keɪˈɒtɪk/", t:"连读"},
    {a:"as long as", p:"/əz lɒŋ əz/", t:"连读"},
    {a:"just as hard", p:"/dʒʌst əz hɑːd/", t:"弱读"},
    {a:"keeps the whole", p:"/kiːps ðə həʊl/", t:"连读"}
  ],
  qs:[
    {q:"判断排队表现的关键量是什么？", o:["平均服务时长","服务时长的波动性","人数"], a:1},
    {q:"单队服务多柜台为何更快？", o:["员工更努力","避免了某队空转、另一队积压","顾客更守规矩"], a:1},
    {q:"系统接近满负荷时？", o:["等待时间线性上升","等待时间上升快于线性","等待时间下降"], a:1},

  ]},

{ id:"m4", t:"复盘会：为什么延期三周", lv:"B2", scene:"职场", wpm:160,

    "Each round was reasonable on its own, but nobody added up the waiting time between them.",
    "We also discovered, late, that the old data could not be migrated without a manual check of a few thousand records.",
    "For next time, I would put a fixed decision date on design, and a small test migration in week one, not week six."
  ],
  cn:"我们坦白说说为什么晚了三周交付，因为我们跟客户讲的那套并不是全部。时间表假设设计一轮就能签核，实际用了四轮。每一轮单看都合理，但没人把中间等待的时间加起来。我们还发现得太晚：旧数据不做几千条记录的人工核对，就没法迁移。下次我会给设计定一个固定的决策日，并在第一周（而不是第六周）做一次小规模试迁移。",
  notes:[

  ling:[

  qs:[

{ id:"m5", t:"客户电话：交付延迟投诉", lv:"C1", scene:"职场", wpm:180,

    "That is the second time this year. The first delay cost us a weekend of overtime, and I have had to explain it to my own management.",
    "I understand. What I can do today is send six units from our local stock by courier for tomorrow morning, and the rest will follow once the shipment clears.",
    "Six covers the urgent line, not the whole order. When exactly will the rest arrive?",
    "I will know by Monday, and I will call you before noon whether or not I have a date."
  ],
  cn:"我打电话是因为我们被告知替换件周一就到，现在都周四了，既没货也没解释。您说得对，我道歉。这批货被卡在边境，因为单据上有个海关编码填错了。这是今年第二次了。上次延误让我们周末加班，我还得向自己的管理层解释。我理解。我今天能做的是从本地库存调六台，用快递明天上午送到，其余的等货物清关后跟上。六台只够紧急产线，不是整单。剩下的到底什么时候到？我周一会知道，而且不管有没有确切日期，我都会在中午前给您打电话。",
  notes:[
    {w:"held at the border", n:"hold 表「扣留、滞留」"},
    {w:"the shipment clears", n:"clear 指清关，customs clearance 的名词形式"},
    {w:"covers the urgent line", n:"cover 表「足够应付」；line 指产线"},
    {w:"whether or not I have a date", n:"让步状语，「不管有没有结果」"}

  ling:[

    {a:"held at the border", p:"/held ət ðə ˈbɔːdə/", t:"连读"},
    {a:"cost us a weekend", p:"/kɒst əs ə ˈwiːkend/", t:"连读"},

  ]},
{ id:"m6", t:"预算评审：砍掉哪个功能", lv:"C1", scene:"职场", wpm:180,
  s:[
    "If we keep everything on this list, we are asking for forty per cent more than we were given, so something has to go.",
    "The export tool is the obvious candidate: it is used by a small group, and there is a manual workaround that takes ten minutes.",
    "I would push back on that. The small group is our three biggest accounts, and ten minutes each time adds up to a day a month for them.",
    "Fair. Then we defer the redesign of the settings page instead. Nobody has complained about it, and it can wait a quarter.",
    "That leaves the budget almost balanced, with about five per cent spare for the things we always forget to cost."
  ],
  cn:"如果清单上的全留，我们要的比批下来的多四成，所以必须有东西被砍。导出工具是最明显的候选：用它的人少，而且有个手动替代办法，花十分钟。这一点我要反驳：人少的那群正是我们三个最大的客户，每次十分钟，对他们来说一个月就累计成一天。有道理。那就把设置页改版往后推。没人抱怨过它，可以等一个季度。这样预算基本平衡，还能留约百分之五应付那些我们总是忘了计价的琐事。",
  notes:[

    /* v25：口音筛选补齐；老数据没有这个键时回落全部 */
    DB.bgAcc = bgAccNorm(DB.bgAcc);
    DB.bgAccTs = Number(DB.bgAccTs) || 0;
    /* v27：睡前档位与开关补齐；老数据没有这两个键时给 15 分钟 + 自动收尾开 */
    DB.bgSleepMins = bgSleepMinsNorm(DB.bgSleepMins);
    DB.bgSleepAuto = bgSleepAutoNorm(DB.bgSleepAuto);
    DB.bgSleepTs = Number(DB.bgSleepTs) || 0;
    /* 主文件被清但镜像键还在时，把自定义词捞回来，避免一次误清就让所有生词消失 */
    try{ if(typeof myRestore==="function") myRestore(); }catch(e){}
    /* 把自定义词并进 VOCAB / VOCAB_BY_W：词网详情、检索、复习队列、四向计数、掌握度全部同权 */
    try{ if(typeof mySync==="function") mySync(); }catch(e){}
    if(!DB.start){ DB.start = dk(); saveDB(); }
  }catch(e){}
}
function saveDB(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){ toast("保存失败：浏览器禁用了本地存储"); } }

/* v23：背景听断点合并——工作听/睡前听各取「日期较新」的一侧；同一天取段号较大的（听过的不回退） */
function bgProgMerge(a, b){
  var base = (a && typeof a==="object" && !(a instanceof Array)) ? a : {};
  var add  = (b && typeof b==="object" && !(b instanceof Array)) ? b : {};
  var out = { work:{ idx:0, d:"" }, sleep:{ idx:0, d:"" } }, m, x, y, dx, dy;
  /* v25：断点里带上口音集合标识；恢复时集合若已变要按取模兜底，不能直接沿用旧段号 */
  function pc(o){ return { idx:(o.idx|0), d:String(o.d||""), acc:bgAccNorm(o.acc) }; }
  for(m in out){
    x = base[m] || null; y = add[m] || null;
    if(!x && !y) continue;
    if(!x){ out[m] = pc(y); continue; }
    if(!y){ out[m] = pc(x); continue; }
    dx = String(x.d||""); dy = String(y.d||"");
    if(dy > dx) out[m] = pc(y);
    else if(dx > dy) out[m] = pc(x);
    else out[m] = { idx:Math.max(x.idx|0, y.idx|0), d:dx, acc:bgAccNorm(x.acc||y.acc) };
  }
  return out;
}

/* ===== v24：有效门槛（秒）与没听清标记的规范化 / 合并 =====
   门槛只允许三档 600/1200/1800，其余一律回落默认值——
   旧快照、手改 localStorage、导入的脏数据都不能把判定逻辑改成玄学 */
var BG_GOAL_DEF = 600;
var BG_GOALS = [600, 1200, 1800];

/* ===== v27：睡前听时长档位与自动收尾开关 =====
   档位只允许 10/15/20/30 四档，默认 15；开关只认 0/1，默认 1（到点收尾）。
   与门槛一样做白名单式规范化：手改 localStorage、导入脏数据、旧快照都不会让设置变成别的样子 */
var BG_SLEEP_MINS = [10, 15, 20, 30];
var BG_SLEEP_MINS_DEF = 15;
function bgSleepMinsNorm(v){
  var n = Number(v) | 0;
  return (BG_SLEEP_MINS.indexOf(n) >= 0) ? n : BG_SLEEP_MINS_DEF;
}
function bgSleepAutoNorm(v){
  if(v === 0 || v === "0" || v === false) return 0;
  if(v === 1 || v === "1" || v === true) return 1;
  return 1;                                  /* 默认开着：到点收尾，不留一整夜的声音 */
}
function bgSleepAutoOn(){ return bgSleepAutoNorm(DB.bgSleepAuto) === 1; }
/* 合并：按时间戳取较新的一侧；两侧时间戳都没有时保留本机（a 侧），不因旧数据把设置改回去 */
function bgSleepPick(ta, va, tb, vb){
  var TA = Number(ta) || 0, TB = Number(tb) || 0;
  var A = { mins: bgSleepMinsNorm(va && va.mins), auto: bgSleepAutoNorm(va && va.auto) };
  var B = { mins: bgSleepMinsNorm(vb && vb.mins), auto: bgSleepAutoNorm(vb && vb.auto) };
  if(TA === TB) return { v: A, ts: TA };
  return (TA > TB) ? { v: A, ts: TA } : { v: B, ts: TB };
}
var BG_MARK_MAX = 200;
function bgGoalNorm(v){
  var n = Number(v);
  if(n === 600 || n === 1200 || n === 1800) return n;
  return BG_GOAL_DEF;
}
function bgGoalMinText(){ return (bgGoalNorm(DB.bgGoal) / 60) + " 分钟"; }
/* 一条标记：{ id, t:段标题, mode:work/sleep, idx:段号或轮次, d:日期, tm:时刻, ts:毫秒 } */
function bgMarkDef(x, i){
  if(!x || typeof x!=="object") return null;
  var o = {
    id: String(x.id || ("m" + (Number(x.ts)||0) + "_" + (i|0) + "_" + (x.idx|0))),
    t: String(x.t || "未命名段"),
    mode: (x.mode === "sleep") ? "sleep" : "work",
    idx: (x.idx | 0),
    d: String(x.d || ""),
    tm: String(x.tm || ""),
    ts: Number(x.ts) || 0
  };
  if(o.idx < 0) o.idx = 0;
  return o;
}
function bgMarkNormArr(a){
  var out = [], seen = {}, i, o;
  if(!(a instanceof Array)) return out;
  for(i = 0; i < a.length; i++){
    o = bgMarkDef(a[i], i);
    if(!o) continue;
    if(seen[o.id]) continue;
    seen[o.id] = 1;
    out.push(o);
  }
  /* 一律时间倒序（新在前）：这样「超出上限就淘汰」淘汰的必然是最旧的那条，
     不依赖数组原本是按什么顺序存进来的 */
  out.sort(function(x, y){ return ((y.ts | 0) - (x.ts | 0)); });
  if(out.length > BG_MARK_MAX) out.length = BG_MARK_MAX;   /* 上限 200 条，超出淘汰最旧 */
  return out;
}
/* 按 id 去重合并，时间倒序，最多 200 条 */
function bgMarkMerge(a, b){
  var x = bgMarkNormArr(a), y = bgMarkNormArr(b), seen = {}, out = [], i;
  for(i = 0; i < x.length; i++){ if(!seen[x[i].id]){ seen[x[i].id] = 1; out.push(x[i]); } }
  for(i = 0; i < y.length; i++){ if(!seen[y[i].id]){ seen[y[i].id] = 1; out.push(y[i]); } }
  out.sort(function(p2, q2){ return (q2.ts|0) - (p2.ts|0); });
  return out.slice(0, BG_MARK_MAX);
}

function todayRec(){
  var k=dk();
  if(!DB.days[k]) DB.days[k]={ m:{}, sec:0, p:[] };
  if(!DB.days[k].p) DB.days[k].p=[];

}
function touch(kind, n){ var t=todayRec(); t.m[kind]=(t.m[kind]||0)+(n===undefined?1:n); saveDB(); }
/* v16：addSec(n, kind) —— kind 为 listen/read/view/say/write 时，同一笔时长同时记进当天分步骤账本 t.sx，
   让「每周复盘」能拿到真实的分钟数；不传 kind 的旧调用照旧只加总时长。 */
function addSec(n, kind){
  var t=todayRec(), s=Math.max(0, Math.round(n||0));
  t.sec+=s;
  if(kind){ if(!t.sx) t.sx={}; t.sx[kind]=(t.sx[kind]||0)+s; }
  saveDB();
}

var IVS=[0,1,2,4,7,15,30,60];

  if(q<=0){ s.lv=0; }
  else if(q===1){ s.lv=Math.max(1,s.lv|0); }
  else { s.lv=Math.min(IVS.length-1,(s.lv|0)+1); if(q===3) s.ok=(s.ok||0)+1; }
  s.iv=IVS[s.lv]; s.due=addDays(s.iv); s.last=dk();
  DB.srs[w]=s; saveDB(); return s;
}

/* --- 在线语音（无需本机英文语音包） ---
   音频用 <audio> 直连第三方合成接口播放：不需要 CORS，只要求请求不带 Referer
   （文档级 referrer 策略已在 head 设为 no-referrer）。
   单词/短语走有道词典发音，整句走百度翻译发音；任一路失败自动换另一路。 */
/* --- 离线语音包：词库发音预生成，下载一次存进 IndexedDB，之后完全断网也能读 ---
   优先级：本地离线包 > 在线合成 > 系统语音。离线包只覆盖词库单词，句子/文章仍需联网。 */
var OFF = { map:{}, state:"none", busy:false, count:0, idb:null };
function offIdb(){
  return new Promise(function(res,rej){
    if(OFF.idb) return res(OFF.idb);
    if(!window.indexedDB) return rej(new Error("浏览器不支持 IndexedDB"));
    var r;
    try{ r=indexedDB.open("englab_voice",1); }catch(e){ return rej(e); }
    r.onupgradeneeded=function(){ try{ r.result.createObjectStore("kv"); }catch(e){} };
    r.onsuccess=function(){ OFF.idb=r.result; res(r.result); };
    r.onerror=function(){ rej(r.error); };
  });
}
function offIdbOp(mode, fn){
  return offIdb().then(function(db){
    return new Promise(function(res,rej){
      var q;
      try{
        var t=db.transaction("kv",mode), st=t.objectStore("kv");
        q=fn(st);
        t.oncomplete=function(){ res(q?q.result:null); };
        t.onerror=function(){ rej(t.error); };
        t.onabort=function(){ rej(t.error); };
      }catch(e){ rej(e); }
    });
  });
}
function offIdbGet(k){ return offIdbOp("readonly", function(st){ return st.get(k); }); }
function offIdbPut(k,v){ return offIdbOp("readwrite", function(st){ return st.put(v,k); }); }
function offIdbDel(k){ return offIdbOp("readwrite", function(st){ return st.delete(k); }); }
function offLoad(){
  return offIdbGet("pack").then(function(v){
    if(v && v.d && typeof v.d==="object" && Object.keys(v.d).length){
      OFF.map=v.d; OFF.count=v.count||Object.keys(v.d).length; OFF.state="ready";
    }else{ OFF.map={}; OFF.count=0; OFF.state="none"; }
    offPaint();
  }).catch(function(){ OFF.state="none"; offPaint(); });
}
function offKey(t){
  return String(t==null?"":t).trim().toLowerCase().replace(/^[^a-z']+|[^a-z']+$/g,"");
}
function offSrc(t){
  if(OFF.state!=="ready") return null;
  var k=offKey(t);
  if(!k) return null;
  var b=OFF.map[k];
  return b? ("data:audio/mpeg;base64,"+b) : null;
}
function vocabUniq(){

  for(i=0;i<VOCAB.length;i++){ w=String(VOCAB[i]&&VOCAB[i].w||"").toLowerCase().trim(); if(w) s[w]=1; }
  return Object.keys(s).length;
}
function offInstall(){
  if(OFF.busy) return;

    if(!j || !j.d || !Object.keys(j.d).length) throw new Error("语音包内容异常");
    return offIdbPut("pack", { v:j.v||1, ts:Date.now(), count:j.count||0, d:j.d }).then(function(){
      OFF.map=j.d; OFF.count=j.count||Object.keys(j.d).length; OFF.state="ready";

/* --- 屏幕常亮：安卓息屏后浏览器会挂起 JS，朗读链会断 --- */
/* 持有者登记：朗读(speak)每一句持一份，背景听(bg)整段会话持一份。

var SCREEN = { lock:null, on:false, holds:{}, err:0, trying:0, gen:0 };

      l.addEventListener("release", function(){
        SCREEN.lock=null; SCREEN.on=false;

  if(SCREEN.on) return "屏幕常亮已开启：播放期间不会自动息屏";

   所以把「谁在占用锁屏」显式分成两个作用域：
     read —— 精听、词卡、听写里的逐句朗读（pause/stop 仍然只是停朗读）

    set("nexttrack", function(){ bgNextSeg(); });

    set("pause", function(){ stopSpeak(); });
    set("stop", function(){ stopSpeak(); });
    set("previoustrack", null);
    set("nexttrack", null);

    set("play", null);
    set("pause", null);
    set("stop", null);

/* --- 朗读守护：看门狗 + 息屏/切后台打断后的续播 ---

   整条播放链就静默卡死——用户回到页面只看到"停在原地"，也没有任何提示。
   这里补三件事：
   ①看门狗：每次朗读前按词数与实际语速估算预期时长（×2.5 + 3 秒），
     到时既没 onend 也没 error 就判中断，不进入无限等待；
   ②隐藏即冻结：页面被切走/息屏时记下当前句索引并停掉朗读，不让回调继续推进；

  if(!g) return true;

function spkInterrupt(reason){

/* --- 恢复条 --- */
function rbHost(){

function rbText(kind, idx, total){

/* --- 播放会话：逐句串起来放，才知道"现在放到第几句" --- */
function spSeqStop(){

  SPK.seq=null;
  spkDisarm();
  wakeOff("seq");
  /* 会话收掉时当前这句也要真的停掉：否则 speech 还占着一把常亮、也还在念 */
  try{ stopSpeak(); }catch(e){}
  rbHide();

function spSeqStart(items, opt){
  opt=opt||{};
  var list=[], i, t;
  for(i=0;i<(items||[]).length;i++){ t=String(items[i]==null?"":items[i]).trim(); if(t) list.push(t); }
  if(!list.length){ toast("没有可朗读的内容"); return null; }
  spSeqStop();
  var s={ items:list, i:(opt.from|0)||0, rate:opt.rate, gap:(opt.gap==null? 260 : opt.gap),
          kind:opt.kind||"speak", done:false, frozen:0, doneCb:opt.done||null, okCount:0, failed:0 };
  if(s.i<0) s.i=0;
  if(s.i>list.length-1) s.i=0;

  wakeOn("seq");     /* 会话级常亮：句间停顿也不让设备睡过去 */

function spSeqNext(){
  var s=SPK.seq;

  if(s.i>=s.items.length){
    s.done=true;
    wakeOff("seq");
    rbHide();

  var txt=s.items[s.i], r=(typeof s.rate==="function")? s.rate() : s.rate;

/* --- 可见性：隐藏判打断、可见给恢复条 --- */

/* 精听计时：扣掉息屏/切后台的时长，回到前台才继续算 */

function ttsChunks(t){
  t=String(t==null?"":t).replace(/\s+/g," ").trim();
  if(t.length<=110) return t?[t]:[];
  var parts=t.match(/[^.!?;:,]+[.!?;:,]*\s*/g)||[t], out=[], buf="";
  for(var i=0;i<parts.length;i++){
    if((buf+parts[i]).length>110 && buf){ out.push(buf.trim()); buf=parts[i]; }
    else buf+=parts[i];
  }
  if(buf.trim()) out.push(buf.trim());
  return out;
}
/* ================= P1-2 整句朗读按需缓存（IndexedDB） =================
   在线合成成功一次，就把音频字节存本地；下次同样的 文本 + 音色 + 口音 + 语速 直接本地播放，断网也能复读。
   只缓存句子级（≥12 字符且不是单词/短词组）：单词仍走离线语音包与神经音色，不重复占空间。

var TTC = { db:null, ready:false, busy:false, warm:0, size:0, map:{}, urls:{}, hit:0, blocked:0,

function ttcHash(s){
  var h=2166136261, i; s=String(s==null?"":s);
  for(i=0;i<s.length;i++){ h=h^s.charCodeAt(i); h=(h*16777619)>>>0; }
  return h.toString(36);

function ttcTag(){ return String(DB.voice||"auto")+"|"+(DB.acc==="uk"?"uk":"us"); }
function ttcKey(text, rate){
  return ttcHash(String(text==null?"":text).trim())+"~"+ttcHash(ttcTag())+"~"+Math.round((rate||DB.rate||0.92)*100);
}
function ttcEligible(text){
  var t=String(text==null?"":text).trim();
  if(t.length<TTC.MINLEN) return false;
  try{ if(isShortTerm(t)) return false; }catch(e){}
  return true;
}
function ttcOpen(){
  return new Promise(function(res,rej){
    if(TTC.db) return res(TTC.db);
    if(!window.indexedDB) return rej(new Error("no idb"));
    var r;
    try{ r=indexedDB.open("englab_tts",1); }catch(e){ return rej(e); }
    r.onupgradeneeded=function(){ try{ r.result.createObjectStore("kv"); }catch(e){} };
    r.onsuccess=function(){ TTC.db=r.result; res(r.result); };
    r.onerror=function(){ rej(r.error||new Error("idb")); };
  });

function ttcOp(mode, fn){
  return ttcOpen().then(function(db){
    return new Promise(function(res,rej){
      var q;
      try{
        var t=db.transaction("kv",mode), st=t.objectStore("kv");
        q=fn(st);
        t.oncomplete=function(){ res(q?q.result:null); };
        t.onerror=function(){ rej(t.error||new Error("idb")); };
        t.onabort=function(){ rej(t.error||new Error("idb")); };
      }catch(e){ rej(e); }
    });
  });

function ttcMetaSave(){
  try{ ttcOp("readwrite", function(st){ return st.put({ size:TTC.size, map:TTC.map }, "meta"); }).catch(function(){}); }catch(e){}
}
function ttcLoad(){
  if(TTC.ready) return Promise.resolve(TTC);
  return ttcOp("readonly", function(st){ return st.get("meta"); }).then(function(v){
    if(v && typeof v==="object"){
      TTC.map = v.map || {};
      TTC.size = v.size || 0;
    }

    return TTC;
  }).catch(function(){ TTC.ready=true; return TTC; });

function ttcCount(){ return Object.keys(TTC.map||{}).length; }
function ttcBytes(n){
  n=n||0;
  if(n<1024) return n+" B";
  if(n<1048576) return (n/1024).toFixed(1)+" KB";
  return (n/1048576).toFixed(1)+" MB";

function ttcHuman(){ return ttcBytes(TTC.size); }
function ttcEvict(need){
  var ks=Object.keys(TTC.map||{}), arr=[], i;
  for(i=0;i<ks.length;i++) arr.push({ k:ks[i], ts:TTC.map[ks[i]].ts||0, sz:TTC.map[ks[i]].sz||0 });
  arr.sort(function(a,b){ return a.ts-b.ts; });   /* 最久没用的先淘汰 */
  while(arr.length && (TTC.size+need>TTC.MAXB || arr.length>=TTC.MAXN)){
    var it=arr.shift(), key=it.k;
    TTC.size=Math.max(0, TTC.size-(it.sz||0));
    if(TTC.map[key]) delete TTC.map[key];
    try{ ttcOp("readwrite", function(st){ return st.delete("c:"+key); }).catch(function(){}); }catch(e){}
  }

function ttcGet(text, rate){
  if(!ttcEligible(text)) return Promise.resolve(null);
  var k=ttcKey(text, rate);

    if(!TTC.map[k]) return null;
    return ttcOp("readonly", function(st){ return st.get("c:"+k); });
  }).then(function(rec){
    if(!rec || !rec.b) return null;
    TTC.map[k]={ sz:rec.sz||0, ts:Date.now() };   /* 命中即刷新 LRU 时间 */
    ttcMetaSave();
    return rec.b;
  }).catch(function(){ return null; });

function ttcPut(text, rate, blob){

    ttcEvict(sz);
    TTC.map[k]={ sz:sz, ts:Date.now() };

function netNet(chunks, idx, rate, done){
  if(idx>=chunks.length){ done&&done(true); return; }
  var cur=chunks[idx];
  if(!ttcEligible(cur)){ netNetUrl(chunks, idx, rate, done); return; }
  ttcGet(cur, rate).then(function(blob){
    if(!blob){ netNetUrl(chunks, idx, rate, done); return; }
    var u=ttcBlobUrl(ttcKey(cur, rate), blob);
    if(!u){ netNetUrl(chunks, idx, rate, done); return; }
    netPlayOne(u, rate, function(ok){
      if(ok){ ttcHintHit(); netSeq(chunks, idx+1, rate, done); }
      else netNetUrl(chunks, idx, rate, done);

  }).catch(function(){ netNetUrl(chunks, idx, rate, done); });

    if(k>=urls.length){ done&&done(false); return; }
    var u=urls[k++];
    netPlayOne(u, rate, function(ok){
      if(ok){ ttcTapStore(cur, rate, u); netSeq(chunks, idx+1, rate, done); }
      else tryUrl();

}

function lcsLen(a,b){
  var n=a.length, m=b.length, i, j;
  var prev=new Array(m+1), cur=new Array(m+1);
  for(j=0;j<=m;j++) prev[j]=0;
  for(i=1;i<=n;i++){
    cur[0]=0;
    for(j=1;j<=m;j++){
      cur[j] = a[i-1]===b[j-1] ? prev[j-1]+1 : Math.max(prev[j], cur[j-1]);
    }
    var tmp=prev; prev=cur; cur=tmp;
  }
  return prev[m];
}
function scoreSpeak(target, said){
  var a=normWords(target), b=normWords(said);
  if(!a.length) return { score:0, hit:0, miss:0, extra:b.length, mark:[] };
  var hit=lcsLen(a,b);
  var score=Math.round(hit/a.length*100);
  var mark=[], used=0;
  var pool=b.slice();
  for(var i=0;i<a.length;i++){
    var idx=pool.indexOf(a[i]);
    if(idx>=0){ mark.push({ w:a[i], ok:true }); pool.splice(idx,1); used++; }
    else mark.push({ w:a[i], ok:false });
  }
  var extra=0;
  for(var k=0;k<DB_SAID_EXTRA_LEN(b,a);k++) extra++;
  return { score:score, hit:used, miss:a.length-used, extra:Math.max(0,b.length-used), mark:mark };
