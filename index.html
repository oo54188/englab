<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBFBF8">
<!-- 在线朗读音频由第三方合成，请求不能带 Referer（带上会被源站拒绝返回空音频） -->
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<meta name="apple-mobile-web-app-title" content="EngLab">
<meta name="application-name" content="EngLab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>EngLab · 听 · 说 · 读 · 写 · 看 · 译</title>
<style>
:root{
  --green:#5C8A4E; --green-d:#436B37; --green-l:#F0F6EB; --green-l2:#E1EEDA;
  --ink:#141A11; --ink2:#4E5A48; --muted:#8C9587; --line:#EBEDE7; --line2:#F3F4F0;
  --bg:#FBFBF8; --card:#FFFFFF;
  --red:#C9584F; --red-l:#FBEEEC; --amber:#C08A22; --amber-l:#FCF6E8; --blue:#4A7DA6; --blue-l:#EEF4F9;
  --r:20px; --r2:14px;
  --sh:0 1px 1px rgba(20,26,17,.03), 0 8px 24px -8px rgba(20,26,17,.10);
  --sh2:0 1px 2px rgba(20,26,17,.04);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.62;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  letter-spacing:.1px;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--green-l2)}
.app{max-width:1180px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ===== 顶栏：极简无边框 ===== */
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:14px 20px 10px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:rgba(251,251,248,.86);backdrop-filter:saturate(180%) blur(16px);
}
.spacer{flex:1}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:17px;letter-spacing:-.2px}
.logo{
  width:28px;height:28px;border-radius:10px;background:var(--green);display:grid;place-items:center;
  color:#fff;font-size:13px;font-weight:800;box-shadow:0 4px 10px -3px rgba(92,138,78,.5);
}
.brand small{display:block;font-size:9px;letter-spacing:1.1px;color:var(--muted);font-weight:700;margin-top:-2px}
.chip{
  display:inline-flex;align-items:center;gap:4px;background:var(--green-l);color:var(--green-d);
  border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;letter-spacing:.2px;
}
.chip.warn{background:var(--amber-l);color:#8A6412}
.chip.plain{background:#F2F3EF;color:var(--ink2)}
.chip.act{background:#fff;border:1px solid var(--line);color:var(--ink);cursor:pointer;padding:7px 13px;font-size:12px;font-weight:700;transition:.16s}
.chip.act:active{transform:scale(.97);background:var(--green-l);border-color:var(--green)}

/* ===== 主体 ===== */
main{flex:1;padding:6px 18px 104px;padding-bottom:calc(104px + var(--safe-b))}
.view{display:none}
.view.on{display:block;animation:fade .26s cubic-bezier(.2,.7,.3,1)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 底部标签：悬浮胶囊 ===== */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:2px;
  background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--line2);
  padding:7px 8px calc(7px + var(--safe-b));
}
.tabbar .tab{
  flex:1;border:0;background:none;padding:6px 2px 4px;border-radius:14px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:#79837A;font-size:11px;font-weight:750;
  transition:color .18s,background .18s;letter-spacing:.3px;
}
.tabbar .tab .ic{width:24px;height:24px;display:grid;place-items:center;border-radius:9px;transition:background .18s}
.tabbar .tab .ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.tabbar .tab.on{color:var(--green-d)}
.tabbar .tab.on .ic{background:var(--green-l)}
.tabbar .tab.on .ic svg{stroke-width:1.9}
@media(min-width:768px){
  .tabbar{position:sticky;max-width:720px;margin:0 auto;width:calc(100% - 36px);border-radius:20px 20px 0 0;
    border:1px solid var(--line2);border-bottom:0;box-shadow:0 -6px 24px -14px rgba(20,26,17,.2)}
  main{max-width:720px;margin:0 auto;width:100%;padding:6px 0 92px}
  .topbar{max-width:720px;width:100%;margin:0 auto;padding-left:0;padding-right:0}
}

/* ===== 卡片 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh2);margin-bottom:14px}
.card.tight{padding:14px 15px}
.card.flat{box-shadow:none;background:#FCFCFA}
.card.edge{border-color:var(--line2);box-shadow:var(--sh)}
.hd{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.hd h3{margin:0;font-size:15.5px;font-weight:750;letter-spacing:-.15px}
.hd .sub{font-size:11.5px;color:var(--muted);font-weight:600}
.hd .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.h2{
  margin:24px 2px 10px;font-size:11.5px;font-weight:800;color:var(--muted);
  letter-spacing:1.1px;text-transform:uppercase;display:flex;align-items:center;gap:10px;
}
.h2 .ln{flex:1;height:1px;background:var(--line2)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:760px){
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
}

/* ===== Hero ===== */
.hero{
  padding:26px 4px 18px;
}
.hero .kicker{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--green);text-transform:uppercase}
.hero h1{margin:6px 0 4px;font-size:30px;line-height:1.16;font-weight:800;letter-spacing:-1px}
.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.ring{width:64px;height:64px;flex:none}
.ring text{font-size:13px;font-weight:800;fill:var(--ink);letter-spacing:-.4px}
.ring circle.track{stroke:var(--line);fill:none;stroke-width:5}
.ring circle.val{stroke:var(--green);fill:none;stroke-width:5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s}

/* ===== 按钮 ===== */
.btn{
  border:1px solid var(--green);background:var(--green);color:#fff;border-radius:var(--r2);
  padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s,opacity .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;letter-spacing:.2px;
}
.btn:active{transform:scale(.976)}
.btn.block{display:flex;width:100%}
.btn.sm{padding:7px 13px;font-size:12.5px;border-radius:11px}
.btn.gray{background:#fff;border-color:var(--line);color:var(--ink2)}
.btn.gray.on,.btn.ghost.on{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink2)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.dark{background:var(--ink);border-color:var(--ink)}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn.big{padding:16px 20px;font-size:15.5px;border-radius:16px;font-weight:750}

/* ===== 分段 ===== */
.seg{display:flex;gap:5px;overflow-x:auto;padding:3px;margin-bottom:10px;scrollbar-width:none;
  background:#F2F3EF;border-radius:14px}
.seg::-webkit-scrollbar{display:none}
.seg.wrap{flex-wrap:wrap;overflow:visible}
.seg button{
  flex:none;border:0;background:transparent;color:var(--ink2);
  padding:7px 14px;border-radius:11px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.16s;letter-spacing:.2px;
}
.seg button.on{background:#fff;color:var(--green-d);box-shadow:0 1px 3px rgba(20,26,17,.09)}

/* ===== 进度 ===== */
.bar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .45s cubic-bezier(.2,.7,.3,1)}
.bar.thin{height:4px}

/* ===== 统计 ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;text-align:center;background:var(--line2);
  border-radius:var(--r2);overflow:hidden;border:1px solid var(--line2)}
.stat{background:#fff;padding:12px 4px}
.stat b{display:block;font-size:20px;font-weight:800;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat span{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.2px}

/* ===== 任务行 ===== */
.todo{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.todo:last-child{border-bottom:0;padding-bottom:2px}
.todo .tick{
  width:21px;height:21px;flex:none;border-radius:50%;border:1.5px solid #D9DED3;display:grid;place-items:center;
  font-size:11px;color:transparent;background:#fff;transition:.2s;
}
.todo.done .tick{background:var(--green);border-color:var(--green);color:#fff}
.todo .tt{font-weight:700;font-size:14px}
.todo.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:#DCE1D5}
.todo .ts{font-size:11.5px;color:var(--muted)}
.todo .go{margin-left:auto;font-size:11.5px;color:var(--green-d);font-weight:800;background:var(--green-l);border-radius:9px;padding:4px 9px}

/* ===== 词卡 ===== */
.wcard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--sh)}
.wcard .w{font-size:31px;font-weight:800;letter-spacing:-.9px;line-height:1.14}
.wcard .ph{color:var(--muted);font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:3px}
.wcard .cn{font-size:15px;font-weight:700;color:var(--green-d);margin-top:8px}
.tag{display:inline-block;background:var(--green-l);color:var(--green-d);border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;margin:2px 4px 2px 0;letter-spacing:.2px}
.tag.b{background:var(--blue-l);color:#356A9B}
.tag.a{background:var(--amber-l);color:#8A6412}
.tag.r{background:var(--red-l);color:#A33C39}
.tag.g{background:#F2F3EF;color:var(--ink2)}
.ex{border-left:2px solid var(--green-l2);padding:2px 0 2px 12px;margin:10px 0;font-size:13.5px;line-height:1.7}
.ex em{font-style:normal;font-weight:800;color:var(--green-d);background:linear-gradient(transparent 64%,var(--green-l2) 0)}
.ex .cn2{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* ===== 联想网 ===== */
.web{position:relative;margin-top:8px;border-radius:18px;background:radial-gradient(circle at 50% 44%,var(--green-l) 0,rgba(255,255,255,0) 60%);min-height:250px}
.web svg{display:block;width:100%;height:auto;overflow:visible}
.web .node{cursor:pointer}
.web .node text{font-family:inherit;font-size:9.5px;font-weight:700;fill:var(--ink2)}
.web .node.core text{font-size:12.5px;fill:#fff}
.web .node.core circle{fill:var(--green)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* ===== 词条行 ===== */
.wrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.wrow:last-child{border-bottom:0}
.wrow .lw{font-weight:750;font-size:14.5px;min-width:78px;letter-spacing:-.2px}
.wrow .lc{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .lr{font-size:10.5px;color:var(--green-d);font-weight:800;background:var(--green-l);border-radius:7px;padding:2px 7px}

/* ===== 播放/录音 ===== */
.playbtn{
  width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--line);background:#fff;
  color:var(--green-d);cursor:pointer;display:grid;place-items:center;font-size:12px;transition:.16s;
}
.playbtn:active{transform:scale(.94)}
.playbtn.on{background:var(--green);border-color:var(--green);color:#fff}
.mic{
  width:100%;border:0;border-radius:18px;padding:17px;background:var(--green);color:#fff;font-weight:750;font-size:15px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 10px 24px -10px rgba(92,138,78,.7);letter-spacing:.4px;
}
.mic.rec{background:var(--red);box-shadow:0 10px 24px -10px rgba(201,88,79,.7);animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.84}}
.mic .dot{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.92}
.volk{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}

/* ===== 句子 ===== */
.sent{padding:12px 0;border-bottom:1px solid var(--line2)}
.sent:last-child{border-bottom:0}
.sent .en{font-size:15px;line-height:1.62;font-weight:600;letter-spacing:-.1px}
.sent .cn3{font-size:12px;color:var(--muted);margin-top:3px}
.sent .tool{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mini{
  border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:9px;padding:5px 10px;font-size:11.5px;
  font-weight:700;cursor:pointer;transition:.16s;
}
.mini.on{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.mini.red{color:var(--red);border-color:#F1DAD8}

/* ===== 反馈 ===== */
.fb{margin-top:10px;border-radius:14px;padding:12px 14px;font-size:13px;background:var(--green-l);color:#3B5A28;line-height:1.65}
.fb.bad{background:var(--red-l);color:#9C3835}
.fb.warn{background:var(--amber-l);color:#7A5A10}
.fb b{font-weight:800}
.opt{
  display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:8px;font-size:13.5px;cursor:pointer;font-weight:600;transition:.16s;
}
.opt.on{border-color:var(--green);background:var(--green-l)}
.opt.ok{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.opt.no{border-color:#EDC9C6;background:var(--red-l);color:#9C3835}

/* ===== 分数 ===== */
.big{font-size:42px;font-weight:800;line-height:1;letter-spacing:-1.6px;color:var(--ink);font-variant-numeric:tabular-nums}
.big small{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0}
.cmp{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;background:#fff}
.cmp .sc{font-size:26px;font-weight:800;color:var(--green-d);font-variant-numeric:tabular-nums}
.wordcmp{line-height:2.2;font-size:14px}
.wordcmp span{display:inline-block;padding:1px 5px;border-radius:6px;margin-right:3px}
.wordcmp .hit{background:var(--green-l);color:#33521F}
.wordcmp .miss{background:var(--red-l);color:#9C3835;text-decoration:line-through}
.wordcmp .extra{background:var(--amber-l);color:#7A5A10}

/* ===== 计时 ===== */
.timerbig{font-size:46px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums;color:var(--ink);text-align:center;line-height:1.05}
.pill{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:middle}
.pill.done{background:var(--green)}
.pill.cur{background:var(--green);box-shadow:0 0 0 3px var(--green-l2)}

/* ===== 表格 ===== */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:700;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase}
td.n{font-weight:800;color:var(--green-d)}

/* ===== 热力 ===== */
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:5px;background:#F2F3EF;display:block}
.heat i.l1{background:#DCEBCE}.heat i.l2{background:#B6D69A}.heat i.l3{background:var(--green)}

/* ===== 输入 ===== */
textarea,input[type=text]{
  width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;
  font-size:14px;line-height:1.65;resize:vertical;outline:none;transition:.16s;
}
textarea:focus,input[type=text]:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-l)}
label.fl{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin:0 0 6px;letter-spacing:.6px;text-transform:uppercase}

/* ===== 弹层 ===== */
.mask{position:fixed;inset:0;background:rgba(18,24,15,.38);z-index:60;display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(2px)}
.mask.on{display:flex}
.wtbar{height:7px;border-radius:99px;background:var(--line2);overflow:hidden;margin:10px 0 2px}
.wtbar i{display:block;height:100%;background:var(--green);transition:width .25s linear}
.wtq{font-size:19px;line-height:1.6;font-weight:800;letter-spacing:-.3px;margin:14px 0 12px}
.sheet{background:#fff;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + var(--safe-b));width:100%;max-width:560px;max-height:84vh;overflow:auto;animation:up .28s cubic-bezier(.2,.7,.3,1)}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 8px;font-size:17px;font-weight:800;letter-spacing:-.3px}
.toast{
  position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,10px);z-index:80;
  background:rgba(20,26,17,.94);color:#fff;padding:10px 16px;border-radius:13px;font-size:12.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .24s;max-width:82vw;text-align:center;letter-spacing:.2px;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hr{height:1px;background:var(--line2);margin:14px 0}
.linkrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2);text-decoration:none;color:inherit}
.linkrow:last-child{border-bottom:0}
.linkrow .lic{width:32px;height:32px;border-radius:11px;background:var(--green-l);color:var(--green-d);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.linkrow .lt{font-weight:700;font-size:13.5px}
.linkrow .ld{font-size:11px;color:var(--muted)}
.linkrow .la{margin-left:auto;color:#C6CCC0;font-size:15px}
.badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:9px;font-weight:800;border-radius:99px;padding:1px 5px}
.rel{position:relative}

/* ===== 新增：模块 17 听写 ===== */
.dictline{display:flex;align-items:center;gap:8px;margin-top:10px}
.dictbox{
  flex:1;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;font-size:15px;
  letter-spacing:.4px;outline:none;
}
.dictbox:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-l)}
.dictbox.ok{border-color:var(--green);background:var(--green-l)}
.dictbox.no{border-color:#EDC9C6;background:var(--red-l)}
.dictletter{display:inline-block;min-width:15px;border-bottom:1.5px solid #D6DCD0;margin:0 1px;text-align:center;color:var(--ink)}
.dictletter.gap{color:var(--red)}
.dictcount{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.4px}
.kbd{
  display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:7px;
  padding:1px 6px;font-size:11px;font-weight:700;color:var(--ink2);background:#FCFCFA;
}
.empty{padding:36px 10px;text-align:center;color:var(--muted);font-size:13px}

/* ===== 新增：模块 18 碎片 ===== */
.snackcard{
  border-radius:22px;padding:20px;background:linear-gradient(150deg,#F4F9EF 0%,#FDFDFB 62%);
  border:1px solid var(--line2);position:relative;overflow:hidden;
}
.snackcard:after{
  content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,rgba(92,138,78,.10),rgba(92,138,78,0) 70%);
}
.snacktile{
  display:flex;flex-direction:column;gap:4px;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:14px;cursor:pointer;transition:.18s;box-shadow:var(--sh2);
}
.snacktile:active{transform:scale(.985)}
.snacktile .st{font-size:14px;font-weight:750;letter-spacing:-.2px}
.snacktile .sd{font-size:11.5px;color:var(--muted);line-height:1.5}
.snacktile .sm{font-size:10.5px;font-weight:800;color:var(--green);letter-spacing:.8px;text-transform:uppercase}
.snacktile.hot{background:linear-gradient(160deg,#F6FBF1,#fff);border-color:#DDEBD2}
.snackprog{display:flex;gap:4px;margin-top:10px}
.snackprog i{flex:1;height:4px;border-radius:99px;background:#E6E9E2;display:block}
.snackprog i.on{background:var(--green)}
.snackprog i.cur{background:var(--green);box-shadow:0 0 0 2px var(--green-l2)}
.bigword{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.15;text-align:center;margin:10px 0 4px}
.snackans{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

/* ===== 新增：模块 19 交传/同传 ===== */
.interphead{display:flex;align-items:center;gap:12px}
.meter{display:flex;align-items:flex-end;gap:3px;height:34px}
.meter i{width:4px;border-radius:2px;background:var(--green-l2);display:block;transition:height .12s}
.meter.on i{background:var(--green)}
.cue{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;line-height:1.7;
  font-size:15.5px;font-weight:600;min-height:74px;letter-spacing:-.1px;
}
.cue .cnline{display:block;margin-top:8px;font-size:13px;color:var(--muted);font-weight:500}
.shadow{
  border-radius:16px;background:#141A11;color:#EAF0E4;padding:14px 16px;font-size:13px;line-height:1.7;
  font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2px;
}
.shadow .hl{color:#9FD37E;font-weight:700}
.shadow .dim{color:#7E8B76}
.segtime{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.segtime:last-child{border-bottom:0}
.segtime .num{width:22px;height:22px;flex:none;border-radius:8px;background:var(--green-l);color:var(--green-d);
  display:grid;place-items:center;font-size:11px;font-weight:800}
.segtime .txt{flex:1;min-width:0;font-size:13.5px;line-height:1.55}
.segtime .txt small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:359px){
  .split{grid-template-columns:1fr}
  .snackans{grid-template-columns:1fr}
  .hero h1{font-size:26px}
}
/* ===== 背景听 ===== */
.bgclock{font-size:48px;font-weight:800;letter-spacing:-1.6px;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--green-d)}
.srcrow{display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r2);padding:13px 14px;margin-bottom:9px;
  box-shadow:var(--sh2);transition:.16s}
.srcrow:active{transform:scale(.995);background:#FCFDFB}
.sr-top{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.sr-top .chip{flex:none}
.sr-name{font-size:14px;font-weight:750;letter-spacing:-.1px;flex:1;min-width:0;line-height:1.45;word-break:break-word}
.sr-org{font-size:11.5px;color:var(--muted);margin-top:3px}
.sr-why{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-top:6px}
.sr-go{font-size:11.5px;color:var(--green-d);font-weight:700;margin-top:7px}
body.bgnight{--bg:#0F1511;--card:#16201A;--line:#243028;--line2:#1C2720;--ink:#DDE6D8;
  --ink2:#A9B8A3;--muted:#7C8C76;--green:#8FB683;--green-d:#9CC48F;--green-l:#1B2A20;--green-l2:#213328}
body.bgnight .tabbar{background:#121A15;border-color:#243028}
body.bgnight .toast{background:#243028;color:#DDE6D8}
@media (max-width:340px){ .bgclock{font-size:40px} }

/* ===== 辨析词 / 跨模块回流 ===== */
.cfwrap{margin-top:10px}
.cfhd{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.cfbox{border:1px solid var(--line);border-radius:var(--r2);background:#FBFDF8;padding:10px 11px;margin-top:8px}
.cftag{display:inline-block;font-size:11px;font-weight:800;color:var(--green-d);background:var(--green-l);border-radius:999px;padding:2px 8px;margin-bottom:7px}
.cfrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cfcol{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 9px;min-width:0}
.cfcol.cur{border-color:var(--green);box-shadow:0 0 0 2px var(--green-l)}
.cfw{font-size:14px;font-weight:800;letter-spacing:-.1px;cursor:pointer;word-break:break-word}
.cfpt{font-size:12px;line-height:1.6;color:var(--ink2);margin-top:4px}
.cfex{font-size:12px;line-height:1.62;color:var(--ink2);margin-top:5px;word-break:break-word}
.cfex b{color:var(--green-d)}
.cfrule{font-size:12.5px;line-height:1.72;margin-top:7px;background:var(--card);border:1px dashed var(--green);border-radius:10px;padding:8px 9px;color:var(--ink2)}
.cfrule b{color:var(--green-d)}
.cfqline{font-size:15px;line-height:1.75;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px}
.cfqline .blank{color:var(--green-d);letter-spacing:1px}
.rcbox{font-size:12px;line-height:1.65;margin-top:8px;background:var(--green-l2);border-left:3px solid var(--green);border-radius:8px;padding:8px 10px;color:var(--ink2)}
.rcbox b{color:var(--green-d)}
@media (max-width:360px){ .cfrow{grid-template-columns:1fr} }

/* ---------- 每日素材 ---------- */
.dl-day{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.4px;margin:16px 2px 8px}
.dl-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px 13px;margin-bottom:9px;cursor:pointer;box-shadow:var(--sh2)}
.dl-item:active{transform:scale(.995)}
.dl-top{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.dl-src{font-size:10.5px;font-weight:800;color:var(--green-d);background:var(--green-l);border-radius:6px;padding:2px 6px;letter-spacing:.2px}
.dl-lv{font-size:10.5px;font-weight:800;color:var(--amber);background:var(--amber-l);border-radius:6px;padding:2px 6px}
.dl-meta{font-size:10.5px;color:var(--muted);font-weight:650}
.dl-t{font-size:15px;font-weight:750;line-height:1.35;letter-spacing:-.15px;color:var(--ink)}
.dl-sub{font-size:11.5px;color:var(--muted);margin-top:5px}
.dl-body{font-size:16.5px;line-height:1.9;color:var(--ink)}
.dl-s{border-radius:4px;padding:1px 0}
.dl-s:active{background:var(--green-l)}
.dl-w{color:var(--green-d);border-bottom:1px dashed var(--green);font-weight:650}
.dl-key{display:flex;flex-wrap:wrap;gap:7px}
.dl-k{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.dl-k i{font-style:normal;font-weight:600;color:var(--muted);font-size:11px;margin-left:5px}
.dl-q{border:1px solid var(--line);border-radius:var(--r2);padding:12px;margin-bottom:9px}
.dl-q .qt{font-size:14px;font-weight:750;margin-bottom:8px}
.dl-op{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;margin-bottom:6px;font-size:13px;font-weight:650;cursor:pointer;color:var(--ink)}
.dl-op.ok{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.dl-op.no{border-color:var(--red);background:var(--red-l);color:var(--red)}
</style>
</head>

<script>
/* ==== el2_vocab_a.js ==== */
/* ===== 词库 A：学术与职场（联想字段：词根 / 词族 / 近义 / 反义 / 搭配 / 易混 / 主题） ===== */
function V(w, ph, pos, cn, root, fam, syn, ant, col, ex, exCn, scene, conf){
  return { w: w, ph: ph, pos: pos, cn: cn, root: root,
    fam: sp(fam), syn: sp(syn), ant: sp(ant), col: sp(col),
    ex: ex, exCn: exCn, scene: scene, conf: sp(conf) };
}
function sp(s){ return s ? s.split("|").filter(Boolean) : []; }

var VOCAB = [
V("analyze","/ˈænəlaɪz/","v.","分析；拆解",
  "ana-(彻底) + lys(松开) → 把整体彻底拆开来看",
  "analysis|analyst|analytical","examine|dissect|break down","synthesize|overlook",
  "analyze data|analyze the cause|analyze in depth",
  "We need to analyze the data before drawing any conclusion.",
  "在得出任何结论之前，我们需要分析数据。","学术",
  "英式拼 analyse；名词 analysis 重音在后，动词 analyze 重音在前"),
V("significant","/sɪɡˈnɪfɪkənt/","adj.","显著的；有意义的",
  "sign(标记) + fic(做) + -ant → 能做出标记的 → 值得注意的",
  "significance|significantly|insignificant","notable|substantial|meaningful","trivial|negligible",
  "a significant increase|statistically significant|significant impact",
  "There was a significant increase in enrollment this year.",
  "今年报名人数有显著增长。","学术",
  "significant 指「重要/显著」，不是「很大的」；口语里说 a big difference 更自然"),
V("hypothesis","/haɪˈpɒθəsɪs/","n.","假设；假说",
  "hypo-(在下面) + thesis(放置) → 放在下面当基础的命题",
  "hypotheses|hypothetical|hypothesize","assumption|proposition|theory","fact|conclusion",
  "test a hypothesis|support the hypothesis|formulate a hypothesis",
  "The experiment was designed to test a simple hypothesis.",
  "这个实验旨在检验一个简单的假设。","学术",
  "复数 hypotheses /haɪˈpɒθəsiːz/；theory 是已被广泛验证的，hypothesis 尚未验证"),
V("evidence","/ˈevɪdəns/","n.","证据；依据",
  "e-(向外) + vid(看) + -ence → 能拿出来给人看的东西",
  "evident|evidently|evidential","proof|data|indication","guess|speculation",
  "strong evidence|evidence suggests|provide evidence",
  "The evidence suggests that the policy has not worked.",
  "证据表明这项政策没有奏效。","学术",
  "不可数名词，不说 an evidence；proof 比 evidence 更强，指确证"),
V("evaluate","/ɪˈvæljueɪt/","v.","评估；估值",
  "e-(向外) + value(价值) → 把价值算出来",
  "evaluation|evaluative|evaluator","assess|appraise|judge","ignore|assume",
  "evaluate the results|evaluate performance|critically evaluate",
  "Students are asked to evaluate the course at the end of term.",
  "学生被要求在期末评估这门课。","学术",
  "evaluate 强调按标准衡量；assess 更常用于能力/风险，两者近义但搭配不同"),
V("imply","/ɪmˈplaɪ/","v.","暗示；意味着",
  "im-(向内) + plic(折) → 折进话里，不明说",
  "implication|implicit|implicitly","suggest|hint|indicate","state|spell out",
  "imply that|strongly imply|as the name implies",
  "His silence implied that he did not agree.",
  "他的沉默暗示他并不同意。","学术",
  "说话人 imply（暗示），听话人 infer（推断）—— 方向相反，考场高频混淆"),
V("perspective","/pəˈspektɪv/","n.","视角；观点",
  "per-(穿过) + spect(看) + -ive → 透过某处看过去的角度",
  "perspectives|perspectival","viewpoint|standpoint|angle","—",
  "from a different perspective|put into perspective|broaden perspective",
  "Try to see the issue from her perspective.",
  "试着从她的角度看这个问题。","学术",
  "别与 prospective（未来的、潜在的）混；prospective student = 有意向报考的学生"),
V("contrast","/ˈkɒntrɑːst/","n./v.","对比；反差",
  "contra-(相反) + st(站) → 相对而立",
  "contrasting|contrastive","compare|distinguish|juxtapose","resemble|match",
  "in contrast|by contrast|contrast A with B",
  "In contrast to last year, sales have fallen sharply.",
  "与去年相比，销售额大幅下降。","学术",
  "compare 找相同点，contrast 找不同点；in contrast 后跟名词或句子，by contrast 常独立使用"),
V("emphasize","/ˈemfəsaɪz/","v.","强调；着重",
  "en-(使) + phasis(显现、陈述) → 使某点显出来",
  "emphasis|emphatic|emphatically","stress|highlight|underline","downplay|understate",
  "emphasize the need|emphasize that|place emphasis on",
  "The report emphasizes the need for early intervention.",
  "报告强调需要早期干预。","学术",
  "名词 emphasis，动词 emphasize 或英式 emphasise；put emphasis on 不是 make emphasis"),
V("framework","/ˈfreɪmwɜːk/","n.","框架；体系",
  "frame(骨架) + work(结构) → 支撑整体的骨架",
  "frames|framing","structure|model|scheme","—",
  "theoretical framework|legal framework|within the framework of",
  "The study lacks a clear theoretical framework.",
  "这项研究缺乏清晰的理论框架。","学术",
  "framework 是可数名词，a framework / frameworks；抽象说「框架内」用 within the framework of"),
V("derive","/dɪˈraɪv/","v.","获得；源自",
  "de-(从……来) + riv(河流) → 从河里引水 → 引出来源",
  "derivation|derivative|derived","obtain|originate|stem","—",
  "derive from|derive pleasure from|be derived from",
  "The word derives from an old Latin root.",
  "这个词源自一个古拉丁词根。","学术",
  "derive from = 源自（主动）；be derived from = 由……派生（被动），论文里两种都常见"),
V("coherent","/kəʊˈhɪərənt/","adj.","连贯的；条理清楚的",
  "co-(共同) + haer(粘) + -ent → 粘在一起的",
  "coherence|coherently|incoherent","logical|consistent|well-organized","confused|incoherent",
  "a coherent argument|coherent structure|logically coherent",
  "Your essay needs a more coherent structure.",
  "你的文章需要一个更连贯的结构。","学术",
  "coherent 指逻辑连贯；cohesive 指凝聚力强（团队、群体），两者不能互换"),

V("negotiate","/nɪˈɡəʊʃieɪt/","v.","谈判；协商",
  "neg-(不) + oti(闲暇) → 不得闲 → 谈正事、做买卖",
  "negotiation|negotiator|negotiable","bargain|mediate|discuss terms","dictate|impose",
  "negotiate a deal|negotiate with sb|enter negotiations",
  "We are still negotiating the terms of the contract.",
  "我们仍在协商合同的条款。","职场",
  "negotiate 后面直接跟宾语（negotiate a price），不说 negotiate about a price"),
V("deadline","/ˈdedlaɪn/","n.","截止日期",
  "dead(死) + line(线) → 越过即作废的界线（源自监狱围墙线、报社截稿线）",
  "deadlines|deadline-driven","due date|cutoff|time limit","—",
  "meet a deadline|miss a deadline|tight deadline",
  "We have a tight deadline, so let us keep it short.",
  "我们时间很紧，所以简短点说。","职场",
  "deadline 是「期限」，due date 是「到期日」；miss the deadline = 逾期，不是 lose"),
V("delegate","/ˈdelɪɡeɪt/","v./n.","委派；代表",
  "de-(向下) + leg(派遣) + -ate → 派下去做事",
  "delegation|delegated","assign|entrust|hand over","micromanage|take on",
  "delegate tasks|delegate authority|delegate to sb",
  "A good manager knows how to delegate.",
  "好的管理者懂得如何授权。","职场",
  "名词重音在首音节 /ˈdelɪɡət/（代表），动词在末 /ˈdelɪɡeɪt/（委派）"),
V("propose","/prəˈpəʊz/","v.","提议；提出",
  "pro-(向前) + pos(放) → 放到前面来给大家看",
  "proposal|proposition|proponent","suggest|put forward|recommend","oppose|reject",
  "propose a plan|propose that|propose doing",
  "I propose that we postpone the launch by a week.",
  "我建议把上线时间推迟一周。","职场",
  "propose 后接从句用虚拟语气（propose that he be present）；proposal 是可数名词"),
V("feedback","/ˈfiːdbæk/","n.","反馈意见",
  "feed(喂) + back(返回) → 把输出回送回来（源自控制论）",
  "feedbacks（少用）","response|input|comments","—",
  "give feedback|receive feedback|constructive feedback",
  "Thanks for the feedback — it is genuinely useful.",
  "谢谢反馈，确实有用。","职场",
  "不可数，不说 a feedback，要说 a piece of feedback 或 some feedback"),
V("prioritize","/praɪˈɒrətaɪz/","v.","优先处理；排优先级",
  "prior(在先的) + -ize → 把在先的挑出来",
  "priority|priorities|prioritization","rank|put first|focus on","neglect|postpone",

var VOCAB_DUP_LOG = [];
(function dedupeVocab(){
  var idx = {}, order = [], arr = ["fam","syn","ant","col","conf"], i, j, f, k;
  for(i=0;i<VOCAB.length;i++){
    var v=VOCAB[i]; if(!v||!v.w) continue;
    k=String(v.w).toLowerCase();
    if(!idx[k]){ idx[k]=v; order.push(k); continue; }
    var t=idx[k];
    VOCAB_DUP_LOG.push(k);
    if(String(v.cn||"").length>String(t.cn||"").length) t.cn=v.cn;
    if(String(v.ex||"").length>String(t.ex||"").length){ t.ex=v.ex; if(v.exCn) t.exCn=v.exCn; }
    else if(String(v.exCn||"").length>String(t.exCn||"").length){ t.exCn=v.exCn; }
    if(!t.ph && v.ph) t.ph=v.ph;
    if(!t.pos && v.pos) t.pos=v.pos;
    if(!t.scene && v.scene) t.scene=v.scene;
    if(String(v.root||"").length>String(t.root||"").length) t.root=v.root;
    for(j=0;j<arr.length;j++){
      f=arr[j]; if(!t[f] || !t[f].length || typeof t[f].push!=="function") t[f]=t[f]?String(t[f]).split("|"):[];
      var src=v[f]; if(src && src.length && typeof src.push!=="function") src=String(src).split("|");
      if(src && src.length) for(var q=0;q<src.length;q++){ if(src[q] && t[f].indexOf(src[q])<0) t[f].push(src[q]); }
    }
  }
  var out=[]; for(i=0;i<order.length;i++) out.push(idx[order[i]]);
  VOCAB.length=0;
  for(i=0;i<out.length;i++) VOCAB.push(out[i]);
})();

/* ===== 状态、存储、语音、评分、通用 UI ===== */
var LS_KEY = "englab_v2";
var DB = { srs:{}, days:{}, use:{}, goal:20, rate:0.92, voice:"", acc:"us", wake:1, start:"", net:"online", off:0, daily:{read:{}} };
function useWord(w, kind){
  var k=String(w||"").toLowerCase(); if(!k) return;
  if(!DB.use) DB.use={};
  var u=DB.use[k]||(DB.use[k]={});
  u[kind]=(u[kind]||0)+1;
  /* 在听/读/看/说/写里遇到库内词，就把它放进回流队列，等回词网确认 */
  if(kind!=="vocab" && typeof VOCAB_BY_W!=="undefined" && VOCAB_BY_W[k]){
    if(!DB.rec) DB.rec={};
    var r=DB.rec[k]||(DB.rec[k]={ t:0, kinds:{} });
    if(!r.kinds) r.kinds={};
    r.kinds[kind]=1; r.t=Date.now();
  }
  saveDB();
}
function useOf(w){
  var u=(DB.use||{})[String(w||"").toLowerCase()]||{};
  return { listen:u.listen||0, read:u.read||0, view:u.view||0, say:u.say||0, write:u.write||0 };
}

function pad2(n){ return (n<10?"0":"")+n; }
function dk(d){ d=d||new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function addDays(n){ var d=new Date(); d.setDate(d.getDate()+n); return dk(d); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function loadDB(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){ var o=JSON.parse(raw)||{};
      DB.srs = o.srs||{}; DB.days = o.days||{}; DB.use = o.use||{}; DB.mat = o.mat||{};
      DB.goal = o.goal||20; DB.rate = o.rate||0.92; DB.voice = o.voice||"";
      DB.net = (o.net==="local"||o.net==="online") ? o.net : "online";
      DB.acc = (o.acc==="uk") ? "uk" : "us";
      DB.wake = (o.wake===0) ? 0 : 1;
      DB.off = o.off?1:0;
      DB.start = o.start||"";
      DB.wd = o.wd||{}; DB.paste = o.paste||[];
      DB.rec = o.rec||{}; DB.wait = o.wait||{};
      DB.daily = o.daily||{read:{}};
    }
    if(!DB.start){ DB.start = dk(); saveDB(); }
  }catch(e){}
}
function saveDB(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){ toast("保存失败：浏览器禁用了本地存储"); } }

function todayRec(){
  var k=dk();
  if(!DB.days[k]) DB.days[k]={ m:{}, sec:0, p:[] };
  if(!DB.days[k].p) DB.days[k].p=[];
  return DB.days[k];
}
function touch(kind, n){ var t=todayRec(); t.m[kind]=(t.m[kind]||0)+(n===undefined?1:n); saveDB(); }
function addSec(n){ var t=todayRec(); t.sec+=n; saveDB(); }
function markStep(id){ var t=todayRec(); if(t.p.indexOf(id)<0){ t.p.push(id); saveDB(); return true; } return false; }
function stepDone(id){ return todayRec().p.indexOf(id)>=0; }

/* ---------- SRS：五档间隔 ---------- */
var IVS=[0,1,2,4,7,15,30,60];
function srsOf(w){ return DB.srs[w]||{ lv:0, due:"", seen:0, ok:0 }; }
function srsUpd(w,q){
  var s=srsOf(w); s.seen=(s.seen||0)+1;
  if(q<=0){ s.lv=0; }
  else if(q===1){ s.lv=Math.max(1,s.lv|0); }
  else { s.lv=Math.min(IVS.length-1,(s.lv|0)+1); if(q===3) s.ok=(s.ok||0)+1; }
  s.iv=IVS[s.lv]; s.due=addDays(s.iv); s.last=dk();
  DB.srs[w]=s; saveDB(); return s;
}
function dueWords(){
  var out=[];
  for(var k in DB.srs){ var s=DB.srs[k]; if(VOCAB_BY_W[k] && (!s.due || s.due<=dk())) out.push(k); }
  return out;
}
function newWords(n){
  var out=[];
  for(var i=0;i<VOCAB.length && out.length<n;i++){ var w=VOCAB[i].w.toLowerCase(); if(!DB.srs[w]) out.push(w); }
  return out;
}
function learnedCount(){ var c=0; for(var k in DB.srs) if(VOCAB_BY_W[k]) c++; return c; }
function masteredCount(){ var c=0; for(var k in DB.srs) if((DB.srs[k].lv|0)>=5 && VOCAB_BY_W[k]) c++; return c; }

/* ---------- 连续天数 ---------- */
function streak(){
  var n=0, d=new Date();
  for(var i=0;i<400;i++){
    var k=dk(d); var r=DB.days[k];
    var active = r && (r.sec>20 || (r.m && Object.keys(r.m).length));
    if(k===dk() && !active){ d.setDate(d.getDate()-1); continue; }
    if(!active) break;
    n++; d.setDate(d.getDate()-1);
  }
  return n;
}
function totalMin(){
  var s=0; for(var k in DB.days) s+=(DB.days[k].sec||0);
  return Math.round(s/60);
}

/* ---------- 语音合成 ---------- */
var _voices=[];
function loadVoices(){
  if(!window.speechSynthesis) return;
  _voices = speechSynthesis.getVoices()||[];
}
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged=loadVoices;
}
function enVoices(){ return _voices.filter(function(v){ return /^en/i.test(v.lang); }); }
function pickVoice(){
  var en=enVoices();
  if(!en.length) return null;
  if(DB.voice){ for(var i=0;i<en.length;i++) if(en[i].name===DB.voice) return en[i]; }
  var pref=/Samantha|Aria|Jenny|Zira|Google US English|Google UK English|Alex|Natural/i;
  for(var j=0;j<en.length;j++) if(pref.test(en[j].name)) return en[j];
  return en[0];
}
/* --- 系统语音（本机语音包） --- */
function localSpeak(text, rate, cb){
  if(!window.speechSynthesis){ toast("此浏览器不支持系统朗读，请换 Chrome / Edge"); if(cb) cb(); return; }
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(String(text));
  var v=pickVoice();
  if(v){ u.voice=v; u.lang=v.lang; } else { u.lang="en-US"; }
  u.rate=rate||DB.rate||0.92; u.pitch=1;
  u.onerror=function(){ if(cb) cb(); };
  if(cb){ u.onend=cb; }
  speechSynthesis.speak(u);
}

/* --- 在线语音（无需本机英文语音包） ---
   音频用 <audio> 直连第三方合成接口播放：不需要 CORS，只要求请求不带 Referer
   （文档级 referrer 策略已在 head 设为 no-referrer）。
   单词/短语走有道词典发音，整句走百度翻译发音；任一路失败自动换另一路。 */
/* --- 离线语音包：词库发音预生成，下载一次存进 IndexedDB，之后完全断网也能读 ---
   优先级：本地离线包 > 在线合成 > 系统语音。离线包只覆盖词库单词，句子/文章仍需联网。 */
var OFF = { map:{}, state:"none", busy:false, count:0, idb:null };
function offIdb(){
  return new Promise(function(res,rej){
    if(OFF.idb) return res(OFF.idb);
    if(!window.indexedDB) return rej(new Error("浏览器不支持 IndexedDB"));
    var r;
    try{ r=indexedDB.open("englab_voice",1); }catch(e){ return rej(e); }
    r.onupgradeneeded=function(){ try{ r.result.createObjectStore("kv"); }catch(e){} };
    r.onsuccess=function(){ OFF.idb=r.result; res(r.result); };
    r.onerror=function(){ rej(r.error); };
  });
}
function offIdbOp(mode, fn){
  return offIdb().then(function(db){
    return new Promise(function(res,rej){
      var q;
      try{
        var t=db.transaction("kv",mode), st=t.objectStore("kv");
        q=fn(st);
        t.oncomplete=function(){ res(q?q.result:null); };
        t.onerror=function(){ rej(t.error); };
        t.onabort=function(){ rej(t.error); };
      }catch(e){ rej(e); }
    });
  });
}
function offIdbGet(k){ return offIdbOp("readonly", function(st){ return st.get(k); }); }
function offIdbPut(k,v){ return offIdbOp("readwrite", function(st){ return st.put(v,k); }); }
function offIdbDel(k){ return offIdbOp("readwrite", function(st){ return st.delete(k); }); }
function offLoad(){
  return offIdbGet("pack").then(function(v){
    if(v && v.d && typeof v.d==="object" && Object.keys(v.d).length){
      OFF.map=v.d; OFF.count=v.count||Object.keys(v.d).length; OFF.state="ready";
    }else{ OFF.map={}; OFF.count=0; OFF.state="none"; }
    offPaint();
  }).catch(function(){ OFF.state="none"; offPaint(); });
}
function offKey(t){
  return String(t==null?"":t).trim().toLowerCase().replace(/^[^a-z']+|[^a-z']+$/g,"");
}
function offSrc(t){
  if(OFF.state!=="ready") return null;
  var k=offKey(t);
  if(!k) return null;
  var b=OFF.map[k];
  return b? ("data:audio/mpeg;base64,"+b) : null;
}
function vocabUniq(){
  var s={}, i, w;
  for(i=0;i<VOCAB.length;i++){ w=String(VOCAB[i]&&VOCAB[i].w||"").toLowerCase().trim(); if(w) s[w]=1; }
  return Object.keys(s).length;
}
function offInstall(){
  if(OFF.busy) return;
  if(location.protocol==="file:"){ toast("file:// 打开时浏览器禁止读取本地包，请用网址打开后再下载"); return; }
  OFF.busy=true; offPaint();
  fetch("./voice-pack.json", {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){
    if(!j || !j.d || !Object.keys(j.d).length) throw new Error("语音包内容异常");
    return offIdbPut("pack", { v:j.v||1, ts:Date.now(), count:j.count||0, d:j.d }).then(function(){
      OFF.map=j.d; OFF.count=j.count||Object.keys(j.d).length; OFF.state="ready";
      DB.off=1; saveDB();
    });
  }).then(function(){
    OFF.busy=false; offPaint();
    toast("离线语音包装好了："+OFF.count+" 个词断网也能读");
  }).catch(function(e){
    OFF.busy=false; offPaint();
    toast("下载失败："+(e&&e.message?e.message:"网络问题")+"，联网后再点一次");
  });
}
function offRemove(){
  if(!confirm("删除已下载的离线语音包？删除后单词发音要靠联网。")) return;
  offIdbDel("pack").then(function(){
    OFF.map={}; OFF.count=0; OFF.state="none"; DB.off=0; saveDB(); offPaint();
    toast("已删除离线语音包");
  }).catch(function(){ toast("删除失败，可清浏览器数据后重试"); });
}
function offBoxHtml(){
  var n=vocabUniq();
  var h='<div class="row" style="margin-top:6px">';
  if(OFF.busy){
    h+='<button class="btn sm" disabled>正在下载…</button>';
  }else if(OFF.state==="ready"){
    h+='<button class="btn sm ghost" onclick="offInstall()">重新下载</button>'+
       '<button class="btn sm ghost" onclick="offRemove()">删除</button>';
  }else{
    h+='<button class="btn sm" onclick="offInstall()">下载离线包（约 2.2MB）</button>';
  }
  h+='</div>';

  var parts=t.match(/[^.!?;:,]+[.!?;:,]*\s*/g)||[t], out=[], buf="";
  for(var i=0;i<parts.length;i++){
    if((buf+parts[i]).length>110 && buf){ out.push(buf.trim()); buf=parts[i]; }

  var el=netAudio(), my=++NET.seq, done=false;
  function fin(ok){ if(done) return; done=true; if(my!==NET.seq) return; cb&&cb(ok); }
  el.onended=null; el.onerror=null;
  el.muted=false;
  el.onended=function(){ fin(true); };

function netSeq(chunks, idx, rate, done){

      if(ok) netSeq(chunks, idx+1, rate, done);

    });
    return;
  }

}
function netNet(chunks, idx, rate, done){
  if(idx>=chunks.length){ done&&done(true); return; }
  var urls=netUrls(chunks[idx]), k=0;
  (function tryUrl(){
    if(k>=urls.length){ done&&done(false); return; }
    netPlayOne(urls[k++], rate, function(ok){

    v.setUint32(28,sr,true); v.setUint16(32,1,true); v.setUint16(34,8,true);

var ASR = { ok: !!(window.SpeechRecognition||window.webkitSpeechRecognition), rec:null, on:false, t0:0 };

function asrSupport(){
  if(!ASR.ok) return false;
  if(location.protocol==="file:") return false;
  return true;
}
function asrHint(){
  if(!ASR.ok) return "当前浏览器不支持语音识别，请用 Chrome 或 Edge 打开";
  if(location.protocol==="file:") return "双击打开（file://）时浏览器禁止麦克风。用本地服务器打开即可录音打分，或先手动自评";
  return "";
}
function normWords(s){
  return String(s||"").toLowerCase().replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean);
}
function lcsLen(a,b){
  var n=a.length, m=b.length, i, j;
  var prev=new Array(m+1), cur=new Array(m+1);
  for(j=0;j<=m;j++) prev[j]=0;
  for(i=1;i<=n;i++){
    cur[0]=0;
    for(j=1;j<=m;j++){
      cur[j] = a[i-1]===b[j-1] ? prev[j-1]+1 : Math.max(prev[j], cur[j-1]);
    }
    var tmp=prev; prev=cur; cur=tmp;
  }
  return prev[m];
}
function scoreSpeak(target, said){
  var a=normWords(target), b=normWords(said);
  if(!a.length) return { score:0, hit:0, miss:0, extra:b.length, mark:[] };
  var hit=lcsLen(a,b);
  var score=Math.round(hit/a.length*100);
  var mark=[], used=0;
  var pool=b.slice();
  for(var i=0;i<a.length;i++){
    var idx=pool.indexOf(a[i]);
    if(idx>=0){ mark.push({ w:a[i], ok:true }); pool.splice(idx,1); used++; }
    else mark.push({ w:a[i], ok:false });
  }
  var extra=0;
  for(var k=0;k<DB_SAID_EXTRA_LEN(b,a);k++) extra++;
  return { score:score, hit:used, miss:a.length-used, extra:Math.max(0,b.length-used), mark:mark };
}
function DB_SAID_EXTRA_LEN(){ return 0; }

function startASR(onResult, onEnd){
  if(!asrSupport()){ toast(asrHint()); if(onEnd) onEnd(); return false; }
  var SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  var r=new SR();
  r.lang="en-US"; r.interimResults=true; r.continuous=true; r.maxAlternatives=1;
  REC.text=""; REC.sec=0; ASR.on=true; ASR.t0=Date.now();
  r.onresult=function(e){
    var s="";
    for(var i=0;i<e.results.length;i++) s+=e.results[i][0].transcript+" ";
    REC.text=s.trim();
    if(onResult) onResult(REC.text, "interim");
  };
  r.onerror=function(e){
    ASR.on=false;
    if(e.error==="not-allowed"||e.error==="service-not-allowed") toast("麦克风被拒绝，请在浏览器地址栏允许后重试");
    else if(e.error==="no-speech") toast("没听到声音，靠近一点再说");
    else toast("识别出错："+e.error);
    if(onEnd) onEnd(REC.text, "error");
  };
  r.onend=function(){
    ASR.on=false;
    REC.sec=Math.round((Date.now()-ASR.t0)/1000);
    if(onEnd) onEnd(REC.text, "end");
  };

  try{ r.start(); }catch(err){ ASR.on=false; toast("启动失败，请刷新后重试"); return false; }

}

function shuffle(a){
  var r=a.slice(), i, j, t;
  for(i=r.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=r[i]; r[i]=r[j]; r[j]=t; }
  return r;
}
function pickN(a, n){ return shuffle(a).slice(0, n); }
function oneOf(a){ return a[Math.floor(Math.random()*a.length)]; }
function wordPool(){
  var out=[], i;
  for(i=0;i<VOCAB.length;i++) out.push(VOCAB[i].w.toLowerCase());
  return out;
}
function dueFirstPool(){
  var d=dueWords(), rest=[], i, k;
  var seen={};
  for(i=0;i<d.length;i++) seen[d[i]]=1;
  var all=shuffle(wordPool());
  for(i=0;i<all.length;i++) if(!seen[all[i]]) rest.push(all[i]);
  return shuffle(d).concat(rest);
}
function humanSec(s){
  s=Math.max(0, Math.round(s));
  var m=Math.floor(s/60), r=s%60;
  return m? (m+":"+(r<10?"0":"")+r) : (r+"s");
}

  if(!n) return "VOA Learning English、News in Levels、Breaking News English 每天更新；联网时自动取当天文章，断网看缓存。";
  var line="已存 "+n+" 篇";
  if(DAILY.from==="cache") line+="（离线缓存）";
  else if(DAILY.ts) line+="，素材抓取于 "+dailyAgo(DAILY.ts);
  var today=dk(), c=0, i;
  for(i=0;i<dailyItems().length;i++) if(dailyItems()[i].date===today) c++;
  if(c>0) line+=" · 今天 "+c+" 篇";
  return line;
}
function dailyPickRandom(){
  var a=dailyItems(), pool=[], i;
  for(i=0;i<a.length;i++) if(!dailyIsRead(a[i].id)) pool.push(a[i]);
  if(!pool.length) pool=a;
  if(!pool.length){ toast("素材还没取到，联网后再试"); return; }
  dailyOpen(pool[Math.floor(Math.random()*pool.length)].id);
}
function dailyOpen(id){
  if(!dailyById(id)){ toast("这篇没在缓存里了"); return; }
  DAILY.cur=id; DAILY.quiz=null; DAILY.sents=[];
  go("dailyread");
}
function dailyRate(){
  var rs=[0.75,0.85,0.95,1.05], cur=DB.rate||0.92, i, n=rs[0];
  for(i=0;i<rs.length;i++) if(Math.abs(rs[i]-cur)<0.03){ n=rs[(i+1)%rs.length]; break; }
  DB.rate=n; saveDB();
  toast("朗读语速 "+n+"×");
  render();
}
function dailyRich(s){
  return esc(s).replace(/([A-Za-z][A-Za-z'-]+)/g, function(m){
    var k=m.toLowerCase();
    if(typeof VOCAB_BY_W!=="undefined" && VOCAB_BY_W[k]){
      return '<b class="dl-w" onclick="event.stopPropagation();openWord(\''+k.replace(/'/g,"")+'\')">'+m+'</b>';
    }
    return m;
  });
}
function dailySplit(t){
  var raw=String(t||"").match(/[^.!?]+[.!?]*/g) || [];
  var out=[], i;
  for(i=0;i<raw.length;i++){ var x=raw[i].trim(); if(x) out.push(x); }
  return out;
}
function dailySay(i){
  var s=DAILY.sents[i];
  if(s) speak(s, null, null);
}
function dailyPlayAll(){
  if(!DAILY.sents.length) return;
  toast("开始朗读，点任意一句可以跳到那句");
  speakSeq(DAILY.sents, 220, null);
}
function dailyMarkRead(){
  var it=dailyById(DAILY.cur); if(!it) return;
  if(!DB.daily) DB.daily={read:{}};
  if(!DB.daily.read) DB.daily.read={};
  DB.daily.read[it.id]=Date.now();
  saveDB(); touch("read", 1);
  var ks=it.key||[], i, put=0;
  for(i=0;i<ks.length;i++){ if(VOCAB_BY_W[ks[i]]){ useWord(ks[i],"read"); put++; } }
  toast("记了一笔阅读"+(put?"，"+put+" 个词进了词网回流":""));
  render();
}
function dailyQuizStart(){
  var it=dailyById(DAILY.cur); if(!it) return;
  var pool=[], i, j;
  for(i=0;i<(it.key||[]).length;i++){
    var v=VOCAB_BY_W[it.key[i]];
    if(v && v.cn) pool.push(v);
  }
  if(pool.length<3){ toast("这篇的词库内词不够出题，先用上方逐句听读"); return; }
  pool=pool.slice(0,5);
  var qs=[];
  for(i=0;i<pool.length;i++){
    var ans=pool[i], opts=[ans.cn], guard=0;
    while(opts.length<4 && guard++<60){
      var rv=VOCAB[Math.floor(Math.random()*VOCAB.length)];
      if(!rv || !rv.cn || rv.cn===ans.cn) continue;
      if(opts.indexOf(rv.cn)>=0) continue;
      opts.push(rv.cn);
    }
    for(j=opts.length-1;j>0;j--){ var k=Math.floor(Math.random()*(j+1)), t=opts[j]; opts[j]=opts[k]; opts[k]=t; }
    qs.push({ w:ans.w, cn:ans.cn, opts:opts, pick:"", ok:false });
  }
  DAILY.quiz=qs;
  render();
}
function dailyQuizPick(qi, oi){
  var q=DAILY.quiz && DAILY.quiz[qi]; if(!q || q.pick!=="") return;
  q.pick=q.opts[oi]; q.ok=(q.opts[oi]===q.cn);
  if(q.ok){ useWord(q.w,"read"); touch("read",1); }
  saveDB(); render();
}

  go("output","say"); SAY_TAB="shadow"; render();

function saveWordFromQuote(){
  var q=QUOTES[new Date().getDate()%QUOTES.length];
  var ws=normWords(q.en), hit=0;
  for(var i=0;i<ws.length;i++){ if(VOCAB_BY_W[ws[i]]){ hit++; } }

}

      segBtn("weak","掌握弱")+segBtn("done","已掌握 "+masteredCount())+
    '</div>'+
    (rcN?'<div class="small muted" style="margin-top:7px">「回流」是你在听读看说写里遇到、还没在词网确认过的词；看完点一次评分就会移出。</div>':'')+
    '</div>'+
    '<div class="card tight"><div id="vlist">'+vList()+'</div></div>';
  return h;
}
function segBtn(k,label){
  return '<button class="'+(VFILTER===k?"on":"")+'" onclick="setVFilter(\''+k+'\')">'+esc(label)+'</button>';
}
function setVFilter(k){ VFILTER=k; go("vocab"); }
function vFilter(q){ VQ=(q||"").trim().toLowerCase(); var box=document.getElementById("vlist"); if(box) box.innerHTML=vList(); }
function vRandom(){
  var v=VOCAB[Math.floor(Math.random()*VOCAB.length)];
  openWord(v.w);
}
function vList(){
  var arr=VOCAB.slice(), out=[], i;
  if(VFILTER==="due"){ var d=dueWords(); arr=arr.filter(function(v){ return d.indexOf(v.w.toLowerCase())>=0; }); }
  else if(VFILTER==="back"){
    var rw=(typeof recWords==="function")? recWords() : [];
    arr=rw.map(function(k){ return VOCAB_BY_W[k]; }).filter(Boolean);
  }
  else if(VFILTER==="new"){ arr=arr.filter(function(v){ return !DB.srs[v.w.toLowerCase()]; }); }
  else if(VFILTER==="weak"){ arr=arr.filter(function(v){ var s=DB.srs[v.w.toLowerCase()]; return s && (s.lv|0)<=2; }); }
  else if(VFILTER==="done"){ arr=arr.filter(function(v){ var s=DB.srs[v.w.toLowerCase()]; return s && (s.lv|0)>=5; }); }
  if(VQ){
    arr=arr.filter(function(v){
      var hay=(v.w+" "+v.cn+" "+v.root+" "+v.syn.join(" ")+" "+v.fam.join(" ")+" "+v.scene+" "+v.pos).toLowerCase();
      return hay.indexOf(VQ)>=0;
    });
  }
  if(!arr.length) return '<div class="small muted center" style="padding:18px 0">这里暂时没有词。换个筛选条件，或先去「听读看」里刷几段材料。</div>';
  for(i=0;i<arr.length;i++){
    var v=arr[i], s=DB.srs[v.w.toLowerCase()], u=useOf(v.w);
    var lv=s?(s.lv|0):0;
    var four=(u.listen>0?"听":"·")+(u.read>0?"读":"·")+(u.view>0?"看":"·")+(u.say>0?"说":"·")+(u.write>0?"写":"·");
    var rrec=(VFILTER==="back" && DB.rec)?DB.rec[v.w.toLowerCase()]:null;
    out.push('<div class="wrow" onclick="openWord(\''+v.w+'\')">'+
      '<span class="lw">'+esc(v.w)+'</span>'+
      '<span class="lc">'+esc(v.cn)+' · '+esc(v.pos)+'</span>'+
      '<span class="lr"'+(rrec?' style="font-size:10.5px"':' style="letter-spacing:1px"')+'>'+
        (rrec? (esc(recKindsStr(rrec))+' · '+agoStr(rrec.t)) : (four+' '+lv+'/7'))+'</span></div>');
  }
  return out.join("");
}

/* ---------- 词详情 ---------- */
function openWord(w){
  var v=VOCAB_BY_W[String(w||"").toLowerCase()];
  if(!v){ toast("词库里没有「"+w+"」，先去「听读看」里遇到它"); return; }

  var h=sheetHead(v.w+" "+v.ph, v.pos+" · "+v.cn+" · "+v.scene);
  h+='<div class="row" style="margin-bottom:8px">'+
    '<button class="btn sm" onclick="speak(\''+v.w+'\')">▶ 美音</button>'+
    '<button class="btn sm ghost" onclick="speak(\''+esc(v.ex).replace(/'/g,"")+'\')">▶ 整句</button>'+
    '<button class="btn sm ghost" onclick="quizWord(\''+v.w+'\')">考我</button>'+
    '</div>';

  h+='<div class="card tight" style="margin:0 0 8px;box-shadow:none;border:1px solid var(--line)">'+
     '<div class="small muted" style="margin-bottom:4px">四向联动（这个字被练过几次）</div>'+
     '<div class="small">听 '+u.listen+' · 读 '+u.read+' · 看 '+u.view+' · 说 '+u.say+' · 写 '+u.write+'</div>'+
     '<div class="bar thin" style="margin-top:6px"><i style="width:'+Math.min(100,Math.round((u.listen+u.read+u.view+u.say+u.write)/12*100))+'%"></i></div>'+
     '<div class="tiny muted" style="margin-top:4px">掌握度 '+ (s.lv|0) +'/7 · 已复习 '+ (s.seen||0) +' 次'+(s.due?' · 下次 '+s.due:'')+'</div>'+
     '</div>';

  var rc=recOf(v.w);
  if(rc) h+='<div class="rcbox">这次是在「<b>'+esc(recKindsStr(rc))+'</b>」里遇到它的（'+agoStr(rc.t)+'），还没在词网确认。<br>看完下面这一页，点一次评分就会把它移出回流队列。</div>';

  h+=webSVG(v);

  h+='<div class="ex" style="margin-top:10px"><div><b>词根</b>　'+esc(v.root)+'</div></div>';
  if(v.fam.length) h+=chipRow("词族",v.fam);
  if(v.syn.length) h+=chipRow("近义",v.syn);
  if(v.ant.length) h+=chipRow("反义",v.ant);
  if(v.col.length) h+='<div class="mt8 small"><b>常用搭配</b><div class="muted" style="line-height:1.85">'+v.col.map(esc).join(" / ")+'</div></div>';
  h+='<div class="ex">'+
     '<span style="font-size:14.5px">'+hlWord(v.ex,v.w)+'</span>'+
     '<span class="cn2">'+esc(v.exCn)+'</span></div>';
  h+=confBlocks(v);

  h+='<div class="hr"></div><div class="small muted" style="margin-bottom:6px">刚才回想这个词，有多难？</div>'+
     '<div class="row wrap">'+
     '<button class="btn sm red" onclick="rateWord(\''+v.w+'\',0)">忘了</button>'+
     '<button class="btn sm ghost" onclick="rateWord(\''+v.w+'\',1)">模糊</button>'+
     '<button class="btn sm" onclick="rateWord(\''+v.w+'\',2)">记得</button>'+
     '<button class="btn sm gray" onclick="rateWord(\''+v.w+'\',3)">太简单</button>'+
     '</div>';
  h+='<div class="row mt8"><button class="btn sm ghost" onclick="closeSheet();go(\'input\',\'listen\')">去听里遇到它</button>'+
     '<button class="btn sm ghost" onclick="closeSheet();go(\'input\',\'read\')">去读里用它</button>'+
     '<button class="btn sm ghost" onclick="closeSheet();go(\'output\',\'write\')">写进句子</button></div>';
  openSheet(h);
}
function chipRow(label,list){
  return '<div class="mt8 small"><b>'+label+'</b><div style="margin-top:3px">'+
    list.map(function(x){
      var inLib = !!VOCAB_BY_W[String(x).toLowerCase()];
      return '<span class="tag'+(inLib?"":" g")+'" style="cursor:pointer" onclick="tapRel(\''+esc(x).replace(/'/g,"")+'\','+inLib+')">'+esc(x)+'</span>';
    }).join("")+'</div></div>';
}
function tapRel(x, inLib){
  if(inLib) openWord(x);
  else toast("「"+x+"」不在本库，可在「我的 · 联网」用剑桥词典查");
}
function hlWord(sent, w){
  var re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*)","ig");
  return esc(sent).replace(re, "<em>$1</em>");
}
function rateWord(w,q){
  var s=srsUpd(w,q);
  touch("word",1);
  var hadRec = typeof recOf==="function" && recOf(w);
  if(hadRec) clearRec(w);
  closeSheet();
  var left = (typeof recCount==="function")? recCount() : 0;
  var tail = hadRec ? ("　已移出回流"+(left?("，还剩 "+left+" 个"):"")) : "";
  toast((q<=0?("已放回：明天再见 "+w):("已记录：「"+w+"」"+s.iv+" 天后再复习"))+tail);
  render();
}
function quizWord(w){
  var v=VOCAB_BY_W[String(w).toLowerCase()];
  var pool=VOCAB.filter(function(x){ return x.w!==v.w; });
  var picks=[v.cn], i;
  while(picks.length<4){
    var r=pool[Math.floor(Math.random()*pool.length)];
    if(picks.indexOf(r.cn)<0) picks.push(r.cn);
  }
  picks.sort();
  var h=sheetHead("考我："+v.w, "选一个正确的释义");
  h+='<div class="small muted" style="margin-bottom:8px">先在心里回想，再点。想不起来直接点「忘了」也行——回想失败本身就是有效练习。</div>';
  for(i=0;i<picks.length;i++){
    var ok = picks[i]===v.cn;
    h+='<button class="opt" onclick="quizAns(this,'+ok+',\''+v.w+'\')">'+esc(picks[i])+'</button>';
  }
  h+='<div id="qfb"></div>';
  openSheet(h);
}
function quizAns(btn, ok, w){
  var all=document.querySelectorAll("#sheet .opt"), i;
  for(i=0;i<all.length;i++) all[i].disabled=true;
  btn.className="opt "+(ok?"ok":"no");
  if(!ok){
    var v=VOCAB_BY_W[w.toLowerCase()];
    for(i=0;i<all.length;i++) if(all[i].textContent===v.cn) all[i].className="opt ok";
  }
  var fb=document.getElementById("qfb");
  fb.innerHTML='<div class="fb'+(ok?"":" bad")+'">'+(ok?"对。":"正确答案已标出。")+
    '<div class="row mt8"><button class="btn sm '+(ok?"":"red")+'" onclick="rateWord(\''+w+'\','+(ok?2:0)+')">'+(ok?"确认记得":"记下不会")+'</button>'+
    '<button class="btn sm ghost" onclick="openWord(\''+w+'\')">看详情</button></div></div>';
}

/* ---------- 联想网 SVG ---------- */
function webSVG(v){
  var cx=150, cy=132, R=100;
  var bs=[
    { k:"词根", txt:short(v.root,14), kind:"t" },
    { k:"词族", txt:v.fam[0]||"—", kind:"w" },
    { k:"近义", txt:v.syn[0]||"—", kind:"w" },
    { k:"反义", txt:v.ant[0]||"—", kind:"w" },
    { k:"搭配", txt:short(v.col[0]||"—",14), kind:"t" },
    { k:"易混", txt:short(v.conf[0]||"—",14), kind:"t" }
  ];
  var s='<div class="web"><svg viewBox="0 0 300 268">';
  var i, pts=[];
  for(i=0;i<6;i++){
    var a=(-90+i*60)*Math.PI/180;
    pts.push({ x:cx+Math.cos(a)*R, y:cy+Math.sin(a)*R });
  }
  for(i=0;i<6;i++){
    s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+pts[i].x.toFixed(1)+'" y2="'+pts[i].y.toFixed(1)+'" stroke="#CFE0BD" stroke-width="1.2" stroke-dasharray="3 3"/>';
  }
  for(i=0;i<6;i++){
    var b=bs[i], p=pts[i], click="", label=esc(short(b.txt,10));
    if(b.kind==="w" && VOCAB_BY_W[String(b.txt).toLowerCase()]) click=' onclick="openWord(\''+esc(b.txt)+'\')"';
    else if(b.kind==="w") click=' onclick="toast(\'库外联想词：'+esc(b.txt).replace(/'/g,"")+'\')"';
    s+='<g class="node"'+click+'>'+
       '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="27" fill="#fff" stroke="#B7D39A" stroke-width="1.4"/>'+
       '<text x="'+p.x.toFixed(1)+'" y="'+(p.y-3).toFixed(1)+'" text-anchor="middle" font-size="9" font-weight="800" fill="#6FA84F">'+esc(b.k)+'</text>'+
       '<text x="'+p.x.toFixed(1)+'" y="'+(p.y+9).toFixed(1)+'" text-anchor="middle" font-size="8" fill="#55624B">'+label+'</text>'+
       '</g>';
  }
  s+='<g class="node core"><circle cx="'+cx+'" cy="'+cy+'" r="34"/>'+
     '<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle">'+esc(short(v.w,10))+'</text></g>';
  s+='</svg></div>';
  s+='<div class="legend"><span><i style="background:#6FA84F"></i>当前词</span><span><i style="background:#B7D39A"></i>可直接跳转的库内词</span><span><i style="background:#E4E7DF"></i>说明性节点</span></div>';
  return s;
}
function short(s,n){ s=String(s||""); return s.length>n? s.slice(0,n)+"…" : s; }

    h+='<div class="small muted" style="margin-bottom:8px">两题，凭记忆答，不要回看。</div>';
    for(var q=0;q<m.qs.length;q++){
      var qq=m.qs[q], picked=LS_ST.ans[q];
      h+='<div style="margin-bottom:12px"><div style="font-weight:700;font-size:14px;margin-bottom:6px">'+(q+1)+'. '+esc(qq.q)+'</div>';
      for(var o=0;o<qq.o.length;o++){
        var cls="opt";
        if(picked!==null){
          if(o===qq.a) cls="opt ok"; else if(o===picked) cls="opt no";
        }
        h+='<button class="'+cls+'" '+(picked!==null?"disabled":"")+' onclick="lAns('+q+','+o+')">'+esc(qq.o[o])+'</button>';
      }
      h+='</div>';
    }
    var answered = LS_ST.ans[0]!==null && LS_ST.ans[1]!==null;
    if(answered){
      var right=0;
      for(i=0;i<m.qs.length;i++) if(LS_ST.ans[i]===m.qs[i].a) right++;
      h+='<div class="fb'+(right===m.qs.length?"":" warn")+'"><b>对了 '+right+'/'+m.qs.length+'</b> '+
         (right===m.qs.length?"可以进入跟读了。":"错的那题再听一遍对应句子——听错通常不是词不认识，而是没接住重音。" )+'</div>';
      h+='<div class="row mt8"><button class="btn block" onclick="lFinish('+right+')">完成这一段</button></div>';
    } else {
      h+='<div class="small muted">两题都选完自动出结果。</div>';
    }
  }
  else {
    h+='<div class="big">'+LS_ST.got+'<small>/'+m.qs.length+'</small></div>';
    h+='<div class="small mt8" style="line-height:1.85">这一段已完成。接下来最好的动作是：挑最难的那一句，去「说」里跟读三遍。<br>听完不跟读，等于只做了输入的一半。</div>';
    h+='<div class="row mt8"><button class="btn block" onclick="closeSheet();go(\'output\',\'say\')">去跟读</button></div>';
    h+='<div class="row"><button class="btn ghost sm" onclick="closeSheet();go(\'input\',\'listen\')">再选一段</button></div>';
  }
  document.getElementById("lsheet").innerHTML=h;
}

function rqsHtml(m){

function rAns(btn, ok){

  m.kws.forEach(function(w){ useWord(w,"read"); });

/* ---------- 句中词高亮 ---------- */
var _linkRe=null;
function linkWords(sent){
  if(!_linkRe){
    var ws=Object.keys(VOCAB_BY_W).sort(function(a,b){ return b.length-a.length; });
    var esc2=ws.map(function(w){ return w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); });
    _linkRe=new RegExp("\\b("+esc2.join("|")+")(s|es|ed|ing|d|ly)?\\b","ig");
  }
  return esc(sent).replace(_linkRe, function(all, base){
    return '<em style="cursor:pointer" onclick="openWord(\''+base+'\')">'+all+'</em>';
  });
}

/* ===== 录音组件 / 图表 / 看图说 ===== */
var REC_ID = 0, REC_TICK = null, TIMER = null;

function micBlock(target){
  REC_ID++;
  var id="mic"+REC_ID;
  return '<div id="'+id+'" data-target="'+esc(target).replace(/"/g,"&quot;")+'" style="margin-top:8px">'+
    '<button class="mic" onclick="recToggle(this,\''+id+'\')"><span class="dot"></span><span>点一下开始说</span></button>'+
    '<div class="volk"><span class="ti">0s</span><span class="tw">— wpm</span><span class="tsc">—</span></div>'+
    '<div class="res"></div></div>';
}
function recToggle(btn, wrapId){
  var wrap=document.getElementById(wrapId);
  if(!wrap){ return; }
  if(ASR.on){ stopASR(); return; }
  var target=wrap.getAttribute("data-target")||"";
  var tEl=wrap.querySelector(".ti"), wEl=wrap.querySelector(".tw"), sEl=wrap.querySelector(".tsc"), rEl=wrap.querySelector(".res");
  var label=btn.querySelector("span:last-child");
  btn.classList.add("rec");
  if(label) label.textContent="正在听…点一下结束";
  var tick=setInterval(function(){
    var s=Math.round((Date.now()-ASR.t0)/1000);
    if(tEl) tEl.textContent=s+"s";
    var n=normWords(REC.text).length;
    if(wEl) wEl.textContent=(s>0? Math.round(n/s*60):0)+" wpm";
  },400);
  var ok=startASR(null, function(txt){
    clearInterval(tick);
    btn.classList.remove("rec");
    if(label) label.textContent="再说一次";
    var sec=Math.max(1,Math.round((Date.now()-ASR.t0)/1000));
    var spoken=txt||"";
    if(!normWords(spoken).length){
      rEl.innerHTML='<div class="fb bad">没识别到英文。环境太吵，或麦克风没被允许。</div>';
      return;
    }
    if(!target){
      var wpm0=Math.round(normWords(spoken).length/sec*60);
      if(tEl) tEl.textContent=sec+"s";
      if(wEl) wEl.textContent=wpm0+" wpm";
      if(sEl) sEl.textContent="已录 "+sec+"s";
      rEl.innerHTML='<div class="cmp">'+
        '<div class="row"><div class="sc">'+sec+'<small>s</small></div>'+
        '<div style="margin-left:auto;text-align:right"><div class="tiny muted">语速</div><b>'+wpm0+' wpm</b></div></div>'+
        '<div class="small muted" style="margin-top:6px">你说的是：'+esc(spoken)+'</div>'+
        '<div class="fb" style="margin-top:8px">'+
        (wpm0<70? "语速偏慢，说明中间在找词。把要点先抄成 3 个关键词，看着关键词再说一遍。"
          : wpm0>165? "语速偏快。刻意在句子之间停半拍，听感会立刻清晰。"
          : "语速正常。现在检查：有没有超过 3 秒的空白？有就说明这里缺词，补一个过渡句。")+
        '</div></div>';
      touch("say",1); addSec(sec);
      return;
    }
    var r=scoreSpeak(target, spoken);
    var wpm=Math.round(normWords(spoken).length/sec*60);
    if(tEl) tEl.textContent=sec+"s";
    if(wEl) wEl.textContent=wpm+" wpm";
    if(sEl) sEl.textContent="相似 "+r.score+"%";
    var marks="";
    for(var i=0;i<r.mark.length;i++){
      marks+='<span class="'+(r.mark[i].ok?"hit":"miss")+'">'+esc(r.mark[i].w)+'</span> ';
    }
    var advice = r.score>=90 ? "基本准确，可以提速到正常语速。" :
                 r.score>=70 ? "词都到位了，接下来注意重音和停顿，别每个词都一样重。" :
                 "漏词较多。先降速跟读两遍，再录一次——不要在一次录音里反复重试。";
    rEl.innerHTML='<div class="cmp">'+
      '<div class="row" style="align-items:flex-end"><div class="sc">'+r.score+'<small>/100</small></div>'+
      '<div style="margin-left:auto;text-align:right"><div class="tiny muted">语速</div><b>'+wpm+' wpm</b></div></div>'+
      '<div class="wordcmp" style="margin-top:8px">'+marks+'</div>'+
      '<div class="small muted" style="margin-top:6px">你实际说的：'+esc(spoken)+'</div>'+
      '<div class="fb" style="margin-top:8px">'+advice+'</div></div>';
    touch("say",1); addSec(sec);
  });
  if(!ok){ clearInterval(tick); btn.classList.remove("rec"); if(label) label.textContent="点一下开始说"; }
}
function fmtT(s){ var m=Math.floor(s/60), r=s%60; return (m?m+":":"")+(m&&r<10?"0":"")+r; }
function startTimer(sec, elId, onEnd){
  clearInterval(TIMER);
  var left=sec;
  var el=document.getElementById(elId);
  if(el) el.textContent=fmtT(left);
  TIMER=setInterval(function(){
    left--;
    var e=document.getElementById(elId);
    if(e) e.textContent=fmtT(Math.max(0,left));
    if(left<=0){ clearInterval(TIMER); if(onEnd) onEnd(); }
  },1000);
}
function stopTimer(){ clearInterval(TIMER); }

function chartHtml(d){
  var max=1, i;
  for(i=0;i<d.vals.length;i++) if(d.vals[i]>max) max=d.vals[i];
  var h='<div class="card tight" style="margin:0 0 10px;box-shadow:none;border:1px solid var(--line)">'+
    '<div class="small" style="font-weight:700;margin-bottom:8px">'+esc(d.title)+'</div>'+
    '<div style="display:flex;align-items:flex-end;gap:6px;height:110px">';
  for(i=0;i<d.vals.length;i++){
    var pct=Math.round(d.vals[i]/max*100);
    h+='<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%">'+
       '<div class="tiny" style="color:var(--green-d);font-weight:800">'+d.vals[i]+'</div>'+
       '<div style="width:100%;height:'+Math.max(4,pct)+'%;background:linear-gradient(180deg,#8FBF6E,#6FA84F);border-radius:5px 5px 2px 2px"></div>'+
       '<div class="tiny muted" style="margin-top:3px">'+esc(d.years[i])+'</div></div>';
  }
  h+='</div></div>';
  return h;
}

var CONN=["however","therefore","moreover","furthermore","in addition","for example","for instance","as a result","in contrast","on the other hand","although","whereas","while","because","since","consequently","nevertheless","in conclusion","first","second","finally","despite","in spite of","thus","hence","that is","in other words"];
var STOP="the a an and or but of to in on at for with is are was were be been it this that these those i you he she they we my your his her their as by from not no so if then than about into over under can could should would will do does did have has had there here what which who whom whose when where why how all any some more most other such only own same too very just also".split(" ");

function wCheck(id){
  var m=null,i;
  for(i=0;i<WRITE.length;i++) if(WRITE[i].id===id) m=WRITE[i];
  var txt=document.getElementById("wtxt").value||"";
  var words=normWords(txt), n=words.length;
  var rep=document.getElementById("wrep");
  if(n<10){ rep.innerHTML='<div class="fb bad">太短了，先写满 3 句再看检查结果。</div>'; return; }
  var low=" "+txt.toLowerCase()+" ";
  var sents=txt.split(/[.!?]+/).filter(function(s){ return normWords(s).length>0; });
  var avg = sents.length? Math.round(n/sents.length*10)/10 : n;
  var conns=[], ci;
  for(ci=0;ci<CONN.length;ci++) if(low.indexOf(" "+CONN[ci]+" ")>=0 || low.indexOf(" "+CONN[ci]+",")>=0) conns.push(CONN[ci]);
  var sub=[], su;
  var SUBS=["that","which","who","whom","whose","because","although","though","while","if","unless","whether","when","whenever","since","whereas","despite","in order to","so that","even though","as long as","how"];
  for(su=0;su<SUBS.length;su++) if(low.indexOf(" "+SUBS[su]+" ")>=0) sub.push(SUBS[su]);
  var contr=["don't","can't","won't","isn't","aren't","didn't","doesn't","it's","i'm","you're","they're","we're","couldn't","shouldn't"];
  var shortForms=contr.filter(function(c){ return low.indexOf(c)>=0; });
  var zhPunct=(txt.match(/[，。；：！？、""]/g)||[]).length;
  var capIssue=(txt.match(/[.!?]\s+[a-z]/g)||[]).length + (txt.match(/(^|\s)i(\s|')/g)||[]).length;
  var freq={}, wi, top=[];
  for(wi=0;wi<words.length;wi++){
    var w=words[wi];
    if(w.length<4 || STOP.indexOf(w)>=0) continue;
    freq[w]=(freq[w]||0)+1;
  }
  for(var k in freq) if(freq[k]>=3) top.push({w:k,n:freq[k]});
  top.sort(function(a,b){ return b.n-a.n; });

  var issues=[], goods=[];
  if(n<m.min) issues.push("长度不够：写了 "+n+" 词，目标 ≥"+m.min+"。先把要点补齐，别急着换难词。");
  else goods.push("长度达标（"+n+" 词）。");
  if(!conns.length) issues.push("一个显性连接词都没有。段落之间至少要有一个 however / therefore / for example，让读者知道句子关系。");
  else goods.push("连接词 "+conns.length+" 处："+conns.slice(0,5).join(" / ")+"。");
  if(!sub.length) issues.push("没有从句结构。加一个 which / although / because 引导的从句，句式立刻不像口语。");
  else goods.push("从句标记："+sub.slice(0,4).join(" / ")+"。");
  if(avg>32) issues.push("平均句长 "+avg+" 词，偏长，容易读断。把一句话拆成两句，或删掉重复修饰。");
  else if(avg<9 && sents.length>1) issues.push("平均句长只有 "+avg+" 词，句子太碎。用 and / which / because 把两句合起来。");
  if(shortForms.length) issues.push("有口语缩写："+shortForms.slice(0,4).join(" / ")+"。学术写作里要写全（do not / cannot / it is）。");
  if(zhPunct) issues.push("发现 "+zhPunct+" 个中文标点。中英混用会直接扣印象分，全部改成英文标点。");
  if(capIssue) issues.push("有 "+capIssue+" 处句首或 I 没大写。");
  if(top.length) issues.push("高频重复："+top.slice(0,3).map(function(x){return x.w+"×"+x.n}).join("、")+"。至少换掉一个，用近义词或改指代。");
  if(!issues.length) goods.push("结构层面没发现明显问题。");

  var sc1=Math.min(100, Math.round(n/Math.max(1,m.min)*100));
  var sc2=Math.min(100, 40+conns.length*18+sub.length*8);
  var sc3=100-Math.min(60, shortForms.length*10+zhPunct*15+capIssue*8+(avg>32||avg<9?12:0));
  function bar(label,v){
    return '<div style="margin-bottom:6px"><div class="row" style="justify-content:space-between"><span class="small">'+label+'</span><span class="small muted">'+v+'</span></div>'+
      '<div class="bar thin"><i style="width:'+v+'%"></i></div></div>';
  }
  var h='<div class="card tight" style="margin-top:10px;box-shadow:none;border:1px solid var(--line)">'+
    '<div class="small muted" style="margin-bottom:6px">结构检查（不是语法打分，语法请对照范例自查）</div>'+
    bar("任务完成度",sc1)+bar("连贯与衔接",sc2)+bar("书面规范",Math.max(20,sc3))+
    '<div class="tiny muted" style="margin-top:4px">'+n+' 词 · '+sents.length+' 句 · 平均 '+avg+' 词/句</div>'+
    '<div class="tiny muted" style="margin-top:6px">检查范围：长度、连接词、从句、句长、缩写、中文标点、大小写、重复词。时态、主谓一致、冠词不在范围内——这几项请对照范例逐句自查。</div>'+
    '</div>';
  if(goods.length) h+='<div class="fb" style="margin-top:8px"><b>做到了</b><br>'+goods.map(esc).join("<br>")+'</div>';
  if(issues.length) h+='<div class="fb warn" style="margin-top:8px"><b>要改的 '+issues.length+' 处</b><br>'+issues.map(esc).join("<br>")+'</div>';
  h+='<div class="row mt8"><button class="btn block" onclick="wDone(\''+id+'\','+n+')">完成并记录</button></div>';
  rep.innerHTML=h;
  rep.scrollIntoView({ behavior:"smooth", block:"nearest" });
}

function fourCoverage(){

    tot++;

    if(u.listen) l++;
    if(u.read) r++;
    if(u.view) v++;
    if(u.say) s++;
    if(u.write) w++;
    if(!u.say && !u.write) never++;
  }
  return { total:tot, listen:l, read:r, view:v, say:s, write:w, never:never };
}

function importJSON(f){
  if(!f){ return; }
  if(f.size>12*1024*1024){ toast("文件太大，不像进度文件"); return; }
  var fr=new FileReader();
  fr.onerror=function(){ toast("读取失败：文件无法访问"); };
  fr.onload=function(){
    var raw=String(fr.result||""), o;
    try{ o=JSON.parse(raw); }catch(e){ toast("不是有效的 JSON 文件"); return; }
    if(o && o.db && !o.srs) o=o.db;
    if(!o || typeof o!=="object" || Object.prototype.toString.call(o)==="[object Array]"){ toast("这不像是 EngLab 的进度文件"); return; }
    if(!o.srs && !o.days && !o.use){ toast("文件里没有找到学习记录"); return; }
    var nw=(o.srs?Object.keys(o.srs).length:0), nd=(o.days?Object.keys(o.days).length:0);
    if(!confirm("导入会覆盖这台设备当前的全部学习记录（掌握度、四向计数、打卡、草稿）。\n\n文件里： "+nw+" 个词的记录、"+nd+" 天打卡。\n\n建议先点「导出进度」备份当前数据。确定继续？")) return;
    try{ localStorage.setItem(LS_KEY, JSON.stringify(o)); }
    catch(e){ toast("写入失败：浏览器存储被禁用或空间不足"); return; }
    loadDB(); render();
    toast("已导入 "+nd+" 天记录、"+nw+" 个词");
  };
  fr.readAsText(f);
}

var PASTE_SENTS = [];

function ensurePaste(){ if(!DB.paste) DB.paste=[]; }
function openPaste(){
  ensurePaste();

     '为什么不直接填网址自动抓取：浏览器禁止网页去读别的域名（跨域限制），硬做只会给你空白页或报错。粘贴是更可靠的方式。</div>';

function pasteClip(){

  }).catch(function(){ toast("读取被拒绝，请手动粘贴"); });
}
function pasteBase(w){
  if(VOCAB_BY_W[w]) return w;
  var suf=["s","es","ed","d","ing","ly","er","est"], i, b;
  for(i=0;i<suf.length;i++){
    var s=suf[i];
    if(w.length>s.length+2 && w.slice(-s.length)===s){
      b=w.slice(0,-s.length);
      if(VOCAB_BY_W[b]) return b;
      if(VOCAB_BY_W[b+"e"]) return b+"e";
      if(s==="ing" && b.length>2 && b[b.length-1]===b[b.length-2] && VOCAB_BY_W[b.slice(0,-1)]) return b.slice(0,-1);
    }
  }
  return "";
}
function pasteAnalyze(){
  var el=document.getElementById("ptxt"), rep=document.getElementById("prep");
  if(!el||!rep) return;
  var txt=el.value.replace(/\u00a0/g," ").replace(/[ \t]+/g," ").trim();
  var words=normWords(txt), total=words.length;
  if(total<40){
    rep.innerHTML='<div class="fb bad">只有 '+total+' 个词，太短，看不出难度。至少粘 40 词（差不多两段话）。</div>';
    return;
  }
  var sents=(txt.match(/[^.!?]+[.!?]+/g)||[]).filter(function(s){ return normWords(s).length>2; });
  if(!sents.length) sents=[txt];
  if(sents.length>80) sents=sents.slice(0,80);
  var avg=Math.round(total/Math.max(1,sents.length)*10)/10;
  var hit=0, freq={}, longw=0, i, k;
  for(i=0;i<words.length;i++){
    var w=words[i];
    if(w.length>=8) longw++;
    if(pasteBase(w)) hit++;
    else if(w.length>=4 && STOP.indexOf(w)<0) freq[w]=(freq[w]||0)+1;
  }
  var news=[];
  for(k in freq) news.push({w:k,n:freq[k]});
  news.sort(function(a,b){ return b.n-a.n || b.w.length-a.w.length; });
  news=news.slice(0,12);
  var cov=Math.round(hit/Math.max(1,total)*100);
  PASTE_SENTS=sents;

  var lv = avg<12? "偏简单（句子短，适合快速读）" :
           avg<18? "B1-B2 区间，最舒服的泛读难度" :
           avg<25? "B2-C1，长句多，需要拆结构" :
                   "C1 以上，学术或长句密集，建议逐句读";
  var h='<div class="grid3 stats" style="margin-top:10px">'+
    '<div class="stat"><b>'+total+'</b><span>词数</span></div>'+
    '<div class="stat"><b>'+sents.length+'</b><span>句数</span></div>'+
    '<div class="stat"><b>'+avg+'</b><span>词/句</span></div>'+
    '</div><div style="display:flex;flex-wrap:wrap;margin-top:8px">'+
    '<span class="tag g">库内命中 '+hit+'</span>'+
    '<span class="tag g">长词 '+Math.round(longw/Math.max(1,total)*100)+'%</span>'+
    '<span class="tag g">高频生词 '+news.length+'</span></div>';
  h+='<div class="fb" style="margin-top:8px"><b>难度</b> '+lv+'。词网现有 '+VOCAB.length+' 个词，真实文章里大多数词本来就在库外——命中 '+hit+
     ' 个的意思是：这段里有 '+hit+' 个词正是你在背的，读完顺手把它们复习一遍，比另起炉灶划算。</div>';
  if(news.length){
    h+='<div class="card tight" style="margin-top:10px;box-shadow:none;border:1px solid var(--line)">'+
       '<div class="small" style="font-weight:700;margin-bottom:6px">高频生词（不在库内，点一下听发音）</div>'+
       '<div style="display:flex;flex-wrap:wrap">'+news.map(function(x){
         return '<span class="tag" onclick="speak(\''+esc(x.w).replace(/'/g,"")+'\')">'+esc(x.w)+' <i>×'+x.n+'</i></span>';
       }).join("")+'</div>'+
       '<div class="tiny muted" style="margin-top:6px">这里只给发音和出现次数，不给释义——释义我不编。自己去查一遍，记得更牢。</div></div>';
  }
  h+='<div class="row" style="margin-top:10px"><button class="btn sm block" onclick="pastePlayAll()">整段朗读</button>'+
     '<button class="btn sm ghost" onclick="stopSpeak()">停</button></div>';
  h+='<div class="card tight" style="margin-top:8px;box-shadow:none;border:1px solid var(--line)">'+
     '<div class="small" style="font-weight:700;margin-bottom:6px">逐句（绿字可直接点开词网）</div>';
  sents.forEach(function(s,idx){
    h+='<div class="sent" style="margin-bottom:8px"><div class="small" style="line-height:1.7">'+(idx+1)+'. '+linkWords(s.trim())+'</div>'+
       '<div class="tool" style="margin-top:4px"><button class="mini" onclick="speak(PASTE_SENTS['+idx+'],0.9)">▶ 听这句</button></div></div>';
  });
  h+='</div>';
  rep.innerHTML=h;
  if(!DB.paste) DB.paste=[];
  addSec(Math.max(60, Math.round(total*0.6)));
  touch("read",1); markStep("read"); saveDB();
  rep.scrollIntoView({ behavior:"smooth", block:"nearest" });
}
