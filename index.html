/* ---------------- P2-2 自动快照备份（独立 IndexedDB） ---------------- */
var SNAP={ db:null, list:[], busy:false, loaded:false, MAX:4, DBNAME:"englab_snap", STORE:"snaps" };
function snapOpenP(){
  return new Promise(function(res, rej){
    if(!window.indexedDB){ rej(new Error("这个浏览器不支持 IndexedDB")); return; }
    if(SNAP.db){ res(SNAP.db); return; }
    var rq;
    try{ rq=indexedDB.open(SNAP.DBNAME, 1); }catch(e){ rej(e); return; }
    rq.onupgradeneeded=function(ev){
      var d=ev.target.result;
      if(!d.objectStoreNames.contains(SNAP.STORE)) d.createObjectStore(SNAP.STORE, { keyPath:"id" });
    };
    rq.onerror=function(){ rej(rq.error||new Error("快照库打不开")); };
    rq.onsuccess=function(){ SNAP.db=rq.result; res(SNAP.db); };
  });
}
function snapAll(){
  return snapOpenP().then(function(d){
    return new Promise(function(res, rej){
      var tx=d.transaction(SNAP.STORE,"readonly"), st=tx.objectStore(SNAP.STORE), rq=st.getAll();
      rq.onsuccess=function(){ res(rq.result||[]); };
      rq.onerror=function(){ rej(rq.error||new Error("读取快照失败")); };
    });
  });
}
function snapPut(rec){
  return snapOpenP().then(function(d){
    return new Promise(function(res, rej){
      var tx=d.transaction(SNAP.STORE,"readwrite");
      tx.objectStore(SNAP.STORE).put(rec);
      tx.oncomplete=function(){ res(true); };
      tx.onerror=function(){ rej(tx.error||new Error("写入快照失败")); };
      tx.onabort=function(){ rej(tx.error||new Error("写入快照被中止")); };
    });
  });
}
function snapDelRaw(id){
  return snapOpenP().then(function(d){
    return new Promise(function(res, rej){
      var tx=d.transaction(SNAP.STORE,"readwrite");
      tx.objectStore(SNAP.STORE).delete(id);
      tx.oncomplete=function(){ res(true); };
      tx.onerror=function(){ rej(tx.error||new Error("删除快照失败")); };
    });
  });
}
function snapPayload(){
  var e=errInit();
  return {
    v:1, ts:Date.now(), day:dk(),
    start:DB.start||"", goal:(DB.goal|0), rate:DB.rate, voice:DB.voice||"",
    acc:DB.acc||"us", net:DB.net||"online",
    /* v22：主题偏好随快照走，恢复后不会弹回浅色 */
    theme:(DB.theme==="light"||DB.theme==="dark")?DB.theme:"auto",
    srs:DB.srs||{}, days:DB.days||{}, use:DB.use||{},
    exam:DB.exam||{ name:"", date:"", target:0 },
    err:e, lapse:(DB.lapse||{}), lapseCfg:(DB.lapseCfg||{ on:1 }),
    prodLog:(DB.prodLog||[]).slice(-60),
    myWords:myBag(),
    fix:(DB.fix||[]).slice(0,20),
    /* v18：精听答题历史，随快照/云备份一起走 */
    listen:(function(){ var o={}, k, a; var src=DB.listen||{}; for(k in src){ a=src[k]; if(a instanceof Array) o[k]=a.slice(-60); } return o; })(),
    /* v20：句子听写本轮记录，随快照/云备份一起走 */
    dictSent:(DB.dictSent||[]).slice(-30),
    /* v23：背景听断点，随快照/云备份一起走 */
    bgProg:bgProgMerge(DB.bgProg, {}),
    /* v24：有效门槛档位（带时间戳）与没听清标记，一起走 */
    bgGoal:bgGoalNorm(DB.bgGoal), bgGoalTs:(Number(DB.bgGoalTs) || 0),
    bgMark:bgMarkNormArr(DB.bgMark),
    /* v25：口音筛选（带时间戳）随快照/云备份走 */
    bgAcc:bgAccNorm(DB.bgAcc), bgAccTs:(Number(DB.bgAccTs) || 0),
    /* v27：睡前时长档位与自动收尾开关（带时间戳）随快照/云备份走 */
    bgSleepMins:bgSleepMinsNorm(DB.bgSleepMins), bgSleepAuto:bgSleepAutoNorm(DB.bgSleepAuto),
    bgSleepTs:(Number(DB.bgSleepTs) || 0)
  };
}
function snapN(o){ try{ return Object.keys(o.srs||{}).length; }catch(e){ return 0; } }
function snapD(o){ try{ return Object.keys(o.days||{}).length; }catch(e){ return 0; } }
function snapSz(o){ try{ return JSON.stringify(o).length; }catch(e){ return 0; } }
function snapReasonText(r){
  return r==="auto" ? "打开自动" : r==="manual" ? "手动备份" : r==="before-restore" ? "恢复前留存" : "备份";
}
/* 生成一份快照；自动快照当天只存一次，超出 4 份淘汰最旧 */
function snapTake(reason){
  var p=snapPayload();
  var rec={ id:"s"+p.ts+"_"+Math.floor(Math.random()*100000), ts:p.ts, day:p.day,
            reason:reason||"manual", n:snapN(p), d:snapD(p), size:snapSz(p), data:p };
  return snapAll().then(function(all){
    var list=(all||[]).slice();
    if(reason==="auto"){
      for(var i=0;i<list.length;i++){
        if(list[i].day===p.day && list[i].reason==="auto") return { ok:true, skipped:true, list:list };
      }
    }
    list.push(rec);
    list.sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
    var dead=[];
    while(list.length>SNAP.MAX) dead.push(list.shift());
    return snapPut(rec).then(function(){
      var jobs=[];
      for(var j=0;j<dead.length;j++) jobs.push(snapDelRaw(dead[j].id).catch(function(){ return null; }));
      return Promise.all(jobs).then(function(){
        DB.snapLast=p.day; saveDB();
        SNAP.list=list; SNAP.loaded=true;
        return { ok:true, skipped:false, rec:rec, evicted:dead.length, list:list };
      });
    });
  });
}
/* 每天首次打开自动备份 */
function snapAuto(){
  if(DB.snapLast===dk()) return;   /* 当天已有快照，不重复 */
  snapTake("auto").then(function(r){
    if(!r || r.skipped) return;
    if(CURRENT==="home" || CURRENT==="snap" || CURRENT==="me"){ try{ render(); }catch(e){} }
  }).catch(function(e){
    toast("自动备份失败："+(e && e.message ? e.message : "浏览器存储不可用"));
  });
}
function snapNow(){
  snapTake("manual").then(function(r){
    if(r && r.ok){
      toast("已备份（共 "+r.list.length+" 份"+(r.evicted?("，淘汰最旧 "+r.evicted+" 份"):"")+"）");
      if(CURRENT==="snap" || CURRENT==="home") render();
    }
  }).catch(function(e){ toast("备份失败："+(e && e.message ? e.message : "未知错误")); });
}
/* 恢复：先把当前状态存一份，再套用快照（禁止覆盖式恢复） */
function snapRestore(id){
  snapAll().then(function(all){
    var t=null, i;
    for(i=0;i<all.length;i++) if(all[i].id===id) t=all[i];
    if(!t){ toast("这份快照找不到了"); return null; }
    return snapTake("before-restore").then(function(){
      var p=t.data||{};
      if(p.srs) DB.srs=p.srs;
      if(p.days) DB.days=p.days;
      if(p.use) DB.use=p.use;
      if(p.exam) DB.exam=p.exam;
      if(p.err) DB.err=p.err;
      if(p.lapse) DB.lapse=p.lapse;
      if(p.lapseCfg) DB.lapseCfg=p.lapseCfg;
      if(p.goal) DB.goal=p.goal;
      if(p.rate) DB.rate=p.rate;
      if(p.start) DB.start=p.start;
      if(p.prodLog) DB.prodLog=p.prodLog;
      if(p.myWords && typeof p.myWords==="object" && !(p.myWords instanceof Array)){ DB.myWords=p.myWords; }
      if(p.fix instanceof Array) DB.fix=p.fix.slice(0,20);
      if(p.listen && typeof p.listen==="object" && !(p.listen instanceof Array)){ DB.listen=p.listen; }
      /* v23：背景听断点一起恢复，恢复后从快照那天的段接着听 */
      if(p.bgProg && typeof p.bgProg==="object" && !(p.bgProg instanceof Array)){ DB.bgProg=bgProgMerge(DB.bgProg, p.bgProg); }
      /* v24：门槛按时间戳取较新（旧快照降不回去）；标记清单按 id 合并，不丢已有的 */
      if(p.bgGoal !== undefined && p.bgGoal !== null){

/* ---------------- P3-1 断点降级策略 ---------------- */
function lapseCfg(){
  if(!DB.lapseCfg || typeof DB.lapseCfg!=="object") DB.lapseCfg={ on:1 };
  if(DB.lapseCfg.on===undefined) DB.lapseCfg.on=1;
  return DB.lapseCfg;
}
function lapseRec(){
  if(!DB.lapse || typeof DB.lapse!=="object") DB.lapse={ d:"", orig:0, missed:0, back:"", snooze:"" };
  if(DB.lapse.snooze===undefined) DB.lapse.snooze="";
  return DB.lapse;
}
function dayActive_(r){
  if(!r) return false;
  if((r.sec||0)>=60) return true;
  if(r.m && Object.keys(r.m).length) return true;
  if(r.p && r.p.length) return true;
  return false;
}
function lapseHist_(){ var n=0,k; for(k in DB.days) if(dayActive_(DB.days[k])) n++; return n; }
function lapseMissed_(){
  var d=new Date(); d.setDate(d.getDate()-1);
  var n=0,i,k;
  for(i=0;i<90;i++){
    k=dk(d);
    if(dayActive_(DB.days[k])) break;
    n++; d.setDate(d.getDate()-1);
  }
  return n;
}
function lapseCheck(){
  var cfg=lapseCfg(), l=lapseRec(), today=dk();
  /* 1) 回升：降级生效日之后，任意一天有活动 → 恢复原目标 */
  if(l.d && l.d<today){
    var back=false, k;
    for(k in DB.days){ if(k>l.d && dayActive_(DB.days[k])){ back=true; break; } }
    if(back){
      var g=(l.orig|0) || ((DB.exam && DB.exam.planQ)|0) || 20;
      DB.goal=g;
      l.back=today; l.d=""; l.missed=0; l.orig=0;
      saveDB();
      toast("已恢复打卡，每日新词回升到 "+g+" 个");
      return { state:"restored", goal:g };
    }
  }
  if(!cfg.on) return { state:"off" };
  if(l.snooze===today) return { state:"snooze" };
  /* 2) 当天已降级：保证目标仍是 10 */
  if(l.d===today){
    if((DB.goal|0)!==10){ DB.goal=10; saveDB(); }
    return { state:"degraded", fresh:false };
  }
  if(lapseHist_()<1) return { state:"new" };     /* 从没用过，不谈降级 */
  /* 今天已经有活动（用户已经回来了）：不再压目标，交给 SRS 自然恢复 */
  if(dayActive_(DB.days[today])) return { state:"ok" };
  var miss=lapseMissed_();
  if(miss<2) return { state:"ok" };
  if((DB.goal|0)<=10) return { state:"ok" };      /* 目标本来就小，不必再降 */
  l.orig=(DB.goal|0); l.d=today; l.missed=miss; l.back="";
  DB.goal=10;
  saveDB();
  toast("连续漏打卡 "+miss+" 天，今天新词先降到 10 个（原目标 "+l.orig+" 已备份）");
  return { state:"degraded", fresh:true, orig:l.orig, missed:miss };
}

             : '已关闭。漏打卡不再自动改目标，每日词量完全由你自己定。')+'</div>';

/* ================= 自定义词条（我的词）：与内置词同权 ================= */
var MY_LS = "englab_mywords_v1";
function myBag(){
  if(!DB.myWords || typeof DB.myWords!=="object" || DB.myWords instanceof Array) DB.myWords={};
  return DB.myWords;
}
function myCount(){ var b=myBag(), n=0, k; for(k in b){ if(b[k] && b[k].w) n++; } return n; }
function myList(){
  var b=myBag(), out=[], k;
  for(k in b){ if(b[k] && b[k].w) out.push(b[k]); }
  out.sort(function(x,y){ return String(x.w).toLowerCase()<String(y.w).toLowerCase()?-1:1; });
  return out;
}
/* 多值字段：支持 | 、 逗号 、 顿号 、 分号 分隔 */
function mySplit(t){
  var a=String(t==null?"":t).split(/[|｜,，、;；\n\/]+/), out=[], i;
  for(i=0;i<a.length;i++){ var x=a[i].replace(/^\s+|\s+$/g,""); if(x) out.push(x); }
  return out;
}
/* 记录 → 词网条目结构（字段齐全，空字段给默认值，避免下游 v.fam.length 之类炸掉） */
function myToVocab(e){
  return { w:e.w, ph:e.ph||"", pos:e.pos||"", cn:e.cn||"", root:e.root||"",
    fam:(e.fam||[]).slice(), syn:(e.syn||[]).slice(), ant:(e.ant||[]).slice(),
    col:(e.col||[]).slice(), ex:e.ex||"", exCn:e.exCn||"", scene:e.scene||"",
    conf:(e.conf||[]).slice(), __my:1 };
}
/* 把自定义词并进 VOCAB / VOCAB_BY_W：词网详情、检索、复习队列、四向计数、掌握度全部复用同一套逻辑 */
function mySync(){
  try{
    var b=myBag(), k, i;
    if(typeof VOCAB!=="undefined" && VOCAB && VOCAB.length){
      for(i=VOCAB.length-1;i>=0;i--){ if(VOCAB[i] && VOCAB[i].__my) VOCAB.splice(i,1); }
      /* 与内置词同名的自定义词不并入词网：内置词永远优先，避免导入文件把内置词顶掉 */
      var built={};
      for(i=0;i<VOCAB.length;i++){ if(VOCAB[i] && VOCAB[i].w && !VOCAB[i].__my) built[String(VOCAB[i].w).toLowerCase()]=1; }
      for(k in b){ if(b[k] && b[k].w && !built[String(b[k].w).toLowerCase()]) VOCAB.push(myToVocab(b[k])); }
    }
    if(typeof VOCAB_BY_W!=="undefined"){
      VOCAB_BY_W={};
      if(typeof VOCAB!=="undefined"){
        for(i=0;i<VOCAB.length;i++){ var v=VOCAB[i]; if(v && v.w) VOCAB_BY_W[String(v.w).toLowerCase()]=v; }
      }
    }
  }catch(e){}
  return myCount();
}

function myRestore(){
  try{
    if(DB.myWords && typeof DB.myWords==="object" && !(DB.myWords instanceof Array)) return;
    var raw=localStorage.getItem(MY_LS);

/* 删除（二次确认，并说明会一并清掉哪些记录） */
function myDelAsk(key){

     '· 四向计数：听 '+(u.listen||0)+' · 读 '+(u.read||0)+' · 看 '+(u.view||0)+' · 说 '+(u.say||0)+' · 写 '+(u.write||0)+'<br>'+

function myDelDo(key){

/* ==== el27_week.js ==== */
/* ================= 每周复盘报告（自然周：周一至周日） ================= */
var WK = { off:0, max:7 };
var KIND5 = [ {k:"listen",t:"听"}, {k:"read",t:"读"}, {k:"view",t:"看"}, {k:"say",t:"说"}, {k:"write",t:"写"} ];
function wkMon(d){
  var src=d||new Date();
  var x=new Date(src.getFullYear(), src.getMonth(), src.getDate());
  var wd=(x.getDay()+6)%7;
  x.setDate(x.getDate()-wd);
  return x;
}
function wkRange(off){
  var m=wkMon(new Date());
  m.setDate(m.getDate()+(off||0)*7);
  var e=new Date(m.getFullYear(), m.getMonth(), m.getDate()+6);
  return { start:new Date(m.getFullYear(),m.getMonth(),m.getDate()), end:e, sk:dk(m), ek:dk(e) };
}
function wkDays(r){
  var out=[], d=new Date(r.start.getFullYear(), r.start.getMonth(), r.start.getDate());
  for(var i=0;i<7;i++){ out.push(dk(d)); d.setDate(d.getDate()+1); }
  return out;
}
function wkLabel(r){ return r.sk+" ~ "+r.ek; }
function wkTitle(off){ return off===0? "本周" : (off===-1? "上周" : (Math.abs(off)+" 周前")); }
function wkShift(n){
  var t=(WK.off|0)+n;
  if(t>0) t=0;
  if(t< -WK.max) t=-WK.max;
  WK.off=t; render();
}
function wkStreakEnd(ek){
  var n=0, y=parseInt(ek.slice(0,4),10), mo=parseInt(ek.slice(5,7),10)-1, da=parseInt(ek.slice(8,10),10);
  var d=new Date(y,mo,da);
  for(var i=0;i<400;i++){
    var k=dk(d), r=DB.days[k];
    var act= r && (((r.sec|0)>20) || (r.m && Object.keys(r.m).length));
    if(!act) break;
    n++; d.setDate(d.getDate()-1);
  }
  return n;
}
/* 一周统计（全部本地计算，不发网络请求） */
function wkStat(off){
  var r=wkRange(off), days=wkDays(r), cnt={}, min={}, i, j;
  for(i=0;i<KIND5.length;i++){ cnt[KIND5[i].k]=0; min[KIND5[i].k]=0; }
  cnt.word=0;
  var totSec=0, active=0, est=0;
  for(i=0;i<days.length;i++){
    var rec=DB.days[days[i]];
    if(!rec) continue;
    var m=rec.m||{}, sx=rec.sx||null, daySec=rec.sec|0, sum=0;
    for(j=0;j<KIND5.length;j++) sum+=(m[KIND5[j].k]|0);
    cnt.word+=(m.word|0);
    for(j=0;j<KIND5.length;j++){
      var kk=KIND5[j].k, c=(m[kk]|0);
      cnt[kk]+=c;
      if(sx && (sx[kk]|0)>0){ min[kk]+=(sx[kk]|0)/60; }
      else if(c>0 && sum>0 && daySec>0){ min[kk]+=daySec*c/sum/60; est=1; }
    }
    totSec+=daySec;
    if(daySec>20 || sum>0) active++;
  }
  /* 词网：本周评过分的词、其中到掌握(≥5)的 */
  var touched=0, up5=0, k2, s2;
  for(k2 in DB.srs){
    s2=DB.srs[k2]; if(!s2) continue;
    var last=String(s2.last||"");
    if(last>=r.sk && last<=r.ek){ touched++; if((s2.lv|0)>=5) up5++; }
  }
  /* 错因分布（错因账本只保留最近 30 天，更早的周会偏少） */
  var e=DB.err||{}, eDay=e.day||{}, ed=0, tags={};
  for(j=0;j<ERR_TAGS.length;j++) tags[ERR_TAGS[j].k]=0;
  for(i=0;i<days.length;i++){
    var er=eDay[days[i]];
    if(!er) continue;
    for(j=0;j<ERR_TAGS.length;j++){ var n2=(er[ERR_TAGS[j].k]|0); tags[ERR_TAGS[j].k]+=n2; ed+=n2; }
  }
  /* 逾期：本周用实时到期数；历史周按当前记录推算截至该周末应复习而未复习的 */
  var overdue=0;
  if(off>=0){ overdue=dueWords().length; }
  else{
    for(k2 in DB.srs){
      s2=DB.srs[k2];
      if(!VOCAB_BY_W[k2] || !s2) continue;
      if(s2.due && s2.due<=r.ek && String(s2.last||"")<=r.ek) overdue++;
    }
  }
  /* 只有输入没有输出的词（碰过听/读/看，说/写为 0） */
  var inOnly=[], k3, u3;
  for(k3 in (DB.use||{})){
    if(!VOCAB_BY_W[k3]) continue;
    u3=DB.use[k3]||{};
    var inp=(u3.listen|0)+(u3.read|0)+(u3.view|0);
    var outp=(u3.say|0)+(u3.write|0);
    if(inp>0 && outp===0) inOnly.push({ w:k3, n:inp });
  }
  inOnly.sort(function(x,y){ return (y.n|0)-(x.n|0); });
  /* 精听答题历史（v18）：按周范围从 DB.listen 里筛，段数 / 平均正确率 / 用时都是真实记录 */
  var lsn=0, lsSec=0, lsRight=0, lsQs=0, lsFull=0, kS, arrS, jS, hS;
  var lsMap=DB.listen||{};
  for(kS in lsMap){
    arrS=lsMap[kS];
    if(!(arrS instanceof Array)) continue;
    for(jS=0;jS<arrS.length;jS++){
      hS=arrS[jS]; if(!hS) continue;
      var hd=String(hS.d||"");
      if(!(hd>=r.sk && hd<=r.ek)) continue;
      lsn++; lsSec+=Number(hS.sec||0);
      lsRight+=(hS.right|0); lsQs+=(hS.qs|0);
      if(hS.full) lsFull++;
    }
  }
  /* 句子听写（v20）：按周范围从 DB.dictSent 里筛真实记录 */
  var dsN=0, dsSent=0, dsWords=0, dsRight=0, jD, hD, hdd;
  var dsArr=(DB.dictSent instanceof Array)? DB.dictSent : [];
  for(jD=0;jD<dsArr.length;jD++){
    hD=dsArr[jD]; if(!hD) continue;
    hdd=String(hD.d||"");
    if(!(hdd>=r.sk && hdd<=r.ek)) continue;
    dsN++; dsSent+=(hD.n|0); dsWords+=(hD.words|0); dsRight+=(hD.right|0);
  }
  var st=(off>=0)? streak() : wkStreakEnd(r.ek);
  var any=(active>0 || touched>0 || ed>0 || (cnt.word|0)>0 || lsn>0 || dsN>0);
  return { off:off, r:r, days:days, cnt:cnt, min:min, totalMin:Math.round(totSec/60), active:active,
    est:est, touched:touched, up5:up5, errTot:ed, tags:tags, overdue:overdue, inOnly:inOnly,
    lsn:lsn, lsMin:Math.round(lsSec/60), lsAcc:(lsQs? Math.round(lsRight/lsQs*100):0), lsFull:lsFull,
    dsN:dsN, dsSent:dsSent, dsWords:dsWords, dsAcc:(dsWords? Math.round(dsRight/dsWords*100):0),
    streak:st, any:any, sec:totSec };
}
function wkDelta(n, unit){
  if(!n) return '<span class="tiny muted">持平</span>';
  var up=(n>0);
  return '<span class="tiny" style="color:'+(up?"var(--ok-tx)":"var(--bad-tx)")+'">'+(up?"+":"")+n+(unit||"")+'</span>';
}
function wkLine(l, v, d){
  return '<div class="row" style="justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line)">'+
    '<span class="small">'+l+'</span><span class="small"><b>'+v+'</b> '+(d||'')+'</span></div>';
}
function wkAdvice(S, P){
  var out=[], i, tot=S.errTot|0, top=null, topn=0;
  if(tot>0){
    for(i=0;i<ERR_TAGS.length;i++){
      var n=S.tags[ERR_TAGS[i].k]|0;
      if(n>topn){ topn=n; top=ERR_TAGS[i]; }
    }
  }
  if(top && tot>0){
    var pct=Math.round(topn/tot*100);
    var how = top.k==="hear"
      ? "去「听读看 · 听写」练 10 分钟：先整句盲听一遍再逐词打字，做完再对照文本。"
      : (top.k==="spell"
        ? "挑这 10 个词做拼写专项：按词根词族分组默写，别整词硬背。"
        : "这些词还只是「见过」：挑 3 个各写进一句自己的话，再进「说」的话题卡讲一遍。");
    out.push("本周 "+pct+"% 的错误是「"+top.t+"」（"+top.d+"）。"+how);
  }
  var inp=(S.cnt.listen|0)+(S.cnt.read|0)+(S.cnt.view|0);
  var outp=(S.cnt.say|0)+(S.cnt.write|0);
  if(inp>0 && (outp===0 || inp/outp>=3)){
    out.push("输入 "+inp+" 次、输出 "+outp+" 次——比例失衡。"+(outp===0
      ? "今天先做一件最小的事：把「只有输入没有输出」清单里的第一个词写进一句话。"
      : "下周把「说」的时间翻倍：每天 3 分钟复述一段刚读完的材料。"));
  }
  if(S.inOnly.length>=5){
    var names=[];
    for(i=0;i<Math.min(3,S.inOnly.length);i++) names.push(S.inOnly[i].w);
    out.push("有 "+S.inOnly.length+" 个词只碰过听/读/看，从没说过写过。先从最靠前的 3 个开始（"+names.join(" / ")+"），每个造一句。");
  }
  if((S.overdue|0)>=20){
    out.push("逾期未复习 "+S.overdue+" 个词，复习队列已经被压住。先清「词网 · 待复习」，这周别急着加新词。");
  }
  if(P.any){
    var d=Math.round(S.totalMin-P.totalMin);
    if(d<=-15) out.push("本周比上周少了 "+Math.abs(d)+" 分钟。当前连续 "+S.streak+" 天，惯性比强度重要：明天先做 10 分钟，别等整块时间。");
  }
  if(!out.length){
    out.push("数据还不足以定位问题（错因 "+tot+" 条、五步次数偏少）。再攒两周：每次答错都点一个错因，报告才有东西可分析。");
  }
  while(out.length>3) out.pop();
  return out;
}
function htmlWeek(){

  /* 4. 只有输入没有输出 */
  h+='<div class="card"><div class="hd"><h3>只有输入没有输出的词</h3><span class="sub">'+(S.inOnly.length? S.inOnly.length+" 个" : "无")+'</span></div>';
  if(S.inOnly.length){
    h+='<div class="small muted" style="margin-bottom:2px">碰过听 / 读 / 看，但「说」和「写」都是 0——这类词认得，用不出来。</div>';
    for(i=0;i<Math.min(10,S.inOnly.length);i++){
      var it=S.inOnly[i];
      h+='<div class="wrow" onclick="openWord(\''+esc(it.w).replace(/'/g,"")+'\')">'+
         '<span class="lw">'+esc(it.w)+'</span>'+
         '<span class="lc">'+esc((VOCAB_BY_W[it.w]||{}).cn||"")+'</span>'+
         '<span class="lr">碰到 '+it.n+' 次 · 说0 写0</span></div>';
    }
    if(S.inOnly.length>10) h+='<div class="tiny muted" style="margin-top:6px">只列前 10 个（按碰到的次数排序）。完整清单在导出的 CSV 里。</div>';
  }else{
    h+='<div class="small muted" style="margin-top:6px">没有这种词：碰过的词里都有过口头或书面输出。</div>';
  }
  h+='</div>';

  /* 5. 可执行建议 */
  var adv=wkAdvice(S,P);
  h+='<div class="card"><div class="hd"><h3>下周怎么做</h3><span class="sub">基于本周真实数据</span></div>';
  for(i=0;i<adv.length;i++){
    h+='<div class="small" style="line-height:1.95;margin-top:6px"><b>'+(i+1)+'.</b> '+adv[i]+'</div>';
  }
  h+='</div>';

  /* 6. 与上周对比 */
  h+='<div class="card"><div class="hd"><h3>与上周对比</h3><span class="sub">'+(P.any? esc(wkLabel(P.r)) : "上周无记录")+'</span></div>';
  if(P.any){
    h+=wkLine("总时长", Math.round(S.totalMin)+" 分钟", wkDelta(Math.round(S.totalMin-P.totalMin), " 分钟"));
    var tc=0, pc2=0;
    for(i=0;i<KIND5.length;i++){ tc+=(S.cnt[KIND5[i].k]|0); pc2+=(P.cnt[KIND5[i].k]|0); }
    h+=wkLine("五步总次数", tc+" 次", wkDelta(tc-pc2, " 次"));
    h+=wkLine("活跃天数", S.active+" 天", wkDelta(S.active-P.active, " 天"));
    h+=wkLine("错因次数", (S.errTot|0)+" 次", wkDelta((S.errTot|0)-(P.errTot|0), " 次"));
    h+=wkLine("词网过词", S.touched+" 个", wkDelta(S.touched-P.touched, " 个"));
    h+=wkLine("逾期未复习", S.overdue+" 个", wkDelta(S.overdue-P.overdue, " 个"));
  }else{
    h+='<div class="small muted" style="margin-top:6px">上周（'+(WK.off-1)+' 周次）没有任何记录，无法对比。等下周再看这张表会有意义。</div>';
  }
  h+='</div>';

  /* 7. 导出 */
  h+='<div class="card tight"><div class="hd"><h3>导出</h3></div>'+
    '<div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap">'+
    '<button class="btn sm" onclick="wkExport(\'csv\')">导出周报 CSV</button>'+
    '<button class="btn sm ghost" onclick="wkExport(\'txt\')">导出周报文本</button>'+
    '<button class="btn sm ghost" onclick="go(\'me\')">回我的</button></div>'+
    '<div class="tiny muted" style="margin-top:7px;line-height:1.8">文件名带周次与日期范围，直接下载到本机，不上传任何服务器。</div></div>';
  return h;
}
function wkFname(ext){
  var r=wkRange(WK.off);
  return "englab-week-"+r.sk+"_"+r.ek+"."+ext;
}
function wkCsvCell(x){
  return '"'+String(x==null?"":x).replace(/"/g,'""')+'"';
}
function wkExport(kind){
  var S=wkStat(WK.off), P=wkStat(WK.off-1), i;
  var label=(WK.off===0? "本周" : (WK.off===-1? "上周" : (Math.abs(WK.off)+"周前")));
  var r=S.r;
  if(kind==="txt"){
    var L=[], adv=wkAdvice(S,P);
    L.push("EngLab 每周复盘 · "+label);
    L.push("日期范围："+r.sk+" ~ "+r.ek+"（周一至周日）");
    L.push("导出时间："+dk()+" "+new Date().toTimeString().slice(0,5));
    L.push("");
    if(!S.any){
      L.push("【结论】本周无记录：这一周没有任何学习数据。");
    }else{
      L.push("【五步投入】");
      for(i=0;i<KIND5.length;i++){
        var o=KIND5[i];
        L.push("  "+o.t+"："+(S.cnt[o.k]|0)+" 次 / "+(S.est?"≈":"")+Math.round(S.min[o.k]||0)+" 分钟"+
          (P.any? "（上周 "+(P.cnt[o.k]|0)+" 次）" : ""));
      }
      L.push("  总时长："+Math.round(S.totalMin)+" 分钟；活跃 "+S.active+"/7 天；词网评分 "+(S.cnt.word|0)+" 次");
      L.push("  精听完成："+((S.lsn|0)? ((S.lsn|0)+" 段（平均正确率 "+S.lsAcc+"%，满分 "+S.lsFull+" 段，用时 "+S.lsMin+" 分钟）") : "本周未完成整段精听"));
      L.push("  句子听写："+((S.dsN|0)? ((S.dsN|0)+" 轮 / "+(S.dsSent|0)+" 句 / 逐词正确率 "+S.dsAcc+"%（共 "+S.dsWords+" 词）") : "本周没做"));
      L.push("");
      L.push("【词网与掌握】");
      L.push("  本周在词网评过分："+S.touched+" 个；到掌握(>=5/7)："+S.up5+" 个");
      L.push("  逾期未复习："+S.overdue+" 个；连续学习："+S.streak+" 天");
      L.push("");
      L.push("【错因分布】共 "+(S.errTot|0)+" 次");
      if((S.errTot|0)>0){
        for(i=0;i<ERR_TAGS.length;i++){
          var t2=ERR_TAGS[i], n2=(S.tags[t2.k]|0);
          L.push("  "+t2.t+"："+n2+" 次（"+(S.errTot? Math.round(n2/S.errTot*100):0)+"%）");
        }
      }else{ L.push("  本周无错因记录"); }
      L.push("");
      L.push("【只有输入没有输出】"+(S.inOnly.length? S.inOnly.length+" 个" : "无"));
      for(i=0;i<S.inOnly.length;i++){ L.push("  "+S.inOnly[i].w+"（碰到 "+S.inOnly[i].n+" 次，说0 写0）"); }
      L.push("");
      L.push("【与上周对比】"+(P.any? ("总时长 "+(Math.round(S.totalMin-P.totalMin)>=0?"+":"")+Math.round(S.totalMin-P.totalMin)+" 分钟") : "上周无记录"));
      L.push("");
      L.push("【下周怎么做】");
      for(i=0;i<adv.length;i++) L.push("  "+(i+1)+". "+adv[i].replace(/<\/?[a-zA-Z]+[^>]*>/g,""));
    }
    dl(wkFname("txt"), L.join("\r\n"), "text/plain;charset=utf-8");
    toast("已导出周报文本");
    return;
  }
  var rows=[];
  rows.push([wkCsvCell("EngLab 每周复盘"), wkCsvCell(label)]);
  rows.push([wkCsvCell("日期范围"), wkCsvCell(r.sk+" ~ "+r.ek)]);
  rows.push([wkCsvCell("指标"), wkCsvCell("本周"), wkCsvCell("上周")]);
  function row(name, a, b){ rows.push([wkCsvCell(name), wkCsvCell(a), wkCsvCell(P.any? b : "")]); }
  for(i=0;i<KIND5.length;i++){
    var o2=KIND5[i];
    row(o2.t+"次数", (S.cnt[o2.k]|0), (P.cnt[o2.k]|0));
    row(o2.t+"分钟", (S.est?"~":"")+Math.round(S.min[o2.k]||0), Math.round(P.min[o2.k]||0));
  }
  row("词网评分次数", (S.cnt.word|0), (P.cnt.word|0));
  row("精听完成段数", (S.lsn|0), (P.lsn|0));
  row("精听平均正确率%", (S.lsn|0)? S.lsAcc : "", (P.lsn|0)? P.lsAcc : "");
  row("精听满分段数", (S.lsFull|0), (P.lsFull|0));
  row("精听用时分钟", (S.est?"~":"")+S.lsMin, P.lsMin);
  row("句子听写轮数", (S.dsN|0), (P.dsN|0));
  row("句子听写句数", (S.dsSent|0), (P.dsSent|0));
  row("句子听写逐词正确率%", (S.dsN|0)? S.dsAcc : "", (P.dsN|0)? P.dsAcc : "");
  row("总时长分钟", Math.round(S.totalMin), Math.round(P.totalMin));
  row("活跃天数", S.active, P.active);
  row("本周词网过词", S.touched, P.touched);
  row("到掌握>=5", S.up5, P.up5);
  row("逾期未复习", S.overdue, P.overdue);
  row("连续学习天数", S.streak, P.streak);
  row("错因总次数", (S.errTot|0), (P.errTot|0));
  for(i=0;i<ERR_TAGS.length;i++){
    var t3=ERR_TAGS[i];
    row("错因-"+t3.t, (S.tags[t3.k]|0), (P.tags[t3.k]|0));
  }
  rows.push([wkCsvCell("只有输入没有输出的词"), wkCsvCell(S.inOnly.length? S.inOnly.map(function(x){ return x.w; }).join(" | ") : "无"), wkCsvCell("")]);
  var adv2=wkAdvice(S,P);
  for(i=0;i<adv2.length;i++) rows.push([wkCsvCell("建议"+(i+1)), wkCsvCell(adv2[i].replace(/<\/?[a-zA-Z]+[^>]*>/g,"")), wkCsvCell("")]);
  dl(wkFname("csv"), "\ufeff"+rows.map(function(x){ return x.join(","); }).join("\r\n"), "text/csv;charset=utf-8");
  toast("已导出周报 CSV");
}

/* ================= v22 整页深色模式 =================
   三档：auto 跟随系统 / light 浅色 / dark 深色；只改 html[data-theme]，颜色全部由 CSS 变量切换，
   因此切主题不需要整页重载，答题进度、播放队列、定时器都不会被打断。 */
var THEME={ mode:"auto", dark:false, mq:null };
function themeMode(){ return (DB.theme==="light"||DB.theme==="dark") ? DB.theme : "auto"; }
function themeSysDark(){
  try{ return !!(THEME.mq && THEME.mq.matches); }catch(e){ return false; }
}
function themeIsDark(){
  var m=themeMode();
  if(m==="dark") return true;
  if(m==="light") return false;
  return themeSysDark();
}
/* 套用主题：写 data-theme + 同步地址栏/状态栏配色，再把设置页按钮态刷一遍 */
function themeApply(){
  var dark=themeIsDark();
  THEME.mode=themeMode(); THEME.dark=dark;
  try{ document.documentElement.setAttribute("data-theme", dark?"dark":"light"); }catch(e){}
  try{
    var mc=document.querySelector('meta[name="theme-color"]');
    if(mc) mc.setAttribute("content", dark?"#0F1410":"#FBFBF8");
    var sa=document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if(sa) sa.setAttribute("content", dark?"black-translucent":"default");
  }catch(e){}
  themeSyncBtns();
  return dark;
}
/* 不重建页面也能更新三档按钮的选中态，避免切主题时把当前页状态重置掉 */
function themeSyncBtns(){
  var cur=themeMode(), bs=document.querySelectorAll("[data-th]"), i, b;
  for(i=0;i<bs.length;i++){
    b=bs[i];
    b.className = (b.getAttribute("data-th")===cur) ? "on" : "";
  }
}
function themeBtn(v,label){
  return '<button data-th="'+v+'" class="'+(themeMode()===v?"on":"")+'" onclick="themeSet(\''+v+'\')">'+label+'</button>';
}
function themeSet(m){
  DB.theme = (m==="light"||m==="dark") ? m : "auto";
  saveDB();
  var dark=themeApply();
  if(CURRENT==="me"){ try{ render(); }catch(e){} }else{ themeSyncBtns(); }
  toast(DB.theme==="auto" ? ("已改为跟随系统（当前"+(dark?"深色":"浅色")+"）") : (dark?"已切换到深色":"已切换到浅色"));
}
/* 系统主题变化时，只有"跟随系统"档才实时响应；手动选定的档位不受系统影响 */
function themeInit(){
  try{ THEME.mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null; }catch(e){ THEME.mq=null; }
  themeApply();
  if(THEME.mq){
    var h=function(){ if(themeMode()==="auto") themeApply(); };
    try{
      if(THEME.mq.addEventListener) THEME.mq.addEventListener("change", h);
      else if(THEME.mq.addListener) THEME.mq.addListener(h);
    }catch(e){}
  }
}
function themeHint(){
  var m=themeMode();
  if(m==="auto") return "当前跟随系统："+(themeIsDark()?"深色":"浅色")+"。系统换主题时整页会跟着换，不用重开。";
  return m==="dark" ? "已锁定深色，系统换主题也不影响；夜里看屏幕不刺眼。" : "已锁定浅色，白天看得更清楚。";
}
/* ================= v22 深色模式结束 ================= */

/* ===== 启动 ===== */
(function(){
  try{ loadDB(); }catch(e){}
  /* v22：主题要在首屏渲染前套用，且注册系统主题变化监听 */
  try{ themeInit(); }catch(e){}
  try{ loadVoices(); }catch(e){}
  try{ offLoad(); }catch(e){}
  /* P3-1：启动时检查是否连续漏打卡，决定当日是否降级 */
  try{ lapseCheck(); }catch(e){}
  /* P2-2：每天首次打开自动留一份快照 */
  try{ setTimeout(snapAuto, 1500); }catch(e){}
  /* P2-3：双栏跟随窗口尺寸实时切换 */
  try{
    window.addEventListener("resize", function(){ duoSync(); });
    window.addEventListener("orientationchange", function(){ setTimeout(duoSync,90); });
    duoSync();
  }catch(e){}
  var tabs=document.querySelectorAll("#tabbar .tab"), i;
  for(i=0;i<tabs.length;i++){
    tabs[i].onclick=(function(el){ return function(){ go(el.getAttribute("data-v")); }; })(tabs[i]);
  }
  document.addEventListener("click", function(e){
    var t=e.target;
    if(t && t.classList && t.classList.contains("mask")) closeSheet();
  });
  try{ go("home"); }catch(e){}
})();

</script>
