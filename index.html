/* ---------- 降级通道：录音回放 + 手动自评 ----------
   识别不可用时跟读不再死掉：MediaRecorder 录一段 -> 回放自听 -> 按 1-5 分自评，
   结果照常写进今日 say 统计 / 学习时长 / 遇到过回流。MediaRecorder 也没有就退成"计时 + 自评"。 */
var MR = { rec:null, chunks:[], on:false, t0:0, tick:null, stream:null, wrapId:"", target:"", url:"" };
function mrAvail(){
  return !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}
function micSetLabel(btn, txt){
  if(!btn) return;
  var l=btn.querySelector("span:last-child");
  if(l) l.textContent=txt;
}
function mrStop(){
  if(!MR.on) return;
  MR.on=false;
  if(MR.tick){ clearInterval(MR.tick); MR.tick=null; }
  try{ if(MR.rec && MR.rec.state!=="inactive") MR.rec.stop(); }catch(e){}
}
function mrStart(btn, wrap, target, why){
  if(!wrap) return;
  var rEl=wrap.querySelector(".res");
  if(rEl) rEl.innerHTML="";
  if(!mrAvail()){ micSelfPanel(btn, wrap, target, "", 0, why||"浏览器不支持录音"); return; }
  micSetLabel(btn, "正在准备麦克风…");
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var rec;
    try{ rec=new MediaRecorder(stream); }
    catch(e){ try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e2){} micSetLabel(btn,"点一下开始"); micSelfPanel(btn, wrap, target, "", 0, "录音启动失败，改用计时自评"); return; }
    MR.rec=rec; MR.stream=stream; MR.chunks=[]; MR.on=true; MR.t0=Date.now(); MR.url="";
    MR.target=target||""; MR.wrapId=wrap.id||"";
    micSetLabel(btn, "正在录音…点一下结束");
    if(btn) btn.classList.add("rec");
    var wid=wrap.id||"";
    MR.tick=setInterval(function(){
      var e=wid?document.getElementById(wid):null;
      if(!e) return;
      var ti=e.querySelector(".ti");
      if(ti) ti.textContent=Math.round((Date.now()-MR.t0)/1000)+"s";
    }, 400);
    rec.ondataavailable=function(ev){ if(ev.data && ev.data.size) MR.chunks.push(ev.data); };
    rec.onstop=function(){
      var sec=Math.max(1, Math.round((Date.now()-MR.t0)/1000));
      var url="", blob=null;
      try{
        if(MR.chunks.length){
          var type=MR.chunks[0].type||"audio/webm";
          blob=new Blob(MR.chunks, {type:type});
          url=URL.createObjectURL(blob);
        }
      }catch(e){}
      if(MR.stream){ try{ MR.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} MR.stream=null; }
      if(btn) btn.classList.remove("rec");
      micSetLabel(btn, "重录一段");
      var w2=wid?document.getElementById(wid):wrap;
      var tg=MR.target, wh=why||"";
      /* 先做本地能量分析再出面板：波形/停顿/语速都要跟着自评一起给，自评才有客观参照 */
      if(blob && waveAvail()){
        waveAnalyze(blob, tg, function(st){
          micSelfPanel(btn, w2, tg, url, sec, wh, st);
        });
      } else {
        micSelfPanel(btn, w2, tg, url, sec, wh);
      }
    };
    try{ rec.start(); }
    catch(e){
      MR.on=false;
      if(MR.tick){ clearInterval(MR.tick); MR.tick=null; }
      try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e2){}
      if(btn) btn.classList.remove("rec");
      micSetLabel(btn, "点一下开始");
      micSelfPanel(btn, wrap, target, "", 0, "录音启动失败，改用计时自评");
    }
  }).catch(function(e){
    var n=(e&&e.name)||"";
    if(btn) btn.classList.remove("rec");
    micSetLabel(btn, "点一下开始");
    var w2 = (n==="NotAllowedError"||n==="SecurityError") ? "麦克风权限被拒（设置 → 应用和服务 → 应用管理 → 浏览器 → 权限 → 麦克风，改允许）"
           : (n==="NotFoundError"||n==="DevicesNotFoundError") ? "没找到麦克风"
           : "麦克风不可用";
    micSelfPanel(btn, wrap, target, "", 0, w2);
    if(n==="NotAllowedError"||n==="SecurityError") asrTellOnce("denied");
  });
}
/* 自评面板：有录音就回放，没有就计时自评；两种都能打分入库
   st 为可选的能量分析结果（无 MediaRecorder / 解析失败时为 null，波形区整体不出现） */
function micSelfPanel(btn, wrap, target, url, sec, why, st){
  if(!wrap) return;
  var rEl=wrap.querySelector(".res");
  if(!rEl) return;
  var ctx=MICCTX[wrap.id]||(MICCTX[wrap.id]={});
  ctx.target=target||""; ctx.sec=sec||0; ctx.url=url||""; ctx.wave=st||null;
  if(why) ctx.why=why;
  if(!ctx.why) ctx.why=asrReasonShort()||"环境不支持";
  var h='<div class="fb warn" style="margin-top:8px;line-height:1.85"><b>降级模式</b> · 语音识别不可用（'+esc(ctx.why)+'）。录音回放自听后给自己打分，成绩照常计入。</div>';
  if(url) h+='<audio controls preload="metadata" src="'+url+'" style="width:100%;margin-top:8px"></audio>';
  else h+='<div class="small muted" style="margin-top:6px">没有录音（无麦克风或用不了）。自己数着把句子说一遍'+(sec?('，本次计时 '+sec+' 秒'):'')+'，然后按下面打分。</div>';
  if(st) h+=waveReportHtml(st, target);
  h+='<div class="small muted" style="margin-top:8px">听完给自己打分：1 完全不像 · 3 能用 · 5 和示范差不多</div>';
  h+='<div class="row" style="margin-top:6px">';
  for(var i=1;i<=5;i++) h+='<button class="btn sm ghost" onclick="micSelf(\''+wrap.id+'\','+i+')">'+i+'</button>';
  h+='</div>';
  h+='<div class="tiny muted" style="margin-top:6px">1-2 分：明天重练这一句；3 分：正常计入；4-5 分：计入并标为掌握得不错。</div>';
  rEl.innerHTML=h;
}
function micSelf(wrapId, score){
  var wrap=document.getElementById(wrapId);
  var ctx=MICCTX[wrapId]||{};
  var sec=Math.max(1, ctx.sec||0);
  var target=String(ctx.target||"");
  touch("say",1);
  addSec(sec, "say");
  /* 复习记录：目标句里出现过的词库词，标记为"说过"并进遇到过回流。
     自评 1-2 分说明这一遍不算过，留给明天重练，不推进词的掌握进度。 */
  try{
    if(score>=3 && typeof normWords==="function" && typeof VOCAB_BY_W!=="undefined"){
      var ws=normWords(target), seen={}, i;
      for(i=0;i<ws.length;i++){
        if(VOCAB_BY_W[ws[i]] && !seen[ws[i]]){ seen[ws[i]]=1; useWord(ws[i],"say"); }
      }
    }
  }catch(e){}
  if(!DB.sayLog) DB.sayLog=[];
  var wv=ctx.wave||null;
  DB.sayLog.push({ t:Date.now(), target:target.slice(0,80), score:score, sec:sec, mode:"self",
    wpm: wv?(wv.wpm|0):0,
    voiced: wv?(Math.round(wv.voiced*10)/10):0,
    pauses: wv?(wv.pauseCount|0):0,
    longest: wv?(Math.round((wv.longest?wv.longest.dur:0)*10)/10):0,
    afterWord: wv?(wv.afterWord|0):0,
    verdict: wv?(wv.verdict||""):"" });
  if(DB.sayLog.length>200) DB.sayLog=DB.sayLog.slice(-200);
  saveDB();
  if(wrap){
    var rEl=wrap.querySelector(".res");
    if(rEl){
      var tip = score>=4 ? "不错。把这一句放进今天的「话题卡」再说一次会更稳。"
              : score===3 ? "能用。重点是重音放在实词上，别每个词一样重。"
              : "别慌——降速跟读两遍再重录一次，只重录一遍就好。";
      rEl.innerHTML='<div class="cmp"><div class="row" style="align-items:flex-end"><div class="sc">'+score+'<small>/5 自评</small></div>'+
        '<div style="margin-left:auto;text-align:right"><div class="tiny muted">计时</div><b>'+sec+'s</b></div></div>'+
        (ctx.url? '<audio controls preload="metadata" src="'+ctx.url+'" style="width:100%;margin-top:8px"></audio>':'')+
        '<div class="fb" style="margin-top:8px">'+esc(tip)+'</div>'+
        (wv? '<div class="tiny muted" style="margin-top:6px">本次录音客观数据：有效发声 '+Math.round(wv.ratio*100)+'% · 停顿 '+wv.pauseCount+' 次 · 最长 '+(wv.longest?wv.longest.dur.toFixed(1):"0.0")+'s · 语速 '+wv.wpm+' wpm</div>':'')+
        '<div class="tiny muted" style="margin-top:6px">已计入今日「说」+1、学习时长 +'+sec+'s'+(ctx.target?'，目标句里的词已标为说过':'')+'。</div></div>';
    }
  }
  toast("已记录自评 "+score+"/5");
}

/* ===== 录音波形客观反馈（P0-2）=====
   自评只有 1-5 分，主观且不可核对。这里对录音本身做能量分析：
   总时长 / 有效发声 / 静音段分布 / 最长停顿起止 / 语速，全部本地算，不联网、不依赖语音识别。
   没有 MediaRecorder 或 AudioContext 时静默降级（返回空），调用方不显示波形区即可，不抛错。 */
function waveAvail(){
  var AC = window.AudioContext || window.webkitAudioContext;
  return !!(AC && window.MediaRecorder && window.FileReader);
}
function waveAnalyze(blob, target, cb){
  cb = cb || function(){};
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!blob || !AC){ cb(null); return; }
  var ac=null, done=false, guard=null;
  function fin(st){
    if(done) return;
    done=true;
    if(guard){ clearTimeout(guard); guard=null; }
    try{ if(ac && ac.close) ac.close(); }catch(e){}
    cb(st||null);
  }
  try{ ac = new AC(); }catch(e){ fin(null); return; }
  guard = setTimeout(function(){ fin(null); }, 4000);
  function onBuf(buf){
    var st=null;
    try{ st = waveStats(buf, target); }catch(e){ st=null; }
    fin(st);
  }
  function withArr(arr){
    if(!arr){ fin(null); return; }
    try{
      var p = ac.decodeAudioData(arr, onBuf, function(){ fin(null); });
      if(p && p.then) p.then(onBuf).catch(function(){ fin(null); });
    }catch(e){ fin(null); }
  }
  try{
    if(blob.arrayBuffer && typeof Promise!=="undefined"){
      blob.arrayBuffer().then(withArr).catch(function(){ fin(null); });
    } else {
      var fr=new FileReader();
      fr.onload=function(){ withArr(fr.result); };
      fr.onerror=function(){ fin(null); };
      fr.readAsArrayBuffer(blob);
    }
  }catch(e){ fin(null); }
}
/* 能量统计：帧长 50ms，阈值取峰值 11%，连续 ≥250ms 静音算一次停顿 */
function waveStats(buf, target){
  var ch = (buf && buf.getChannelData) ? buf.getChannelData(0) : null;
  if(!ch || !ch.length) return null;
  var sr = buf.sampleRate || 44100;
  var dur = buf.duration || (ch.length/sr);
  var FL = 0.05, fp = Math.max(1, Math.round(sr*FL));
  var nf = Math.max(1, Math.floor(ch.length/fp));
  var rms = new Array(nf), mx = 0, i, j;
  for(i=0;i<nf;i++){
    var s=0, off=i*fp, len=Math.min(fp, ch.length-off), x;
    for(j=0;j<len;j++){ x=ch[off+j]||0; s+=x*x; }
    var v=Math.sqrt(s/Math.max(1,len));
    rms[i]=v; if(v>mx) mx=v;
  }
  var thr = Math.max(0.004, mx*0.11);
  var voiced=0, lead=0, tail=0;
  for(i=0;i<nf;i++) if(rms[i]>thr) voiced++;
  for(i=0;i<nf && rms[i]<=thr;i++) lead++;
  for(i=nf-1;i>=0 && rms[i]<=thr;i--) tail++;
  if(lead>=nf){ lead=nf; tail=0; }
  var MINP=5, pauses=[], run=0, vSeen=0, vTotal=voiced;
  for(i=0;i<nf;i++){
    if(rms[i]>thr){ vSeen++; run=0; continue; }
    if(i<lead || i>=nf-tail) continue;
    run++;
    if(run===MINP){
      pauses.push({ start:(i-MINP+1)*FL, end:(i+1)*FL, dur:MINP*FL, at:vSeen });
    } else if(run>MINP && pauses.length){
      var pp=pauses[pauses.length-1];
      pp.end=(i+1)*FL; pp.dur=pp.end-pp.start;
    }
  }
  var longest=null;
  for(i=0;i<pauses.length;i++) if(!longest || pauses[i].dur>longest.dur) longest=pauses[i];
  /* 最长停顿映射回目标文本：按停顿前已发出的发声帧占比估算停在第几个词之后 */
  var ws = normWords(target||""), nw = ws.length, afterWord = 0;
  if(nw && longest && vTotal>0) afterWord = Math.max(1, Math.min(nw, Math.round(longest.at/vTotal*nw)));
  var BARS=56, bars=[], k;
  for(k=0;k<BARS;k++){
    var f0=Math.floor(k*nf/BARS), f1=Math.max(f0+1, Math.floor((k+1)*nf/BARS));
    var hmax=0, vcnt=0;
    for(i=f0;i<f1 && i<nf;i++){ if(rms[i]>hmax) hmax=rms[i]; if(rms[i]>thr) vcnt++; }
    bars.push({ h: mx>0 ? Math.min(1,hmax/mx) : 0, sil: vcnt===0 });
  }
  var voicedSec = voiced*FL, silSec = Math.max(0, dur-voicedSec);
  var ratio = dur>0 ? voicedSec/dur : 0;
  var wpm = nw ? Math.round(nw/(dur/60)) : 0;
  var voicedWpm = (nw && voicedSec>0.3) ? Math.round(nw/(voicedSec/60)) : 0;
  var verdict = (pauses.length>=3 || (longest && longest.dur>=2)) ? "停顿过多"
              : (pauses.length===0 ? "停顿过少" : "适中");
  return { ok:1, dur:dur, voiced:voicedSec, silence:silSec, ratio:ratio,
    pauseCount:pauses.length, pauses:pauses, longest:longest,
    leadSec:lead*FL, tailSec:tail*FL, bars:bars, wpm:wpm, voicedWpm:voicedWpm,
    verdict:verdict, words:nw, afterWord:afterWord };
}
function waveBarsHtml(st){
  if(!st || !st.bars || !st.bars.length) return "";
  var h='<div class="wv">', i;
  for(i=0;i<st.bars.length;i++){
    var b=st.bars[i];
    h+='<i class="'+(b.sil?"sil":"")+'" style="height:'+Math.max(6,Math.round(b.h*100))+'%"></i>';
  }
  return h+'</div><div class="wvlg"><span><i class="dot"></i>发声</span><span><i class="dot sil"></i>静音段</span><span>每段约 '+Math.max(1,Math.round(st.dur/st.bars.length*100)/100)+'s</span></div>';
}
function waveReportHtml(st, target){
  if(!st || !st.ok) return "";
  var h='<div class="wvbox">';
  h+='<div class="tiny muted" style="margin-bottom:4px">录音波形 · 本地能量分析（不依赖识别）</div>';
  h+=waveBarsHtml(st);
  h+='<div class="wvnum">'+
     '<div><b>'+st.dur.toFixed(1)+'s</b><span>总时长</span></div>'+
     '<div><b>'+st.voiced.toFixed(1)+'s</b><span>有效发声</span></div>'+
     '<div><b>'+st.pauseCount+'</b><span>停顿次数</span></div>'+
     '<div><b>'+(st.longest? st.longest.dur.toFixed(1):"0.0")+'s</b><span>最长停顿</span></div>'+
     '</div>';
  var line=[];
  if(st.longest) line.push("最长停顿在 "+st.longest.start.toFixed(1)+"s ~ "+st.longest.end.toFixed(1)+"s，停了 "+st.longest.dur.toFixed(1)+" 秒");
  else line.push("中途没有超过 0.25 秒的停顿");
  if(st.afterWord && st.words) line.push("按发声比例映射，你停在<b>第 "+st.afterWord+" 个词</b>之后（目标文本共 "+st.words+" 个词）");
  h+='<div class="small" style="line-height:1.8;margin-top:8px">'+line.join("；")+'。</div>';
  var sp = st.words
    ? ('<b>'+st.wpm+' wpm</b>（按整段 '+st.dur.toFixed(1)+'s）'+(st.voicedWpm?('，只算发声段 <b>'+st.voicedWpm+' wpm</b>'):''))
    : ('整段 '+st.dur.toFixed(1)+'s，有效发声占 '+Math.round(st.ratio*100)+'%');
  h+='<div class="small" style="margin-top:4px">语速 '+sp+'　<span class="chip" style="padding:1px 8px">停顿'+esc(st.verdict)+'</span></div>';
  var tip = st.verdict==="停顿过多"
    ? "停顿偏多：多数不是你嘴慢，是脑子里在找词或现想语法。先把整句背到能连着说，再来录。"
    : st.verdict==="停顿过少"
    ? "整句没有换气点，听着像赶时间。意群之间留半拍，意群内部连起来。"
    : "停顿结构正常。下一步盯重音：实词重、虚词轻。";
  h+='<div class="fb" style="margin-top:8px">'+esc(tip)+'</div>';
  return h+'</div>';
}

/* ================= 模块 16：通用工具（随机、抽样、时间） ================= */
function shuffle(a){
  var r=a.slice(), i, j, t;
  for(i=r.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=r[i]; r[i]=r[j]; r[j]=t; }
  return r;
}
function pickN(a, n){ return shuffle(a).slice(0, n); }
function oneOf(a){ return a[Math.floor(Math.random()*a.length)]; }
function wordPool(){
  var out=[], i;
  for(i=0;i<VOCAB.length;i++) out.push(VOCAB[i].w.toLowerCase());
  return out;
}
function dueFirstPool(){
  var d=dueWords(), rest=[], i, k;
  var seen={};
  for(i=0;i<d.length;i++) seen[d[i]]=1;
  var all=shuffle(wordPool());
  for(i=0;i<all.length;i++) if(!seen[all[i]]) rest.push(all[i]);
  return shuffle(d).concat(rest);
}
function humanSec(s){
  s=Math.max(0, Math.round(s));
  var m=Math.floor(s/60), r=s%60;
  return m? (m+":"+(r<10?"0":"")+r) : (r+"s");
}

  {re:/\bthere\s+(have|has)\b/i, t:"中式表达", m:"there be 句型里不能用 have/has，用 there is / there are。"},
  {re:/\bthe\s+reason\b[^.]*\bis\s+because\b/i, t:"中式表达", m:"the reason is because 语义重复，直接用 because。"},
  {re:/\bcontact\s+with\s+me\b/i, t:"搭配升级", m:"contact 作动词及物，去掉 with。"},
  {re:/\blook(ing)?\s+forward\s+to\s+(hear|see|meet|receive|get)\b/i, t:"搭配升级", m:"look forward to 的 to 是介词，后接动名词 hearing / seeing / meeting。"},
  {re:/\bdiscuss\s+about\b/i, t:"搭配升级", m:"discuss 及物，不加 about。"},
  {re:/\bmarri(ed|y)\s+with\b/i, t:"搭配升级", m:"用 marry somebody / be married to somebody。"},
  {re:/\bdo\s+something\b/i, t:"冗余删除", m:"do something 是空话，换成具体动词。"},
  {re:/\ba\s+lot\s+of\s+things\b/i, t:"中式表达", m:"a lot of things 太空，说清是哪一类。"},
  {re:/\btake\s+measures\b/i, t:"冗余删除", m:"take measures 是套话，能写具体动作就写具体动作。"}
];
function fixRule(txt){
  var out=[], i, t=String(txt||"");
  for(i=0;i<FIX_RULES.length;i++){
    if(FIX_RULES[i].re.test(t)) out.push({ t:FIX_RULES[i].t, m:FIX_RULES[i].m });
  }
  /* 重复词：the the / is is */
  var dm=t.match(/\b([A-Za-z]{2,})\s+\1\b/i);
  if(dm) out.push({ t:"冗余删除", m:"「"+dm[1]+" "+dm[1]+"」重复了一次，删掉一个。" });
  /* 关联词重复：because…so / although…but */
  if(/\bbecause\b/i.test(t) && /\bso\b/i.test(t)) out.push({ t:"中式表达", m:"because 与 so 不在同一句里成对使用，留一个。" });
  if(/\b(although|though|even\s+though)\b/i.test(t) && /\bbut\b/i.test(t)) out.push({ t:"中式表达", m:"although / though 之后不再用 but。" });
  if(/\bhowever\b/i.test(t) && /\bbut\b/i.test(t)) out.push({ t:"中式表达", m:"however 与 but 都是转折，留一个。" });
  /* 逗号粘连：一个句子两个完整小句只用逗号连 */
  var parts=t.split(/[.!?;]+/), pi, p;
  for(pi=0;pi<parts.length;pi++){
    p=parts[pi];
    if(/,\s*(?!(and|but|so|or|yet|for|nor|which|who|whom|whose|that|because|although|though|while|when|if|since|as|after|before|where)\b)/i.test(p)
       && /,\s*[A-Za-z']+\s+(is|are|was|were|has|have|had|do|does|did|can|could|will|would|should|must|think|believe|want|need|seems?)\b/i.test(p)){
      out.push({ t:"连接词缺失", m:"逗号把两个完整小句连在一起（comma splice）：加 and / but / so 或改用分号。" }); break;
    }
  }
  /* 超长句且无标点 */
  for(pi=0;pi<parts.length;pi++){
    var q=String(parts[pi]||"");
    if(q.length>140 && q.indexOf(",")<0){ out.push({ t:"连接词缺失", m:"这一句超过 140 字符还只有一个停顿，拆成两三句，或补逗号与连接词。" }); break; }
  }
  /* 被动堆叠 */
  var pas=t.match(/\b(is|are|was|were|be|been|being)\s+[a-z]+(ed|en)\b/gi);
  if(pas && pas.length>=3) out.push({ t:"被动滥用", m:"一句里出现 "+pas.length+" 处被动，主语被藏起来了：改成主动，说清「谁做」。" });
  return out;
}

/* ---------- 差异渲染 ---------- */
function fixTone(t){
  if(t==="搭配升级"||t==="名词化") return { f:"var(--green-d)", b:"var(--green-l)" };
  if(t==="中式表达"||t==="时态") return { f:"var(--red)", b:"var(--red-l)" };
  return { f:"var(--amber)", b:"var(--amber-l)" };
}
function fixMarked(text, arr, side){
  var src=String(text||""), low=src.toLowerCase(), out="", cur=0, i, k, f, tone;
  var list=[];
  for(i=0;i<arr.length;i++){ f=arr[i][side]; if(f) list.push({ f:String(f), k:low.indexOf(String(f).toLowerCase()) }); }
  list.sort(function(x,y){ return x.k-y.k; });
  for(i=0;i<list.length;i++){
    k=list[i].k; f=list[i].f;
    if(k<cur) continue;
    tone=fixTone(arr[0] && arr[0].t);
    out+=esc(src.slice(cur,k))+'<span style="background:'+(side==="a"?"var(--red-l)":"var(--green-l)")+';color:'+(side==="a"?"var(--red)":"var(--green-d)")+';border-radius:4px;padding:0 2px">'+esc(src.slice(k,k+f.length))+'</span>';
    cur=k+f.length;
  }
  return out+esc(src.slice(cur));
}
function fixDiffRows(arr){
  var h="", i, d, tn;
  for(i=0;i<arr.length;i++){
    d=arr[i]; tn=fixTone(d.t);
    h+='<div style="border-left:3px solid '+tn.f+';padding:2px 0 2px 9px;margin-top:10px">'+
       '<div class="tiny" style="color:'+tn.f+';font-weight:600">'+esc(d.t)+'</div>'+
       '<div class="small" style="line-height:1.75;word-break:break-word;margin-top:2px">'+
         '<span style="color:var(--red);text-decoration:line-through">'+esc(d.a)+'</span>'+
         '<span style="color:var(--muted)"> → </span>'+
         '<span style="color:var(--green-d);font-weight:600">'+esc(d.b? d.b : "（删除）")+'</span></div>'+
       '<div class="tiny muted" style="line-height:1.7;margin-top:2px">'+esc(d.n)+'</div></div>';
  }
  return h;
}
function fixRuleHtml(list){
  var h='<div class="card tight"><div class="hd"><h3>规则检查</h3><div class="right"><span class="chip">不等同完整改写</span></div></div>';
  if(!list || !list.length){
    h+='<div class="small muted" style="line-height:1.8">没发现可判定的机械问题。这只说明没踩到已知的直译、重复、搭配坑，句子是否地道仍要看对照。</div>';
  } else {
    for(var i=0;i<list.length;i++){
      var tn=fixTone(list[i].t);
      h+='<div style="margin-top:9px"><span class="tiny" style="color:'+tn.f+';font-weight:600">'+esc(list[i].t)+'</span>'+
         '<div class="small" style="line-height:1.75;word-break:break-word">'+esc(list[i].m)+'</div>'+
         '<div class="tiny muted">规则检查，不等同完整改写</div></div>';

/* ---------- 记录与统计 ---------- */
function fixTime(t){
  var d=new Date(Number(t)||0);
  return (d.getMonth()+1)+"月"+d.getDate()+"日 "+pad2(d.getHours())+":"+pad2(d.getMinutes());
}
function fixCountWrite(raw){
  touch("write",1);
  var sec=0;
  if(FIX.t0){ sec=Math.round((Date.now()-FIX.t0)/1000); if(sec<0) sec=0; if(sec>1800) sec=1800; }
  if(sec>=20) addSec(sec,"write");
  FIX.t0=0;
  var w=fixToks(raw), i, n=0;
  for(i=0;i<w.length;i++){
    if(n>=12) break;
    if(typeof VOCAB_BY_W!=="undefined" && VOCAB_BY_W[w[i]]){ useWord(w[i],"write"); n++; }
  }
}
function fixRecord(raw, best){
  var now=Date.now(), arr=(DB.fix && DB.fix instanceof Array) ? DB.fix : (DB.fix=[]);
  var key=fixNorm(raw), dup=false, i;
  for(i=0;i<arr.length;i++){ if(arr[i].k===key && (now-(Number(arr[i].t)||0))<600000){ dup=true; break; } }
  if(dup){ arr[i].t=now; saveDB(); return true; }
  var clean=String(raw).replace(/\s+/g," ").trim();
  var rec={ t:now, k:key, raw:clean, id:best?best.it.id:"", grp:best?best.it._grp:"", good:best?best.it.b:"", un:best?0:1, n:best?best.it.d.length:0, d:best?best.it.d:[] };
  arr.unshift(rec);
  while(arr.length>20) arr.pop();
  saveDB();
  fixCountWrite(clean);
  return false;
}

var LIB = { idx:null, from:"none", busy:false, q:"", lv:0, show:30, bodies:{}, shardLoad:{}, shardPend:{}, fetching:"" };

function libItems(){
  var a=(LIB.idx && LIB.idx.items) || [];
  if(LIB.sortedFor!==LIB.idx){
    a.sort(function(x,y){
      var d=String(y.date||""), c=String(x.date||"");
      if(d!==c) return d<c?-1:1;
      return String(y.id||"")<String(x.id||"")?-1:1;
    });
    LIB.sortedFor=LIB.idx;
  }
  return a;
}
function libClean(t){
  t=String(t||"");
  t=t.replace(/^\s*id="[^"]*">/,'').replace(/\s*<[a-zA-Z\/][^>]*>\s*$/,'').replace(/\s*<[a-zA-Z\/][^>]*$/,'')
     .replace(/^\s*(?:class|id)="[^"]*"\s*>/,'').replace(/^\s*\d{1,2}-\d{1,2}-\d{4}(?:\s+\d{1,2}:\d{2})?\s*/,'')
     .replace(/The post [\s\S]*? appeared first on [\s\S]*?$/,'').replace(/\s+/g,' ').trim();
  return t;
}
function libById(id){
  var a=libItems(), i, it=null, k;
  for(i=0;i<a.length;i++){ if(a[i].id===id){ it=a[i]; break; } }
  if(!it) return null;
  var m={}, k, b=LIB.bodies[id];
  for(k in it) if(Object.prototype.hasOwnProperty.call(it,k)) m[k]=it[k];
  m.fromLib=1;
  if(b){ m.text=libClean(b.text); m.key=b.key; if(b.audio) m.audio=b.audio; }
  return m;
}
function allItems(){
  var a=dailyItems(), b=libItems(), seen={}, out=[], i;
  for(i=0;i<a.length;i++){ seen[a[i].id]=1; out.push(a[i]); }
  for(i=0;i<b.length;i++){ if(!seen[b[i].id]){ seen[b[i].id]=1; out.push(b[i]); } }
  return out;
}
function libSrcName(n,j){ var S=(j&&j.sources)||(LIB.idx&&LIB.idx.sources)||["News in Levels"]; return S[n||0]||S[0]; }
function libDerive(item){
  /* 索引为瘦身版：id 形如 nil-<topic>-l<level>，title 与 url 均可由 id 还原 */
  var m=/^nil-(.+)-l(\d)$/.exec(item[0]||"");
  if(!m) return {title:"", url:""};
  var t=m[1].replace(/-/g," ");
  return { title:t.charAt(0).toUpperCase()+t.slice(1),
           url:"https://www.newsinlevels.com/products/"+m[1]+"-level-"+m[2]+"/" };
}
function libNormIdx(j){
  if(!j || !j.items || !j.items.length) return j;
  if(!Array.isArray(j.items[0])) return j;   /* 旧版对象格式，直接用 */
  var a=j.items, out=new Array(a.length), i, r, d;
  for(i=0;i<a.length;i++){
    r=a[i]; d=libDerive(r);
    out[i]={ id:r[0], src:libSrcName(r[6],j), level:r[1],
             title:(r.length>7&&r[7])?r[7]:d.title, date:r[2],
             url:(r.length>8&&r[8])?r[8]:d.url, words:r[3], shard:r[4],
             kw:r[5]?String(r[5]).split(" ").filter(Boolean):[] };
  }
  j.items=out;
  return j;
}
function libFetchYears(meta){
  /* v3 索引：index.json 只存元信息，条目按年拆在 ./data/library/i/YYYY.json，并行拉取后合并 */
  var ys=Object.keys(meta.years||{});
  if(!ys.length) return Promise.reject(new Error("no years"));
  return Promise.all(ys.map(function(y){
    return fetch("./data/library/i/"+y+".json").then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    }).then(function(p){ return (p && p.items) || []; });
  })).then(function(arrs){
    var items=[], i, k, a;
    for(i=0;i<arrs.length;i++){ a=arrs[i]; for(k=0;k<a.length;k++) items.push(a[k]); }

function libLoad(force){

    if(!r.ok) throw new Error("HTTP "+r.status);

    if(j && j.v>=3 && j.years) return libFetchYears(j);
    if(!j || !j.items || !j.items.length) throw new Error("empty");
    return j;
  }).then(function(j){

    try{ offIdbPut("lib_idx", j); }catch(e){}

    }).catch(function(){ LIB.idx={items:[],count:0,total_available:0}; LIB.from="none"; }).then(function(){
      LIB.busy=false;

function libShardFile(n){ var s=String(n); while(s.length<2) s="0"+s; return "./data/library/s/"+s+".json"; }
function libEnsureBody(id){
  var it=libById(id);
  if(!it) return Promise.reject(new Error("not found"));
  if(it.text) return Promise.resolve(it);
  var s=it.shard;
  if(LIB.shardLoad[s]) return Promise.resolve(libById(id));
  if(!LIB.shardPend[s]){
    LIB.shardPend[s]=fetch(libShardFile(s), {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    }).then(function(j){
      (j.items||[]).forEach(function(b){ LIB.bodies[b.id]=b; });
      LIB.shardLoad[s]=1;
      delete LIB.shardPend[s];
      try{ offIdbPut("lib_s"+s, j); }catch(e){}
      return true;
    }).catch(function(){
      delete LIB.shardPend[s];
      return offIdbGet("lib_s"+s).then(function(v){
        if(v && v.items){ v.items.forEach(function(b){ LIB.bodies[b.id]=b; }); LIB.shardLoad[s]=1; }
        return !!(v && v.items);
      });
    });
  }
  return LIB.shardPend[s].then(function(){ return libById(id); });
}
function libFiltered(){
  var a=libItems(), q=(LIB.q||"").trim().toLowerCase(), lv=LIB.lv, out=[], i, it;
  for(i=0;i<a.length;i++){

      } else if(hay.indexOf(q)<0) continue;
    }
    out.push(it);
  }
  return out;
}

var COMMON_SET = null;
function commonSet(){
  if(COMMON_SET) return COMMON_SET;
  var m={}, a=COMMON_TXT.split(/\s+/).concat(FREQ_TOP_TXT.split(/\s+/)), i;
  for(i=0;i<a.length;i++) if(a[i]) m[a[i]]=1;
  COMMON_SET=m;
  return m;
}
function recTokens(s){
  var raw=String(s==null?"":s).toLowerCase().replace(/[^a-z' ]+/g," ").split(/\s+/), out=[], i, w;
  for(i=0;i<raw.length;i++){
    w=raw[i].replace(/^'+|'+$/g,"");
    if(w.length<2) continue;
    out.push(w);
  }
  return out;
}
function recKnown(w){
  if(!w) return true;
  if(typeof VOCAB_BY_W!=="undefined" && VOCAB_BY_W[w]) return true;
  return !!commonSet()[w];
}
function recNovelty(txt){
  var toks=recTokens(txt), total=toks.length, novel=0, freq={}, uniq=[], i, w;
  for(i=0;i<total;i++){
    w=toks[i];
    if(recKnown(w)) continue;
    novel++;
    freq[w]=(freq[w]||0)+1;
  }
  for(w in freq) if(Object.prototype.hasOwnProperty.call(freq,w)) uniq.push(w);
  uniq.sort(function(a,b){ return (freq[b]-freq[a]) || (a<b?-1:1); });
  return { total:total, novel:novel, rate:(total? novel/total*100 : 0), words:uniq };
}
var LIBREC = { map:{}, pick:null, day:"", busy:false };
function libRecSrc(it){
  if(it && it.text) return it.text;
  var b=(it && LIB.bodies) ? LIB.bodies[it.id] : null;
  if(b && b.text) return b.text;
  return (((it && it.kw) ? it.kw.join(" ") : "") + " " + ((it && it.title) || "")).trim();
}
function libRecExact(it){
  if(it && it.text) return true;
  var b=(it && LIB.bodies) ? LIB.bodies[it.id] : null;
  return !!(b && b.text);
}
function libRecScore(it){
  var hit=LIBREC.map[it.id], exact=libRecExact(it);
  if(hit && (hit.exact || !exact)) return hit;
  var r=recNovelty(libRecSrc(it));
  var out={ rate:Math.round(r.rate*10)/10, novel:r.novel, total:r.total,
            words:r.words.slice(0,14), exact:exact?1:0, ts:Date.now() };
  LIBREC.map[it.id]=out;
  var ks=Object.keys(LIBREC.map);
  if(ks.length>400){   /* 缓存上限：只留最近算过的 400 篇 */
    ks.sort(function(a,b){ return (LIBREC.map[a].ts||0)-(LIBREC.map[b].ts||0); });
    for(var i=0;i<ks.length-400;i++) delete LIBREC.map[ks[i]];
  }
  return out;
}
function libRecPool(){
  var a=libItems(), cut=addDays(-730), out=[], i, it;
  for(i=0;i<a.length;i++){
    it=a[i];
    if(!it || !it.id || !it.date) continue;
    if(String(it.date)<cut) continue;      /* 只取最近 1~2 年分片，避免扫全量 1.5 万条 */
    out.push(it);
    if(out.length>=200) break;
  }
  return out;
}
function libRecSeed(){ return (parseInt(dk().replace(/-/g,""),10)||1)+7; }
function libRecPickOf(list){
  if(!list.length) return null;
  return list[libRecSeed()%list.length];
}
function libRecDecide(){
  var pool=libRecPool(), rows=[], i, r, unread, use=[], band=[], low=[], high=[];
  for(i=0;i<pool.length;i++){
    rows.push({ it:pool[i], sc:libRecScore(pool[i]), read:dailyIsRead(pool[i].id)?1:0 });
  }
  unread=rows.filter(function(x){ return !x.read; });
  use=unread.length? unread : rows;
  for(i=0;i<use.length;i++){
    r=use[i].sc.rate;
    if(r>=5 && r<=10) band.push(use[i]);
    else if(r<5) low.push(use[i]);
    else high.push(use[i]);
  }
  function byNear(a,b){ return Math.abs(a.sc.rate-7.5)-Math.abs(b.sc.rate-7.5); }
  band.sort(byNear);
  var out={ kind:"none", main:null, low:null, high:null, pool:use.length, band:band.length };
  if(band.length){ out.kind="hit"; out.main=libRecPickOf(band.slice(0,8)); return out; }
  low.sort(byNear); high.sort(byNear);
  if(low.length || high.length){
    out.kind="miss";
    out.low = low.length ? libRecPickOf(low.slice(0,8)) : null;
    out.high= high.length ? libRecPickOf(high.slice(0,8)) : null;
    out.main= out.low || out.high;
  }
  return out;
}
function libRecBuild(force){
  if(!LIB.idx) return;
  if(LIBREC.busy) return;
  if(!force && LIBREC.pick && LIBREC.day===dk()) return;
  LIBREC.busy=true; LIBREC.day=dk();
  var rough=libRecDecide(), cands=[], i, need=[];
  if(rough.main) cands.push(rough.main);
  if(rough.low) cands.push(rough.low);
  if(rough.high) cands.push(rough.high);
  /* 再挑 3 篇粗算最接近区间的未读篇目，抓正文精算（最多 3 个分片，避免卡顿） */
  var near=libRecPool().map(function(it){ return { it:it, sc:libRecScore(it) }; })
            .filter(function(x){ return !dailyIsRead(x.it.id); })
            .sort(function(a,b){ return Math.abs(a.sc.rate-7.5)-Math.abs(b.sc.rate-7.5); })
            .slice(0,3);
  for(i=0;i<near.length;i++) cands.push(near[i]);
  for(i=0;i<cands.length;i++){
    if(cands[i] && cands[i].it && !cands[i].sc.exact && need.indexOf(cands[i].it.id)<0) need.push(cands[i].it.id);
  }
  need=need.slice(0,3);
  function finish(){
    LIBREC.pick=libRecDecide();
    LIBREC.busy=false;
    if(CURRENT==="library") render();
  }
  (function step(n){
    if(n>=need.length){ finish(); return; }
    libEnsureBody(need[n]).then(function(){ step(n+1); }).catch(function(){ step(n+1); });
  })(0);
}

function libRecAdd(id){

function libRecRow(r, why){
  if(!r || !r.it) return "";

  h+='<div style="border-top:1px dashed var(--line);padding-top:10px;margin-top:8px">';
  h+='<div class="row wrap" style="gap:6px;margin-bottom:6px">'+
     '<span class="chip">L'+it.level+'</span>'+
     '<span class="chip">生词率 '+sc.rate+'%</span>'+
     '<span class="chip">预计生词 '+sc.novel+' / '+sc.total+' 词</span>'+
     '<span class="chip">'+esc(String(it.date||""))+'</span>'+
     (sc.exact? '' : '<span class="chip">按关键词估</span>')+
     '</div>';
  h+='<div style="font-size:15px;font-weight:600;line-height:1.45">'+esc(it.title)+'</div>';
  if(why) h+='<div class="tiny" style="margin-top:4px;color:var(--green-d)">'+esc(why)+'</div>';
  if(sc.words && sc.words.length){
    h+='<div class="tiny muted" style="margin-top:8px">会遇到的生词（点一下查词 / 发音）</div>'+
       '<div class="row wrap" style="gap:6px;margin-top:4px">';
    for(i=0;i<sc.words.length && i<10;i++){
      w=String(sc.words[i]).replace(/'/g,"");
      if(!w) continue;
      h+='<button class="chip" onclick="libRecWordClick(\''+esc(w)+'\')">'+esc(w)+'</button>';
    }
    h+='</div>';
  }
  h+='<div class="row wrap" style="gap:6px;margin-top:10px">'+
     '<button class="btn sm" onclick="dailyOpen(\''+it.id+'\')">读这篇</button>'+
     '<button class="btn sm ghost" onclick="libRecAdd(\''+it.id+'\')">加入今天读</button>'+
     (it.url? '<button class="btn sm ghost" onclick="window.open(\''+esc(it.url)+'\',\'_blank\')">看原文</button>' : '')+
     '</div></div>';
  return h;
}
function libRecCardHtml(){
  var h='<div class="card tight" id="libRec"><div class="hd"><h3>今天读这篇</h3>'+
        '<div class="right"><span class="tag">i+1</span></div></div>';
  if(!LIB.idx && !LIB.busy){
    h+='<div class="small muted">素材库索引还没取到，联网后这里会给出一篇生词率 5%~10% 的文章。</div></div>';
    return h;
  }
  if(!LIBREC.pick && !LIBREC.busy) libRecBuild(false);
  var p=LIBREC.pick;
  if(!p){
    h+='<div class="small muted">'+(LIBREC.busy?'正在按你的词库算生词率…':'索引里没有可用篇目，先看下面的列表')+'</div></div>';
    return h;
  }
  if(p.kind==="miss"){
    h+='<div class="fb warn" style="margin:0 0 6px">最近两年的篇目里没有落在 5%~10% 生词率区间的，下面给两个备选并标了原因。</div>';
    if(p.low)  h+=libRecRow(p.low, "低于 5% · 太简单，可以提速读（i+0）");
    if(p.high) h+=libRecRow(p.high, "高于 10% · 太难，建议先降到 L1/L2 再读");
    h+='<div class="tiny muted" style="margin-top:8px">口径：生词率 = 不在「你的词库 '+VOCAB.length+' 词 + 内置高频 4000 词」里的词的占比。'+
       (p.main? ('这两年里最容易的一篇是 '+p.main.sc.rate+'%，再多掌握一些词就会自动落进 i+1 区间。') : '')+'</div>';
    h+='</div>';
    return h;
  }
  if(p.kind==="hit"){
    h+=libRecRow(p.main, "生词率落在 i+1 区间："+(p.band>1? ("两年内还有 "+(p.band-1)+" 篇同类可选") : "读起来刚好"));
    h+='<div class="tiny muted" style="margin-top:8px">口径：生词率 = 不在「你的词库 '+VOCAB.length+' 词 + 内置高频 4000 词」里的词的占比，只推 5%~10%（约每 100 词有 5~10 个新词）。同一天固定'+
       (p.band>1?'在这几篇里':'在这篇')+'，隔天会换。</div>';
    h+='</div>';
    return h;
  }
  h+='<div class="small muted">索引里没有可用篇目，先看下面的列表。</div></div>';
  return h;
}

function dailyAgo(ts){
  if(!ts) return "";
  var d=+new Date(ts), diff=Math.round((Date.now()-d)/60000);
  if(diff<2) return "刚刚";
  if(diff<60) return diff+" 分钟前";
  if(diff<1440) return Math.round(diff/60)+" 小时前";
  return Math.round(diff/1440)+" 天前";
}
function dailyItems(){ return (DAILY.data && DAILY.data.items) || []; }
function dailyById(id){
  var a=dailyItems(),i;
  for(i=0;i<a.length;i++) if(a[i].id===id) return a[i];
  return libById(id);
}
function dailyIsRead(id){ return !!(DB.daily && DB.daily.read && DB.daily.read[id]); }

function dailyPaint(){
  if(CURRENT==="daily" || CURRENT==="dailyread") render();
}
function dailyLoad(force){
  if(DAILY.busy) return;
  if(DAILY.data && !force){ dailyPaint(); return; }
  DAILY.busy=true;
  fetch("./data/daily.json", {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){
    if(!j || !j.items || !j.items.length) throw new Error("empty");
    DAILY.data=j; DAILY.from=(navigator.onLine===false?"cache":"net"); DAILY.ts=Date.now(); DAILY.busy=false;
    try{ offIdbPut("daily", j); }catch(e){}
    dailyPaint();
    if(CURRENT==="home") render();
  }).catch(function(){
    offIdbGet("daily").then(function(v){
      if(v && v.items && v.items.length){ DAILY.data=v; DAILY.from="cache"; }
      else { DAILY.data={items:[],updated:"",generated:""}; DAILY.from="none"; }
    }).catch(function(){
      DAILY.data={items:[],updated:"",generated:""}; DAILY.from="none";
    }).then(function(){
      DAILY.busy=false;
      dailyPaint();
      if(CURRENT==="home") render();
      if(force) toast(DAILY.from==="cache" ? "连不上网络，先看上次缓存的篇目" : "暂时取不到每日素材，联网后再试一次");
    });
  });
}

  else if(DAILY.ts) line+="，素材抓取于 "+dailyAgo(DAILY.ts);

}

function dailyNext(){
  var it=dailyById(DAILY.cur); if(!it) return;
  var all=allItems(), pool=[], i, idx=-1;
  if(it.fromLib){
    /* 素材库内：跟随当前搜索与难度上下文 */
    var f=libFiltered();

    for(i=0;i<all.length;i++){ if(all[i].level===it.level) pool.push(all[i]); }
    if(pool.length<2) pool=all;
  }
  pool.sort(function(a,b){ return (a.date<b.date)?1:((a.date>b.date)?-1:0); });
  for(i=0;i<pool.length;i++){ if(pool[i].id===it.id){ idx=i; break; } }

function dailyQuizStart(){
  var it=dailyById(DAILY.cur); if(!it) return;
  var pool=[], i, j;
  for(i=0;i<(it.key||[]).length;i++){
    var v=VOCAB_BY_W[it.key[i]];
    if(v && v.cn) pool.push(v);
  }
  if(pool.length<3){ toast("这篇的词库内词不够出题，先用上方逐句听读"); return; }
  pool=pool.slice(0,5);
  var qs=[];
  for(i=0;i<pool.length;i++){
    var ans=pool[i], opts=[ans.cn], guard=0;
    while(opts.length<4 && guard++<60){
      var rv=VOCAB[Math.floor(Math.random()*VOCAB.length)];
      if(!rv || !rv.cn || rv.cn===ans.cn) continue;
      if(opts.indexOf(rv.cn)>=0) continue;
      opts.push(rv.cn);
    }
    for(j=opts.length-1;j>0;j--){ var k=Math.floor(Math.random()*(j+1)), t=opts[j]; opts[j]=opts[k]; opts[k]=t; }
    qs.push({ w:ans.w, cn:ans.cn, opts:opts, pick:"", ok:false });
  }
  DAILY.quiz=qs;
  render();
}

  saveDB(); render();
}

function segBtn(k,label){

}
function setVFilter(k){ VFILTER=k; go("vocab"); }
function vFilter(q){ VQ=(q||"").trim().toLowerCase(); var box=document.getElementById("vlist"); if(box) box.innerHTML=vList(); }
function vRandom(){
  var v=VOCAB[Math.floor(Math.random()*VOCAB.length)];
  openWord(v.w);
}
function vList(){
  var arr=VOCAB.slice(), out=[], i;
  if(VFILTER==="due"){ var d=dueWords(); arr=arr.filter(function(v){ return d.indexOf(v.w.toLowerCase())>=0; }); }
  else if(VFILTER==="back"){
    var rw=(typeof recWords==="function")? recWords() : [];
    arr=rw.map(function(k){ return VOCAB_BY_W[k]; }).filter(Boolean);
  }
  else if(VFILTER==="new"){ arr=arr.filter(function(v){ return !DB.srs[v.w.toLowerCase()]; }); }
  else if(VFILTER==="weak"){ arr=arr.filter(function(v){ var s=DB.srs[v.w.toLowerCase()]; return s && (s.lv|0)<=2; }); }
  else if(VFILTER==="done"){ arr=arr.filter(function(v){ var s=DB.srs[v.w.toLowerCase()]; return s && (s.lv|0)>=5; }); }
  if(VQ){
    arr=arr.filter(function(v){
      var hay=(v.w+" "+v.cn+" "+v.root+" "+v.syn.join(" ")+" "+v.fam.join(" ")+" "+v.scene+" "+v.pos).toLowerCase();
      return hay.indexOf(VQ)>=0;
    });
  }
  if(!arr.length) return '<div class="small muted center" style="padding:18px 0">这里暂时没有词。换个筛选条件，或先去「听读看」里刷几段材料。</div>';
  for(i=0;i<arr.length;i++){
    var v=arr[i], s=DB.srs[v.w.toLowerCase()], u=useOf(v.w);
    var lv=s?(s.lv|0):0;
    var four=(u.listen>0?"听":"·")+(u.read>0?"读":"·")+(u.view>0?"看":"·")+(u.say>0?"说":"·")+(u.write>0?"写":"·");
    var rrec=(VFILTER==="back" && DB.rec)?DB.rec[v.w.toLowerCase()]:null;
    out.push('<div class="wrow" onclick="openWord(\''+v.w+'\')">'+
      '<span class="lw">'+esc(v.w)+'</span>'+
      '<span class="lc">'+esc(v.cn)+' · '+esc(v.pos)+'</span>'+
      '<span class="lr"'+(rrec?' style="font-size:10.5px"':' style="letter-spacing:1px"')+'>'+
        (rrec? (esc(recKindsStr(rrec))+' · '+agoStr(rrec.t)) : (four+' '+lv+'/7'))+'</span></div>');
  }
  return out.join("");
}

/* ---------- 词详情 ---------- */
function openWord(w){

    '</div>';

  h+='<div class="card tight" style="margin:0 0 8px;box-shadow:none;border:1px solid var(--line)">'+
     '<div class="small muted" style="margin-bottom:4px">四向联动（这个字被练过几次）</div>'+
     '<div class="small">听 '+u.listen+' · 读 '+u.read+' · 看 '+u.view+' · 说 '+u.say+' · 写 '+u.write+'</div>'+
     '<div class="bar thin" style="margin-top:6px"><i style="width:'+Math.min(100,Math.round((u.listen+u.read+u.view+u.say+u.write)/12*100))+'%"></i></div>'+

    h+='<div class="tiny muted" style="margin:-2px 0 8px;line-height:1.75">背景听里出现过 <b>'+((bex&&bex.n)||0)+'</b> 次'+
       (bhd?'，标过「没听清」<b>'+bhd.n+'</b> 次——这种词该进精听，别只靠背景听':'')+'</div>';
  }

  var rc=recOf(v.w);
  if(rc) h+='<div class="rcbox">这次是在「<b>'+esc(recKindsStr(rc))+'</b>」里遇到它的（'+agoStr(rc.t)+'），还没在词网确认。<br>看完下面这一页，点一次评分就会把它移出回流队列。</div>';

  h+=webSVG(v);

  h+='<div class="ex" style="margin-top:10px"><div><b>词根</b>　'+(v.root? esc(v.root) : '<span class="muted">未填写（该维度不参与连线）</span>')+'</div></div>';
  if(v.fam.length) h+=chipRow("词族",v.fam);

  h+='<div class="ex">'+
     (v.ex? ('<span style="font-size:14.5px">'+hlWord(v.ex,v.w)+'</span>'+
             '<span class="cn2">'+esc(v.exCn)+'</span>')
           : '<span class="small muted">还没有例句。我的词可以在「编辑」里补一句自己的例句。</span>')+'</div>';
  h+=confBlocks(v);

  h+='<div class="hr"></div><div class="small muted" style="margin-bottom:6px">刚才回想这个词，有多难？</div>'+

function chipRow(label,list){
  return '<div class="mt8 small"><b>'+label+'</b><div style="margin-top:3px">'+
    list.map(function(x){
      var inLib = !!VOCAB_BY_W[String(x).toLowerCase()];
      return '<span class="tag'+(inLib?"":" g")+'" style="cursor:pointer" onclick="tapRel(\''+esc(x).replace(/'/g,"")+'\','+inLib+')">'+esc(x)+'</span>';
    }).join("")+'</div></div>';
}
function tapRel(x, inLib){
  if(inLib) openWord(x);
  else toast("「"+x+"」不在本库，可在「我的 · 联网」用剑桥词典查");
}
function hlWord(sent, w){
  var re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*)","ig");
  return esc(sent).replace(re, "<em>$1</em>");
}
function rateWord(w,q,src){
  var s=srsUpd(w,q);
  touch("word",1);
  var hadRec = typeof recOf==="function" && recOf(w);
  if(hadRec) clearRec(w);
  closeSheet();
  var left = (typeof recCount==="function")? recCount() : 0;
  var tail = hadRec ? ("　已移出回流"+(left?("，还剩 "+left+" 个"):"")) : "";
  if(q<=0){
    /* P2-1：答错（复习 / 词卡）→ 三选一错因，可跳过，默认按不认识 */
    toast("已放回：明天再见 "+w+tail);
    render();
    errAsk(w, src||"review");
    return;
  }
  toast((q<=0?("已放回：明天再见 "+w):("已记录：「"+w+"」"+s.iv+" 天后再复习"))+tail);
  render();
}
function quizWord(w){
  var v=VOCAB_BY_W[String(w).toLowerCase()];
  var pool=VOCAB.filter(function(x){ return x.w!==v.w; });
  var picks=[v.cn], i;
  while(picks.length<4){
    var r=pool[Math.floor(Math.random()*pool.length)];
    if(picks.indexOf(r.cn)<0) picks.push(r.cn);
  }
  picks.sort();
  var h=sheetHead("考我："+v.w, "选一个正确的释义");
  h+='<div class="small muted" style="margin-bottom:8px">先在心里回想，再点。想不起来直接点「忘了」也行——回想失败本身就是有效练习。</div>';
  for(i=0;i<picks.length;i++){
    var ok = picks[i]===v.cn;
    h+='<button class="opt" onclick="quizAns(this,'+ok+',\''+v.w+'\')">'+esc(picks[i])+'</button>';
  }
  h+='<div id="qfb"></div>';
  openSheet(h);
}
function quizAns(btn, ok, w){
  var all=document.querySelectorAll("#sheet .opt"), i;
  for(i=0;i<all.length;i++) all[i].disabled=true;
  btn.className="opt "+(ok?"ok":"no");
  if(!ok){
    var v=VOCAB_BY_W[w.toLowerCase()];
    for(i=0;i<all.length;i++) if(all[i].textContent===v.cn) all[i].className="opt ok";
  }
  var fb=document.getElementById("qfb");
  fb.innerHTML='<div class="fb'+(ok?"":" bad")+'">'+(ok?"对。":"正确答案已标出。")+
    '<div class="row mt8"><button class="btn sm '+(ok?"":"red")+'" onclick="rateWord(\''+w+'\','+(ok?2:0)+',\'quiz\')">'+(ok?"确认记得":"记下不会")+'</button>'+
    '<button class="btn sm ghost" onclick="openWord(\''+w+'\')">看详情</button></div></div>';
}

/* ---------- 联想网 SVG ---------- */
function webSVG(v){
  var cx=150, cy=132, R=100;
  var bs=[
    { k:"词根", txt:short(v.root,14), kind:"t" },
    { k:"词族", txt:v.fam[0]||"—", kind:"w" },
    { k:"近义", txt:v.syn[0]||"—", kind:"w" },
    { k:"反义", txt:v.ant[0]||"—", kind:"w" },
    { k:"搭配", txt:short(v.col[0]||"—",14), kind:"t" },
    { k:"易混", txt:short(v.conf[0]||"—",14), kind:"t" }
  ];
  var s='<div class="web"><svg viewBox="0 0 300 268">';
  var i, pts=[];
  for(i=0;i<6;i++){
    var a=(-90+i*60)*Math.PI/180;
    pts.push({ x:cx+Math.cos(a)*R, y:cy+Math.sin(a)*R });
  }
  for(i=0;i<6;i++){
    s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+pts[i].x.toFixed(1)+'" y2="'+pts[i].y.toFixed(1)+'" style="stroke:var(--web-edge)" stroke-width="1.2" stroke-dasharray="3 3"/>';
  }
  for(i=0;i<6;i++){
    var b=bs[i], p=pts[i], click="", label=esc(short(b.txt,10));
    if(b.kind==="w" && VOCAB_BY_W[String(b.txt).toLowerCase()]) click=' onclick="openWord(\''+esc(b.txt)+'\')"';
    else if(b.kind==="w") click=' onclick="toast(\'库外联想词：'+esc(b.txt).replace(/'/g,"")+'\')"';
    s+='<g class="node"'+click+'>'+
       '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="27" style="fill:var(--web-core);stroke:var(--web-nb)" stroke-width="1.4"/>'+
       '<text x="'+p.x.toFixed(1)+'" y="'+(p.y-3).toFixed(1)+'" text-anchor="middle" font-size="9" font-weight="800" style="fill:var(--green)">'+esc(b.k)+'</text>'+
       '<text x="'+p.x.toFixed(1)+'" y="'+(p.y+9).toFixed(1)+'" text-anchor="middle" font-size="8" style="fill:var(--ink2)">'+label+'</text>'+
       '</g>';
  }
  s+='<g class="node core"><circle cx="'+cx+'" cy="'+cy+'" r="34"/>'+
     '<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle">'+esc(short(v.w,10))+'</text></g>';
  s+='</svg></div>';
  s+='<div class="legend"><span><i style="background:var(--green)"></i>当前词</span><span><i style="background:var(--web-nb)"></i>可直接跳转的库内词</span><span><i style="background:var(--web-dim)"></i>说明性节点</span></div>';
  return s;
}
function short(s,n){ s=String(s||""); return s.length>n? s.slice(0,n)+"…" : s; }

/* wpm → 引擎语速：以 160 wpm 记作 ×1.00（Chromium 英文语音 rate=1 时约 150–170 wpm），
   四档 120/140/160/180 分别换算成 0.75 / 0.875 / 1.00 / 1.125，所以 120 档明显慢于 180 档。
   mult 是界面上的相对倍速（如 0.72）。换算结果若超出语音引擎可靠区间 0.5–1.6 就按边界降级，
   并置 clamped 标记，页面如实说明「达不到标注档位」，不假装数字生效。 */
var LS_WPM_BASE=160;
function lsRate(m, mult){
  var w=Number(m&&m.wpm)||LS_WPM_BASE, r=w/LS_WPM_BASE, clamped=false;
  if(mult && mult>0) r=r*mult;
  if(r<0.5){ r=0.5; clamped=true; }
  if(r>1.6){ r=1.6; clamped=true; }
  r=Math.round(r*100)/100;
  return { r:r, wpm:w, clamped:clamped };
}
function lsRateLine(m){
  var d=lsRate(m, 0);
  return "本段标注 "+d.wpm+" wpm · 实际播放语速 ×"+d.r.toFixed(2)+"（基准 160 wpm = ×1.00）"+
    (d.clamped? " · 已按本机语音上下限降级，实际达不到该档位" : "");
}
/* 盲听/整段播放：按句拆进播放会话——只有拆开才知道息屏打断后该从"第几句"接着放。
   仍然只有整段每一句都真的发出声（ok）才计一遍；静音失败、被系统打断都不计。 */
function lPlay(mult){
  var m=lFind(); if(!m) return;
  var list=(m.s||[]).slice();
  if(!list.length){ toast("这一段没有可朗读的内容"); return; }
  var d=lsRate(m, mult);
  LS_ST.playMult=mult||0;
  spSeqStart(list, {
    rate:d.r, gap:240, kind:"listen",
    done:function(ok){
      LS_ST.playMult=0;
      if(ok){
        LS_ST.plays=(LS_ST.plays|0)+1;
        if(LS_ST.stage===0) lDraw(); else toast("已播 "+(LS_ST.plays|0)+" 遍");
      }else{

  });
}

/* 音变标注：条数一律从 m.ling 实数统计，0 条就明说「本段没有标注音变」，
   不回退任何写死的数字。每条都标出落在原文第几句，定位不到就直说，
   避免出现「标注了但句子里没有」这种凑数。 */
function lingHit(m, a){
  var key=String(a||"").toLowerCase(), arr=(m&&m.s)||[], i;
  if(!key) return 0;
  for(i=0;i<arr.length;i++){

}

/* 从整段句子里挑出真正命中词库的词（与 linkWords 同规则：允许 -s/-ed/-ing 等词尾），
   同一段内同词只返回一次。notes 里的短语只作讲解展示，不参与计数。 */
var _lvRe=null, _lvN=-1;
function lVocabWords(m){
  var out=[], seen={}, i, mm, sent, arr=(m&&m.s)||[];
  if(typeof VOCAB_BY_W==="undefined") return out;
  var keys=Object.keys(VOCAB_BY_W);
  /* 词库会因「自定义词条」变大，用词数做版本号，变了就重建正则，避免新词永远漏计 */
  if(!_lvRe || keys.length!==_lvN){
    _lvN=keys.length;
    _lvRe=null;
    if(!keys.length) return out;
    var ws=keys.sort(function(a,b){ return b.length-a.length; });
    var es=ws.map(function(w){ return w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); });
    _lvRe=new RegExp("\\b("+es.join("|")+")(s|es|ed|ing|d|ly)?\\b","ig");
  }
  for(i=0;i<arr.length;i++){
    sent=String(arr[i]||"");
    _lvRe.lastIndex=0;
    while((mm=_lvRe.exec(sent))!==null){
      var w=String(mm[1]||"").toLowerCase();
      if(!w || seen[w]) continue;
      if(!VOCAB_BY_W[w]) continue;
      seen[w]=1; out.push(w);
      if(_lvRe.lastIndex<=mm.index) _lvRe.lastIndex=mm.index+1;
    }
  }
  return out;
}
/* 精听答题历史：按材料 id 存数组，记录时间/正确数/题目总数/重听遍数/用时/是否满分 */
function lsHistPush(m, right, sec){
  if(!DB.listen || typeof DB.listen!=="object" || DB.listen instanceof Array) DB.listen={};
  var arr=DB.listen[m.id];
  if(!arr || !(arr instanceof Array)) arr=DB.listen[m.id]=[];
  var qn=(m.qs||[]).length;
  arr.push({ t:Date.now(), d:dk(), qs:qn, right:(right|0), plays:(LS_ST.plays|0), sec:Math.round(sec||0), full:((right|0)>=qn && qn>0) });
  if(arr.length>60) arr.splice(0, arr.length-60);
  saveDB();
}
function lsHistOf(id){
  var a=(DB.listen||{})[id];
  return (a instanceof Array) ? a : [];
}
/* 精听实际用时：进入该段的 t0 → 现在，扣掉切后台/息屏那段（那段时间没在学）。
   下限 30 秒防误点，上限 20 分钟防挂机；息屏回来不会变 0，也不会因为放了一夜就爆成几小时。 */
function lsForeSec(){
  var t0=Number(LS_ST.t0||0);
  if(!t0) return 0;
  var ms=Date.now()-t0;
  ms-=(Number(LS_ST.bgMs|0)||0);
  if(LS_ST.hideAt) ms-=(Date.now()-LS_ST.hideAt);
  if(ms<0) ms=0;
  var sec=Math.round(ms/1000);
  if(sec<30) sec=30;
  if(sec>1200) sec=1200;
  return sec;
}
function lFinish(right){
  var m=lFind(); if(!m) return;
  try{ spSeqStop(); }catch(e){}
  var sec=lsForeSec();
  LS_ST.got=right; LS_ST.stage=3;
  touch("listen",1); addSec(sec, "listen"); markStep("listen"); markMat(m.id,"listen");
  /* 听方向计数：只认词库词，逐词记一次（同一段内去重），四向覆盖里的「听」才会真的涨 */
  var ws=lVocabWords(m), wi;
  for(wi=0;wi<ws.length;wi++){ try{ useWord(ws[wi],"listen"); }catch(e){} }
  LS_ST.wsN=ws.length;
  /* 答题历史写入 DB.listen，「本周复盘」的听力数据从这里读 */
  lsHistPush(m, right|0, sec);
  /* 答错 → 既有错因账本记一条「听不出」（精听里最贴合的既有标签），周报错因分布可读 */
  var qn=(m.qs||[]).length, wrong=Math.max(0, qn-(right|0));
  for(wi=0;wi<wrong;wi++){ try{ errBump(null, "hear", "listen"); }catch(e){} }
  LS_ST.lastSec=sec;
  lDraw(); render();
}

    }

}
function rAns(btn, ok){

/* ---------- 句中词高亮 ---------- */
var _linkRe=null;
function linkWords(sent){
  if(!_linkRe){
    var ws=Object.keys(VOCAB_BY_W).sort(function(a,b){ return b.length-a.length; });
    var esc2=ws.map(function(w){ return w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); });
    _linkRe=new RegExp("\\b("+esc2.join("|")+")(s|es|ed|ing|d|ly)?\\b","ig");
  }
  return esc(sent).replace(_linkRe, function(all, base){
    return '<em style="cursor:pointer" onclick="openWord(\''+base+'\')">'+all+'</em>';
  });
}

/* ===== 录音组件 / 图表 / 看图说 ===== */
var REC_ID = 0, REC_TICK = null, TIMER = null;

function micBlock(target){
  REC_ID++;
  var id="mic"+REC_ID;
  var hint=micDegradeHint();
  return '<div id="'+id+'" data-target="'+esc(target).replace(/"/g,"&quot;")+'" style="margin-top:8px">'+
    '<button class="mic" onclick="recToggle(this,\''+id+'\')"><span class="dot"></span><span>'+(hint?"录音自评 · 点一下开始":"点一下开始说")+'</span></button>'+
    '<div class="volk"><span class="ti">0s</span><span class="tw">— wpm</span><span class="tsc">—</span></div>'+
    (hint? '<div class="tiny muted" style="margin-top:4px">'+esc(hint)+'</div>':'')+
    '<div class="res"></div></div>';
}
/* 跟读统一入口：先判断识别能不能用，不能就自动走录音自评，绝不让按钮"点了没反应" */
function recToggle(btn, wrapId){
  var wrap=document.getElementById(wrapId);
  if(!wrap){ return; }
  if(ASR.on){ stopASR(); return; }
  if(MR.on){ mrStop(); return; }
  var target=wrap.getAttribute("data-target")||"";
  var label=btn.querySelector("span:last-child");
  var br=asrBlockReason();
  if(br){
    /* 已知不可用：直接降级，不重试、不重复弹错 */
    if(br!=="denied") ASR.hinted[br===("noenv")?"service":br]=1;
    mrStart(btn, wrap, target, asrReasonShort());
    return;
  }
  if(ASR.st==="unknown"){
    /* 首次使用：真探测一次再决定，避免"构造器在但一启动就死" */
    btn.classList.add("rec");
    if(label) label.textContent="正在检查语音环境…";
    asrProbe(function(ok){
      btn.classList.remove("rec");
      if(label) label.textContent="点一下开始说";
      if(ok){ recStart(btn, wrap, target); return; }
      if(asrBlockReason()==="denied") asrTellOnce("denied");
      else asrTellOnce("service");
      mrStart(btn, wrap, target, asrReasonShort());
    });
    return;
  }
  recStart(btn, wrap, target);
}
function recStart(btn, wrap, target){
  var tEl=wrap.querySelector(".ti"), wEl=wrap.querySelector(".tw"), sEl=wrap.querySelector(".tsc"), rEl=wrap.querySelector(".res");
  var label=btn.querySelector("span:last-child");
  btn.classList.add("rec");
  if(label) label.textContent="正在听…点一下结束";
  var tick=setInterval(function(){
    var s=Math.round((Date.now()-ASR.t0)/1000);
    if(tEl) tEl.textContent=s+"s";
    var n=normWords(REC.text).length;
    if(wEl) wEl.textContent=(s>0? Math.round(n/s*60):0)+" wpm";
  },400);
  var switched=false;
  var ok=startASR(null, function(txt, type){
    clearInterval(tick);
    btn.classList.remove("rec");
    if(label) label.textContent="再说一次";
    var sec=Math.max(1,Math.round((Date.now()-ASR.t0)/1000));
    var spoken=txt||"";
    /* 识别因环境挂掉：不留白，立刻转录音自评 */
    if(type==="error" && (ASR.st==="noenv"||ASR.st==="denied")){
      switched=true;
      if(label) label.textContent="点一下开始";
      mrStart(btn, wrap, target, asrReasonShort());
      return;
    }
    if(!normWords(spoken).length){
      rEl.innerHTML='<div class="fb bad">没识别到英文。环境太吵，或麦克风没被允许。</div>';
      return;
    }
    if(!target){
      var wpm0=Math.round(normWords(spoken).length/sec*60);
      if(tEl) tEl.textContent=sec+"s";
      if(wEl) wEl.textContent=wpm0+" wpm";
      if(sEl) sEl.textContent="已录 "+sec+"s";
      rEl.innerHTML='<div class="cmp">'+
        '<div class="row"><div class="sc">'+sec+'<small>s</small></div>'+
        '<div style="margin-left:auto;text-align:right"><div class="tiny muted">语速</div><b>'+wpm0+' wpm</b></div></div>'+
        '<div class="small muted" style="margin-top:6px">你说的是：'+esc(spoken)+'</div>'+
        '<div class="fb" style="margin-top:8px">'+
        (wpm0<70? "语速偏慢，说明中间在找词。把要点先抄成 3 个关键词，看着关键词再说一遍。"
          : wpm0>165? "语速偏快。刻意在句子之间停半拍，听感会立刻清晰。"
          : "语速正常。现在检查：有没有超过 3 秒的空白？有就说明这里缺词，补一个过渡句。")+
        '</div></div>';
      touch("say",1); addSec(sec, "say");
      return;
    }
    var r=scoreSpeak(target, spoken);
    var wpm=Math.round(normWords(spoken).length/sec*60);
    if(tEl) tEl.textContent=sec+"s";
    if(wEl) wEl.textContent=wpm+" wpm";
    if(sEl) sEl.textContent="相似 "+r.score+"%";
    var marks="";
    for(var i=0;i<r.mark.length;i++){
      marks+='<span class="'+(r.mark[i].ok?"hit":"miss")+'">'+esc(r.mark[i].w)+'</span> ';
    }
    var advice = r.score>=90 ? "基本准确，可以提速到正常语速。" :
                 r.score>=70 ? "词都到位了，接下来注意重音和停顿，别每个词都一样重。" :
                 "漏词较多。先降速跟读两遍，再录一次——不要在一次录音里反复重试。";
    rEl.innerHTML='<div class="cmp">'+
      '<div class="row" style="align-items:flex-end"><div class="sc">'+r.score+'<small>/100</small></div>'+
      '<div style="margin-left:auto;text-align:right"><div class="tiny muted">语速</div><b>'+wpm+' wpm</b></div></div>'+
      '<div class="wordcmp" style="margin-top:8px">'+marks+'</div>'+
      '<div class="small muted" style="margin-top:6px">你实际说的：'+esc(spoken)+'</div>'+
      '<div class="fb" style="margin-top:8px">'+advice+'</div></div>';
    touch("say",1); addSec(sec, "say");
  });
  if(!ok && !switched){ clearInterval(tick); btn.classList.remove("rec"); if(label) label.textContent="点一下开始"; }
}
function fmtT(s){ var m=Math.floor(s/60), r=s%60; return (m?m+":":"")+(m&&r<10?"0":"")+r; }
function startTimer(sec, elId, onEnd){
  clearInterval(TIMER);
  var left=sec;
  var el=document.getElementById(elId);
  if(el) el.textContent=fmtT(left);
  TIMER=setInterval(function(){
    left--;
    var e=document.getElementById(elId);
    if(e) e.textContent=fmtT(Math.max(0,left));
    if(left<=0){ clearInterval(TIMER); if(onEnd) onEnd(); }
  },1000);
}
function stopTimer(){ clearInterval(TIMER); }

   未通过不推进掌握度：due 打回今天、等级原地不动，并记错因标签（为后续错因统计预留）。 */
var PROD = { list:[], i:0, pass:0, fails:[], retry:false, mode:"write", sayOn:false, done:false, moved:false };
var PROD_TAGS = [{ k:"hear", t:"听不出" }, { k:"spell", t:"拼错" }, { k:"unknown", t:"不认识" }];

function prodGo(){ SAY_TAB="produce"; OUT_TAB="say"; go("output"); }
function prodKey(s){
  return String(s||"").toLowerCase().replace(/[\s\-_–—'’·.,!?]/g,"").replace(/[^a-z0-9]/g,"");
}
function prodLev(a,b){
  var n=a.length, m=b.length, i, j, t;
  if(!n) return m;
  if(!m) return n;
  var prev=[], cur=[];
  for(j=0;j<=m;j++) prev[j]=j;
  for(i=1;i<=n;i++){
    cur[0]=i;
    for(j=1;j<=m;j++){
      var d = (a.charAt(i-1)===b.charAt(j-1)) ? 0 : 1;
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+d);
    }
    t=prev; prev=cur; cur=t;
  }
  return prev[m];
}
function prodCmp(input, word){
  var a=prodKey(input), b=prodKey(word);
  if(!a) return { r:"empty", d:0 };
  if(a===b) return { r:"exact", d:0 };
  return { r:"near", d:prodLev(a,b) };
}
function prodPool(){
  var out=[], seen={}, k, i;
  function add(x){
    var kk=String(x||"").toLowerCase();
    if(VOCAB_BY_W[kk] && !seen[kk]){ seen[kk]=1; out.push(kk); }
  }
  var due=dueWords();
  for(i=0;i<due.length;i++) add(due[i]);
  var mas=[];
  for(k in DB.srs) if((DB.srs[k].lv|0)>=5 && VOCAB_BY_W[k]) mas.push(k);
  mas=shuffle(mas);
  for(i=0;i<mas.length;i++) add(mas[i]);
  return out;
}
/* 抽词：到期词优先，其次已掌握词；不够用已学过的词兜底，最少 5 个 */
function prodBuildList(){
  var pool=shuffle(prodPool()), list=[], i;
  for(i=0;i<pool.length && list.length<PROD_N;i++) list.push(pool[i]);
  if(list.length<5){
    var rest=[], k;
    for(k in DB.srs) if(VOCAB_BY_W[k] && list.indexOf(k)<0) rest.push(k);
    rest=shuffle(rest);
    for(i=0;i<rest.length && list.length<5;i++) list.push(rest[i]);
  }
  if(list.length<5){
    var all=shuffle(wordPool());
    for(i=0;i<all.length && list.length<5;i++) if(list.indexOf(all[i])<0) list.push(all[i]);
  }
  return list.slice(0, PROD_N);
}

function prodAnswer(){
  if(PROD.done || PROD.i>=PROD.list.length) return;
  var w=PROD.list[PROD.i];
  PROD.mode="write";

  if(c.r==="empty"){
    prodFb('<div class="fb warn">先写一个再提交。写错也算一次尝试——不写等于没有判断。</div>');
    return;
  }
  if(c.r==="exact"){ prodPass(w, "write"); return; }
  if(!PROD.retry){
    PROD.retry=true;
    prodFb('<div class="fb warn"><b>差一点</b>：和你写的「'+esc(val)+'」相比，正确拼写差 '+c.d+' 个字母。再写一次，这次写对才算过。</div>');
    if(el){ el.value=""; try{ el.focus(); }catch(e){} }
    return;

function prodGiveUp(){

function prodSayStart(){
  if(PROD.done || PROD.i>=PROD.list.length) return;
  var w=PROD.list[PROD.i];
  PROD.mode="say";
  if(PROD.sayOn){ stopASR(); PROD.sayOn=false; return; }
  if(asrBlockReason()){ prodSelfPanel(asrReasonShort()||"识别不可用"); return; }
  prodFb('<div class="fb warn">正在听…把这个词说出来，说完再点一次「口述这个词」结束。</div>');
  PROD.sayOn=true;
  var ok=startASR(null, function(txt, type){
    PROD.sayOn=false;
    if(type==="error" && (ASR.st==="noenv" || ASR.st==="denied")){
      prodSelfPanel(asrReasonShort()||"识别不可用");
      return;
    }
    var said=txt||"", ws=normWords(said), hit=-1, i;
    for(i=0;i<ws.length;i++) if(prodKey(ws[i])===prodKey(w)){ hit=i; break; }
    if(hit>=0){ prodPass(w, "say"); return; }
    if(!PROD.retry){
      PROD.retry=true;
      prodFb('<div class="fb warn">'+(ws.length? ('听到的是「'+esc(said)+'」，不是目标词。') : '这次没听到声音。')+'再说一次，说清楚就没问题。</div>');
      return;
    }
    prodFail(w, "hear", 0, ws.length? ("说成了「"+esc(said)+"」") : "没有出声/没识别到");
  });
  if(!ok){ PROD.sayOn=false; prodSelfPanel("识别起不来"); }

/* 无识别环境下的口述通道：录音自评，4-5 分算通过，1-3 分算没过（与拼写判定同一套账） */
function prodSelfPanel(why){

  h+='</div><div class="tiny muted" style="margin-top:6px">自评也要诚实：说不出来就按 1 分，按 5 分糊过去只骗到自己的进度。</div>';

function prodSelfGrade(n){

  if(n>=4) prodPass(w, "say");
  else prodFail(w, "unknown", 0, "自评 "+n+" 分：说不出来");

/* 记 use(kind) 但不往"回流待确认"队列里塞：产出校验本身就是产出过的确认，不需要再回词网认领一次 */
function prodUse(w, kind){
  var k=String(w||"").toLowerCase();
  if(!k) return;
  if(!DB.use) DB.use={};
  var u=DB.use[k]||(DB.use[k]={});
  u[kind]=(u[kind]|0)+1;
  saveDB();
}
function prodPass(w, mode){
  var before=(srsOf(w).lv|0);
  var s=srsUpd(w, 2);           /* 只有真的产出来了才推进一级 */
  touch("word", 1);
  prodUse(w, mode==="say" ? "say" : "write");
  prodLog(w, mode, true, 0, "");
  PROD.pass++;
  PROD.retry=false;
  var h='<div class="fb"><b>通过</b>　'+esc(w)+'　掌握度 '+before+'/7 → '+(s.lv|0)+'/7，'+s.iv+' 天后再复习。'+
    '<div class="row mt8"><button class="btn sm" onclick="prodNext()">下一个 ›</button></div></div>';
  prodFb(h);
  prodLock();
}
function prodFail(w, tag, d, note){
  var before=(srsOf(w).lv|0);
  var s=srsOf(w);
  s.seen=(s.seen|0)+1; s.fail=(s.fail|0)+1;
  s.iv=0; s.due=dk(); s.last=dk();   /* 打回到期今天，等级不升 */
  DB.srs[w]=s;
  var t=prodLog(w, PROD.mode, false, d, tag||"");
  saveDB();
  PROD.fails.push({ w:w, tag:tag||"", note:note||"", t:t });
  PROD.retry=false;
  var h='<div class="fb bad"><b>未通过</b>　正确写法 <b>'+esc(w)+'</b>'+(note? ('（'+note+'）') : '')+
    '<div class="small" style="margin-top:6px">掌握度没动（还是 '+before+'/7），这个词已打回到期<b>今天</b>，明天还会排进来。</div>'+
    '<div class="tiny muted" style="margin-top:10px">错在哪？选一个（留着做弱项统计）</div>'+
    '<div class="row wrap" style="margin-top:6px">';
  for(var i=0;i<PROD_TAGS.length;i++){
    h+='<button class="btn sm '+(PROD_TAGS[i].k===tag?"":"ghost")+'" id="pt_'+PROD_TAGS[i].k+'" onclick="prodTag(\''+PROD_TAGS[i].k+'\')">'+PROD_TAGS[i].t+'</button>';
  }
  h+='</div><div class="row mt8"><button class="btn sm" onclick="prodNext()">下一个 ›</button></div></div>';
  prodFb(h);
  prodLock();
}
function prodErrBump(w, tag){
  /* 统一走 errBump：保证 sum / 逐词 / 每日趋势三处口径一致（P2-1） */
  if(typeof errBump==="function"){ errBump(w, tag, "prod"); return; }
  if(!DB.err) DB.err={ sum:{}, w:{} };
  if(!DB.err.sum) DB.err.sum={};
  if(!DB.err.w) DB.err.w={};
  DB.err.sum[tag]=(DB.err.sum[tag]|0)+1;
  var e=DB.err.w[w];
  if(!e) e=DB.err.w[w]={};
  e[tag]=(e[tag]|0)+1;
}
function prodLog(w, mode, ok, d, tag){
  if(!DB.prodLog) DB.prodLog=[];
  var rec={ t:Date.now(), w:w, ok:ok?1:0, mode:mode||"write", d:d|0, tag:tag||"" };
  DB.prodLog.push(rec);
  if(DB.prodLog.length>300) DB.prodLog=DB.prodLog.slice(-300);
  if(!ok && tag) prodErrBump(w, tag);
  saveDB();
  return rec.t;
}
function prodTag(tag){
  var f=PROD.fails[PROD.fails.length-1];
  if(!f) return;
  if(f.tag===tag){ toast("已经是这个标签了"); return; }
  if(f.tag && DB.err && DB.err.sum){
    DB.err.sum[f.tag]=Math.max(0,(DB.err.sum[f.tag]|0)-1);
    var oe=DB.err.w ? DB.err.w[f.w] : null;
    if(oe) oe[f.tag]=Math.max(0,(oe[f.tag]|0)-1);
  }
  prodErrBump(f.w, tag);
  if(DB.prodLog){
    for(var i=DB.prodLog.length-1;i>=0;i--) if(DB.prodLog[i].t===f.t){ DB.prodLog[i].tag=tag; break; }
  }
  f.tag=tag;
  saveDB();
  for(var j=0;j<PROD_TAGS.length;j++){
    var b=document.getElementById("pt_"+PROD_TAGS[j].k);
    if(b) b.className="btn sm "+(PROD_TAGS[j].k===tag?"":"ghost");
  }
  toast("已标记："+(tag==="hear"?"听不出":tag==="spell"?"拼错":"不认识"));
}
function prodNext(){
  PROD.retry=false; PROD.mode="write"; PROD.sayOn=false;

  return h;

function openWrite(id){

function wCount(){

var CONN=["however","therefore","moreover","furthermore","in addition","for example","for instance","as a result","in contrast","on the other hand","although","whereas","while","because","since","consequently","nevertheless","in conclusion","first","second","finally","despite","in spite of","thus","hence","that is","in other words"];
var STOP="the a an and or but of to in on at for with is are was were be been it this that these those i you he she they we my your his her their as by from not no so if then than about into over under can could should would will do does did have has had there here what which who whom whose when where why how all any some more most other such only own same too very just also".split(" ");

function wCheck(id){
  var m=null,i;
  for(i=0;i<WRITE.length;i++) if(WRITE[i].id===id) m=WRITE[i];
  var txt=document.getElementById("wtxt").value||"";
  var words=normWords(txt), n=words.length;
  var rep=document.getElementById("wrep");
  if(n<10){ rep.innerHTML='<div class="fb bad">太短了，先写满 3 句再看检查结果。</div>'; return; }
  var low=" "+txt.toLowerCase()+" ";
  var sents=txt.split(/[.!?]+/).filter(function(s){ return normWords(s).length>0; });
  var avg = sents.length? Math.round(n/sents.length*10)/10 : n;
  var conns=[], ci;
  for(ci=0;ci<CONN.length;ci++) if(low.indexOf(" "+CONN[ci]+" ")>=0 || low.indexOf(" "+CONN[ci]+",")>=0) conns.push(CONN[ci]);
  var sub=[], su;
  var SUBS=["that","which","who","whom","whose","because","although","though","while","if","unless","whether","when","whenever","since","whereas","despite","in order to","so that","even though","as long as","how"];
  for(su=0;su<SUBS.length;su++) if(low.indexOf(" "+SUBS[su]+" ")>=0) sub.push(SUBS[su]);
  var contr=["don't","can't","won't","isn't","aren't","didn't","doesn't","it's","i'm","you're","they're","we're","couldn't","shouldn't"];
  var shortForms=contr.filter(function(c){ return low.indexOf(c)>=0; });
  var zhPunct=(txt.match(/[，。；：！？、""]/g)||[]).length;
  var capIssue=(txt.match(/[.!?]\s+[a-z]/g)||[]).length + (txt.match(/(^|\s)i(\s|')/g)||[]).length;
  var freq={}, wi, top=[];
  for(wi=0;wi<words.length;wi++){
    var w=words[wi];
    if(w.length<4 || STOP.indexOf(w)>=0) continue;
    freq[w]=(freq[w]||0)+1;
  }
  for(var k in freq) if(freq[k]>=3) top.push({w:k,n:freq[k]});
  top.sort(function(a,b){ return b.n-a.n; });

  var issues=[], goods=[];
  if(n<m.min) issues.push("长度不够：写了 "+n+" 词，目标 ≥"+m.min+"。先把要点补齐，别急着换难词。");
  else goods.push("长度达标（"+n+" 词）。");
  if(!conns.length) issues.push("一个显性连接词都没有。段落之间至少要有一个 however / therefore / for example，让读者知道句子关系。");
  else goods.push("连接词 "+conns.length+" 处："+conns.slice(0,5).join(" / ")+"。");
  if(!sub.length) issues.push("没有从句结构。加一个 which / although / because 引导的从句，句式立刻不像口语。");
  else goods.push("从句标记："+sub.slice(0,4).join(" / ")+"。");
  if(avg>32) issues.push("平均句长 "+avg+" 词，偏长，容易读断。把一句话拆成两句，或删掉重复修饰。");
  else if(avg<9 && sents.length>1) issues.push("平均句长只有 "+avg+" 词，句子太碎。用 and / which / because 把两句合起来。");
  if(shortForms.length) issues.push("有口语缩写："+shortForms.slice(0,4).join(" / ")+"。学术写作里要写全（do not / cannot / it is）。");
  if(zhPunct) issues.push("发现 "+zhPunct+" 个中文标点。中英混用会直接扣印象分，全部改成英文标点。");
  if(capIssue) issues.push("有 "+capIssue+" 处句首或 I 没大写。");
  if(top.length) issues.push("高频重复："+top.slice(0,3).map(function(x){return x.w+"×"+x.n}).join("、")+"。至少换掉一个，用近义词或改指代。");
  if(!issues.length) goods.push("结构层面没发现明显问题。");

  var sc1=Math.min(100, Math.round(n/Math.max(1,m.min)*100));
  var sc2=Math.min(100, 40+conns.length*18+sub.length*8);
  var sc3=100-Math.min(60, shortForms.length*10+zhPunct*15+capIssue*8+(avg>32||avg<9?12:0));
  function bar(label,v){
    return '<div style="margin-bottom:6px"><div class="row" style="justify-content:space-between"><span class="small">'+label+'</span><span class="small muted">'+v+'</span></div>'+
      '<div class="bar thin"><i style="width:'+v+'%"></i></div></div>';
  }
  var h='<div class="card tight" style="margin-top:10px;box-shadow:none;border:1px solid var(--line)">'+
    '<div class="small muted" style="margin-bottom:6px">结构检查（不是语法打分，语法请对照范例自查）</div>'+
    bar("任务完成度",sc1)+bar("连贯与衔接",sc2)+bar("书面规范",Math.max(20,sc3))+
    '<div class="tiny muted" style="margin-top:4px">'+n+' 词 · '+sents.length+' 句 · 平均 '+avg+' 词/句</div>'+
    '<div class="tiny muted" style="margin-top:6px">检查范围：长度、连接词、从句、句长、缩写、中文标点、大小写、重复词。时态、主谓一致、冠词不在范围内——这几项请对照范例逐句自查。</div>'+
    '</div>';
  if(goods.length) h+='<div class="fb" style="margin-top:8px"><b>做到了</b><br>'+goods.map(esc).join("<br>")+'</div>';
  if(issues.length) h+='<div class="fb warn" style="margin-top:8px"><b>要改的 '+issues.length+' 处</b><br>'+issues.map(esc).join("<br>")+'</div>';
  h+='<div class="row mt8"><button class="btn block" onclick="wDone(\''+id+'\','+n+')">完成并记录</button></div>';
  rep.innerHTML=h;
  rep.scrollIntoView({ behavior:"smooth", block:"nearest" });
}
function wDone(id,n){
  if(!DB.wd) DB.wd={};
  var t=document.getElementById("wtxt");
  if(t) DB.wd[id]=t.value;
  saveDB();
  touch("write",1); markStep("write"); addSec(Math.max(180,n*90), "write");
  var m=null,i;
  for(i=0;i<WRITE.length;i++) if(WRITE[i].id===id) m=WRITE[i];
  render();
  toast("已记录："+n+" 词");
  closeSheet();
}

/* ==== el14_me.js ==== */
/* ===== 云同步（GitHub Gist）=====
   设计要点：
   1) 直连 api.github.com，不经过任何中转服务器，不引第三方库，纯前端 fetch + WebCrypto。
   2) token 与同步口令存在独立的 localStorage 键（englab_gist_v1），绝不进入 DB，
      避免被快照/导出/上传内容带走。
   3) 上传/下载/合并前一律先 snapTake 留档，禁止覆盖式操作。 */
var LS_GIST = "englab_gist_v1";
var GH_API = "https://api.github.com";
var GIST_IT = 120000;                 /* PBKDF2 迭代次数 */
var GIST_FILE = "englab-backup.json";
var GIST = { loaded:0, tok:"", id:"", pass:"", usePass:0, keep:1, last:"",
             busy:0, msg:"", bad:0, remote:null, stage:"idle", remoteNew:0 };

/* ---------- 配置读写（token 不进 DB） ---------- */
function gistCfgLoad(){
  if(GIST.loaded) return;
  GIST.loaded=1;
  try{
    var o=JSON.parse(localStorage.getItem(LS_GIST)||"{}")||{};
    if(o.id) GIST.id=String(o.id);
    if(o.last) GIST.last=String(o.last);
    GIST.usePass=o.usePass?1:0;
    GIST.keep=(o.keep===0?0:1);
    if(GIST.keep && o.tok) GIST.tok=String(o.tok);
  }catch(e){}
}
function gistCfgSave(){
  var o={ id:GIST.id, last:GIST.last, usePass:GIST.usePass?1:0, keep:GIST.keep?1:0 };
  if(GIST.keep) o.tok=GIST.tok;
  try{ localStorage.setItem(LS_GIST, JSON.stringify(o)); }catch(e){}
}
function gistSetTok(v){ GIST.tok=String(v||""); if(GIST.keep) gistCfgSave(); }
function gistSetId(v){ GIST.id=String(v||"").trim(); gistCfgSave(); }
function gistSetPass(v){ GIST.pass=String(v||""); }
function gistToggleKeep(on){ GIST.keep=on?0:1; if(!GIST.keep) GIST.tok=""; else gistCfgSave(); gistCfgSave(); gistSay(GIST.keep?"token 会存在本机浏览器里（只适合自用设备）":"token 只在本次会话内有效，关闭页面即忘"); }
function gistTogglePass(on){ GIST.usePass=on?1:0; gistCfgSave(); gistSay(on? "已开启口令加密：上传内容会用 PBKDF2(120000 次) + AES-GCM 加密后提交" : "已改为明文上传：gist 内容可被任何拿到链接的人直接读"); }
function gistPass(){ return GIST.usePass ? String(GIST.pass||"") : ""; }
function gistSay(msg, bad){
  GIST.msg=String(msg||""); GIST.bad=bad?1:0;
  if(CURRENT==="me"){ try{ render(); }catch(e){} }
}

/* ---------- HTTP（带超时 + 错误分类） ---------- */
function ghHdr(){
  var h={ "Accept":"application/vnd.github+json" };
  var t=(GIST.tok||"").trim();
  if(t) h["Authorization"]="Bearer "+t;
  return h;
}
function ghErrOf(r, j){
  var st=r.status, m=(j&&j.message)||"";
  if(st===401) return { kind:"401", msg:"token 无效或已过期。请到 GitHub → Settings → Developer settings → Personal access tokens 重新生成（勾 gist 权限）后粘贴回来。" };
  if(st===403){
    var rest=null, reset=null;
    try{ rest=r.headers.get("x-ratelimit-remaining"); reset=r.headers.get("x-ratelimit-reset"); }catch(e){}
    if(rest==="0"){
      var when="";
      if(reset){ try{ when="约 "+new Date((reset|0)*1000).toLocaleTimeString()+" 后恢复"; }catch(e){} }
      return { kind:"403", msg:"触发 GitHub 频率限制（未认证 60 次/小时，认证 5000 次/小时），"+when+"，稍后再试" };
    }
    return { kind:"403", msg:"没有权限：token 缺少 gist 权限，或这个 gist 不属于该账号。重新勾选 gist scope 再试。" };
  }
  if(st===404) return { kind:"404", msg:"gist 不存在（可能已被删除或 ID 填错）。可以清空 gist ID 后重新上传，会自动建一个新的。" };
  if(st===422) return { kind:"422", msg:"GitHub 拒绝了这次提交（内容为空或格式不合法）。" };
  if(st>=500) return { kind:"5xx", msg:"GitHub 服务端异常（HTTP "+st+"），稍后重试。" };
  return { kind:"http", msg:"请求失败（HTTP "+st+"）"+(m?("："+String(m).slice(0,80)):"") };
}
function ghReq(method, url, body, ms){
  var opt={ method:method, headers:ghHdr(), cache:"no-store" };
  if(body){ opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(body); }
  var ctl=null, timer=null;
  if(typeof AbortController!=="undefined"){ ctl=new AbortController(); opt.signal=ctl.signal; }
  var to=ms||20000;
  return new Promise(function(resolve, reject){
    var done=0;
    function fin(){ if(timer){ clearTimeout(timer); timer=null; } }
    if(ctl) timer=setTimeout(function(){
      if(done) return;
      done=1;
      try{ ctl.abort(); }catch(e){}
      reject({ kind:"net", msg:"网络超时（"+Math.round(to/1000)+" 秒没响应）。检查网络/代理，或稍后重试。" });
    }, to);
    var pr;
    try{ pr=fetch(url, opt); }
    catch(e){ done=1; fin(); reject({ kind:"net", msg:"请求发不出去："+((e&&e.message)||"浏览器拒绝") }); return; }
    pr.then(function(r){
      return r.text().then(function(t){ return { r:r, t:t }; });
    }).then(function(o){
      if(done) return;
      done=1; fin();
      var r=o.r, txt=o.t||"", j=null, bad=0;
      if(txt){
        try{ j=JSON.parse(txt); }catch(e){ bad=1; }
      }
      if(r.ok){
        if(bad){ reject({ kind:"json", msg:"返回内容不是合法 JSON（可能被网络中间层改写了）" }); return; }
        resolve({ j:j, status:r.status, headers:r.headers });
        return;
      }
      reject(ghErrOf(r, j));
    }).catch(function(e){
      if(done) return;
      done=1; fin();
      reject(e && e.kind ? e : { kind:"net", msg:"网络请求失败："+((e&&e.message)||"连接被拒绝或已断网") });
    });
  });
}
/* 取 raw 地址的纯文本（gist 文件过大时 content 会被截断） */
function ghText(url, ms){
  var opt={ method:"GET", headers:ghHdr(), cache:"no-store" };
  var to=ms||20000, ctl=null, timer=null;
  if(typeof AbortController!=="undefined"){ ctl=new AbortController(); opt.signal=ctl.signal; }
  return new Promise(function(resolve, reject){
    var done=0;
    function fin(){ if(timer){ clearTimeout(timer); timer=null; } }
    if(ctl) timer=setTimeout(function(){ if(!done){ done=1; try{ ctl.abort(); }catch(e){} reject({ kind:"net", msg:"下载超时（"+Math.round(to/1000)+" 秒）" }); } }, to);
    fetch(url, opt).then(function(r){
      if(!r.ok) return r.text().then(function(t){ var j=null; try{ j=JSON.parse(t); }catch(e){} throw ghErrOf(r, j); });
      return r.text();
    }).then(function(t){ if(done) return; done=1; fin(); resolve(t); })
     .catch(function(e){ if(done) return; done=1; fin(); reject(e && e.kind ? e : { kind:"net", msg:"下载失败："+((e&&e.message)||"网络错误") }); });
  });
}

/* ---------- 加解密（口令可选） ---------- */
function gistEncAvail(){ return !!(window.crypto && window.crypto.subtle && window.crypto.subtle.importKey && window.TextEncoder); }
function gistB64(buf){
  var a=new Uint8Array(buf), s="", i, step=8192;
  for(i=0;i<a.length;i+=step) s+=String.fromCharCode.apply(null, a.subarray(i, Math.min(i+step, a.length)));
  return btoa(s);
}
function gistUnb64(txt){
  var bin=atob(String(txt||"")), a=new Uint8Array(bin.length), i;
  for(i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return a;
}
function gistKey(pass, salt, it){
  var enc=new TextEncoder();
  return crypto.subtle.importKey("raw", enc.encode(String(pass)), "PBKDF2", false, ["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({ name:"PBKDF2", salt:salt, iterations:it, hash:"SHA-256" },
      base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
  });
}
function gistEncrypt(pass, obj){
  if(!gistEncAvail()) return Promise.reject({ kind:"crypto", msg:"当前环境不能用加密：WebCrypto 需要 https 或 localhost 打开。可先取消口令改明文上传。" });
  if(!pass) return Promise.reject({ kind:"pass", msg:"开启了加密但口令是空的，请填一个口令" });
  var salt=crypto.getRandomValues(new Uint8Array(16));
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var txt=JSON.stringify(obj);
  return gistKey(pass, salt, GIST_IT).then(function(k){
    return crypto.subtle.encrypt({ name:"AES-GCM", iv:iv }, k, new TextEncoder().encode(txt));
  }).then(function(ct){
    return { app:"EngLab", v:1, ts:(obj&&obj.ts)||Date.now(), enc:1,
             alg:"AES-GCM-256", kdf:{ k:"PBKDF2-SHA256", n:GIST_IT, s:gistB64(salt) },
             iv:gistB64(iv), ct:gistB64(ct) };
  });
}
function gistDecrypt(pass, env){
  if(!gistEncAvail()) return Promise.reject({ kind:"crypto", msg:"当前环境不支持解密（WebCrypto 需要 https 或 localhost）" });
  if(!pass) return Promise.reject({ kind:"pass", msg:"这份备份是加密的，需要输入同步口令才能解开" });
  var salt, iv, ct;
  try{ salt=gistUnb64(env.kdf.s); iv=gistUnb64(env.iv); ct=gistUnb64(env.ct); }
  catch(e){ return Promise.reject({ kind:"json", msg:"加密数据字段残缺，文件可能被截断或不是 EngLab 备份" }); }
  var it=(env.kdf && (env.kdf.n|0)) || GIST_IT;
  return gistKey(pass, salt, it).then(function(k){
    return crypto.subtle.decrypt({ name:"AES-GCM", iv:iv }, k, ct);
  }).then(function(buf){
    var t=new TextDecoder().decode(buf);
    try{ return JSON.parse(t); }
    catch(e){ throw { kind:"json", msg:"解密后内容不是合法 JSON" }; }
  }).catch(function(e){
    if(e && e.kind) throw e;
    throw { kind:"pass", msg:"口令不对，解密失败（AES-GCM 校验不通过）。请确认口令与上传时一致。" };
  });
}

/* ---------- 数据打包：只带学习记录，不带音频缓存/离线语音包 ---------- */
function gistLocalPayload(){
  var p=snapPayload();
  p.app="EngLab";
  return p;
}
function gistEnvelope(p, env){
  if(env) return env;
  return { app:"EngLab", v:1, ts:p.ts, day:p.day, n:snapN(p), d:snapD(p), enc:0, data:p };
}
function gistDesc(enc){ return "EngLab 学习记录备份"+(enc?"（加密）":"（明文）"); }

/* ---------- 上传 ---------- */
function gistUp(){
  if(GIST.busy){ toast("正在同步，稍等"); return; }
  gistCfgLoad();
  if(!(GIST.tok||"").trim()){ gistSay("先填 GitHub token（需要 gist 权限）才能上传",1); return; }
  var pass=gistPass();
  if(GIST.usePass && !gistEncAvail()){ gistSay("当前环境不支持加密（需 https 或 localhost），请取消口令改明文上传",1); return; }
  if(GIST.usePass && !pass){ gistSay("开启了加密但口令为空，请填口令或取消加密",1); return; }
  GIST.busy=1;

/* ---------- 写入本地（覆盖 / 合并） ---------- */
function gistWrite(p){
  if(!p) return;
  if(p.srs) DB.srs=p.srs;
  if(p.days) DB.days=p.days;
  if(p.use) DB.use=p.use;
  if(p.exam) DB.exam=p.exam;
  if(p.err) DB.err=p.err;
  if(p.lapse) DB.lapse=p.lapse;
  if(p.lapseCfg) DB.lapseCfg=p.lapseCfg;
  if(p.goal) DB.goal=p.goal;
  if(p.rate) DB.rate=p.rate;
  /* v22：恢复主题偏好并立刻套用；只在快照里带了主题时才改，不覆盖本机当前选择以外的东西 */
  if(p.theme==="light"||p.theme==="dark"||p.theme==="auto"){ DB.theme=p.theme; try{ themeApply(); }catch(e){} }
  if(p.start) DB.start=p.start;
  if(p.prodLog) DB.prodLog=p.prodLog;
  if(p.myWords && typeof p.myWords==="object" && !(p.myWords instanceof Array)){ DB.myWords=p.myWords; }
  if(p.fix instanceof Array) DB.fix=p.fix.slice(0,20);
  if(p.listen && typeof p.listen==="object" && !(p.listen instanceof Array)){ DB.listen=p.listen; }
  /* v23：背景听断点按日期取较新的一侧，别让云端的旧进度把今天听到的位置顶掉 */
  if(p.bgProg && typeof p.bgProg==="object" && !(p.bgProg instanceof Array)){ DB.bgProg=bgProgMerge(DB.bgProg, p.bgProg); }
  /* v24：门槛按时间戳取较新（旧快照不能把档位降回去）；标记清单以合并后的载荷为准，按 id 去重、上限 200 */
  if(p.bgGoal !== undefined && p.bgGoal !== null){
    var _gp = bgGoalPick(DB.bgGoalTs, DB.bgGoal, p.bgGoalTs, p.bgGoal);
    DB.bgGoal = _gp.g; DB.bgGoalTs = _gp.ts;
  }
  if(p.bgMark instanceof Array){ DB.bgMark = bgMarkMerge(p.bgMark, DB.bgMark); }
  /* v25：口音筛选按时间戳取较新，旧快照不能把选择抹回去 */
  if(p.bgAcc !== undefined && p.bgAcc !== null){
    var _aq = bgAccPick(DB.bgAccTs, DB.bgAcc, p.bgAccTs, p.bgAcc);
    DB.bgAcc = _aq.a; DB.bgAccTs = _aq.ts;
  }
  /* v27：睡前时长档位与自动收尾开关，同样按时间戳取较新；旧数据带着 15 分钟不能把新选档位改回去 */
  if(p.bgSleepMins !== undefined || p.bgSleepAuto !== undefined){
    var _sq2 = bgSleepPick(DB.bgSleepTs, { mins:DB.bgSleepMins, auto:DB.bgSleepAuto },
                           p.bgSleepTs, { mins:p.bgSleepMins, auto:p.bgSleepAuto });
    DB.bgSleepMins = _sq2.v.mins; DB.bgSleepAuto = _sq2.v.auto; DB.bgSleepTs = _sq2.ts;
  }
  try{ myMirror(); mySync(); }catch(e){}
  saveDB();
}
function gistApply(mode){
  var R=GIST.remote;
  if(!R || !R.data){ toast("云端数据还没解开，先输入口令"); return; }
  if(GIST.busy){ toast("正在同步，稍等"); return; }
  GIST.busy=1;
  gistSay("正在留存当前状态…");
  return snapTake("before-restore").then(function(){
    var p = (mode==="merge") ? gistMergeApp(gistLocalPayload(), R.data) : R.data;
    gistWrite(p);
    GIST.last=new Date().toISOString();
    GIST.stage="pulled";
    GIST.remote=null;
    GIST.remoteNew=0;
    GIST.busy=0;
    gistCfgSave();
    closeSheet();
    try{ go("home"); }catch(e){}
    toast(mode==="merge" ? "已合并云端与本地记录（合并前的状态已存快照）" : "已用云端备份覆盖本地（覆盖前的状态已存快照）");
    gistSay((mode==="merge"?"已合并":"已覆盖")+"：现在本地 "+snapN(p)+" 词 · "+snapD(p)+" 天。写入前的状态已另存快照。");
    return { ok:true, mode:mode, n:snapN(p), d:snapD(p) };
  }).catch(function(e){
    GIST.busy=0;
    gistSay("写入失败："+((e&&e.message)||"未知错误"),1);
    return { ok:false };
  });
}
/* 以词为单位合并：等级高者胜、due 更早者、seen/fail/iv 取大、last 取近 */
function gistMergeApp(a, b){
  a=a||{}; b=b||{};
  var out=JSON.parse(JSON.stringify(a)), i, k, q, w;

    var x=S[w], y=B[w];

    o.lv=Math.max(lx, ly);
    o.iv=Math.max(x.iv|0, y.iv|0);
    o.seen=Math.max(x.seen|0, y.seen|0);
    o.fail=Math.max(x.fail|0, y.fail|0);
    o.due=early.due;

    for(t2 in (v.m||{})) mm[t2]=v.m[t2];

  for(q9=0;q9<DSb.length;q9++){ y9=DSb[q9]; if(!y9) continue; k9=String(y9.t||0)+"_"+String(y9.n||0); if(!dsSeen[k9]){ dsSeen[k9]=1; DSr.push(JSON.parse(JSON.stringify(y9))); } }
